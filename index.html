  c.fillStyle = g; c.beginPath(); top.forEach((p, i) => i ? c.lineTo(...p) : c.moveTo(...p)); c.closePath(); c.fill();
  for (const [hx, hy, hr] of CHEESE_HOLES) {
    const [px, py] = up(W2([hx, hy]));
    const hs = hr * CHEESE_SCALE;
    c.fillStyle = '#c98a1d'; c.beginPath(); c.arc(px, py, hs * s, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e8ad35'; c.beginPath(); c.arc(px + 0.3 * hs, py + 0.3 * hs, hs * s * 0.65, 0, Math.PI * 2); c.fill();
  }
}

// Huellas pegajosas: palma y tres deditos del color del pegamento, que se van desvaneciendo
function drawPrints(c) {
  for (const p of G.prints) {
    const a = 0.6 * (1 - p.t / PRINT_LIFE);
    c.save(); c.translate(p.x, p.y); c.rotate(p.a);
    c.fillStyle = `rgba(28,38,46,${a})`;   // más oscuras que antes, para que se noten
    c.beginPath(); c.ellipse(0, 0, 1.7, 1.3, 0, 0, Math.PI * 2); c.fill();
    for (const s of [-0.5, 0, 0.5]) {
      const ta = p.side * 0.6 + s;
      c.beginPath(); c.arc(Math.cos(ta) * 2.6, Math.sin(ta) * 2.6, 0.55, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
}

// Moneda plateada (el diseño de COIN_BANDS, sin borde): dos ranuras de lado a lado. Gira sobre sí misma como un cilindro
// chato: la cara se angosta con el coseno del giro y el canto (el costado) se ensancha con el seno, así de canto queda
// solo el rectángulo del costado. Las ranuras siguen por el canto (línea oscura y fondo gris, sin la línea clara).
const COIN_R = 8, COIN_T = COIN_R * 0.36;   // radio y espesor (más gruesa: de canto se ve más ancha)
const COIN_ROLL = 1.1;                      // radianes por segundo que rota sobre su centro
let coinBack = null;   // colores de la cara de atrás (los mismos, más oscuros); se arman la primera vez
function drawCoin(c, it) {
  // gira más lento al pasar de canto (sin frenarse) y normal cuando muestra una cara: el ángulo avanza parejo (f) pero
  // se deforma con un seno doble, así la velocidad es 1,56 de frente y 0,44 de canto
  const f = G.time * 3 + it.ph, th = f + 0.28 * Math.sin(2 * f), w = Math.abs(Math.cos(th)), d = COIN_T * Math.sin(th), R = COIN_R;
  if (!coinBack) coinBack = { face: mixC(COIN_FACE, '#000000', 0.32), bands: COIN_BANDS_BACK.map(([a, b, col]) => [a, b, mixC(col, '#000000', 0.32)]) };
  const back = Math.cos(th) < 0, face = back ? coinBack.face : COIN_FACE, bands = back ? coinBack.bands : COIN_BANDS;   // al girar se ve una cara y después la otra
  // además rota despacio sobre su centro, como si tuviera un pivote en el medio (el eje del giro va dando vueltas)
  const spin = G.time * COIN_ROLL + it.ph * 1.7;
  c.save(); c.translate(it.x + 1.4, it.y + 2.6); c.rotate(spin);   // sombra (corrida siempre para el mismo lado)
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(d / 2, 0, R * w + Math.abs(d) / 2 + 1, R * 0.8, 0, 0, Math.PI * 2); c.fill();
  c.restore();
  c.save(); c.translate(it.x, it.y); c.rotate(spin);
  // canto: la banda entre la cara de adelante y la de atrás (corrida d)
  c.beginPath(); c.ellipse(d, 0, R * w + 0.01, R, 0, 0, Math.PI * 2); c.rect(Math.min(0, d), -R, Math.abs(d), R * 2);
  c.fillStyle = '#7b838d'; c.fill();
  c.save(); c.clip();
  // siguen las ranuras de la cara que se ve
  for (const [a, b, col] of back ? COIN_BANDS_BACK : COIN_BANDS) if (col !== '#e1e6ea') { c.fillStyle = col; c.fillRect(-R - COIN_T, a * R, (R + COIN_T) * 2, (b - a) * R + 0.05); }
  c.restore();
  if (w < 0.02) { c.restore(); return; }   // de canto: solo el costado
  c.scale(w, 1);
  c.fillStyle = face; c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fill();                             // cara (la de atrás, más oscura)
  c.save(); c.clip();                                                                                     // las ranuras
  for (const [a, b, col] of bands) { c.fillStyle = col; c.fillRect(-R, a * R, R * 2, (b - a) * R + 0.05); }
  c.restore();
  c.restore();
}

function drawFloorItems(c, v) {
  drawPrints(c);
  for (const it of G.items) {
    // (el pegamento guarda su esquina y su tamaño, y es más largo que el margen: se mide con su rectángulo, si no
    // aparecía tarde al entrar por la izquierda o por arriba)
    const x1 = it.x + (it.w || 0), y1 = it.y + (it.h || 0);
    if (x1 < v.x0 - 60 || it.x > v.x1 + 60 || y1 < v.y0 - 60 || it.y > v.y1 + 60) continue;
    if (it.type === 'sticky') drawSticky(c, it);
    else if (it.type === 'trap') drawTrap(c, it);
    else if (it.type === 'cheese' && !it.got) drawCheese(c, it);
    else if (it.type === 'battery' && !it.got) drawBattery(c, it);
    else if (it.type === 'spinner') drawSpinner(c, it);
    else if (it.type === 'gate') drawGate(c, it);
    else if (it.type === 'door') drawDoorShadow(c, it);
    else if (it.type === 'coin' && !it.got) drawCoin(c, it);
  }
}

// Sirena de los últimos WARN_T segundos: todo se tiñe de rojo y un haz rojo gira desde el techo
// (no lo cortan las paredes), dejando ver por un instante zonas lejos de la linterna
function drawSiren(l, T6) {
  const S = G.siren, w = lightCv.width, h = lightCv.height;
  l.setTransform(1, 0, 0, 1, 0, 0); l.globalAlpha = 1;
  l.globalCompositeOperation = 'multiply';
  l.fillStyle = `rgb(255, ${255 - 170 * S | 0}, ${255 - 185 * S | 0})`; l.fillRect(0, 0, w, h);
  l.globalCompositeOperation = 'lighter';
  l.fillStyle = `rgba(255, 30, 20, ${0.05 * S})`; l.fillRect(0, 0, w, h);      // un rojo apenas en todo
  l.setTransform(...T6);
  const cx = G.maze.W * C / 2, cy = G.maze.H * C / 2, R = Math.hypot(G.maze.W, G.maze.H) * C * 0.75, a = G.time * Math.PI;
  for (const [half, alpha] of [[0.42, 0.12], [0.3, 0.16], [0.18, 0.2]]) {      // tres capas: borde suave
    const g = l.createRadialGradient(cx, cy, 0, cx, cy, R);
    // transparente en el centro: el emisor está en el techo y no se ve, solo el haz que barre
    g.addColorStop(0, 'rgba(255, 50, 35, 0)'); g.addColorStop(0.18, `rgba(255, 50, 35, ${alpha * 1.6 * S})`);
    g.addColorStop(1, `rgba(255, 30, 20, ${alpha * 0.8 * S})`);
    l.fillStyle = g; l.beginPath(); l.moveTo(cx, cy); l.arc(cx, cy, R, a - half, a + half); l.closePath(); l.fill();
  }
  l.setTransform(1, 0, 0, 1, 0, 0); l.globalCompositeOperation = 'source-over';
}

function drawMouse(c, alpha) {
  const bump = M.bumpT / BUMP_T;                       // 1 → 0 durante el golpe
  const S = curSkin();                                 // colores de la ratita elegida
  c.save(); c.globalAlpha = alpha;
  c.save(); c.translate(M.x, M.y); c.rotate(M.a);
  // sombra debajo: centrada y con borde esfumado (gradiente radial aplastado en elipse)
  c.scale(1, 0.6);
  const sg = c.createRadialGradient(-1, 0, 0, -1, 0, 25);
  sg.addColorStop(0, 'rgba(0,0,0,0.5)'); sg.addColorStop(0.55, 'rgba(0,0,0,0.32)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(-1, 0, 25, 0, Math.PI * 2); c.fill();
  c.restore();
  // cola: tramos que se van afinando (posiciones del mundo, calculadas en updateTail)
  if (M.tail) {
    c.strokeStyle = S.tail; c.lineCap = 'round';
    for (let i = 1; i <= TAIL_N; i++) {
      c.lineWidth = tailWidth(i / TAIL_N);
      c.beginPath(); c.moveTo(M.tail[i - 1][0], M.tail[i - 1][1]); c.lineTo(M.tail[i][0], M.tail[i][1]); c.stroke();
    }
    // la cola va por el piso, debajo de las aspas de los molinetes (el cuerpo no): en el juego, las aspas de un molinete
    // cercano se vuelven a dibujar encima, recortadas a la forma de la cola
    if (c === mouseCtx) for (const it of G.items) {
      if (it.type !== 'spinner' || Math.hypot(it.x - M.x, it.y - M.y) > SPIN_ARM + 60) continue;
      c.save(); c.beginPath();
      for (let i = 1; i <= TAIL_N; i++) {
        const [x0, y0] = M.tail[i - 1], [x1, y1] = M.tail[i], r = tailWidth(i / TAIL_N) / 2 + 0.5, d = Math.hypot(x1 - x0, y1 - y0) || 1;
        const nx = -(y1 - y0) / d * r, ny = (x1 - x0) / d * r;
        c.moveTo(x0 + nx, y0 + ny); c.lineTo(x1 + nx, y1 + ny); c.lineTo(x1 - nx, y1 - ny); c.lineTo(x0 - nx, y0 - ny); c.closePath();
        // los redondeos de las puntas en el mismo sentido que los tramos: si no, donde se pisan se anulan (regla nonzero) y
        // por esos huecos se veía la cola a través del aspa
        for (const [px, py] of [[x0, y0], [x1, y1]]) { c.moveTo(px + r, py); c.arc(px, py, r, 0, Math.PI * 2, true); }
      }
      c.clip(); drawSpinner(c, it);
      // el aspa del piso está multiplicada por la luz: el pedazo redibujado también (solo sobre las aspas y el eje), si no
      // se veía más claro, con la forma de la cola
      const sa = spinAng(it); c.beginPath();
      for (let q = 0; q < SPIN_N; q++) {
        const ux = Math.cos(sa + q * Math.PI * 2 / SPIN_N), uy = Math.sin(sa + q * Math.PI * 2 / SPIN_N), h = SPIN_HW + 0.5, L = SPIN_ARM + 0.5;
        c.moveTo(it.x - uy * h, it.y + ux * h); c.lineTo(it.x + ux * L - uy * h, it.y + uy * L + ux * h); c.lineTo(it.x + ux * L + uy * h, it.y + uy * L - ux * h); c.lineTo(it.x + uy * h, it.y - ux * h); c.closePath();
      }
      c.moveTo(it.x + SPIN_HUB + 0.5, it.y); c.arc(it.x, it.y, SPIN_HUB + 0.5, 0, Math.PI * 2, true);   // (mismo sentido que las aspas)
      c.clip(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'multiply'; c.drawImage(lightCv, 0, 0);
      c.restore();
    }
  }
  c.translate(M.x, M.y); c.rotate(M.a);
  // al chocar, la cabeza se va un poco hacia atrás: todo lo que está delante de los hombros se comprime
  const recoil = 2.6 * bump * bump;
  const hx = x => x > 2 ? x - recoil * (x - 2) / 16 : x;
  // patitas: apoyadas en el piso (posición del mundo, calculada en updateFeet). Mientras una pata va por el aire
  // se achica (se levanta), se aclara y gira un poco hacia afuera.
  const ca = Math.cos(M.a), sa = Math.sin(M.a), backFeet = [], frontFeet = [];
  // aplastada por la trampa: patas bien abiertas (las de adelante hacia adelante y afuera, las de atrás estiradas
  // hacia atrás y afuera), torso chato y ancho, orejas caídas una para cada lado
  const sq = M.caught ? (M.squash || 0) : 0;
  c.lineCap = 'round'; c.lineWidth = 0.7;
  FEET.forEach(([fx, fy, front], i) => {
    const ft = M.feet && M.feet[i], side = Math.sign(fy);
    let x = fx, y = fy, lift = ft ? ft.lift : 0;
    if (ft) { const dx = ft.p[0] - M.x, dy = ft.p[1] - M.y; x = dx * ca + dy * sa; y = -dx * sa + dy * ca; }
    if (sq) {
      const [px, py] = front ? [12, side * 11] : [-19, side * 13.5];
      x += (px - x) * sq; y += (py - y) * sq; lift *= 1 - sq;
    }
    if (front) { x = hx(x); frontFeet.push([x, y, side, lift]); } else backFeet.push([x, y, side, lift]);
    const [rx, ry, rot] = front ? [1.7, 2.0, side * 0.4] : [3.4, 1.9, side * (0.35 - 0.9 * sq)];
    const sc = 1 - 0.28 * lift, out = side * 0.35 * lift;
    const col = `rgb(${S.foot[0] + 30 * lift | 0}, ${S.foot[1] + 26 * lift | 0}, ${S.foot[2] + 24 * lift | 0})`;
    c.fillStyle = col; c.strokeStyle = col;
    c.save(); c.translate(x, y); c.rotate(rot + out); c.scale(sc, sc);
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    // deditos abiertos hacia adelante y hacia afuera (en diagonal); en las manos salen un poco más adelante de la palma
    const l = (Math.max(rx, ry) + 1.4) * sc, x0 = x + (front ? 0.4 : 0) * sc;
    c.beginPath();
    for (const spread of [-0.45, -0.15, 0.15, 0.45]) {
      const a = side * (front ? 0.85 - 0.15 * sq : 0.85 + 1.5 * sq) + spread + out;   // aplastada: los de atrás apuntan para atrás
      c.moveTo(x, y); c.lineTo(x0 + Math.cos(a) * l, y + Math.sin(a) * l);
    }
    c.stroke();
  });
  // muslos traseros: óvalos de pelaje desde la cadera hasta cada pata (siguen a la pata cuando da el paso),
  // tapan el hueco entre la pata y el cuerpo; el cuerpo se dibuja encima y los deditos quedan a la vista
  // y brazos delanteros: más finitos, desde el hombro hasta cada mano (asoman apenas al costado de la cabeza)
  const limb = (ax, ay, x, y, thick, minLen, lift) => {
    const dx = x - ax, dy = y - ay, d = Math.hypot(dx, dy);
    const rx = Math.max(minLen, d * 0.42 + 0.8), ry = thick * (1 - 0.12 * lift);   // termina antes del centro de la pata
    c.save(); c.translate(ax + dx * 0.38, ay + dy * 0.38); c.rotate(Math.atan2(dy, dx));
    c.fillStyle = S.fur; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();   // del color del pelaje, plano
    c.restore();
  };
  for (const [x, y, side, lift] of backFeet) limb(-12.5, side * 6.5, x, y, 3.6, 3.8, lift);
  for (const [x, y, side, lift] of frontFeet) limb(4.5, side * 4.2, x, y, 2.3, 3, lift);
  // torso: balanceo de lado a lado y un rebote mínimo al ritmo de los pasos;
  // al girar en el lugar se compacta (más corto y un poco más ancho)
  const moving = clamp(Math.abs(M.v) / SPEED, 0, 1);
  const sway = Math.sin(M.phase * 1.1) * 0.7 * moving, bob = 1 + 0.02 * Math.abs(Math.sin(M.phase * 2.2)) * moving;
  c.save(); c.translate(0, sway); c.rotate(sway * 0.03);
  const st = stretchAmount();   // estirón al despegarse del pegamento: más largo y más finito
  const tsx = (1 - 0.13 * M.spin) * bob * (1 + 0.2 * st) * (1 - 0.04 * sq), tsy = (1 + 0.09 * M.spin) * bob * (1 - 0.13 * st) * (1 + 0.13 * sq);
  c.translate(-2, 0); c.scale(tsx, tsy); c.translate(2, 0);
  // cuerpo en forma de pera redondeada: ancho atrás, hocico corto (cabeza y cuerpo en una sola silueta)
  // la cabeza gira sobre el cuello (x = NECK); entre el cuello y x = NECK + 4 el giro se reparte para que doble suave
  const NECK = 2;
  const P = (x, y) => {
    x = hx(x);
    const a = M.headA * clamp((x - NECK) / 4, 0, 1);
    if (!a) return [x, y];
    const dx = x - NECK;
    return [NECK + dx * Math.cos(a) - y * Math.sin(a), dx * Math.sin(a) + y * Math.cos(a)];
  };
  const bz = (...pts) => { const q = []; for (let i = 0; i < pts.length; i += 2) q.push(...P(pts[i], pts[i + 1])); body.bezierCurveTo(...q); };
  const body = new Path2D();
  body.moveTo(...P(18, 0));
  bz(16.5, -2.2, 13, -4.6, 9, -5.8);       // hocico → cachete
  bz(5, -7, 3, -8.8, -1, -10);             // hombros
  bz(-5, -11.4, -11, -11.6, -15, -10);     // parte más ancha
  bz(-19, -8.2, -20.5, -4.5, -20.5, 0);    // cola / cadera
  bz(-20.5, 4.5, -19, 8.2, -15, 10);
  bz(-11, 11.6, -5, 11.4, -1, 10);
  bz(3, 8.8, 5, 7, 9, 5.8);
  bz(13, 4.6, 16.5, 2.2, 18, 0);
  // cuerpo de un solo color, plano (sin degradé), como las vistas de frente y de perfil (el usuario lo prefirió así)
  c.fillStyle = S.fur; c.fill(body);
  if (S.spots) {   // manchas (Pandita): en el lomo y la cadera, recortadas a la silueta
    c.save(); c.clip(body); c.fillStyle = S.spots;
    for (const [x, y, rx, ry, r] of [[-13, -6.5, 5.5, 4.2, 0.3], [-5, 7, 4.6, 3.4, -0.4], [-18, 5, 3.4, 3, 0], [4, -6.5, 3, 2.4, 0.5]]) {
      c.beginPath(); c.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
  // con la luz del laberinto prendida va sin arnés ni linterna
  const bare = !isMenu() && G.mode === 'story' && !G.dark && !libOn;
  // arnés (recortado a la silueta del cuerpo)
  if (!bare) {
  c.save(); c.clip(body);
  c.strokeStyle = S.harness; c.lineWidth = 2; c.lineCap = 'butt'; c.beginPath();
  c.moveTo(1, -13); c.lineTo(1, 13); c.moveTo(-10, -13); c.lineTo(-10, 13); c.moveTo(-10, 0); c.lineTo(1, 0); c.stroke();
  c.restore();
  }
  // orejas: giran con la cabeza y van debajo de la linterna
  c.save(); c.translate(NECK, 0); c.rotate(M.headA); c.translate(-NECK, 0);
  for (const sy of [-1, 1]) {
    // oreja ovalada: nace donde nacía la redonda y se estira hacia atrás; el interior rosa corrido hacia el cuerpo
    let ear = bump * Math.sin(G.time * 38 + sy) * 0.6;
    if (M.twitch.t > 0 && M.twitch.side === sy) ear += Math.sin((1 - M.twitch.t / TWITCH_T) * Math.PI * 2) * 0.75;
    if (M.caught) ear += Math.sin(G.time * 46 + sy * 1.3) * 0.55 * caughtAmp() + 0.75 * sq;   // atrapado: se agitan (1 s) y quedan caídas
    c.save();
    // un poco metida hacia el cuerpo, e inclinada hacia afuera con pivote en su base trasera (del lado del cuerpo)
    c.translate(0, -sy * EAR_IN);
    c.translate(hx(2.5), sy * 6.5); c.rotate(sy * EAR_TILT); c.translate(-hx(2.5), -sy * 6.5);
    c.translate(hx(7.5), sy * 4.8); c.rotate(sy * ear); c.translate(-hx(7.5), -sy * 4.8);
    c.fillStyle = S.ear; c.beginPath(); c.ellipse(hx(7), sy * 7.8, 5.4, 4.0, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = S.earIn; c.beginPath(); c.ellipse(hx(7.5), sy * 7.0, 3.4, 2.4, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  c.restore();
  // linterna sobre el lomo: cuerpo gris azulado (cilindro, igual de ambos lados) con una barra de batería
  // que muestra el tiempo que queda y se vacía hacia la cola. Es rígida: no se estira ni se aplasta con el torso
  // (se deshace la escala alrededor de su centro; acompaña al lomo en posición pero mantiene su forma)
  const FCX = -2.2;
  if (!bare) {
  c.save(); c.translate(FCX, 0); c.scale(1 / tsx, 1 / tsy); c.translate(-FCX, 0);
  const rr = (x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
  const FL = 4;   // medio ancho del cuerpo
  const lg = c.createLinearGradient(0, -FL, 0, FL);
  lg.addColorStop(0, S.light[0]); lg.addColorStop(0.24, S.light[1]); lg.addColorStop(0.5, S.light[2]);
  lg.addColorStop(0.76, S.light[1]); lg.addColorStop(1, S.light[0]);
  c.fillStyle = lg; rr(-13, -FL, 17, FL * 2, 1.6); c.fill();   // pasa la segunda tira del arnés
  c.fillStyle = '#26282c'; c.fillRect(-12.2, -FL + 0.5, 0.9, FL * 2 - 1);   // tapa trasera
  c.fillStyle = '#121316'; rr(-11.3, -2.1, 10.4, 4.2, 1); c.fill();        // marco de la barra
  const frac = isMenu() ? 1 : clamp(G.timeLeft / Math.max(1, G.timeLimit), 0, 1);
  const blinkOut = G.state === 'play' && G.dark && G.timeLeft <= WARN_T && Math.sin(G.time * 14) < -0.3;
  if (frac > 0 && !blinkOut) {
    c.fillStyle = frac > 0.25 ? '#e2ea3a' : frac > 0.1 ? '#f2b53a' : '#f0563a';
    rr(-10.8, -1.6, 9.4 * frac, 3.2, 0.6); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(-10.6, -1.35, Math.max(0, 9.4 * frac - 0.4), 0.55);   // brillo
  }
  for (const bx of [0.5, 2.6]) {   // botones
    c.fillStyle = '#17181b'; rr(bx - 0.8, -1.4, 1.6, 2.8, 0.45); c.fill();
    c.strokeStyle = 'rgba(190,205,210,0.55)'; c.lineWidth = 0.22; c.beginPath(); c.moveTo(bx, -0.6); c.lineTo(bx, 0.6); c.stroke();
  }
  c.fillStyle = '#3a3d42'; c.fillRect(3.4, -FL + 0.3, 0.6, FL * 2 - 0.6);   // anillo antes del cabezal
  const hg = c.createLinearGradient(0, -4.2, 0, 4.2);   // cabezal: mismo volumen de cilindro que el cuerpo
  hg.addColorStop(0, '#232529'); hg.addColorStop(0.5, '#a9adb4'); hg.addColorStop(1, '#232529');
  c.fillStyle = hg; c.fillRect(4, -4.2, 3.4, 8.4);
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(6.6, -4.2, 0.5, 8.4);   // borde del aro, un poco más claro
  c.fillStyle = G.light > 0.2 ? '#fff4d2' : '#6b6450'; c.fillRect(7.4, -3.6, 1.2, 7.2);
  c.restore();   // fin de la linterna (rígida)
  }
  // cara (nariz, orejas, ojos, bigotes): gira entera con la cabeza
  c.save(); c.translate(NECK, 0); c.rotate(M.headA); c.translate(-NECK, 0);
  // nariz chiquita, un poco metida dentro del hocico
  c.fillStyle = S.nose; c.beginPath(); c.arc(hx(16.9), 0, 0.95, 0, Math.PI * 2); c.fill();
  const eyesClosed = M.blinkT > 0 || bump > 0.2 || (M.caught && !(M.caughtT > 0));   // atrapada: cuando deja de sacudirse, queda con los ojos cerrados
  for (const sy of [-1, 1]) {
    // oreja ovalada: nace donde nacía la redonda y se estira hacia atrás; el interior rosa corrido hacia el cuerpo
    // (las orejas se dibujan antes, debajo de la linterna)
    // ojo: cerca del hocico; rojo (albino) con brillito blanco, o cerrado (rayita de costado, curvada hacia el lomo)
    const ex = hx(11.7);
    if (S.spots) { c.fillStyle = S.spots; c.beginPath(); c.ellipse(ex - 0.4, sy * 3, 2.6, 2, sy * 0.4, 0, Math.PI * 2); c.fill(); }   // antifaz de panda
    if (eyesClosed) {
      c.strokeStyle = S.eyeShut; c.lineWidth = 0.6; c.lineCap = 'round'; c.beginPath();
      c.moveTo(ex, sy * 1.9); c.quadraticCurveTo(ex - 0.9, sy * 2.9, ex, sy * 3.9); c.stroke();
    } else {
      if (S.eyeGlow) {   // brillo rojo alrededor (solo la Albina)
        const eg = c.createRadialGradient(ex, sy * 2.9, 0.4, ex, sy * 2.9, 2.8);
        eg.addColorStop(0, `rgba(${S.eyeGlow},0.55)`); eg.addColorStop(1, `rgba(${S.eyeGlow},0)`);
        c.fillStyle = eg; c.beginPath(); c.arc(ex, sy * 2.9, 2.8, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = S.eyes; c.beginPath(); c.arc(ex, sy * 2.9, 1.1, 0, Math.PI * 2); c.fill();
      c.fillStyle = `rgba(${hexRgb(S.shine).join(',')},0.9)`; c.beginPath(); c.arc(ex + 0.4, sy * 2.5, 0.38, 0, Math.PI * 2); c.fill();
    }
    // bigotes: salen junto a la nariz y se abren bien a los costados; tiemblan apenas y mucho al chocar
    const wt = M.caught ? 0 : G.time;   // atrapada: los bigotes quedan quietos
    const wh = Math.sin(wt * 9 + sy) * 0.04 + Math.sin(wt * 55 + sy * 2) * 0.35 * bump;
    const wx = hx(15.8);
    c.strokeStyle = 'rgba(235,230,220,0.6)'; c.lineWidth = 0.35; c.beginPath();
    for (const [k, len] of [[0.75, 10], [1.1, 12], [1.45, 12], [1.8, 10]]) {
      const th = sy * (k + wh); c.moveTo(wx, sy * 1.2); c.lineTo(wx + Math.cos(th) * len, sy * 1.2 + Math.sin(th) * len);
    }
    c.stroke();
  }
  c.restore();   // fin de la cara
  c.restore();   // fin del torso
  c.restore();
}

function render() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  if (!G.maze) return;
  // temblor suave de cámara (solo al dibujar, no mueve la cámara real)
  const shx = G.shake * G.shake * 3 * Math.sin(G.time * 63), shy = G.shake * G.shake * 3 * Math.cos(G.time * 51);
  cam.x += shx; cam.y += shy;
  const hw = w / (2 * scale), hh = h / (2 * scale);
  const v = { x0: cam.x - hw, y0: cam.y - hh, x1: cam.x + hw, y1: cam.y + hh };
  const T6 = [scale, 0, 0, scale, w / 2 - cam.x * scale, h / 2 - cam.y * scale];
  const menu = isMenu();   // en los menús no hay rata
  const roomLit = !menu && G.mode === 'story' && !G.dark && G.maze;   // nivel con la luz del laberinto prendida
  const lit = G.light > 0.01 || menu || debugLight || roomLit;   // en los menús siempre hay una luz ambiente tenue (el fondo se ve un poco)

  if (lit) {
    // 1) escena completamente iluminada
    ctx.setTransform(...T6); drawFloor(ctx, v);
    wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, w, h); wctx.setTransform(...T6); drawWalls(wctx, v);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(wallCv, 0, 0);

    // 2) mapa de luz: haz recortado por las sombras de las paredes
    const ox = menu ? MenuFl.x : M.x + Math.cos(M.a) * 4, oy = menu ? MenuFl.y : M.y + Math.sin(M.a) * 4;
    const light = menu ? drawBulb : roomLit ? () => {} : drawCone;   // con la luz prendida no hay linterna
    castRays(ox, oy);
    actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, w, h); actx.setTransform(...T6);
    light(actx, ox, oy);
    actx.globalCompositeOperation = 'destination-in'; actx.fillStyle = '#000'; actx.beginPath();
    for (let i = 0; i < RAYS; i++) { const x = ox + COS[i] * HITS[i], y = oy + SIN[i] * HITS[i]; i ? actx.lineTo(x, y) : actx.moveTo(x, y); }
    actx.closePath(); actx.fill(); actx.globalCompositeOperation = 'source-over';
    // la luz del piso no cae sobre las paredes (sus cantos se proyectan encima del piso): las paredes se iluminan solo
    // con la suya, más tenue (WALL_LIGHT), así el borde de arriba no queda más brillante que el piso
    if (!menu) {
      actx.setTransform(1, 0, 0, 1, 0, 0); actx.globalCompositeOperation = 'destination-out';
      actx.drawImage(wallCv, 0, 0); actx.globalCompositeOperation = 'source-over';
    }

    // las paredes se iluminan un poco más allá del impacto (su canto y su cara proyectada)
    bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, w, h); bctx.setTransform(...T6);
    light(bctx, ox, oy);
    bctx.globalCompositeOperation = 'destination-in'; bctx.fillStyle = '#000'; bctx.beginPath();
    const ext = T + 6, s = 1 + K;
    for (let i = 0; i < RAYS; i++) { const x = ox + COS[i] * (HITS[i] + ext), y = oy + SIN[i] * (HITS[i] + ext); i ? bctx.lineTo(x, y) : bctx.moveTo(x, y); }
    bctx.closePath();
    for (let i = 0; i < RAYS; i++) {
      const x = cam.x + (ox + COS[i] * (HITS[i] + ext) - cam.x) * s, y = cam.y + (oy + SIN[i] * (HITS[i] + ext) - cam.y) * s;
      i ? bctx.lineTo(x, y) : bctx.moveTo(x, y);
    }
    bctx.closePath(); bctx.fill('nonzero');
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    if (CAN_BLUR) {
      // borde suave también en la luz de las paredes (antes se veía un círculo de borde duro)
      const bw = blurCv.width, bh = blurCv.height;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0); blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.filter = `blur(${(WALL_SOFT * scale / 2).toFixed(1)}px)`;
      blurCtx.drawImage(bCv, 0, 0, bw, bh); blurCtx.filter = 'none';
      bctx.globalCompositeOperation = 'copy'; bctx.drawImage(blurCv, 0, 0, w, h);
      bctx.globalCompositeOperation = 'destination-in';
    }
    bctx.drawImage(wallCv, 0, 0);
    bctx.globalCompositeOperation = 'source-over';

    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
    lctx.fillStyle = '#000'; lctx.fillRect(0, 0, w, h);
    lctx.globalCompositeOperation = 'lighter'; lctx.globalAlpha = G.light;
    if (CAN_BLUR) {
      // sombras esfumadas: la luz del piso se desenfoca (a media resolución, para que sea barato)
      const bw = blurCv.width, bh = blurCv.height;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0); blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.filter = `blur(${(SHADOW_SOFT * scale / 2).toFixed(1)}px)`;
      blurCtx.drawImage(aCv, 0, 0, bw, bh); blurCtx.filter = 'none';
      lctx.drawImage(blurCv, 0, 0, w, h);
    } else lctx.drawImage(aCv, 0, 0);   // sin filter (iPhone): sombras de borde duro (el desenfoque alternativo vibraba)
    lctx.globalAlpha = G.light * WALL_LIGHT; lctx.drawImage(bCv, 0, 0);   // las paredes, menos iluminadas que el piso
    lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
    const amb = menu ? MENU_AMBIENT : debugLight ? DEBUG_AMBIENT : roomLit ? ROOM_AMBIENT : G.dark ? DARK_AMBIENT * G.light : 0;   // menús: fondo tenue · luz de prueba: todo el laberinto a la vista
    if (amb) { lctx.globalCompositeOperation = 'lighter'; lctx.fillStyle = 'rgba(255,240,215,' + amb + ')'; lctx.fillRect(0, 0, w, h); lctx.globalCompositeOperation = 'source-over'; }
    if (G.siren > 0.01) drawSiren(lctx, T6);

    // 3) oscuridad total salvo lo que toca la luz
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(lightCv, 0, 0); ctx.globalCompositeOperation = 'source-over';
  }

  // zona de pantalla alrededor del ratón (para dibujarlo aparte y para las paredes de encima)
  const pad = 55 * scale, mx = w / 2 + (M.x - cam.x) * scale, my = h / 2 + (M.y - cam.y) * scale;
  const sx = Math.max(0, Math.floor(mx - pad)), sy = Math.max(0, Math.floor(my - pad));
  const sw = Math.min(w, Math.ceil(mx + pad)) - sx, sh = Math.min(h, Math.ceil(my + pad)) - sy;

  // 4) el ratón (siempre visible): se dibuja opaco en su propio canvas y se oscurece según la luz,
  //    así no se transparenta (ni el cuerpo ni la linterna dejan ver lo que hay debajo)
  if (sw > 0 && sh > 0 && !menu) {
    mouseCtx.setTransform(1, 0, 0, 1, 0, 0); mouseCtx.globalCompositeOperation = 'source-over'; mouseCtx.clearRect(sx, sy, sw, sh);
    mouseCtx.setTransform(...T6); drawMouse(mouseCtx, 1);
    mouseCtx.setTransform(1, 0, 0, 1, 0, 0);
    const dark = 1 - (0.4 + 0.6 * G.light) * (1 - exitDarkness());   // al salir, también se pierde en la oscuridad
    if (dark > 0.01) { mouseCtx.globalCompositeOperation = 'source-atop'; mouseCtx.fillStyle = `rgba(0,0,0,${dark})`; mouseCtx.fillRect(sx, sy, sw, sh); }
    mouseCtx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(mouseCv, sx, sy, sw, sh, sx, sy, sw, sh);
  }
  ctx.setTransform(...T6);
  if (lit && !menu && !roomLit) {
    const lx = M.x + Math.cos(M.a) * 8.5, ly = M.y + Math.sin(M.a) * 8.5;
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 12);
    g.addColorStop(0, `rgba(255,240,200,${0.9 * G.light})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(lx - 12, ly - 12, 24, 24);
    ctx.globalCompositeOperation = 'source-over';
  }
  // migas de queso al agarrarlo, y chispitas blancas (rombos que giran y se achican) al agarrar una moneda
  for (const p of G.fx) {
    const k = 1 - p.t / p.life;
    if (p.sq) {
      const sz = p.s * (0.4 + 0.6 * k);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.vr * p.t);
      ctx.fillStyle = `rgba(255,255,255,${k})`; ctx.fillRect(-sz / 2, -sz / 2, sz, sz); ctx.restore();
      continue;
    }
    ctx.fillStyle = `rgba(245, 205, 80, ${k})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  // 5) las paredes son más altas que el ratón: se vuelven a dibujar encima, solo en la zona alrededor de él. Solo los
  //    cantos de arriba (y las cortinas de las puertas vistas de frente): las caras que miran a la cámara quedan debajo
  //    del ratón, así cuando se apoya contra una pared se le ven las orejas, la cabeza y las patas delante de la cara (antes
  //    la pared se las tapaba y parecía que se metía por debajo)
  if (!lit) { wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, w, h); wctx.setTransform(...T6); drawWalls(wctx, v); }
  if (sw > 0 && sh > 0 && !menu) {
    litCtx.setTransform(1, 0, 0, 1, 0, 0); litCtx.globalCompositeOperation = 'source-over'; litCtx.clearRect(sx, sy, sw, sh);
    litCtx.drawImage(wallCv, sx, sy, sw, sh, sx, sy, sw, sh);
    if (lit) { litCtx.globalCompositeOperation = 'multiply'; litCtx.drawImage(lightCv, sx, sy, sw, sh, sx, sy, sw, sh); }
    else { litCtx.globalCompositeOperation = 'source-in'; litCtx.fillStyle = '#000'; litCtx.fillRect(sx, sy, sw, sh); }
    topCtx.setTransform(1, 0, 0, 1, 0, 0); topCtx.clearRect(sx, sy, sw, sh);
    topCtx.save(); topCtx.beginPath(); topCtx.rect(sx, sy, sw, sh); topCtx.clip(); topCtx.setTransform(...T6);
    const rx0 = cam.x + (sx - w / 2) / scale, ry0 = cam.y + (sy - h / 2) / scale, rx1 = rx0 + sw / scale, ry1 = ry0 + sh / scale;
    topCtx.fillStyle = '#000';
    const quad = (...p) => { topCtx.beginPath(); topCtx.moveTo(p[0], p[1]); for (let i = 2; i < 8; i += 2) topCtx.lineTo(p[i], p[i + 1]); topCtx.closePath(); topCtx.fill(); };
    for (const R of G.rects) {
      const t = R._t; if (!t) continue;
      const [tx, ty, tw, th] = t;
      if (Math.min(tx, R.x) >= rx1 || Math.max(tx + tw, R.x + R.w) <= rx0 || Math.min(ty, R.y) >= ry1 || Math.max(ty + th, R.y + R.h) <= ry0) continue;
      topCtx.fillRect(tx - 0.5, ty - 0.5, tw + 1, th + 1);
      // la cara que mira a la cámara tapa al ratón solo si él está del otro lado de la pared (detrás de ella); si está
      // del lado de la cara, queda delante (si no, se le veían las patas y los bigotes asomando del otro lado)
      if (R.x > cam.x && M.x > R.x + R.w / 2) quad(R.x, R.y, R.x, R.y + R.h, tx, ty + th, tx, ty);
      if (R.x + R.w < cam.x && M.x < R.x + R.w / 2) quad(R.x + R.w, R.y, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx + tw, ty);
      if (R.y > cam.y && M.y > R.y + R.h / 2) quad(R.x, R.y, R.x + R.w, R.y, tx + tw, ty, tx, ty);
      if (R.y + R.h < cam.y && M.y < R.y + R.h / 2) quad(R.x, R.y + R.h, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx, ty + th);
    }
    drawDoors(topCtx, v, 'front');
    drawGates(topCtx, v, true);
    topCtx.restore();
    litCtx.globalCompositeOperation = 'destination-in'; litCtx.drawImage(topCv, sx, sy, sw, sh, sx, sy, sw, sh);
    litCtx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(litCv, sx, sy, sw, sh, sx, sy, sw, sh);
  }

  // 6) cortinilla: círculo negro centrado en el ratón que se cierra al salir y se abre al empezar
  if (G.iris < 1) {
    const e = G.iris * G.iris * (3 - 2 * G.iris);   // suavizado
    const maxR = Math.max(Math.hypot(mx, my), Math.hypot(w - mx, my), Math.hypot(mx, h - my), Math.hypot(w - mx, h - my));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.beginPath();
    ctx.rect(0, 0, w, h);
    if (e > 0.001) ctx.arc(mx, my, e * maxR, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
  }
  cam.x -= shx; cam.y -= shy;

  // HUD
  if (!isMenu()) {
    $level.textContent = 'NIVEL ' + G.level;
    // El reloj sube (lo que vas tardando), igual que los resultados y los objetivos; el límite se ve en la batería de la
    // linterna y en la sirena
    $timer.textContent = fmtMS(G.elapsed);
    $timer.classList.toggle('warn', G.lamp && G.timeLeft <= WARN_T && G.state === 'play');
    $cheese.classList.toggle('hidden', !G.cheeseTotal || ['won', 'lost'].includes(G.state));   // detrás del cartel de fin de nivel, no (ya está en el cartel)
    $cheeseN.textContent = `${G.cheese}/${G.cheeseTotal}`;
    // batería de la linterna: un bloque prendido por cada 15 s que quedan (en Desafío, por cada cuarto del tiempo del nivel) (el que se está gastando también); con el
    // último bloque se pone naranja y en los últimos WARN_T s rojo y titila
    $lamp.classList.toggle('hidden', !G.lamp || ['won', 'lost'].includes(G.state));
    $lamp.classList.toggle('up', !G.cheeseTotal);
    if (G.lamp) {
      const n = Math.ceil(Math.max(0, G.timeLeft) / (G.lampBlock || LAMP_BLOCK) - 1e-6), crit = G.timeLeft <= WARN_T, low = n <= 1;
      const blink = crit && G.state === 'play' && Math.sin(G.time * 14) < -0.3;
      $lampCells.forEach((el, k) => { el.className = k < n ? (crit ? 'on crit' : low ? 'on low' : 'on') + (blink && k === n - 1 ? ' blink' : '') : ''; });
    }
  }
  const showHint = G.state === 'play' && G.level <= 2;
  $hint.style.display = showHint ? '' : 'none';
  $hintTouch.style.display = showHint && Stick.id === null ? '' : 'none';
}

// ===================== GALERÍA (index.html?galeria) =====================
// Muestra los items grandes y bien iluminados sobre el cartón, para revisar y corregir los diseños.
const GALLERY = /galeria/i.test(location.search + location.hash);
function renderGallery() {
  const w = cv.width, h = cv.height, cols = w > h ? 4 : 2, rows = Math.ceil(8 / cols), CELL = 64;
  const s = Math.min(w / cols, h / rows) / CELL;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  const ox = (w - cols * CELL * s) / 2, oy = (h - rows * CELL * s) / 2;
  ctx.setTransform(s, 0, 0, s, ox, oy);
  ctx.fillStyle = floorPat; ctx.fillRect(0, 0, cols * CELL, rows * CELL);
  const sc = cam.x, sy = cam.y;
  cam.x = cols * CELL / 2; cam.y = rows * CELL / 2;                 // el queso muestra distintos costados según dónde está
  const at = i => [(i % cols + 0.5) * CELL, (Math.floor(i / cols) + 0.45) * CELL];
  const list = [
    ['Trampera abierta', p => drawTrap(ctx, { x: p[0], y: p[1], a: 0, closed: false, t: 0 })],
    ['Trampera cerrada', p => drawTrap(ctx, { x: p[0], y: p[1], a: 0, closed: true, t: 1 })],
    ['Pegamento', p => drawSticky(ctx, { x: p[0] - TRAY_L / 2, y: p[1] - TRAY_W / 2, w: TRAY_L, h: TRAY_W })],
    ['Queso', p => drawCheese(ctx, { x: p[0], y: p[1], rot: -0.3 })],
    ['Queso (otro ángulo)', p => drawCheese(ctx, { x: p[0], y: p[1], rot: 2.2 })],
    ['Molinete', p => drawSpinner(ctx, { x: p[0], y: p[1], a0: 0, dir: 1 })],
    ['Compuerta', p => { const it = { x: p[0], y: p[1], vert: false, ph: 0 }; drawGate(ctx, it); drawGates(ctx, { x0: -1e9, x1: 1e9, y0: -1e9, y1: 1e9 }, false, [it]); }],
    ['Moneda (girando)', p => drawCoin(ctx, { x: p[0], y: p[1], ph: 0 })],
    ['Moneda (de frente)', p => drawCoin(ctx, { x: p[0], y: p[1], ph: -G.time * 3 })],
    ['Ratón (escala)', p => { const keep = { x: M.x, y: M.y, a: M.a, tail: M.tail, feet: M.feet }; Object.assign(M, { x: p[0] + 6, y: p[1], a: Math.PI, tail: null, feet: null }); updateTail(0); drawMouse(ctx, 1); Object.assign(M, keep); }],
  ];
  list.forEach(([name, draw], i) => {
    const p = at(i); draw(p);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(20,12,4,0.85)'; ctx.font = `${Math.max(12, 5 * s)}px 'Kalam', cursive`; ctx.textAlign = 'center';
    ctx.fillText(name, ox + p[0] * s, oy + (p[1] + CELL * 0.42) * s);
    ctx.restore();
  });
  cam.x = sc; cam.y = sy;
}

// ===================== GALERÍA DE RATITAS (index.html?ratas) =====================
// Las 20 ratitas en sus jaulas, en estantes, todas desbloqueadas y animadas, para revisar los colores.
// Ratita de frente, en dos poses armadas con LAS MISMAS piezas (cabeza, panza, orejas, ojos, nariz, boca, bigotes,

      c.translate(...pv); c.rotate(sh); c.translate(-pv[0], -pv[1]);
    }
    c.fillStyle = P.paws; c.beginPath(); c.ellipse(h.c[0], h.c[1], h.rx, h.ry, h.rot, 0, Math.PI * 2); c.fill();
    c.strokeStyle = P.earLine; c.lineWidth = 5;
    for (const kk of [0, 1]) {   // dos deditos: sentada para abajo y hacia el medio, hecha bolita para arriba
      const o = m2([-sd * (2 + 20 * kk), 4 - 10 * kk], [-sd * (4 + 16 * kk), -7 + 5 * kk]), d = m2([-sd * 12, 36], [-sd * 7, -27]);
      c.beginPath(); c.moveTo(h.c[0] + o[0], h.c[1] + o[1]); c.lineTo(h.c[0] + o[0] + d[0], h.c[1] + o[1] + d[1]); c.stroke();
    }
    c.restore();
  }
  c.restore();
  c.restore();
}
// sentada, con (x, y) en el piso al medio y size la altura total
function drawRatFront(c, x, y, size, i, t = 0, land = -1) { drawRatFrontPose(c, x, y - size * (1092 - FRONT_CY[0]) / 935, size, i, t, land, 0); }
// hecha bolita, con (x, y) en el centro y size el ancho de la bola
function drawRatFrontBall(c, x, y, size, i, t = 0) { drawRatFrontPose(c, x, y, size * 935 / (BALL_R * 2), i, t, -1, 1); }
// Galerías para revisar los colores de las 20 ratitas (no son parte del juego): cada una en su casillero, con el número,
// el nombre y los colores que usa (piel y orejas, de portraitOf). index.html?frente: de frente, sentadas;
// index.html?retratos: el retrato de costado de la pantalla de Ratitas, sin la jaula.
function ratGrid(bg, draw) {
  const w = cv.width, h = cv.height, cols = w > h ? 5 : 4, rows = Math.ceil(RATS.length / cols), cw = w / cols, ch = h / rows;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  const fs = Math.max(11, Math.min(cw, ch) * 0.065);
  RATS.forEach((r, i) => {
    const x0 = (i % cols) * cw, y0 = Math.floor(i / cols) * ch, P = portraitOf(i);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1; ctx.strokeRect(x0 + 0.5, y0 + 0.5, cw - 1, ch - 1);
    draw(x0, y0, cw, ch - fs * 2.6, i);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.fillStyle = '#2a2a2a';
    ctx.font = `${fs}px 'Kalam', cursive`; ctx.fillText(`${i} · ${r[0]}`, x0 + cw / 2, y0 + ch - fs * 1.35);
    ctx.font = `${fs * 0.72}px 'Special Elite', monospace`; ctx.fillText(`piel ${P.fur} · orejas ${P.ear}`, x0 + cw / 2, y0 + ch - fs * 0.35);
  });
}
const FRONT_GALLERY = /frente/i.test(location.search + location.hash);
function renderFrontGallery() {
  ratGrid('#ececec', (x0, y0, cw, ch, i) => { const sz = Math.min(ch * 0.86, cw * 0.62); drawRatFront(ctx, x0 + cw * 0.46, y0 + (ch + sz) / 2, sz, i, G.time + i * 0.7); });
}
const PORTRAIT_GALLERY = /retratos/i.test(location.search + location.hash);
function renderPortraitGallery() {
  ratGrid('#ececec', (x0, y0, cw, ch, i) => { const sz = Math.min(cw * 0.8, ch * 1.25); drawRatPortrait(ctx, x0 + cw / 2, y0 + ch * 0.55, sz, i, G.time + i * 0.7); });
}
const RAT_GALLERY = /ratas/i.test(location.search + location.hash);
function renderRatGallery() {
  const w = cv.width, h = cv.height, cols = w > h ? 5 : 4, rows = Math.ceil(RATS.length / cols);
  const cw = w / cols, ch = h / rows;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  RATS.forEach((r, i) => {
    ctx.save(); ctx.translate((i % cols) * cw, Math.floor(i / cols) * ch);
    drawRatCage(ctx, cw, ch, i, true, false, G.time + i * 0.7);
    ctx.restore();
  });
}

// ===================== LIBRERÍA DE RATITAS (index.html?libreria) =====================
// Herramienta para el usuario (no es parte del juego): las 20 ratitas en sus 3 vistas (laberinto desde arriba, de
// costado y de frente), animadas, con selectores para cambiar sus colores en vivo. Cada color se elige una sola vez y
// se usa en las 3 vistas (la paleta es la de la ratita de frente, portraitOf; skinOf la toma para el laberinto). Los
// cambios se guardan en este navegador (raton.lib) y solo se aplican en la librería; "Aplicar cambios" baja un archivo
// (ratitas-colores.json, a Descargas) con todos los colores, que Claude lee y pasa al código; "Ver cambios" muestra la lista
// de lo que cambió (PORTRAIT_COLORS y RATS). En el panel del navegador: openLib().
const LIB = /libreria/i.test(location.search + location.hash);
let libOn = false;
const LIB_ORIG = { rats: RATS.map(r => r.slice()), port: JSON.parse(JSON.stringify(PORTRAIT_COLORS)) };
// [campo, etiqueta]: claves de portraitOf, o 'r' + índice en RATS (ojos, arnés, linterna, manchas)
const LIB_FIELDS = [['fur', 'Pelaje'], ['ear', 'Oreja externa'], ['earDark', 'Oreja interna (y la de atrás, de costado)'],
  ['earLine', 'Línea de la oreja'], ['nose', 'Nariz'], ['paws', 'Patas'], ['tail', 'Cola'], ['r5', 'Ojos'], ['shine', 'Brillo del ojo'],
  ['line', 'Líneas de la cara'], ['legLine', 'Líneas de las patas'], ['r3', 'Arnés'], ['r4', 'Linterna'], ['r7', 'Manchas']];
// los automáticos de portraitOf salen de otro color: al cambiar ese, se fijan antes con el valor que tenían, así cada
// selector cambia solo lo suyo
const LIB_DEPS = { fur: ['line', 'legLine'], ear: ['earDark', 'earLine', 'nose', 'paws', 'tail'], paws: ['tail'], line: ['legLine'] };
const libPal = i => { const P = portraitOf(i), r = RATS[i]; return { ...P, r3: r[3], r4: r[4], r5: r[5], r7: r[7] }; };
const LIB_PAL0 = RATS.map((_, i) => libPal(i));   // cómo eran antes de los cambios
const Lib = {
  load() {   // los cambios guardados de antes
    let d = null; try { d = JSON.parse(localStorage.getItem('raton.lib')); } catch (_) {}
    if (!d) return;
    for (const i in d.rats || {}) d.rats[i].forEach((v, k) => { if (v) RATS[i][k] = v; });
    for (const i in d.port || {}) PORTRAIT_COLORS[i] = { ...(PORTRAIT_COLORS[i] || {}), ...d.port[i] };
  },
  save() {
    const d = { rats: {}, port: {} };
    RATS.forEach((r, i) => { if (r.some((v, k) => v !== LIB_ORIG.rats[i][k])) d.rats[i] = r.map((v, k) => v !== LIB_ORIG.rats[i][k] ? v : null); });
    for (const i in PORTRAIT_COLORS) { const o = PORTRAIT_COLORS[i], a = LIB_ORIG.port[i] || {}, ch = {};
      for (const k in o) if (o[k] !== a[k]) ch[k] = o[k];
      if (Object.keys(ch).length) d.port[i] = ch; }
    try { localStorage.setItem('raton.lib', JSON.stringify(d)); } catch (_) {}
  },
  // lista legible de lo que cambió (para copiar y pasarle a Claude)
  changes() {
    const out = [];
    RATS.forEach((r, i) => {
      const now = libPal(i), was = LIB_PAL0[i];
      const L = LIB_FIELDS.filter(([k]) => now[k] && now[k] !== was[k]).map(([k, lab]) => `${lab.toLowerCase()}: ${was[k]} → ${now[k]}`);
      if (L.length) out.push(`Ratita ${i} · ${r[0]}\n  ` + L.join('\n  '));
    });
    return out.length ? out.join('\n') : 'Sin cambios.';
  },
};
function openLib() {
  if (libOn) return; libOn = true;
  Lib.load(); for (const k in skinCache) delete skinCache[k];
  closeOpts(); clearTimeout(cardTimer); $card.classList.add('hidden');
  const st = document.createElement('style');
  st.textContent = `
  #lib { position: fixed; inset: 0; z-index: 100; overflow-y: auto; background: #ececec; color: #2a2622; font-family: 'Special Elite', monospace; padding: 16px 16px 60px; }
  #lib h1 { font-family: 'Kalam', cursive; font-weight: normal; margin: 0 0 4px; font-size: 32px; }
  #lib .bar { position: sticky; top: -16px; z-index: 2; background: #ececec; padding: 10px 0 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #ccc; }
  #lib button { font-family: 'Kalam', cursive; font-size: 16px; padding: 6px 14px; border: 0; background: #e2d6b8; box-shadow: 0 2px 0 #6b4c2c; cursor: pointer; }
  #lib .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; margin-top: 14px; }
  #lib .rc { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  #lib .rc h2 { font-family: 'Kalam', cursive; font-weight: normal; margin: 0 0 6px; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
  #lib .rc h2 button { font-size: 12px; padding: 3px 8px; }
  #lib .views { display: flex; gap: 6px; justify-content: space-between; background: #f3f1ec; border-radius: 8px; }
  #lib .views figure { margin: 0; flex: 1; text-align: center; font-size: 11px; color: #777; }
  #lib .views canvas { display: block; width: 100%; aspect-ratio: 1; }
  #lib .eds { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; margin-top: 10px; font-size: 12px; }
  #lib label { display: flex; align-items: center; gap: 6px; }
  #lib input[type=color] { width: 34px; height: 22px; padding: 0; border: 1px solid #bbb; background: none; cursor: pointer; flex: none; }
  #lib label code { color: #888; font-size: 11px; }
  #lib label.ch code { color: #c0392b; }
  #lib textarea { width: 100%; height: 160px; margin-top: 10px; font-family: monospace; font-size: 12px; }
  @media (max-width: 560px) { #lib .eds { grid-template-columns: 1fr; } }`;
  document.head.appendChild(st);
  const box = document.createElement('div'); box.id = 'lib';
  box.innerHTML = `<h1>Librería de ratitas</h1>
    <div class="bar"><button data-l="apply">Aplicar cambios</button><button data-l="copy">Ver cambios</button><button data-l="reset">Borrar todos los cambios</button>
      <span id="libMsg" style="font-size:12px;color:#777">Cada color se usa en las 3 vistas. Cuando termines, apretá "Aplicar cambios" y avisame: los paso al juego.</span></div>
    <textarea id="libOut" readonly hidden></textarea>
    <div class="cards">${RATS.map((r, i) => `<div class="rc" data-i="${i}"><h2><span>${i} · ${r[0]}</span><button data-l="undo" data-i="${i}">Restaurar</button></h2>
      <div class="views"><figure><canvas data-v="maze"></canvas>laberinto</figure><figure><canvas data-v="side"></canvas>costado</figure><figure><canvas data-v="front"></canvas>frente</figure></div>
      <div class="eds">${LIB_FIELDS.filter(([k]) => k !== 'r7' || r[7]).map(([k, lab]) => `<label><input type="color" data-f="${k}">${lab} <code></code></label>`).join('')}</div></div>`).join('')}</div>`;
  document.body.appendChild(box);
  const refresh = i => {   // los valores que se ven
    const card = box.querySelector(`.rc[data-i="${i}"]`), pal = libPal(i), o = PORTRAIT_COLORS[i] || {};
    card.querySelectorAll('input[data-f]').forEach(inp => {
      const k = inp.dataset.f, v = pal[k], auto = k[0] !== 'r' && !o[k];
      if (document.activeElement !== inp) inp.value = v;
      inp.parentNode.querySelector('code').textContent = auto ? v + ' (auto)' : v;
      inp.parentNode.classList.toggle('ch', v !== LIB_PAL0[i][k]);
    });
  };
  RATS.forEach((_, i) => refresh(i));
  box.addEventListener('input', e => {
    const inp = e.target, card = inp.closest('.rc'); if (!card || !inp.dataset.f) return;
    const i = +card.dataset.i, k = inp.dataset.f, v = inp.value;
    if (k[0] === 'r') RATS[i][+k.slice(1)] = v;
    else {
      const pal = portraitOf(i), o = PORTRAIT_COLORS[i] = { ...(PORTRAIT_COLORS[i] || {}) };
      const pin = key => (LIB_DEPS[key] || []).forEach(d => { if (!o[d]) { pin(d); o[d] = pal[d]; } });   // los que dependen de este, quietos
      pin(k); o[k] = v;
    }
    delete skinCache[i]; Lib.save(); refresh(i);
  });
  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-l]'); if (!b) return;
    const out = document.getElementById('libOut');
    if (b.dataset.l === 'apply') {
      // guarda un archivo (en Descargas) con todos los colores de ahora; Claude lo lee de ahí y lo pasa al código
      const data = { app: 'Maze Mouse', tipo: 'colores de ratitas', fecha: new Date().toISOString(), cambios: Lib.changes(),
        RATS: RATS.map(r => r.slice()), PORTRAIT_COLORS: JSON.parse(JSON.stringify(PORTRAIT_COLORS)) };
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
      a.download = 'ratitas-colores.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      document.getElementById('libMsg').textContent = 'Listo: se guardó "ratitas-colores.json" en Descargas. Avisame y lo aplico al juego.';
    } else if (b.dataset.l === 'copy') {
      out.hidden = !out.hidden; out.value = Lib.changes();
    } else if (b.dataset.l === 'undo' || (b.dataset.l === 'reset' && confirm('¿Borrar todos los cambios de colores?'))) {
      const list = b.dataset.l === 'undo' ? [+b.dataset.i] : RATS.map((_, i) => i);
      for (const i of list) {
        RATS[i] = LIB_ORIG.rats[i].slice();
        if (LIB_ORIG.port[i]) PORTRAIT_COLORS[i] = { ...LIB_ORIG.port[i] }; else delete PORTRAIT_COLORS[i];
        delete skinCache[i]; refresh(i);
      }
      Lib.save();
    }
  });
  // solo se dibujan las tarjetas que están a la vista
  const io = new IntersectionObserver(es => es.forEach(en => { en.target.vis = en.isIntersecting; }), { root: box });
  box.querySelectorAll('.rc').forEach(c => io.observe(c));
}
function renderLib(dt = 1 / 60) {
  const box = document.getElementById('lib'); if (!box) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  box.querySelectorAll('.rc').forEach(card => {
    if (!card.vis) return;
    const i = +card.dataset.i, t = G.time + i * 0.7;
    card.querySelectorAll('canvas').forEach(cv2 => {
      const W = Math.round(cv2.clientWidth * dpr); if (!W) return;
      if (cv2.width !== W || cv2.height !== W) { cv2.width = W; cv2.height = W; }
      const g = cv2.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, W);
      const v = cv2.dataset.v;
      if (v === 'side') drawRatPortrait(g, W / 2, W * 0.52, W * 0.86, i, t);
      else if (v === 'front') drawRatFront(g, W * 0.46, W * 0.92, W * 0.8, i, t);
      else {   // la del laberinto, desde arriba, mirando para arriba (lejos de las paredes del laberinto de fondo)
        const keep = { x: M.x, y: M.y, a: M.a, tail: M.tail, feet: M.feet }, so = skinOverride, s = W / 74;
        Object.assign(M, { x: -9000, y: -9000, a: -Math.PI / 2, tail: card.tail || null, feet: null }); skinOverride = i;   // cada una con su cola
        if (card.tail) updateTail(Math.min(dt, 1 / 30)); else for (let n = 0; n < 90; n++) updateTail(1 / 30);   // la primera vez la cola crece de golpe
        card.tail = M.tail;
        g.setTransform(s, 0, 0, s, W / 2 + 9000 * s, W * 0.36 + 9000 * s);
        drawMouse(g, 1);
        Object.assign(M, keep); skinOverride = so;
      }
    });
  });
}

// ===================== LOOP =====================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (GALLERY) { G.time += dt; renderGallery(); return; }
  if (RAT_GALLERY) { G.time += dt; renderRatGallery(); return; }
  if (FRONT_GALLERY) { G.time += dt; renderFrontGallery(); return; }
  if (PORTRAIT_GALLERY) { G.time += dt; renderPortraitGallery(); return; }
  if (libOn) { G.time += dt; renderLib(dt); return; }
  update(dt); render();
}
resize();
showTitle();
if (GALLERY || RAT_GALLERY || FRONT_GALLERY || PORTRAIT_GALLERY) { document.getElementById('vignette').style.display = 'none'; $coins.style.display = 'none'; clearTimeout(cardTimer); $card.classList.add('hidden'); $hint.style.display = $hintTouch.style.display = 'none'; }
if (LIB) openLib();
requestAnimationFrame(frame);
</script>

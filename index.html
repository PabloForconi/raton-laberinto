<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Mouse</title>
<link rel="preload" as="image" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Special Elite', 'Courier New', monospace; color: #2a1a0c; user-select: none; }
  canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }
  .tape { position: absolute; background: #d9cfb2; padding: 4px 16px 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,.6); font-family: 'Permanent Marker', cursive;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 2px, transparent 2px 5px); }
  /* nivel chiquito arriba del reloj, centrados */
  #level { top: 8px; left: 50%; font-size: 15px; padding: 2px 12px 0; transform: translateX(-50%) rotate(-2deg); white-space: nowrap; z-index: 1; }
  #timer { top: 36px; left: 50%; font-size: 34px; transform: translateX(-50%) rotate(1.5deg); min-width: 92px; text-align: center; }
  #timer.warn { color: #b3140f; animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: translateX(-50%) rotate(1.5deg) scale(1.08); } }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 13px; color: #a08060; opacity: .75; pointer-events: none; }
  #hud.hidden, .hidden { display: none !important; }
  #card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1deg);
    width: min(520px, calc(100vw - 32px)); box-sizing: border-box; padding: 26px 30px 22px; text-align: center;
    background: #a27b4f;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.25), transparent 60%);
    border: 2px solid #6b4c2c; box-shadow: 0 10px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(60,35,10,.5); }
  /* animación de carteles: entra chico y crece con rebote; sale achicándose */
  #card.in { animation: cardIn .22s cubic-bezier(.2, .9, .3, 1.25) both; }
  #card.out { animation: cardOut .13s ease-in both; }
  @keyframes cardIn { from { transform: translate(-50%, -50%) rotate(-5deg) scale(.55); opacity: 0; }
                      to { transform: translate(-50%, -50%) rotate(-1deg) scale(1); opacity: 1; } }
  @keyframes cardOut { to { transform: translate(-50%, -50%) rotate(3deg) scale(.6); opacity: 0; } }
  #level.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  #timer.pop:not(.warn) { animation: timerPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes levelPop { from { transform: rotate(-8deg) scale(.5); opacity: 0; } to { transform: rotate(-2deg) scale(1); opacity: 1; } }
  #level.pop { animation: lvlPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes lvlPop { from { transform: translateX(-50%) rotate(-8deg) scale(.5); opacity: 0; } to { transform: translateX(-50%) rotate(-2deg) scale(1); opacity: 1; } }
  /* botón casita (volver al menú), arriba a la izquierda */
  #btnHome { position: fixed; top: 12px; left: 14px; z-index: 5; transform: rotate(-2deg); }
  @keyframes timerPop { from { transform: translateX(-50%) rotate(6deg) scale(.5); opacity: 0; } to { transform: translateX(-50%) rotate(1.5deg) scale(1); opacity: 1; } }
  .btn.tape { transition: transform .12s; }
  .btn.tape:active { transform: scale(.85) !important; }
  #card h1 { font-family: 'Permanent Marker', cursive; font-weight: normal; font-size: 40px; margin: 0 0 8px; color: #1e1208; line-height: 1.05; }
  #card h1.red { color: #8e1410; }
  #card p { margin: 8px 0; font-size: 16px; line-height: 1.4; }
  #card .big { font-family: 'Permanent Marker', cursive; font-size: 22px; }
  #card .go { margin-top: 16px; font-size: 15px; animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  kbd { display: inline-block; background: #e8dcc0; border: 1px solid #5a3e22; border-bottom-width: 3px; border-radius: 4px;
    padding: 0 6px; font-family: inherit; font-size: 13px; margin: 0 1px; }
  #card { z-index: 6; }   /* por encima del joystick, así los botones de la pausa se pueden tocar */
  #card .logo { display: block; width: min(100%, 400px); margin: -6px auto 6px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  #card .menu { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .cbtn { font-family: 'Permanent Marker', cursive; font-size: 22px; color: #1e1208; background: #e2d6b8; border: 0;
    padding: 8px 22px 6px; cursor: pointer; box-shadow: 0 3px 0 #6b4c2c, 0 4px 10px rgba(0,0,0,.35); transform: rotate(-1.5deg);
    -webkit-tap-highlight-color: transparent; }
  .cbtn:nth-child(even) { transform: rotate(1.5deg); }
  .cbtn.alt { background: #c8b893; font-size: 17px; }
  .cbtn:hover { filter: brightness(1.06); }
  .cbtn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 #6b4c2c; }
  #card .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0 4px; max-height: 52vh; overflow-y: auto; padding: 4px 6px 8px; }
  #card .lvl { background: #e2d6b8; border: 0; padding: 8px 4px 6px; cursor: pointer; box-shadow: 0 3px 0 #6b4c2c;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; color: #1e1208;
    -webkit-tap-highlight-color: transparent; }
  #card .lvl:nth-child(odd) { transform: rotate(-1deg); } #card .lvl:nth-child(even) { transform: rotate(1deg); }
  #card .lvl b { font-family: 'Permanent Marker', cursive; font-size: 26px; line-height: 1; }
  #card .lvl small { font-size: 11px; }
  #card .lvl:disabled { opacity: .45; cursor: default; }
  #card .lvl:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #6b4c2c; }
  #card .st { color: #c98a12; font-size: 15px; letter-spacing: 1px; } #card .st i { color: rgba(60,40,20,.3); font-style: normal; }
  #card .stars { font-size: 46px; color: #e0a21a; text-shadow: 0 2px 0 #6b4c2c; letter-spacing: 6px; line-height: 1.1; }
  #card .stars span { color: rgba(60,40,20,.25); text-shadow: none; }
  #card .small { font-size: 13px; opacity: .8; }
  #cheese { top: 66px; left: 14px; font-size: 20px; display: flex; align-items: center; gap: 6px; transform: rotate(1deg); padding: 3px 12px 1px; }
  #cheese svg { width: 22px; height: 22px; }
  #cheese.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  /* monedas: siempre a la vista arriba a la izquierda (en el juego, al lado de la casita) */
  #coins { position: fixed; top: 14px; left: 14px; z-index: 8; font-size: 20px; display: flex; align-items: center; gap: 6px;
    transform: rotate(-1.5deg); padding: 3px 12px 1px; pointer-events: none; }
  #coins.withHome { left: 66px; }
  #coins .ci { width: 20px; height: 20px; }
  #coins.pop { animation: coinPop .25s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes coinPop { from { transform: rotate(-1.5deg) scale(1.3); } to { transform: rotate(-1.5deg) scale(1); } }
  .ci { width: 1em; height: 1em; vertical-align: -0.14em; }
  #card .menu.sub { margin-top: 10px; }
  /* pantallas a pantalla completa (Ratitas, Máquina): fondo negro que entra y sale con un círculo desde el botón */
  #screen { position: fixed; inset: 0; z-index: 7; background: #000; pointer-events: none;
    clip-path: circle(0px at var(--x, 50%) var(--y, 50%)); -webkit-clip-path: circle(0px at var(--x, 50%) var(--y, 50%));
    transition: clip-path .45s ease-in-out, -webkit-clip-path .45s ease-in-out; }
  #screen.open { pointer-events: auto; clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); -webkit-clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); }
  #screen .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
    padding: 64px 12px calc(14px + env(safe-area-inset-bottom)); gap: 8px; opacity: 0; transition: opacity .25s; text-align: center; color: #e9dcc0; }
  #screen.open .inner.show { opacity: 1; }
  #screen .stitle { font-family: 'Permanent Marker', cursive; font-weight: normal; font-size: 46px; margin: 0; color: #f1e4c4; line-height: 1; }
  #screen .ssub { margin: 0; font-size: 15px; color: #bfae8c; }
  #screen .sbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; flex: 0 0 auto; }
  /* ratitas: estantes de metal de punta a punta de la pantalla, sobre el negro; las jaulas centradas en cada estante */
  .rack { flex: 1 1 auto; min-height: 0; overflow-y: auto; width: 100vw; margin: 0 -12px; }
  .shelfrow { position: relative; display: flex; justify-content: center; }
  .shelfrow::after { content: ''; position: absolute; left: 0; right: 0; top: 86%; height: 7%;
    background: linear-gradient(#f7f8f9, #c3c8cc 45%, #8e959a); }
  .rat { position: relative; z-index: 1; background: none; border: 0; padding: 0; cursor: pointer; display: block;
    width: min(calc(100vw / var(--cols)), 280px); -webkit-tap-highlight-color: transparent; }
  .rat canvas { display: block; width: 100%; aspect-ratio: 330 / 300; }
  .rat:disabled { cursor: default; }
  .rat:not(:disabled):active canvas { transform: scale(.96); }
  /* máquina */
  #gachaCv { display: block; width: min(60vh, 92vw); aspect-ratio: 1; flex: 0 1 auto; min-height: 0; }
  #gachaRes { min-height: 2.8em; margin: 0; font-size: 16px; }
  .gname { font-family: 'Permanent Marker', cursive; font-size: 30px; color: #f6e7bf; }
  .cbtn:disabled { opacity: .5; cursor: default; }
  /* aviso de premio en el cartel de fin de nivel */
  .cbtn.prize { background: #ffd84a; animation: prizePulse 1s ease-in-out infinite alternate; }
  @keyframes prizePulse { to { filter: brightness(1.12); transform: rotate(-1.5deg) scale(1.05); } }
  .prizebar { position: relative; width: min(340px, 90%); height: 24px; margin: 12px auto 4px; background: rgba(40,25,10,.35);
    border: 2px solid #6b4c2c; overflow: hidden; }
  .prizebar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ffe27a, #e0a514); }
  .prizebar span { position: relative; display: block; line-height: 22px; font-size: 13px; color: #1e1208; white-space: nowrap; }
  /* portada */
  #card .lead { margin: 4px 0 12px; }
  #card .lead p { margin: 2px 0; font-size: 16px; line-height: 1.35; text-wrap: balance; }
  #card .ctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px auto 2px; padding: 10px 0;
    border-top: 1px dashed rgba(60,35,10,.35); border-bottom: 1px dashed rgba(60,35,10,.35); max-width: 400px; }
  #card .ctl span:last-child { text-align: left; font-size: 14px; line-height: 1.35; }
  #card .keys { display: grid; grid-template-columns: repeat(4, auto); gap: 4px; }
  #card .keys kbd { margin: 0; min-width: 12px; text-align: center; }
  #card .finger { font-size: 30px; line-height: 1; }
  #card .modes { margin-top: 12px; }
  #card .modes p { margin: 2px 0; font-size: 13.5px; line-height: 1.35; opacity: .85; text-wrap: balance; }
  #card .modes b { font-family: 'Permanent Marker', cursive; font-weight: normal; }
  #card .shortcuts { margin-top: 10px; }
  #card table { margin: 10px auto 0; border-collapse: collapse; font-size: 14px; text-align: left; }
  #card td { padding: 2px 8px; }

  /* botones de arriba a la derecha (sonido, pausa, modo de giro) */
  #topbtns { position: fixed; top: 12px; right: 14px; display: flex; gap: 8px; z-index: 8; }
  .btn.tape { position: static; width: 44px; height: 44px; padding: 0; border: 0; display: grid; place-items: center;
    color: #2a1a0c; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn.tape:nth-child(odd) { transform: rotate(-2deg); } .btn.tape:nth-child(even) { transform: rotate(2deg); }
  .btn svg { width: 24px; height: 24px; }
  .btn:active { filter: brightness(.85); }

  /* controles táctiles */
  body:not(.touch) #hintTouch { display: none; }
  body.touch #hint { display: none !important; }
  #hintTouch { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 13px; color: #a08060; opacity: .75; pointer-events: none; padding: 0 120px; }
  /* joystick flotante: aparece donde apoyás el dedo */
  #stickZone { position: fixed; inset: 0; z-index: 3; display: none; touch-action: none; }
  body.touch.playing #stickZone { display: block; }
  #stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    background: rgba(217,207,178,.10); border: 2px solid rgba(217,207,178,.38); display: none; z-index: 4; }
  #stick.on { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(217,207,178,.45); border: 2px solid rgba(240,228,205,.6); }
  body.touch { touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; }
  /* en el celular (o con pantalla táctil) no se muestran las barras de scroll: se sigue pudiendo deslizar */
  @media (max-width: 560px), (pointer: coarse) {
    .rack, #card .levels, #card { scrollbar-width: none; }
    .rack::-webkit-scrollbar, #card .levels::-webkit-scrollbar, #card::-webkit-scrollbar { display: none; }
  }
  /* botón provisorio para probar: luz general en el laberinto (arriba a la izquierda, debajo de las monedas) */
  #btnLight { position: fixed; top: 60px; left: 14px; z-index: 5; width: auto; padding: 0 10px; gap: 4px; display: flex;
    font-family: 'Permanent Marker', cursive; font-size: 14px; transform: rotate(1.5deg); }
  #btnLight.on { background: #ffe17a; }
  @media (max-width: 560px) {
    #level { top: 62px; font-size: 13px; }
    #timer { top: 84px; font-size: 26px; }
    #cheese { top: 64px; font-size: 16px; }
    #card .levels { grid-template-columns: repeat(4, 1fr); gap: 7px; }
    #card .lvl b { font-size: 21px; }
    #card .lvl small { font-size: 9px; }
    #screen .stitle { font-size: 36px; }
    .cbtn { font-size: 19px; padding: 7px 16px 5px; }
    #card { padding: 22px 16px 18px; }
    #card .lead p { font-size: 12.5px; }
    #card .ctl { gap: 10px; }
    #card .ctl span:last-child { font-size: 12.5px; }
    #card .ctl br { display: none; }
    #card .modes p { font-size: 11.5px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud" class="hidden">
  <button id="btnHome" class="btn tape" type="button" title="Volver al menú"></button>
  <div id="level" class="tape">NIVEL 1</div>
  <div id="timer" class="tape">0:00</div>
  <div id="cheese" class="tape hidden"><svg viewBox="0 0 24 24"><path d="M2 17 L21 7 L22 17 Z" fill="#f2c94c" stroke="#8a5b10" stroke-width="1.2" stroke-linejoin="round"/><path d="M2 17 L22 17 L22 20 L2 20 Z" fill="#d9a62e" stroke="#8a5b10" stroke-width="1.2" stroke-linejoin="round"/><circle cx="14" cy="13.5" r="1.6" fill="#c98f1d"/><circle cx="18.5" cy="12" r="1.1" fill="#c98f1d"/></svg><span id="cheeseN">0/5</span></div>
</div>
<div id="coins" class="tape"><span id="coinsIco"></span><span id="coinsN">0</span></div>
<div id="hint"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> moverte ·<kbd>P</kbd> pausa · <kbd>M</kbd> música · <kbd>F</kbd> efectos ·<kbd>R</kbd> reiniciar · <kbd>N</kbd> saltar nivel (debug)</div>
<div id="hintTouch">Apoyá el dedo en cualquier lugar y arrastrá hacia donde querés ir</div>
<div id="stickZone"></div>
<div id="stick"><div id="knob"></div></div>
<button id="btnLight" class="btn tape hidden" type="button" title="Luz general para probar (no cambia la linterna)"></button>
<div id="topbtns">
  <button id="btnPause" class="btn tape hidden" type="button"></button>
  <button id="btnMusic" class="btn tape" type="button"></button>
  <button id="btnSound" class="btn tape" type="button"></button>
</div>
<div id="card" class="hidden"></div>
<div id="screen"></div>

<script>
'use strict';
// ===================== CONSTANTES (tuneables) =====================
const C = 64;              // tamaño de celda (unidades de mundo)
const T = 10;              // grosor de las paredes de cartón
const K = 0.10;            // altura aparente de las paredes (paralaje cenital)
const SPEED = 150;         // velocidad hacia adelante
const TURN = 4.2;          // velocidad de giro máxima (rad/s)
const RAD = 9;             // radio de colisión del cuerpo
const LIGHT_R = 5.2 * C;   // alcance de la linterna
const CONE = 0.50;         // medio ángulo del haz (rad)
const CONE_SOFT = 0.16;    // suavizado del borde del haz
const RAYS = 540;          // rayos para calcular sombras

// Tamaños de laberinto por nivel (columnas x filas)
const SIZES = [[7,4],[9,5],[11,6],[13,8],[16,9],[19,11],[22,13],[26,15],[30,17],[34,19]];
function sizeFor(n) {
  if (n <= SIZES.length) return SIZES[n - 1];
  const e = n - SIZES.length;
  return [Math.min(60, 34 + 3 * e), Math.min(34, 19 + 2 * e)];
}
// Cuántas celdas de ancho entran en pantalla: al principio el laberinto entra casi entero,
// después la cámara se acerca y el laberinto crece, así deja de verse completo.
function viewCells(n) { return Math.max(6, 9 - 0.4 * (n - 1)); }
// Tiempo según el largo del camino más corto
function timeFor(n, pathCells) {
  const factor = Math.max(2.2, 4.2 - 0.25 * (n - 1));
  return Math.ceil((8 + pathCells * C / SPEED * factor) / 5) * 5;
}

// ===================== MODO HISTORIA =====================
// 40 niveles diseñados: semilla fija (siempre el mismo laberinto). Cada mecánica se presenta sola y después se combina:
// 1–6 quesos · 7–12 pegote (y algún queso) · 13–20 trampas (con pegote y quesos) · 21–28 puertas (con todo lo anterior) ·
// 29–40 todo junto, con laberintos cada vez más grandes y más cosas. El tiempo se calcula solo (camino + extras).
// Campos: size [columnas, filas], loops (fracción de paredes que se abren para hacer ciclos),
// traps / sticky / cheese / doors (cantidad de cada cosa), cheeseGoal (quesos a juntar, si hay de más), time (opcional: pisa el tiempo calculado).
const LEVELS = [
  // --- quesos ---
  { name: 'Primer bocado', seed: 1101, size: [10, 6], loops: 0.04, cheese: 3,
    intro: 'Hay quesos escondidos en el laberinto. Juntalos todos antes de salir y te llevás una estrella más.' },
  { name: 'Olor a queso', seed: 1207, size: [11, 6], loops: 0.04, cheese: 4, cheeseGoal: 3,
    intro: 'Hay 4 quesos, pero con 3 alcanza. Seguí tu nariz.' },
  { name: 'Gruyère', seed: 1313, size: [12, 7], loops: 0.03, cheese: 5, cheeseGoal: 4,
    intro: 'Más agujeros que queso... y más quesos que antes.' },
  { name: 'Picada', seed: 1429, size: [12, 7], loops: 0.06, cheese: 5,
    intro: 'Cinco quesos y algunos pasillos que se cruzan: buscá el mejor recorrido.' },
  { name: 'Tabla de quesos', seed: 1531, size: [14, 8], loops: 0.03, cheese: 7, cheeseGoal: 5,
    intro: 'Un laberinto más grande y una tabla entera para picar.' },
  { name: 'Queso rallado', seed: 1637, size: [14, 8], loops: 0.04, cheese: 7, cheeseGoal: 6,
    intro: 'Seis quesos repartidos por todos lados. No te olvides de ninguno.' },
  // --- pegote ---
  { name: 'Pegote', seed: 2203, size: [12, 7], loops: 0.02, sticky: 3,
    intro: 'Hay bandejas con pegamento: te frenan y te dejan las patas pegajosas un ratito. Si podés, rodealas.' },
  { name: 'Patas pegajosas', seed: 2311, size: [13, 7], loops: 0.03, sticky: 4, cheese: 3, cheeseGoal: 2,
    intro: 'Pegamento y unos quesitos. A veces el queso está del otro lado del pegote.' },
  { name: 'Engrudo', seed: 2417, size: [14, 8], loops: 0.02, sticky: 5,
    intro: 'Cinco bandejas en el camino. Cada segundo cuenta.' },
  { name: 'Plasticola', seed: 2521, size: [14, 8], loops: 0.04, sticky: 5, cheese: 5, cheeseGoal: 4,
    intro: 'Quesos para juntar y pegamento para esquivar.' },
  { name: 'Mermelada', seed: 2633, size: [15, 8], loops: 0.03, sticky: 6, cheese: 4, cheeseGoal: 3,
    intro: 'Todo pegajoso. Elegí bien por dónde pasar.' },
  { name: 'Pantano', seed: 2741, size: [16, 9], loops: 0.03, sticky: 8, cheese: 5, cheeseGoal: 4,
    intro: 'Un pantano de pegamento. Los atajos pueden salir caros.' },
  // --- trampas ---
  { name: 'La trampera', seed: 3307, size: [12, 7], loops: 0, traps: 4,
    intro: 'Cuidado: las trampas esperan al fondo de los pasillos sin salida. Si tocás una, te atrapa.' },
  { name: 'Callejones', seed: 3413, size: [14, 8], loops: 0, traps: 6,
    intro: 'Muchos callejones sin salida, y en el fondo de varios hay una trampa.' },
  { name: 'Cebo', seed: 3527, size: [14, 8], loops: 0.02, traps: 6, cheese: 5, cheeseGoal: 4,

const Snd = {
  ctx: null, master: null, noiseBuf: null,
  muted: (() => { try { return localStorage.getItem('raton.muted') === '1'; } catch (_) { return false; } })(),
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = this.ctx = new AC();
    this.master = ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.8; this.master.connect(ctx.destination);
    const len = ctx.sampleRate * 2;
    this.noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // ambiente: ruido marrón grave + zumbido lejano del laboratorio
    const brown = ctx.createBuffer(1, len, ctx.sampleRate), bd = brown.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = brown; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280;
    const g = ctx.createGain(); g.gain.value = 0.10; src.connect(lp).connect(g).connect(this.master); src.start();
    const hum = ctx.createOscillator(); hum.frequency.value = 50; const hg = ctx.createGain(); hg.gain.value = 0.012;
    hum.connect(hg).connect(this.master); hum.start();
  },
  toggle() {
    this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.8;
    try { localStorage.setItem('raton.muted', this.muted ? '1' : '0'); } catch (_) {}
  },
  tone(f0, f1, dur, type, vol, delay = 0) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, freq, q, vol, type = 'bandpass', delay = 0) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
  },
  // paso: cada uno distinto (volumen, tono, duración y "brillo" al azar) para que suene orgánico
  step() {   // apagado: ruido filtrado con pasabajos (sin los agudos) y un golpecito grave, como una patita sobre cartón
    const r = Math.random;
    this.noise(0.03 + r() * 0.03, 380 + r() * 520, 0.6 + r() * 0.5, 0.03 + r() * 0.035, 'lowpass');
    if (r() < 0.6) this.tone(150 + r() * 70, 70 + r() * 30, 0.04 + r() * 0.02, 'sine', 0.025 + r() * 0.02);
  },
  // chillido de rata asustada: tres chirridos agudos con vibrato, el tono sube y baja
  squeal() {
    const c = this.ctx; if (!c) return;
    [[0, 3000, 3900, 2900, 0.16], [0.17, 3300, 4300, 3100, 0.14], [0.33, 2800, 3600, 2500, 0.2]].forEach(([d, f0, f1, f2, dur]) => {
      const t = c.currentTime + d + Math.random() * 0.02;
      const o = c.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + dur * 0.35); o.frequency.linearRampToValueAtTime(f2, t + dur);
      const lfo = c.createOscillator(); lfo.frequency.value = 28 + Math.random() * 10;   // vibrato nervioso
      const lg = c.createGain(); lg.gain.value = 140; lfo.connect(lg).connect(o.frequency);
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.11, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.master); o.start(t); lfo.start(t); o.stop(t + dur + 0.03); lfo.stop(t + dur + 0.03);
    });
  },
  bump() { this.tone(120, 45, 0.18, 'sine', 0.45); this.noise(0.09, 500, 0.7, 0.35, 'lowpass'); },
  // chillidito: cada vez distinto (tono, largo, cuántos chirridos y si sube o baja)
  squeak() {
    const r = Math.random, n = r() < 0.5 ? 1 : r() < 0.7 ? 2 : 3, base = 2100 + r() * 1700;
    let at = 0;
    for (let i = 0; i < n; i++) {
      const f = base * (0.9 + r() * 0.25), d = 0.05 + r() * 0.11, bend = r() < 0.6 ? 1.15 + r() * 0.3 : 0.75 + r() * 0.15;
      this.tone(f, f * bend, d, r() < 0.3 ? 'triangle' : 'sine', 0.05 + r() * 0.04, at);

  },
  // sirena "Uuuuh": sube hasta el pico en WAIL_UP s (cuando el haz pasa por la rata) y después se aleja despacio:
  // el tono baja de a poco y el volumen se va apagando largo (como si se fuera), casi empalmando con la vuelta siguiente
  wail(v = 1) {

    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);

      o.frequency.exponentialRampToValueAtTime(900 * mul, t + up + 0.5); o.frequency.exponentialRampToValueAtTime(640 * mul, t + dur);
      o.connect(f); o.start(t); o.stop(t + dur + 0.05);

  // ruido con barrido de frecuencia (para los "fiuu" de los carteles)
  sweep(f0, f1, dur, vol, q = 1.2, delay = 0) {

  trap() { this.noise(0.06, 2600, 1, 0.6); this.tone(320, 70, 0.14, 'square', 0.22); this.noise(0.12, 400, 0.7, 0.4, 'lowpass', 0.02); },
  // pisar pegamento: "splosh" pegajoso
  squish() { this.sweep(900, 220, 0.25, 0.3, 2.5); this.tone(110, 70, 0.15, 'sine', 0.12); },
  // agarrar un queso: dos notitas para arriba
  cheese() { this.tone(880, 1320, 0.1, 'triangle', 0.18); this.tone(1320, 1760, 0.12, 'triangle', 0.15, 0.08); },
  flap() { this.noise(0.2, 900, 0.7, 0.22); this.sweep(350, 1100, 0.22, 0.1, 2); },   // cortina de cartón que se levanta
  flapShut(v = 1) { this.noise(0.05, 650, 0.9, 0.3 * v, 'lowpass'); this.tone(190, 95, 0.07, 'sine', 0.16 * v); },   // la cortina golpea el marco
};

// Música de fondo (archivo mp3): suena solo dentro del laberinto, con su propio botón de silencio
const Music = {
  el: null, started: false, vol: 0.28,   // volumen bajo para que no tape los efectos
  muted: (() => { try { return localStorage.getItem('raton.musicMuted') === '1'; } catch (_) { return false; } })(),
  start() {
    if (!this.el) {
      this.el = new Audio('audio/laberinto-de-circuitos.mp3');
      this.el.loop = true; this.el.volume = 0; this.el.muted = this.muted;
    }
    this.started = true;
    this.el.play().catch(() => {});
  },
  pause() { if (this.el) this.el.pause(); },
  resume() { if (this.el && this.started) this.el.play().catch(() => {}); },
  toggle() {
    this.muted = !this.muted; if (this.el) this.el.muted = this.muted;
    try { localStorage.setItem('raton.musicMuted', this.muted ? '1' : '0'); } catch (_) {}
  },
  tick(dt) { if (this.el && this.el.volume < this.vol) this.el.volume = Math.min(this.vol, this.el.volume + dt * this.vol / 1.5); },   // entra suave
};

// ===================== LABERINTO =====================
function genMaze(W, H, rng, loopFrac) {
  const hW = [], vW = [];
  for (let r = 0; r <= H; r++) hW.push(new Array(W).fill(true));   // hW[r][c]: pared superior de la fila r
  for (let c = 0; c <= W; c++) vW.push(new Array(H).fill(true));   // vW[c][r]: pared izquierda de la columna c
  const vis = new Uint8Array(W * H);
  const sr = Math.floor(rng() * H); vis[sr * W + W - 1] = 1;
  const stack = [[W - 1, sr]];
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const nb = [];
    if (c > 0 && !vis[r * W + c - 1]) nb.push([c - 1, r, 0]);
    if (c < W - 1 && !vis[r * W + c + 1]) nb.push([c + 1, r, 1]);
    if (r > 0 && !vis[(r - 1) * W + c]) nb.push([c, r - 1, 2]);
    if (r < H - 1 && !vis[(r + 1) * W + c]) nb.push([c, r + 1, 3]);
    if (!nb.length) { stack.pop(); continue; }
    const [nc, nr, d] = nb[Math.floor(rng() * nb.length)];
    if (d === 0) vW[c][r] = false; else if (d === 1) vW[c + 1][r] = false; else if (d === 2) hW[r][c] = false; else hW[r + 1][c] = false;
    vis[nr * W + nc] = 1; stack.push([nc, nr]);
  }
  // algunos ciclos para confundir (se abren paredes al azar)
  const loops = Math.floor(W * H * loopFrac);
  for (let i = 0; i < loops; i++) {
    if (rng() < 0.5) { const c = 1 + Math.floor(rng() * (W - 1)), r = Math.floor(rng() * H); vW[c][r] = false; }
    else { const r = 1 + Math.floor(rng() * (H - 1)), c = Math.floor(rng() * W); hW[r][c] = false; }
  }
  const entRow = Math.floor(rng() * H), exitRow = Math.floor(rng() * H);
  vW[W][entRow] = false; vW[0][exitRow] = false;
  return { W, H, hW, vW, entRow, exitRow };
}

// Distancia (en celdas) desde una celda a todas las demás, recorriendo el laberinto
function bfs(m, c0, r0) {
  const { W, H } = m, dist = new Int32Array(W * H).fill(-1);
  const q = [[c0, r0]]; dist[r0 * W + c0] = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const [c, r] = q[qi], d = dist[r * W + c];
    const go = (nc, nr) => { if (dist[nr * W + nc] < 0) { dist[nr * W + nc] = d + 1; q.push([nc, nr]); } };
    if (c > 0 && !m.vW[c][r]) go(c - 1, r);
    if (c < W - 1 && !m.vW[c + 1][r]) go(c + 1, r);
    if (r > 0 && !m.hW[r][c]) go(c, r - 1);
    if (r < H - 1 && !m.hW[r + 1][c]) go(c, r + 1);
  }
  return dist;
}
// Largo del camino más corto, contando el corral de inicio y el umbral de salida
function pathLen(m) {
  const d = bfs(m, m.W - 1, m.entRow)[m.exitRow * m.W];
  return d < 0 ? m.W * m.H : d + 3;
}

// Paredes como rectángulos (tramos colineales fusionados)
function buildRects(m, rng) {
  const rects = [];
  for (let r = 0; r <= m.H; r++) {
    let c = 0;
    while (c < m.W) {
      if (!m.hW[r][c]) { c++; continue; }
      const c0 = c; while (c < m.W && m.hW[r][c]) c++;
      rects.push({ x: c0 * C - T / 2, y: r * C - T / 2, w: (c - c0) * C + T, h: T });
    }
  }
  for (let c = 0; c <= m.W; c++) {
    let r = 0;
    while (r < m.H) {
      if (!m.vW[c][r]) { r++; continue; }
      const r0 = r; while (r < m.H && m.vW[c][r]) r++;
      rects.push({ x: c * C - T / 2, y: r0 * C - T / 2, w: T, h: (r - r0) * C + T });
    }
  }
  // corral de inicio, fuera de la entrada
  const W = m.W, er = m.entRow;
  rects.push({ x: W * C - T / 2, y: er * C - T / 2, w: C + T, h: T });
  rects.push({ x: W * C - T / 2, y: (er + 1) * C - T / 2, w: C + T, h: T });
  rects.push({ x: (W + 1) * C - T / 2, y: er * C - T / 2, w: T, h: C + T });
  // cinta de embalar en algunas uniones
  for (const R of rects) {
    R.tapes = [];
    const len = Math.max(R.w, R.h);
    for (let k = 0; T / 2 + k * C <= len; k++) if (rng() < 0.3) R.tapes.push(T / 2 + k * C + (rng() - 0.5) * 6);
  }
  return rects;
}

const MARKS = ['?', 'X', 'A-3', 'B-7', 'N°4', '!!', '///', '12', 'LAB', 'x2', '→', '↑', '←', 'O', '#', 'no', '7', 'C-1', '?!', '≈', 'R2', '✓'];
function buildDeco(m, rng) {
  const Wp = m.W * C, Hp = m.H * C, sx = [], sy = [], tapes = [], marks = [];
  for (let x = 110 + rng() * 120; x < Wp - 40; x += 150 + rng() * 170) sx.push(x);
  for (let y = 110 + rng() * 120; y < Hp - 40; y += 150 + rng() * 170) sy.push(y);
  for (const x of sx) for (let y = 20; y < Hp - 20; y += 90) if (rng() < 0.3) { const l = 24 + rng() * 26; tapes.push({ x: x - l / 2, y, w: l, h: 11 }); }
  for (const y of sy) for (let x = 20; x < Wp - 20; x += 90) if (rng() < 0.3) { const l = 24 + rng() * 26; tapes.push({ x, y: y - l / 2, w: 11, h: l }); }
  const n = Math.floor(m.W * m.H / 6);
  for (let i = 0; i < n; i++) {
    const c = Math.floor(rng() * m.W), r = Math.floor(rng() * m.H);
    if ((c === 0 && r === m.exitRow) || (c === m.W - 1 && r === m.entRow)) continue;
    marks.push({ x: (c + 0.25 + rng() * 0.5) * C, y: (r + 0.3 + rng() * 0.4) * C, rot: (rng() - 0.5) * 0.9,
      size: 9 + rng() * 6, text: MARKS[Math.floor(rng() * MARKS.length)],
      color: rng() < 0.2 ? 'rgba(140,22,18,0.75)' : 'rgba(35,24,14,0.55)' });
  }
  return { sx, sy, tapes, marks };
}

// ===================== ITEMS (mecánicas de Historia) =====================
const TRAP_L = 52, TRAP_W = 27;        // trampa (más grande que la rata; casi todo el largo del callejón)
const TRAY_W = 48, TRAY_L = Math.round(TRAY_W * 62 / 32);   // bandeja de pegamento: casi todo el ancho del pasillo, largo proporcional
const STICKY_SLOW = 0.35, STICKY_T = 1.5;     // al salir: recupera desde STICKY_SLOW en STICKY_T segundos
const STICKY_ON = 0.38, STICKY_PAW = 0.06;    // encima: 0.38 de velocidad, menos 0.06 por cada pata apoyada (4 patas: 0.14)

// Coloca los items de un nivel según sus reglas. Todo sale del rng del nivel, así que siempre queda igual.
function placeItems(L, m, rng) {
  const { W, H } = m, idx = (c, r) => r * W + c;
  const dE = bfs(m, W - 1, m.entRow), dX = bfs(m, 0, m.exitRow), best = dE[idx(0, m.exitRow)];
  const onPath = i => dE[i] + dX[i] === best;
  const ent = [W - 1, m.entRow], ext = [0, m.exitRow];
  const near = (c, r, [c2, r2], d) => Math.abs(c - c2) + Math.abs(r - r2) <= d;
  const special = (c, r, d = 0) => near(c, r, ent, d) || near(c, r, ext, d);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const cells = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) cells.push([c, r]);
  const center = (c, r) => [(c + 0.5) * C, (r + 0.5) * C];
  // elige hasta n celdas separadas entre sí al menos minSep (distancia en grilla)
  const pick = (cands, n, minSep, chosen = []) => {
    const out = [];
    for (const cell of cands) {
      if (out.length >= n) break;
      if ([...chosen, ...out].some(o => Math.abs(o[0] - cell[0]) + Math.abs(o[1] - cell[1]) < minSep)) continue;
      out.push(cell);
    }
    return out;
  };
  const items = [], used = [];

  // Trampas: solo al fondo de callejones sin salida, fuera del camino y lejos de la entrada y la salida
  if (L.traps) {
    const walls = (c, r) => [m.hW[r][c], m.hW[r + 1][c], m.vW[c][r], m.vW[c + 1][r]];
    const cand = shuffle(cells.filter(([c, r]) => walls(c, r).filter(Boolean).length === 3 && !onPath(idx(c, r)) && !special(c, r, 1)));
    for (const [c, r] of pick(cand, L.traps, 2)) {
      const [top, bottom, left, right] = walls(c, r);
      const a = !top ? -Math.PI / 2 : !bottom ? Math.PI / 2 : !left ? Math.PI : 0;   // hacia la abertura del callejón
      const [x, y] = center(c, r);
      const back = C / 2 - T / 2 - TRAP_L / 2;   // fondo de la trampa contra la pared del callejón
      items.push({ type: 'trap', x: x - Math.cos(a) * back, y: y - Math.sin(a) * back, a, closed: false, t: 0 });
      used.push([c, r]);
    }
  }
  // Pegamento: solo en tramos rectos de pasillo (dos celdas seguidas con paredes a ambos lados, nunca en cruces ni
  // esquinas), centrada en el pasillo y ocupando casi todo su ancho; puede ir en el camino, más probable cerca de la salida
  if (L.sticky) {
    const maxX = Math.max(...dX), segs = [];
    for (const [c, r] of cells) {
      // horizontal: (c,r) y (c+1,r) unidas, con paredes arriba y abajo en las dos
      if (c + 1 < W && !m.vW[c + 1][r] && m.hW[r][c] && m.hW[r + 1][c] && m.hW[r][c + 1] && m.hW[r + 1][c + 1]) segs.push({ a: [c, r], b: [c + 1, r], vert: false });
      // vertical: (c,r) y (c,r+1) unidas, con paredes a izquierda y derecha en las dos
      if (r + 1 < H && !m.hW[r + 1][c] && m.vW[c][r] && m.vW[c + 1][r] && m.vW[c][r + 1] && m.vW[c + 1][r + 1]) segs.push({ a: [c, r], b: [c, r + 1], vert: true });
    }
    const ok = segs.filter(s => !special(...s.a) && !special(...s.b) && dX[idx(...s.a)] >= 0);
    ok.forEach(s => { const i = idx(...s.a); s.key = rng() * (1 + 3 * (1 - dX[i] / maxX)) * (onPath(i) ? 1.5 : 1); });
    ok.sort((p, q) => q.key - p.key);
    const chosen = [];
    for (const s of ok) {
      if (chosen.length >= L.sticky) break;
      const busy = used.concat(...chosen.map(q => [q.a, q.b]));
      if (busy.some(u => Math.abs(u[0] - s.a[0]) + Math.abs(u[1] - s.a[1]) < 2 || Math.abs(u[0] - s.b[0]) + Math.abs(u[1] - s.b[1]) < 2)) continue;
      chosen.push(s);
    }
    for (const s of chosen) {
      const x = (s.a[0] + s.b[0] + 1) / 2 * C, y = (s.a[1] + s.b[1] + 1) / 2 * C;   // centro del tramo de dos celdas
      const w = s.vert ? TRAY_W : TRAY_L, h = s.vert ? TRAY_L : TRAY_W;
      items.push({ type: 'sticky', x: x - w / 2, y: y - h / 2, w, h });
      used.push(s.a, s.b);
    }
  }
  // Quesos: preferentemente fuera del camino más corto (para que haya que desviarse), separados entre sí
  if (L.cheese) {
    const free = cells.filter(([c, r]) => !special(c, r) && dE[idx(c, r)] >= 0 && !used.some(u => u[0] === c && u[1] === r));
    const off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r)))), on = shuffle(free.filter(([c, r]) => onPath(idx(c, r))));
    let chosen = pick(off, L.cheese, 4, used);
    if (chosen.length < L.cheese) chosen = chosen.concat(pick(off.concat(on), L.cheese - chosen.length, 2, used.concat(chosen)));
    for (const [c, r] of chosen) {
      const [x, y] = center(c, r);
      items.push({ type: 'cheese', x: x + (rng() - 0.5) * 16, y: y + (rng() - 0.5) * 16, rot: rng() * Math.PI * 2, got: false });
      used.push([c, r]);
    }
  }
  // Puertas de un solo sentido: en una pared entre dos celdas vecinas que por el laberinto están lejos.
  // Se pasa de A (lado del agujero) a B (lado de la cortina): A es la celda más lejana a la salida, así es un atajo de ida.
  if (L.doors) {
    const pairs = [];
    for (const [c, r] of cells) {
      if (special(c, r, 1)) continue;
      const d = bfs(m, c, r);
      if (c + 1 < W && m.vW[c + 1][r] && !special(c + 1, r, 1) && d[idx(c + 1, r)] >= 8) pairs.push({ a: [c, r], b: [c + 1, r], gain: d[idx(c + 1, r)] });
      if (r + 1 < H && m.hW[r + 1][c] && !special(c, r + 1, 1) && d[idx(c, r + 1)] >= 8) pairs.push({ a: [c, r], b: [c, r + 1], gain: d[idx(c, r + 1)] });
    }
    shuffle(pairs).sort((p, q) => q.gain - p.gain);
    const chosen = [];
    for (const p of pairs) {
      if (chosen.length >= L.doors) break;
      // separadas entre sí (3 celdas); con los otros items alcanza con no compartir celda (si no, en los niveles cargados no entraban)
      const near = (list, dmin) => list.some(u => Math.abs(u[0] - p.a[0]) + Math.abs(u[1] - p.a[1]) < dmin || Math.abs(u[0] - p.b[0]) + Math.abs(u[1] - p.b[1]) < dmin);
      if (near(used, 1) || near([].concat(...chosen.map(q => [q.a, q.b])), 3)) continue;
      chosen.push(p);
    }
    for (const p of chosen) {
      // hacia la salida: el lado del agujero (A) es el que está más lejos de la salida
      const [from, to] = dX[idx(...p.a)] >= dX[idx(...p.b)] ? [p.a, p.b] : [p.b, p.a];
      const [ax, ay] = center(...from), [bx, by] = center(...to);
      items.push({ type: 'door', dx: Math.sign(bx - ax), dy: Math.sign(by - ay), wx: (ax + bx) / 2, wy: (ay + by) / 2,
        passing: false, ang: DOOR_REST, av: 0, rattle: 0 });
      used.push(p.a, p.b);
    }
  }
  return items;
}

// Monedas: sueltas por los pasillos (más o menos 1 cada 5 celdas), a veces en hilera de 3 a lo largo de un pasillo recto.
// Usan su propio rng, así no cambian dónde caen los otros items. No van en la entrada, la salida ni encima de otro item.
function placeCoins(m, items, seed) {
  const rng = mulberry32(seed), { W, H } = m, out = [];
  const target = clamp(Math.round(W * H * 0.2), 6, 40);
  const busy = (x, y) => items.some(it => Math.hypot((it.x ?? it.wx) - x, (it.y ?? it.wy) - y) < C * 0.75);
  const cells = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) cells.push([c, r]);
  for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  for (const [c, r] of cells) {
    if (out.length >= target) break;
    if ((c === W - 1 && r === m.entRow) || (c === 0 && r === m.exitRow)) continue;
    const x = (c + 0.5) * C, y = (r + 0.5) * C;
    if (busy(x, y)) continue;
    const L = !m.vW[c][r], R = !m.vW[c + 1][r], U = !m.hW[r][c], D = !m.hW[r + 1][c];
    const horiz = L && R && !U && !D, vert = U && D && !L && !R;
    const coin = (cx, cy) => out.push({ type: 'coin', x: cx, y: cy, got: false, ph: rng() * 6 });
    if ((horiz || vert) && rng() < 0.5) for (const k of [-1, 0, 1]) coin(x + (horiz ? k * 17 : 0), y + (vert ? k * 17 : 0));
    else coin(x, y);
  }
  return out;
}

// Puertas: la pared se corta en el hueco (para chocar) y el hueco se vuelve un sólido de un solo sentido.
// Las paredes que se dibujan y cortan la luz (G.rects) quedan enteras: el canto sigue arriba del hueco.
const DOOR_HOLE = 30, DOOR_FLAP = 42;   // ancho del agujero y de la cortina (más grande que el agujero)
function doorSolids(items, rects) {
  let out = rects.slice();
  for (const d of items) if (d.type === 'door') {
    const vert = d.dx !== 0;   // pared vertical si el paso es horizontal
    out = out.flatMap(R => {
      const inside = vert ? R.w === T && Math.abs(R.x + T / 2 - d.wx) < 0.5 && d.wy > R.y && d.wy < R.y + R.h
                          : R.h === T && Math.abs(R.y + T / 2 - d.wy) < 0.5 && d.wx > R.x && d.wx < R.x + R.w;
      if (!inside) return [R];
      return vert
        ? [{ x: R.x, y: R.y, w: R.w, h: d.wy - DOOR_HOLE / 2 - R.y }, { x: R.x, y: d.wy + DOOR_HOLE / 2, w: R.w, h: R.y + R.h - d.wy - DOOR_HOLE / 2 }]
        : [{ x: R.x, y: R.y, w: d.wx - DOOR_HOLE / 2 - R.x, h: R.h }, { x: d.wx + DOOR_HOLE / 2, y: R.y, w: R.x + R.w - d.wx - DOOR_HOLE / 2, h: R.h }];
    });
    d.rect = vert ? { x: d.wx - T / 2, y: d.wy - DOOR_HOLE / 2, w: T, h: DOOR_HOLE, door: d }
                  : { x: d.wx - DOOR_HOLE / 2, y: d.wy - T / 2, w: DOOR_HOLE, h: T, door: d };
    out.push(d.rect);
  }
  return out;
}

// Cortina: cuelga de una bisagra (cinta) arriba del agujero, del lado B. Pasando, sube según cuánto asoma la rata
// del otro lado; al soltarla cae, golpea el marco y rebota un poquito. En reposo queda apenas despegada (se ve el borde).
const DOOR_REST = 0.18;                 // ángulo de reposo (rad)
const WALL_HW = 40;                     // alto de la pared en unidades de mundo (para el largo de la cortina)
const HOLE_H = 0.5, FLAP_H = 0.64;      // alto del agujero y de la bisagra (fracción del alto de la pared)
function updateDoors(dt) {
  const L = FLAP_H * WALL_HW;
  for (const d of G.items) if (d.type === 'door') {
    let tgt = DOOR_REST;
    if (d.passing) {
      // cuánto asoma la rata del lado de la cortina (punta del círculo más adelantado, desde la cara de la pared)
      const depth = Math.max(...ratCircles().map(([x, y, r]) => (x - d.wx) * d.dx + (y - d.wy) * d.dy + r)) - T / 2;
      tgt = clamp(Math.asin(clamp(depth / L, 0, 1)) + 0.25, 0.3, 1.25);
    }
    d.av += ((tgt - d.ang) * 160 - d.av * 11) * dt;
    d.ang += d.av * dt;
    if (d.ang < 0) {                     // golpea el marco
      if (d.av < -2.5) Snd.flapShut(Math.min(1, -d.av / 10));
      d.ang = 0; d.av = -d.av * 0.3;
    }
    d.rattle = Math.max(0, d.rattle - dt * 3);
  }
}

// Dibujo de las puertas, en tres pasadas de drawWalls:
// 'back'  (antes de las paredes): la cortina cuando la cámara está del lado del agujero (la pared la tapa en parte)
// 'hole'  (sobre las caras laterales): el agujero oscuro en la cara que mira a la cámara, del lado A
// 'front' (después de los cantos): la cortina cuando la cámara está del lado de la cortina, y las cintas de la bisagra
function drawDoors(c, v, pass) {
  for (const d of G.items) {
    if (d.type !== 'door' || d.wx < v.x0 - C * 2 || d.wx > v.x1 + C * 2 || d.wy < v.y0 - C * 2 || d.wy > v.y1 + C * 2) continue;
    const nx = d.dx, ny = d.dy, tx = -ny, ty = nx;
    // punto en coordenadas de la puerta: u a lo largo del paso (A→B), w de costado, f altura (0 piso, 1 canto)
    const P = (u, w, f) => {
      const x = d.wx + nx * u + tx * w, y = d.wy + ny * u + ty * w, k = 1 + K * f;
      return [cam.x + (x - cam.x) * k, cam.y + (y - cam.y) * k];
    };
    const quad = pts => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
    const camU = (cam.x - d.wx) * nx + (cam.y - d.wy) * ny;
    if (pass === 'hole') {
      if (camU < -T / 2) {   // la cara del lado A mira a la cámara: se ve el agujero (y adentro, la cortina en sombra)
        const h = DOOR_HOLE / 2, u = -T / 2;
        quad([P(u, -h, 0), P(u, h, 0), P(u, h, HOLE_H), P(u, -h, HOLE_H)]);
        c.fillStyle = '#120c07'; c.fill();
        c.strokeStyle = 'rgba(200,160,110,0.35)'; c.lineWidth = 0.6; c.stroke();   // borde cortado del cartón
      }
      continue;
    }
    if ((pass === 'back') === (camU > T / 2)) {
      if (pass === 'front') drawHinge(c, d, P, quad);
      continue;
    }
    // la cortina: de la bisagra (u = T/2, altura FLAP_H) hasta su borde libre
    const ang = d.ang + d.rattle * 0.05 * Math.abs(Math.sin(G.time * 60));
    const L = FLAP_H * WALL_HW, fw = DOOR_FLAP / 2;
    const u1 = T / 2 + L * Math.sin(ang), f1 = FLAP_H * (1 - Math.cos(ang));
    const hinge = [P(T / 2, -fw, FLAP_H), P(T / 2, fw, FLAP_H)], edge = [P(u1, fw, f1), P(u1, -fw, f1)];
    const [gx0, gy0] = P(T / 2, 0, FLAP_H), [gx1, gy1] = P(u1, 0, f1);
    const g = c.createLinearGradient(gx0, gy0, gx1, gy1);
    g.addColorStop(0, '#6f6658'); g.addColorStop(1, '#a89d88');
    quad([...hinge, ...edge]); c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(40,30,20,0.7)'; c.lineWidth = 0.7; c.stroke();
    // borde inferior más claro (canto del cartón fino)
    c.strokeStyle = '#c9bea8'; c.lineWidth = 1; c.beginPath(); c.moveTo(...edge[0]); c.lineTo(...edge[1]); c.stroke();
    if (pass === 'front') drawHinge(c, d, P, quad);
  }
}
// Sombra en el piso del lado del agujero: el hueco es oscuro y se nota aunque la cámara esté justo arriba
function drawDoorShadow(c, d) {
  const h = DOOR_HOLE / 2, x0 = d.wx - d.dx * T / 2, y0 = d.wy - d.dy * T / 2, x1 = x0 - d.dx * 8, y1 = y0 - d.dy * 8;
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, 'rgba(8,5,2,0.8)'); g.addColorStop(1, 'rgba(8,5,2,0)');
  c.fillStyle = g; c.beginPath();
  c.moveTo(x0 + d.dy * h, y0 - d.dx * h); c.lineTo(x0 - d.dy * h, y0 + d.dx * h);
  c.lineTo(x1 - d.dy * (h + 3), y1 + d.dx * (h + 3)); c.lineTo(x1 + d.dy * (h + 3), y1 - d.dx * (h + 3)); c.closePath(); c.fill();
  // tirita de cinta de peligro en el piso, a lo largo de la pared, del lado por donde se pasa (un poco más oscura que la del inicio)
  c.save(); c.translate(d.wx, d.wy); c.transform(d.dx, d.dy, -d.dy, d.dx, 0, 0);   // x local = hacia B, y local = a lo largo de la pared
  drawStartTape(c, -T / 2 - 10, -(DOOR_HOLE + 10) / 2, DOOR_HOLE + 10, 0.3);

// Cintas que sostienen la cortina: cruzan el canto de la pared y bajan por la cara del lado B
function drawHinge(c, d, P, quad) {
  for (const w of [-DOOR_FLAP / 2 + 5, DOOR_FLAP / 2 - 5]) {
    quad([P(-T / 2 + 1, w - 3, 1), P(-T / 2 + 1, w + 3, 1), P(T / 2, w + 3, 1), P(T / 2, w + 3, FLAP_H - 0.06),
          P(T / 2, w - 3, FLAP_H - 0.06), P(T / 2, w - 3, 1)]);
    c.fillStyle = 'rgba(214,206,186,0.85)'; c.fill();
  }
}

const CS = 320, [coneCv, coneCtx] = mk(CS, CS);
(function () {

    const dist = Math.hypot(x, y), a = Math.abs(Math.atan2(y, x));

function resize() {

const G = { state: 'title', mode: 'challenge', level: 1, viewLevel: 1, story: 0, maze: null, rects: [], solids: [], deco: null,

G.dimIn = 6; G.dimT = 0; G.faltT = 0;

const FALTER_T = 0.35;                      // titubeo de la linterna después de choques seguidos
const M = { x: 0, y: 0, a: Math.PI, v: 0, turnV: 0, phase: 0, stepT: 0, bumpCd: 0, lastBump: -9,

  headA: 0, look: { t: 0, ang: 0, next: 0 }, lookIn: 2,                                   // giro de la cabeza
  spin: 0, feet: null };                                                                  // giro en el lugar y patas
const BUMP_T = 0.6, TWITCH_T = 0.32, BLINK_T = 0.14;
const STRETCH_T = 0.45;   // al despegarse del pegamento: el cuerpo se estira y afina un instante (inercia)
const CAUGHT_T = 1;       // atrapado: cuánto dura el sacudón de orejas y cola (después queda quieta)
// intensidad del sacudón: completa y se apaga suave en el último tercio
const caughtAmp = () => clamp((M.caughtT || 0) / (CAUGHT_T * 0.35), 0, 1);
// cuánto se estira (+) o se achata (-) en este momento: primero se estira, después un rebote mínimo y vuelve
const stretchAmount = () => { if (!(M.stretchT > 0)) return 0; const f = 1 - M.stretchT / STRETCH_T; return Math.sin(f * Math.PI * 1.5) * (1 - f); };
const EAR_TILT = 0.35;   // inclinación de las orejas hacia afuera (rad)
const EAR_IN = 0.45;     // cuánto se meten las orejas hacia el cuerpo
const TAIL_N = 18, TAIL_L = 30, TAIL_SEG = TAIL_L / TAIL_N, TAIL_ROOT = 18;   // la cola nace en x = -TAIL_ROOT
const tailWidth = t => 3.6 - 3.0 * t;

// Patas: [x, y] de reposo (coordenadas del ratón), si es de adelante, y su par diagonal (se mueven de a pares, como un trote)
const FEET = [[6, -5.4, true, 0], [6, 5.4, true, 1], [-14.5, -9.2, false, 1], [-14.5, 9.2, false, 0]];
const STRIDE = 28;        // largo de un ciclo de paso (unidades de mundo recorridas por las patas): más largo = pasos más lentos
const FOOT_SLIP = 0.45;   // apoyada, la pata acompaña al cuerpo este tanto (leve arrastre): pasos largos sin despegarse del cuerpo
const SWING = 0.45;       // fracción del ciclo que la pata va por el aire
const FRONT_REACH = 1;    // recorrido de las manos respecto del de las patas traseras (con menos, se corren hacia atrás al apoyar)
// Marcha atada a la distancia: un ciclo (M.gait) avanza según cuánto se desplazan los lugares de reposo de las patas
// (caminando o girando en el lugar). Cada par diagonal va a medio ciclo del otro, así que siempre están en sincronía:
// lento = pasos lentos, rápido = pasos rápidos. Apoyada, la pata queda quieta en el piso; en el aire va de un poco
// atrás a un poco adelante de su lugar. En el pegamento los pasos son más cortos y "tironeados", y al salir deja huellas.
function updateFeet(dt) {
  if (M.caught && M.feet) return;   // atrapada: las patas quedan abiertas (pose en drawMouse)
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  const homes = FEET.map(([fx, fy]) => [M.x + fx * ca - fy * sa, M.y + fx * sa + fy * ca]);
  if (!M.feet || !M.prevHomes || homes.some((h, i) => Math.hypot(h[0] - M.prevHomes[i][0], h[1] - M.prevHomes[i][1]) > 25)) {
    M.feet = homes.map(h => ({ p: h, dir: [ca, sa], air: false, lift: 0 }));   // primera vez o teletransporte
    M.prevHomes = homes; M.gait = 0;
    return;
  }
  const sticky = M.onTray || M.stickyT > 0, stride = sticky ? STRIDE * 0.6 : STRIDE;
  const disp = homes.map((h, i) => [h[0] - M.prevHomes[i][0], h[1] - M.prevHomes[i][1]]);
  const dist = disp.reduce((a, d) => a + Math.hypot(d[0], d[1]), 0) / disp.length;
  M.gait += dist / stride;
  // si casi no se mueve y quedó una pata en el aire, termina el paso sola (no queda congelada levantada)
  if (dist < 0.02 && M.feet.some(f => f.air)) M.gait += dt * 3;
  FEET.forEach(([, fy, front, pair], i) => {
    const ft = M.feet[i], h = homes[i], dl = Math.hypot(disp[i][0], disp[i][1]);
    if (dl > 0.01) ft.dir = [disp[i][0] / dl, disp[i][1] / dl];          // hacia dónde se mueve esta pata
    const A = stride * (1 - SWING) * (1 - FOOT_SLIP) / 2 * (front ? FRONT_REACH : 1);   // cuánto se adelanta / atrasa
    const pf = ((M.gait + pair * 0.5) % 1 + 1) % 1;
    if (pf < SWING) {                                                    // en el aire
      const s = pf / SWING, e = sticky ? Math.pow(s, 2.2) : 1 - (1 - s) * (1 - s);
      const rel = -A + 2 * A * e;
      ft.p = [h[0] + ft.dir[0] * rel, h[1] + ft.dir[1] * rel];
      ft.air = true; ft.lift = Math.sin(Math.PI * s);
    } else if (ft.air) {                                                 // se apoya
      ft.p = [h[0] + ft.dir[0] * A, h[1] + ft.dir[1] * A];
      ft.air = false; ft.lift = 0;
      if (G.state === 'play') {
        Snd.step();
        if (M.stickyT > 0 && !M.onTray) G.prints.push({ x: ft.p[0], y: ft.p[1], a: M.a, side: Math.sign(fy), t: 0 });
      }
    } else {                                                             // apoyada: acompaña un poco al cuerpo
      ft.p = [ft.p[0] + disp[i][0] * FOOT_SLIP, ft.p[1] + disp[i][1] * FOOT_SLIP];

}
const PRINT_LIFE = 4;   // segundos que duran las huellas pegajosas

// Cola: una cadena de puntos en coordenadas del mundo. Cada punto tiende a su forma "de reposo"
// (ondulando detrás del ratón), mantiene el largo de cada tramo y se empuja fuera de las paredes.
function updateTail(dt) {
  if (M.caught && !(M.caughtT > 0) && M.tail) return;   // atrapada: después del sacudón la cola queda quieta
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  const rest = i => {
    const t = i / TAIL_N, x = -TAIL_ROOT - TAIL_L * t;
    const y = M.caught
      ? Math.sin(G.time * 40 - t * 1.5) * 5 * t * caughtAmp()   // atrapado: cola recta que se sacude (1 s) y queda quieta
      : Math.sin(M.phase * 1.3 - t * 3.2) * 4.5 * t + Math.sin(G.time * 1.7 - t * 2.5) * 1.2 * t - M.turnV * 2.5 * t * t
        + Math.sin(G.time * 42 - t * 4) * 4 * t * (M.bumpT / BUMP_T);   // sacudón rápido de la cola al chocar
    return [M.x + x * ca - y * sa, M.y + x * sa + y * ca];
  };
  // primera vez o teletransporte: la cola nace recogida en la base del cuerpo y crece hacia atrás en los primeros
  // cuadros, chocando con las paredes (si se armaba recta de una, en el corral de inicio atravesaba la pared de atrás)
  if (!M.tail || Math.hypot(M.tail[0][0] - (M.x - ca * TAIL_ROOT), M.tail[0][1] - (M.y - sa * TAIL_ROOT)) > 30) {
    M.tail = []; for (let i = 0; i <= TAIL_N; i++) M.tail.push([M.x - ca * 4, M.y - sa * 4]);
  }
  const P = M.tail;
  // la cola no choca con el hueco de las puertas (pasa por abajo de la cortina detrás del cuerpo)
  const near = G.solids.filter(R => !R.door && R.x < M.x + 60 && R.x + R.w > M.x - 60 && R.y < M.y + 60 && R.y + R.h > M.y - 60);
  // nacimiento de la cola: sobre el eje del cuerpo, pero si ahí hay una pared, se corre hacia el ratón hasta quedar
  // afuera, del lado del ratón (si no, el empuje de las paredes podía mandar la cola al otro lado)
  let root = TAIL_ROOT;
  for (const R of near) {
    const x0 = R.x - 1.5, x1 = R.x + R.w + 1.5, y0 = R.y - 1.5, y1 = R.y + R.h + 1.5;
    let t0 = 0, t1 = TAIL_ROOT;
    for (const [o, d, lo, hi] of [[M.x, -ca, x0, x1], [M.y, -sa, y0, y1]]) {
      if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) { t0 = 1; t1 = 0; } continue; }
      let a = (lo - o) / d, b = (hi - o) / d; if (a > b) [a, b] = [b, a];
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    if (t0 <= t1) root = Math.min(root, Math.max(0, t0 - 0.5));
  }
  P[0] = [M.x - ca * root, M.y - sa * root];
  const MAX_STEP = 4;   // un punto de la cola no se mueve más que esto por cuadro (menos que el grosor del cartón)
  for (let i = 1; i <= TAIL_N; i++) {
    // más floja hacia la punta: al girar o rotar en el lugar la cola queda barriendo atrás (inercia) y se endereza sola
    // (atrapado: firme hasta la punta, así el sacudón se ve entero)
    const t = i / TAIL_N, [rx, ry] = rest(i), k = Math.min(1, dt * (M.caught ? 40 : 20 - 17 * t));
    let mx = (rx - P[i][0]) * k, my = (ry - P[i][1]) * k, ml = Math.hypot(mx, my);
    if (ml > MAX_STEP) { mx *= MAX_STEP / ml; my *= MAX_STEP / ml; }   // aunque se trabe un cuadro, no salta paredes
    let x = P[i][0] + mx, y = P[i][1] + my;
    // largo fijo del tramo + fuera de las paredes; se repite para que, si choca, se deslice a lo largo del muro
    const r = tailWidth(t) / 2 + 0.6;
    for (let pass = 0; pass < 3; pass++) {
      let dx = x - P[i - 1][0], dy = y - P[i - 1][1], d = Math.hypot(dx, dy);
      if (d < 1e-6) { dx = -ca; dy = -sa; d = 1; }
      x = P[i - 1][0] + dx / d * TAIL_SEG; y = P[i - 1][1] + dy / d * TAIL_SEG;
      let hit = false;
      for (const R of near) {
        const qx = clamp(x, R.x, R.x + R.w), qy = clamp(y, R.y, R.y + R.h);
        const ex = x - qx, ey = y - qy, e2 = ex * ex + ey * ey;
        if (e2 >= r * r) continue;
        hit = true;
        if (e2 > 1e-9) { const e = Math.sqrt(e2); x += ex / e * (r - e); y += ey / e * (r - e); }
        else {   // el punto quedó adentro: sale por el borde más cercano
          const l = x - R.x, rr = R.x + R.w - x, tp = y - R.y, b = R.y + R.h - y, m = Math.min(l, rr, tp, b);
          if (m === l) x = R.x - r; else if (m === rr) x = R.x + R.w + r; else if (m === tp) y = R.y - r; else y = R.y + R.h + r;
        }
      }
      if (!hit) break;
    }
    P[i] = [x, y];
  }
}

// Gestos del ratón: golpe contra la pared, parpadeo y orejita cuando está quieto
function animMouse(dt, active) {
  M.bumpT = Math.max(0, M.bumpT - dt);
  M.stretchT = Math.max(0, (M.stretchT || 0) - dt);
  M.caughtT = Math.max(0, (M.caughtT || 0) - dt);
  // atrapada: se aplasta de golpe (pose fija) y no hace más gestos (ni parpadeo, ni orejas, ni cabeza)
  if (M.caught) { M.squash = Math.min(1, (M.squash || 0) + dt / 0.08); M.blinkT = 0; M.twitch.t = 0; return; }
  M.blinkT = Math.max(0, M.blinkT - dt);
  if ((M.blinkIn -= dt) <= 0) { M.blinkT = BLINK_T; M.blinkIn = 1.5 + Math.random() * 4; }

// Arma el laberinto (paredes, decoración) a partir de una semilla; devuelve el rng para seguir colocando cosas
function buildMaze(W, H, seed, loopFrac) {
  const rng = mulberry32(seed);
  G.maze = genMaze(W, H, rng, loopFrac);
  G.rects = buildRects(G.maze, rng);
  G.deco = buildDeco(G.maze, rng);
  return rng;
}
// Desafío: niveles infinitos al azar (la semilla de la partida cambia cada vez)
function loadLevel(n) {
  G.mode = 'challenge'; G.level = n; G.viewLevel = n;
  const [W, H] = sizeFor(n);
  buildMaze(W, H, G.baseSeed + n * 7919, Math.min(0.05, 0.008 * (n - 1)));
  G.items = placeCoins(G.maze, [], G.baseSeed + n * 7919 + 777); G.runCoins = 0;
  G.solids = G.holeRects = G.rects; G.cheeseTotal = 0;
  G.timeLimit = timeFor(n, pathLen(G.maze));
  G.attempts = 1;
  computeScale();
  resetRun();
}
// Historia: niveles fijos de la tabla LEVELS
function loadStory(i) {
  const L = LEVELS[i];
  G.mode = 'story'; G.story = i; G.level = i + 1; G.viewLevel = STORY_VIEW;
  const rng = buildMaze(L.size[0], L.size[1], L.seed, L.loops || 0);
  G.items = placeItems(L, G.maze, rng);
  G.items = G.items.concat(placeCoins(G.maze, G.items, L.seed + 777)); G.runCoins = 0;
  G.solids = doorSolids(G.items, G.rects);
  G.holeRects = G.solids.filter(R => !R.door);   // paredes con los agujeros de las puertas (la luz pasa con la cortina levantada)
  const nCheese = G.items.filter(it => it.type === 'cheese').length;
  G.cheeseTotal = Math.min(nCheese, L.cheeseGoal || nCheese);   // cuántos hay que juntar (puede haber más dando vueltas)
  // tiempo: el del nivel 5 de Desafío más un extra por desvíos (quesos) y por lentitud (pegamento)
  const extra = G.cheeseTotal * 6 + (L.sticky || 0) * 5;   // cruzar una bandeja con las 4 patas adentro lleva ~4 s
  G.timeLimit = L.time || Math.ceil((timeFor(STORY_VIEW, pathLen(G.maze)) + extra) / 5) * 5;
  G.attempts = 1;
  computeScale();
  resetRun();
}
function resetRun() {
  const m = G.maze;
  M.x = (m.W + 0.5) * C; M.y = (m.entRow + 0.5) * C; M.a = Math.PI; M.v = 0; M.turnV = 0; M.tail = null;
  M.stickyT = 0; M.onTray = false; M.feet = null; M.spin = 0; M.caught = false; M.squash = 0; G.prints = [];
  // las monedas que ya agarraste quedan agarradas (son tuyas aunque pierdas; no vuelven a aparecer al reintentar)
  for (const it of G.items) { it.closed = false; it.t = 0; it.got = it.type === 'coin' && it.got; it.passing = false; it.ang = DOOR_REST; it.av = 0; it.rattle = 0; }   // trampas abiertas, quesos sin juntar, puertas cerradas
  G.cheese = 0; G.fx = []; G.dieReason = 'time'; G.siren = 0;
  G.timeLeft = G.timeLimit; G.lastTick = 99; G.light = 0;

function camTarget() {
  const m = G.maze, hw = cv.width / (2 * scale), hh = cv.height / (2 * scale);
  const minX = -1.2 * C, maxX = (m.W + 1.4) * C, minY = -0.5 * C, maxY = (m.H + 0.5) * C;

}

// atrás de un color más intenso y la de adelante redonda con el pliegue marcado, ojo redondo, nariz que asoma en la punta,

// Usa la misma paleta que el juego. t anima: respira, parpadea, mueve la oreja y la cola (t = 0: quieta).
// Coordenadas propias de unos 900 × 430; se centra en (x, y) y size es el ancho total en píxeles.

// Jaula de laboratorio vista de frente, sobre un estante de metal (como las de la referencia): caja de plástico
// transparente un poco más ancha arriba, viruta en el piso, tapa de reja y un cartelito con el nombre.
// Adentro va la ratita de perfil; si todavía no la tenés, es una silueta oscura y el cartel dice "???".
// Dibuja en (0, 0) con tamaño w × h; t anima a la ratita (0: quieta).
const cageOff = document.createElement('canvas'), cageOffCtx = cageOff.getContext('2d');
// shelf: dibuja su pedazo de estante (en la pantalla de Ratitas el estante lo pone el CSS, de punta a punta)
function drawRatCage(g, w, h, i, owned, sel, t = 0, shelf = true) {
  const rnd = mulberry32(i * 977 + 13);
  g.save();
  const sy = h * 0.86, sh = h * 0.07;                                                // estante
  if (shelf) {
    const mg = g.createLinearGradient(0, sy, 0, sy + sh);
    mg.addColorStop(0, '#f7f8f9'); mg.addColorStop(0.45, '#c3c8cc'); mg.addColorStop(1, '#8e959a');
    g.fillStyle = mg; g.fillRect(0, sy, w, sh);
  }

  const box = new Path2D(); box.moveTo(x0, top); box.lineTo(x1, top); box.lineTo(x1 - ins, bot); box.lineTo(x0 + ins, bot); box.closePath();
  g.fillStyle = 'rgba(205,220,226,0.45)'; g.fill(box);
  g.save(); g.clip(box);
  const bed = bot - h * 0.13;                                                        // viruta
  g.fillStyle = '#dcc69e'; g.beginPath(); g.moveTo(0, bot);
  for (let x = 0; x <= w; x += w / 12) g.lineTo(x, bed + Math.sin(x * 0.2 + i) * h * 0.012);
  g.lineTo(w, bot); g.closePath(); g.fill();
  const flecks = ['#c9a873', '#ecdcb6', '#b38f5c', '#f3e9cf'];
  for (let k = 0; k < 40; k++) {
    g.fillStyle = flecks[k % 4];
    g.beginPath(); g.ellipse(x0 + rnd() * (x1 - x0), bed + rnd() * (bot - bed), w * (0.012 + rnd() * 0.02), h * (0.005 + rnd() * 0.008), rnd() * 3, 0, Math.PI * 2); g.fill();
  }
  // ratita parada sobre la viruta (las patas quedan 82 unidades del retrato debajo de su centro)
  const size = (x1 - x0) * 0.8, k = size / 930, cx = w / 2 + w * 0.03, cy = bed + h * 0.035 - 82 * k;
  if (owned) drawRatPortrait(g, cx, cy, size, i, t);
  else {   // silueta oscura (se dibuja aparte para oscurecer solo a la ratita)
    cageOff.width = Math.ceil(w); cageOff.height = Math.ceil(h);
    cageOffCtx.setTransform(1, 0, 0, 1, 0, 0); cageOffCtx.clearRect(0, 0, cageOff.width, cageOff.height);
    drawRatPortrait(cageOffCtx, cx, cy, size, i, 0);
    cageOffCtx.globalCompositeOperation = 'source-atop'; cageOffCtx.fillStyle = '#3a3633'; cageOffCtx.fillRect(0, 0, w, h);
    cageOffCtx.globalCompositeOperation = 'source-over';
    g.drawImage(cageOff, 0, 0, w, h);
  }
  g.restore();
  // plástico: brillo en diagonal y bordes
  g.save(); g.clip(box);
  g.fillStyle = 'rgba(255,255,255,0.16)';
  g.beginPath(); g.moveTo(x0 + w * 0.12, top); g.lineTo(x0 + w * 0.3, top); g.lineTo(x0 + w * 0.08, bot); g.lineTo(x0 - w * 0.1, bot); g.closePath(); g.fill();
  g.restore();
  g.lineJoin = 'round';
  g.strokeStyle = 'rgba(110,130,138,0.45)'; g.lineWidth = Math.max(1, w * 0.012); g.stroke(box);
  g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = Math.max(1, w * 0.006); g.stroke(box);
  // tapa de reja
  const ly = top - h * 0.07;
  g.strokeStyle = '#9aa2a8'; g.lineWidth = Math.max(1, w * 0.008);
  g.beginPath();
  for (let x = x0 + w * 0.02; x <= x1 - w * 0.02; x += w * 0.035) { g.moveTo(x, ly); g.lineTo(x, top); }
  g.stroke();
  g.strokeStyle = '#7f878d'; g.lineWidth = Math.max(1.5, w * 0.016);
  g.beginPath(); g.moveTo(x0 - w * 0.02, ly); g.lineTo(x1 + w * 0.02, ly); g.moveTo(x0 - w * 0.02, top); g.lineTo(x1 + w * 0.02, top); g.stroke();
  // cartelito con el nombre (amarillo si es la elegida)
  const lw = w * 0.62, lh = h * 0.12, lx = (w - lw) / 2, lyy = top + h * 0.035;

  g.fillStyle = sel ? '#ffe17a' : '#fbf8ee'; g.fillRect(lx, lyy, lw, lh);
  g.strokeStyle = sel ? '#c98a12' : '#a9adb0'; g.lineWidth = Math.max(1, w * 0.008); g.strokeRect(lx, lyy, lw, lh);
  const name = owned ? RATS[i][0] : '???';

  while (g.measureText(name).width > lw * 0.9 && fs > 6) { fs -= 0.5; g.font = `${fs}px 'Special Elite', 'Courier New', monospace`; }
  g.fillStyle = '#2a2622'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(name, w / 2, lyy + lh / 2 + 1);
  g.restore();
}
function drawThumb(cv) {

// ---- Máquina de ratitas (como la del Crossy Road): girás la manija, cae una cápsula, se agranda, tiembla, se abre
// y aparece la ratita girando sobre rayos de luz, con papelitos. Arte provisorio dibujado por código. ----
const Gacha = { phase: 'idle', t: 0, clock: 0, tick: 0, pick: 1, dup: false, raf: 0, conf: [], cap: '#e74c3c', caps: null };
const GACHA_T = { crank: 1.0, drop: 0.75, shake: 1.0, open: 0.45 };

function showMachine(from) {
  G.screen = 'machine'; Gacha.phase = 'idle'; Gacha.t = 0; Gacha.conf = [];
  openScreen(`<h2 class="stitle">MÁQUINA</h2>
    <canvas id="gachaCv" width="900" height="900"></canvas>
    <p id="gachaRes">${gachaHint()}</p>
    <div class="sbtns" id="gachaBtns">${gachaButtons(false)}</div>`, from);

  cancelAnimationFrame(Gacha.raf);

    if (G.screen !== 'machine') return;
    Gacha.raf = requestAnimationFrame(step);

    const cv2 = document.getElementById('gachaCv');

  };
  Gacha.raf = requestAnimationFrame(step);
}
function gachaHint() {
  return Wallet.coins >= COIN_SPIN ? `Activarla cuesta ${COIN_SPIN} ${COIN_ICON}. ¡Puede salir cualquier ratita!`
    : `Te faltan <b>${COIN_SPIN - Wallet.coins}</b> ${COIN_ICON} para activarla. Juntalas en los laberintos.`;
}
function gachaButtons(after) {

  return (after ? '<button class="cbtn" data-act="use">Usarla</button>' : '') + spin +
    '<button class="cbtn alt" data-act="ratitas">Ratitas</button><button class="cbtn alt" data-act="back">Volver</button>';

function gachaSpin() {
  if (G.screen !== 'machine' || !['idle', 'reveal'].includes(Gacha.phase) || Wallet.coins < COIN_SPIN) return;
  Wallet.add(-COIN_SPIN); pop($coins);
  Gacha.pick = 1 + Math.floor(Math.random() * (RATS.length - 1));   // la Albina ya la tenés de entrada
  Gacha.dup = Skins.has(Gacha.pick);
  if (!Gacha.dup) { Skins.data.owned.push(Gacha.pick); Skins.save(); }
  Gacha.cap = CAP_COLORS[Math.floor(Math.random() * CAP_COLORS.length)];
  Gacha.phase = 'crank'; Gacha.t = 0; Gacha.tick = 0; Gacha.conf = [];
  document.getElementById('gachaRes').textContent = '¡La máquina está trabajando!';
  document.getElementById('gachaBtns').innerHTML = '';
}
function gachaUpdate(dt) {
  const P = Gacha, next = ph => { P.phase = ph; P.t = 0; P.tick = 0; };
  P.t += dt; P.clock += dt;
  if (P.phase === 'crank') {
    if ((P.tick -= dt) <= 0) { P.tick = 0.09; Snd.crank(); }
    if (P.t >= GACHA_T.crank) next('drop');
  } else if (P.phase === 'drop') {
    if (P.t >= GACHA_T.drop) { Snd.thunk(); next('shake'); document.getElementById('gachaRes').textContent = '¿Qué ratita será?'; }
  } else if (P.phase === 'shake') {
    if (P.t > 0.35 && (P.tick -= dt) <= 0) { P.tick = 0.11; Snd.rattle(); }
    if (P.t >= GACHA_T.shake) {
      Snd.popOpen(); next('open');
      for (let k = 0; k < 70; k++) P.conf.push({ x: 150, y: 150, vx: (Math.random() - 0.5) * 300, vy: -60 - Math.random() * 220,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, w: 4 + Math.random() * 4, h: 2 + Math.random() * 2.5,
        col: CAP_COLORS[k % CAP_COLORS.length] });

  } else if (P.phase === 'open') {
    if (P.t >= GACHA_T.open) { next('reveal'); gachaResult(); }
  }
  for (const f of P.conf) { f.vy += 320 * dt; f.vx *= 1 - dt * 0.8; f.x += f.vx * dt; f.y += f.vy * dt; f.r += f.vr * dt; }
  P.conf = P.conf.filter(f => f.y < 330);
}
function gachaResult() {
  const name = RATS[Gacha.pick][0];

  else Snd.win();
  document.getElementById('gachaRes').innerHTML = Gacha.dup
    ? `<span class="gname">${name}</span><br>Ya la tenías: te devolvemos <b>${COIN_DUP}</b> ${COIN_ICON}`
    : `<span class="gname">¡${name}!</span><br>¡Ratita nueva!`;

}
function drawGacha(g, n) {
  const P = Gacha, t = P.t;
  g.setTransform(n / 300, 0, 0, n / 300, 0, 0); g.clearRect(0, 0, 300, 300);
  const ease = p => { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); };
  if (['idle', 'crank', 'drop', 'shake'].includes(P.phase)) {
    const alpha = P.phase === 'shake' ? 1 - ease(t / 0.3) : 1;
    if (alpha > 0) { g.globalAlpha = alpha; drawMachine(g); g.globalAlpha = 1; }
  }
  if (P.phase === 'drop') {   // sale por la boca de la máquina y rebota en el piso
    const p = clamp(t / GACHA_T.drop, 0, 1);
    const [dx0, dy0] = MACHINE_DOOR;   // aparece en la compuerta, baja por la rampita y rebota hacia adelante

  } else if (P.phase === 'open' || P.phase === 'reveal') {
    const e = P.phase === 'open' ? ease(t / GACHA_T.open) : 1, rt = P.phase === 'open' ? t : t + GACHA_T.open;
    drawRays(g, rt, e);
    const pop = P.phase === 'open' ? e * (1 + 0.25 * Math.sin(e * Math.PI)) : 1;   // aparece creciendo con un rebote
    drawRatPortrait(g, 150, 158, 250 * pop, P.pick, rt);

      g.globalAlpha = 1 - e; capsule(g, 150, 150, 55, P.cap, 0, 90 * e); g.globalAlpha = 1;

      fl.addColorStop(0, `rgba(255,255,255,${0.95 * (1 - e)})`); fl.addColorStop(1, 'rgba(255,255,255,0)');

// Cápsula como las de la referencia: mitad de abajo de color, mitad de arriba transparente (teñida), con una banda en
// el medio y brillos; split separa las mitades al abrirse
function capsule(g, x, y, r, col, rot, split) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const dark = mixC(col, '#000000', 0.25), light = mixC(col, '#ffffff', 0.55);
  // mitad de arriba: plástico transparente teñido

  tg.addColorStop(0, mixC(light, '#ffffff', 0.4)); tg.addColorStop(1, light);
  g.fillStyle = tg; g.beginPath(); g.arc(0, -split, r, Math.PI, Math.PI * 2); g.closePath(); g.fill();
  g.globalAlpha /= 0.72;
  // mitad de abajo: color pleno, un poco más oscuro hacia abajo

  bg.addColorStop(0, col); bg.addColorStop(1, dark);
  g.fillStyle = bg; g.beginPath(); g.arc(0, split, r, 0, Math.PI); g.closePath(); g.fill();
  if (!split) { g.fillStyle = dark; g.fillRect(-r, -r * 0.05, r * 2, r * 0.1); }   // banda donde se juntan
  g.fillStyle = 'rgba(255,255,255,0.75)';                                               // brillos
  g.beginPath(); g.ellipse(-r * 0.38, -split - r * 0.55, r * 0.24, r * 0.12, -0.5, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(-r * 0.05, -split - r * 0.7, r * 0.05, 0, Math.PI * 2); g.arc(r * 0.12, -split - r * 0.66, r * 0.035, 0, Math.PI * 2); g.fill();
  g.restore();

    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 200, i * Math.PI / 6, (i + 1) * Math.PI / 6); g.closePath(); g.fill();
  }

  g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 115, 0, Math.PI * 2); g.fill();

// La máquina de ratitas, como la referencia: tapa turquesa con baliza roja, dos tubos amarillos que brillan, cables,

// pantallita con barras y pulso, y franja de peligro. Se dibuja en las coordenadas de la referencia (≈1145 × 1374)
// achicadas a MS dentro del canvas de 300 × 300. Al activarla: tiembla, la baliza destella, las barras se llenan y las
// cápsulas se sacuden; la compuerta se ilumina más cuando sale la cápsula.

  cable('#d9342b', 26, [[255, 700], [205, 730], [185, 800], [195, 850]]);
  cable(DARK, 24, [[195, 850], [150, 900], [158, 985], [185, 1005]]);
  cable('#d9342b', 22, [[655, 92], [700, 20], [790, 26], [800, 72]]);

    g.fillStyle = halo; g.fillRect(-60, -len * 0.6, len + 120, len * 1.2);
    const tg = g.createLinearGradient(0, -30, 0, 30);
    tg.addColorStop(0, '#d9a51a'); tg.addColorStop(0.5, mixC('#f6d34a', '#fffbe0', glow)); tg.addColorStop(1, '#c58f12');

function showIntro() {
  G.state = 'intro'; $hud.classList.remove('hidden');

  card(L
    ? `<h1>NIVEL ${G.level}</h1>
       <p class="big">${L.name}</p>
       <p>${L.intro}</p>
       <p>Tiempo: <b>${fmt(G.timeLimit)}</b></p>
       ${go('encender la linterna')}`
    : `<h1>NIVEL ${G.level}</h1>
       <p class="big">Laberinto ${m.W} × ${m.H}</p>
       <p>Tiempo: <b>${fmt(G.timeLimit)}</b></p>
       ${go('encender la linterna')}`);
  G.iris = 0; G.irisTarget = 0;
  pop($level); pop($timer);
  updateButtons();
}
function startPlay() {
  G.state = 'play'; G.onT = 0; card(null); Snd.click(); updateButtons();
  G.iris = 0; G.irisTarget = 1;   // la escena se abre desde un círculo negro
  Music.start();                  // por si todavía no arrancó (normalmente ya suena desde la portada)
}
function win() {
  G.state = 'won'; Snd.win();
  G.irisTarget = 0; G.winCard = false;   // se cierra en un círculo negro; el cartel aparece al terminar
  updateButtons();
}
// Estrellas: 1 por escapar + 1 por los quesos (sin quesos: más de 1/3 del tiempo) + 1 por el tiempo (más de 1/3; sin quesos, más de 1/2)
function starsFor() {
  const frac = G.timeLeft / G.timeLimit, hasCheese = G.cheeseTotal > 0;
  return 1 + ((hasCheese ? G.cheese >= G.cheeseTotal : frac > 1 / 3) ? 1 : 0) + ((hasCheese ? frac > 1 / 3 : frac > 1 / 2) ? 1 : 0);
}
// Aviso de premio en el cartel de fin de nivel (como el "Get a prize!" del Crossy Road): si te alcanzan las monedas,
// un botón directo a la Máquina; si no, una barrita con cuánto te falta. Se actualiza al volver de la Máquina.
function prizeBlock() {
  if (Wallet.coins >= COIN_SPIN)
    return `<div class="menu"><button class="cbtn prize" data-act="machine">¡Activá la máquina! · ${COIN_SPIN} ${COIN_ICON}</button></div>`;
  return `<div class="prizebar"><i style="width:${Wallet.coins / COIN_SPIN * 100}%"></i>
    <span>${COIN_ICON} ${Wallet.coins} / ${COIN_SPIN} · te faltan ${COIN_SPIN - Wallet.coins} para activar la máquina</span></div>`;
}
function refreshPrize() { const el = document.getElementById('prizeSlot'); if (el) el.innerHTML = prizeBlock(); }
function showWinCard() {
  G.winCard = true;
  if (G.mode === 'story') {
    const st = starsFor(), last = G.story >= LEVELS.length - 1;
    Story.finish(G.story, st);
    card(`<h1>¡ESCAPASTE!</h1>
      <div class="stars">${'★'.repeat(st)}<span>${'★'.repeat(3 - st)}</span></div>
      <p>${G.cheeseTotal ? `Quesos: <b>${G.cheese}/${G.cheeseTotal}</b> · ` : ''}Te sobraron <b>${Math.floor(G.timeLeft)} s</b></p>
      ${G.runCoins ? `<p>${COIN_ICON} <b>+${G.runCoins}</b> monedas</p>` : ''}
      <div id="prizeSlot">${prizeBlock()}</div>
      ${last ? '<p>¡Completaste la Historia! Escapaste del laboratorio.</p>' : ''}
      <div class="menu">${last ? '' : '<button class="cbtn" data-act="next">Siguiente nivel</button>'}<button class="cbtn alt" data-act="levels">Niveles</button></div>
      ${isTouch ? '' : go(last ? 'volver a los niveles' : 'el siguiente nivel')}`);
    return;
  }
  card(`<h1>¡ESCAPASTE!</h1>
    <p>Te sobraron <b>${Math.floor(G.timeLeft)} s</b>${G.attempts > 1 ? ` · intentos: ${G.attempts}` : ''}</p>
    ${G.runCoins ? `<p>${COIN_ICON} <b>+${G.runCoins}</b> monedas</p>` : ''}
    <div id="prizeSlot">${prizeBlock()}</div>
    ${go(`el nivel ${G.level + 1}`)}`);
}
function startDie(reason = 'time') {
  G.state = 'dying'; G.dieReason = reason; G.dieT = 0;
  if (reason === 'time') G.timeLeft = 0;
  Snd.lose(); updateButtons();
}
function lost() {
  G.state = 'lost';
  card(G.dieReason === 'trap'
    ? `<h1 class="red">¡ATRAPADO!</h1>
       <p>La trampa se cerró. Volvés a la entrada del mismo laberinto.</p>
       <div id="prizeSlot">${prizeBlock()}</div>
       ${go('reintentar')}`
    : `<h1 class="red">SE ACABÓ<br>EL TIEMPO</h1>
       <p>La linterna se apagó. Volvés a la entrada del mismo laberinto.</p>
       <div id="prizeSlot">${prizeBlock()}</div>
       ${go('reintentar')}`);
  updateButtons();
}
function togglePause() {
  if (G.state === 'play') {
    G.state = 'paused'; Music.pause();
    card(`<h1>PAUSA</h1>${go('seguir')}
      <div class="menu"><button class="cbtn alt" data-act="menu">Salir al menú</button></div>
      ${isTouch ? '' : '<p class="small"><kbd>Q</kbd> salir al menú</p>'}`);
  }
  else if (G.state === 'paused') { G.state = 'play'; card(null); Music.resume(); }
  updateButtons();
}
// Acción principal: ESPACIO en teclado o tocar la pantalla
function primaryAction() {
  Snd.init();
  if (G.screen) { if (G.screen === 'machine') gachaSpin(); return; }   // en la Máquina, ESPACIO gira
  if (G.state === 'title') act('story');
  else if (G.state === 'select') { loadStory(Math.min(Story.data.unlocked, LEVELS.length) - 1); showIntro(); }
  else if (G.state === 'intro') startPlay();
  else if (G.state === 'won' && G.winCard) {
    if (G.mode === 'story') act(G.story >= LEVELS.length - 1 ? 'levels' : 'next');
    else { loadLevel(G.level + 1); showIntro(); }
  }
  else if (G.state === 'lost') { G.attempts++; resetRun(); startPlay(); }
  else if (G.state === 'paused') togglePause();
}
// Botones de los carteles (data-act)
function act(a, el) {
  Snd.init();
  if (a === 'story') { firstGesture(); showSelect(); }
  else if (a === 'challenge') { firstGesture(); G.baseSeed = (Math.random() * 1e9) | 0; loadLevel(1); showIntro(); }
  else if (a === 'level') { loadStory(+el.dataset.i); showIntro(); }
  else if (a === 'next') { loadStory(G.story + 1); showIntro(); }
  else if (a === 'levels') showSelect();
  else if (a === 'back') { if (G.screen) { G.screen = null; closeScreen(); refreshPrize(); updateButtons(); } else showTitle(); }
  else if (a === 'menu') { Music.resume(); showTitle(); }
  else if (a === 'ratitas') showRatitas(el);
  else if (a === 'machine') showMachine(el);
  else if (a === 'spin') gachaSpin();
  else if (a === 'pick') pickRat(+el.dataset.i);
  else if (a === 'use') { Skins.data.sel = Gacha.pick; Skins.save(); showRatitas(); }
}

// ===================== FÍSICA =====================
function collide() {
  let pushed = 0;
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  for (let it = 0; it < 3; it++) for (const [off, r] of [[0, RAD], [12, 7]]) {
    let cx = M.x + ca * off, cy = M.y + sa * off;
    for (const R of G.solids) {   // paredes + costados de los rollos
      if (cx + r < R.x || cx - r > R.x + R.w || cy + r < R.y || cy - r > R.y + R.h) continue;
      const px = clamp(cx, R.x, R.x + R.w), py = clamp(cy, R.y, R.y + R.h);
      const dx = cx - px, dy = cy - py, d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      let nx, ny, pen;
      if (d2 > 1e-9) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = r - d; }
      else {
        const l = cx - R.x, rr = R.x + R.w - cx, t = cy - R.y, b = R.y + R.h - cy, mn = Math.min(l, rr, t, b);
        if (mn === l) { nx = -1; ny = 0; pen = l + r; } else if (mn === rr) { nx = 1; ny = 0; pen = rr + r; }
        else if (mn === t) { nx = 0; ny = -1; pen = t + r; } else { nx = 0; ny = 1; pen = b + r; }
      }
      M.x += nx * pen; M.y += ny * pen; cx += nx * pen; cy += ny * pen; pushed = Math.max(pushed, pen);
    }
  }
  return pushed;
}

// Pegamento: devuelve cuánto se multiplica la velocidad (frena encima y deja las patas pegajosas un rato)
function stickyFactor(dt) {
  const on = !M.tunnel && G.items.some(it => it.type === 'sticky' && M.x > it.x && M.x < it.x + it.w && M.y > it.y && M.y < it.y + it.h);
  if (on && !M.onTray) Snd.squish();
  M.onTray = on;
  if (on) { M.stickyT = STICKY_T; return STICKY_SLOW; }
  if (M.stickyT > 0) {
    M.stickyT = Math.max(0, M.stickyT - dt);
    return STICKY_SLOW + (1 - STICKY_SLOW) * (1 - M.stickyT / STICKY_T);   // recupera la velocidad de a poco
  }
  return 1;
}

// Túnel: recorrido automático por el eje del rollo, de una boca a la otra
function tunnelStep(dt) {
  const tn = M.tunnel;
  tn.s += SPEED * 0.9 * dt;
  M.x = tn.ox + tn.ax * tn.s; M.y = tn.oy + tn.ay * tn.s;
  M.a = Math.atan2(tn.ay, tn.ax); M.v = SPEED * 0.9; M.turnV = 0;
  if (tn.s >= tn.end) { M.tunnel = null; M.v = SPEED * 0.6; M.tailFree = 0.5; }
}

// Trampas, quesos y entradas a los túneles
function updateItems() {
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  for (const it of G.items) {
    if (it.type === 'trap' && !it.closed && !M.tunnel) {
      // cuerpo y cabeza de la rata contra el rectángulo de la trampa (en coordenadas de la trampa)
      const c = Math.cos(it.a), s = Math.sin(it.a);
      for (const [off, r] of [[0, RAD], [12, 7]]) {
        const px = M.x + ca * off - it.x, py = M.y + sa * off - it.y;
        const lx = px * c + py * s, ly = -px * s + py * c;
        const qx = clamp(lx, -TRAP_L / 2, TRAP_L / 2), qy = clamp(ly, -TRAP_W / 2, TRAP_W / 2);
        if ((lx - qx) ** 2 + (ly - qy) ** 2 < r * r) {
          it.closed = true; it.t = 0; Snd.trap(); M.v = 0; M.turnV = 0;
          startDie('trap');
          return;
        }
      }
    } else if (it.type === 'cheese' && !it.got) {
      if (Math.hypot(M.x + ca * 10 - it.x, M.y + sa * 10 - it.y) < 14) {
        it.got = true; G.cheese++; Snd.cheese(); pop($cheese);
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 50;
          G.fx.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.35 + Math.random() * 0.2 });
        }
      }
    } else if (it.type === 'tunnel' && !M.tunnel) {
      // se entra con la cabeza en la boca, mirando hacia la pared
      for (const [mouth, sg] of [[it.a, 1], [it.b, -1]]) {
        const ax = it.dx * sg, ay = it.dy * sg, hx = M.x + ca * 12, hy = M.y + sa * 12;
        const along = (hx - mouth[0]) * ax + (hy - mouth[1]) * ay, lat = Math.abs(-(hx - mouth[0]) * ay + (hy - mouth[1]) * ax);
        if (along > -3 && along < TUBE_OUT && lat < TUBE_R - 2 && ca * ax + sa * ay > 0.5) {
          const s = (M.x - mouth[0]) * ax + (M.y - mouth[1]) * ay;
          M.tunnel = { ox: mouth[0], oy: mouth[1], ax, ay, s, end: 2 * TUBE_OUT + 16 };
          Snd.tube();
          break;
        }
      }
    }
  }
}

// Al cruzar el umbral de salida todo se va oscureciendo: 0 dentro del laberinto, 1 ya afuera
function exitDarkness() {
  if (!G.maze || Math.abs(M.y - (G.maze.exitRow + 0.5) * C) > C * 0.6) return 0;
  return clamp((C * 0.4 - M.x) / (C * 0.4 + 30), 0, 1);
}

function update(dt) {
  G.time += dt;
  const up = keys['arrowup'] || keys['w'], down = keys['arrowdown'] || keys['s'];
  const left = keys['arrowleft'] || keys['a'], right = keys['arrowright'] || keys['d'];

  if (G.state === 'play') {
    // Dirección deseada en pantalla: joystick (celular) o flechas/WASD (PC, ↑ = arriba, → = derecha…)
    let dx = 0, dy = 0, mag = 0;
    if (Stick.mag > 0) { dx = Stick.x; dy = Stick.y; mag = Stick.mag; }
    else {
      const kx = (right ? 1 : 0) - (left ? 1 : 0), ky = (down ? 1 : 0) - (up ? 1 : 0);
      if (kx || ky) { const l = Math.hypot(kx, ky); dx = kx / l; dy = ky / l; mag = 1; }
    }
    // el ratón gira hacia esa dirección y avanza más cuanto más alineado está
    let turn = 0, target = 0;
    if (mag > 0) {
      const goal = Math.atan2(dy, dx), diff = Math.atan2(Math.sin(goal - M.a), Math.cos(goal - M.a));
      turn = clamp(diff * 3, -1, 1);
      target = SPEED * mag * Math.max(0, Math.cos(diff));
    }
    target *= stickyFactor(dt);   // el pegamento frena
    const ox = M.x, oy = M.y;
    let want = 0;
    if (M.tunnel) tunnelStep(dt);   // adentro de un rollo: recorrido automático, sin control ni choques
    else {
      M.turnV += (turn * TURN - M.turnV) * Math.min(1, dt * 14);
      M.a += M.turnV * dt;
      M.v += (target - M.v) * Math.min(1, dt * 9);
      want = Math.abs(M.v) * dt;
      M.x += Math.cos(M.a) * M.v * dt; M.y += Math.sin(M.a) * M.v * dt;
      collide();
    }
    const moved = Math.hypot(M.x - ox, M.y - oy);
    M.bumpCd -= dt;
    if (!M.tunnel && want > 1.2 && moved < want * 0.35 && M.bumpCd <= 0 && Math.abs(M.v) > 80) {
      Snd.bump(); if (Math.random() < 0.4) Snd.squeak(); M.bumpCd = 0.45; M.v *= 0.3; M.bumpT = BUMP_T;
      if (G.time - M.lastBump < 1.2) G.shake = Math.min(1, G.shake + 0.5);   // choques seguidos: tiembla la cámara
      M.lastBump = G.time;
    }
    const sp = moved / Math.max(dt, 1e-4) + Math.abs(M.turnV) * 20;
    M.phase += dt * sp * 0.12;
    M.stepT -= dt * sp / SPEED;
    if (M.stepT <= 0 && sp > 20) { Snd.step(); M.stepT = 0.12; }

    G.timeLeft -= dt;
    const s = Math.ceil(G.timeLeft);
    if (G.timeLeft <= 10 && s !== G.lastTick && s > 0) { G.lastTick = s; Snd.tick(s <= 5); }
    G.onT += dt;
    // encendido con parpadeo + leve oscilación del foco
    G.light = G.onT < 0.35 ? (Math.random() < 0.55 ? 1 : 0.15) : 0.96 + 0.04 * Math.sin(G.time * 13) * Math.sin(G.time * 7.3);
    G.light *= 1 - exitDarkness();
    if (M.tunnel) G.light *= 0.25;   // adentro del rollo solo se ve el halo
    updateItems();
    if (G.state !== 'play') { /* una trampa terminó la partida */ }
    else if (M.x < -6) win();
    else if (G.timeLeft <= 0) startDie('time');
  } else if (G.state === 'dying') {
    G.dieT += dt; M.v *= 0.9;
    G.light = G.dieT < 1.1 ? (Math.random() < 0.5 ? 0.12 : 0.85) * (1 - G.dieT / 1.25) : 0;
    if (G.dieT > 1.5) lost();
  } else if (G.state === 'won') {
    M.v = SPEED; M.a += (Math.PI - ((M.a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) * Math.min(1, dt * 4);
    M.x += Math.cos(M.a) * M.v * dt; M.y += Math.sin(M.a) * M.v * dt; M.phase += dt * SPEED * 0.12;
    G.light = 1 - exitDarkness();
  } else if (G.state === 'title' || G.state === 'select') {
    M.a += dt * 0.5; M.phase += dt * 2; G.light = 1;
  } else if (G.state === 'intro' || G.state === 'lost') {
    G.light = 0;
  }
  const input = up || down || left || right || Stick.mag > 0;
  animMouse(dt, G.state === 'play' && (input || Math.abs(M.v) > 5));
  updateTail(dt);

  Music.tick(dt);
  // trampas cerrándose, migas de queso y sirena de los últimos 10 segundos
  for (const it of G.items) if (it.type === 'trap' && it.closed) it.t = Math.min(1, it.t + dt / 0.15);
  for (const p of G.fx) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.fx = G.fx.filter(p => p.t < p.life);
  const sirenOn = (G.state === 'play' || G.state === 'paused') && G.timeLeft <= 10;
  G.siren += clamp((sirenOn ? 1 : 0) - G.siren, -dt / 0.5, dt / 0.5);
  // cortinilla circular y temblor de cámara
  G.iris += clamp(G.irisTarget - G.iris, -dt / IRIS_T, dt / IRIS_T);
  if (G.state === 'won' && !G.winCard && G.iris <= 0) showWinCard();
  G.shake = Math.max(0, G.shake - dt * 2.2);

  const t = camTarget(), f = Math.min(1, dt * 4);
  cam.x += (t.x - cam.x) * f; cam.y += (t.y - cam.y) * f;
  // red de seguridad: el ratón siempre queda dentro de una zona segura de la pantalla
  const z = safeZone(), w = cv.width, h = cv.height;
  cam.x = clamp(cam.x, M.x - (z.x1 - w / 2) / scale, M.x - (z.x0 - w / 2) / scale);
  cam.y = clamp(cam.y, M.y - (z.y1 - h / 2) / scale, M.y - (z.y0 - h / 2) / scale);
}

// Zona de pantalla (en píxeles del canvas) donde tiene que quedar el ratón.
// En el celular: debajo del HUD y por encima del tercio de abajo (donde suele estar el dedo del joystick).
function safeZone() {
  const w = cv.width, h = cv.height, dpr = cv.width / (cv.clientWidth || cv.width);
  let y0 = h * 0.15, y1 = h * 0.85;
  if (isTouch) {
    if (!safeZone.at || G.time - safeZone.at > 0.5) {   // medir el HUD cuesta: se renueva cada medio segundo
      safeZone.at = G.time;
      let hud = document.getElementById('topbtns').getBoundingClientRect().bottom;
      if (!$hud.classList.contains('hidden')) hud = Math.max(hud, $timer.getBoundingClientRect().bottom);
      safeZone.hud = hud;
    }
    const top = (safeZone.hud + 28) * dpr, bottom = h * 0.72;
    if (bottom - top > h * 0.25) { y0 = top; y1 = bottom; }   // en pantallas muy bajitas se queda con la zona normal
  }
  return { x0: w * 0.15, x1: w * 0.85, y0, y1 };
}

// ===================== LUZ (rayos contra las paredes) =====================
const COS = new Float32Array(RAYS), SIN = new Float32Array(RAYS), HITS = new Float32Array(RAYS);
for (let i = 0; i < RAYS; i++) { const a = i / RAYS * Math.PI * 2; COS[i] = Math.cos(a); SIN[i] = Math.sin(a); }
function castRays(ox, oy) {
  const vs = [], hs = [];
  for (const R of G.rects) {
    const px = clamp(ox, R.x, R.x + R.w), py = clamp(oy, R.y, R.y + R.h);
    if ((px - ox) ** 2 + (py - oy) ** 2 > LIGHT_R * LIGHT_R) continue;
    vs.push(R.x, R.y, R.y + R.h, R.x + R.w, R.y, R.y + R.h);
    hs.push(R.y, R.x, R.x + R.w, R.y + R.h, R.x, R.x + R.w);
  }
  for (let i = 0; i < RAYS; i++) {
    const dx = COS[i], dy = SIN[i]; let t = LIGHT_R;
    if (Math.abs(dx) > 1e-6) for (let j = 0; j < vs.length; j += 3) {
      const tt = (vs[j] - ox) / dx; if (tt <= 0 || tt >= t) continue;
      const y = oy + tt * dy; if (y >= vs[j + 1] && y <= vs[j + 2]) t = tt;
    }
    if (Math.abs(dy) > 1e-6) for (let j = 0; j < hs.length; j += 3) {
      const tt = (hs[j] - oy) / dy; if (tt <= 0 || tt >= t) continue;
      const x = ox + tt * dx; if (x >= hs[j + 1] && x <= hs[j + 2]) t = tt;
    }
    HITS[i] = t;
  }
}
function drawCone(c, ox, oy) {
  c.save(); c.translate(ox, oy); c.rotate(M.a); c.drawImage(coneCv, -LIGHT_R, -LIGHT_R, LIGHT_R * 2, LIGHT_R * 2); c.restore();
}

// ===================== RENDER =====================
function visible(R, v, pad) { return R.x + R.w > v.x0 - pad && R.x < v.x1 + pad && R.y + R.h > v.y0 - pad && R.y < v.y1 + pad; }

function drawFloor(c, v) {
  const m = G.maze, Wp = m.W * C, Hp = m.H * C;
  c.fillStyle = '#2b2018'; c.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);       // mesa
  c.fillStyle = floorPat;
  c.fillRect(-T / 2, -T / 2, Wp + T, Hp + T);
  c.fillRect(Wp, m.entRow * C, C, C);
  // uniones de las planchas de cartón
  c.lineWidth = 1.1;
  for (const x of G.deco.sx) {
    if (x < v.x0 - 4 || x > v.x1 + 4) continue;
    c.strokeStyle = 'rgba(35,22,10,0.6)'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, Hp); c.stroke();
    c.strokeStyle = 'rgba(200,160,110,0.25)'; c.beginPath(); c.moveTo(x + 1.2, 0); c.lineTo(x + 1.2, Hp); c.stroke();
  }
  for (const y of G.deco.sy) {
    if (y < v.y0 - 4 || y > v.y1 + 4) continue;
    c.strokeStyle = 'rgba(35,22,10,0.6)'; c.beginPath(); c.moveTo(0, y); c.lineTo(Wp, y); c.stroke();
    c.strokeStyle = 'rgba(200,160,110,0.25)'; c.beginPath(); c.moveTo(0, y + 1.2); c.lineTo(Wp, y + 1.2); c.stroke();
  }
  for (const t of G.deco.tapes) {
    if (!visible(t, v, 10)) continue;
    c.fillStyle = 'rgba(200,196,182,0.5)'; c.fillRect(t.x, t.y, t.w, t.h);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(t.x, t.y, t.w, Math.min(t.h, t.w) * 0.25);
  }
  // marcas de lápiz y marcador
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const k of G.deco.marks) {
    if (k.x < v.x0 - 30 || k.x > v.x1 + 30 || k.y < v.y0 - 30 || k.y > v.y1 + 30) continue;
    c.save(); c.translate(k.x, k.y); c.rotate(k.rot); c.fillStyle = k.color;
    c.font = `${k.size}px 'Permanent Marker', cursive`; c.fillText(k.text, 0, 0); c.restore();
  }
  // salida e inicio pintados en el piso
  c.save(); c.translate(C * 0.5, (m.exitRow + 0.5) * C);
  c.fillStyle = 'rgba(150,20,16,0.85)'; c.font = `13px 'Permanent Marker', cursive`;
  c.fillText('SALIDA', 2, -10); c.font = `22px 'Permanent Marker', cursive`; c.fillText('←', 0, 10); c.restore();
  c.save(); c.translate((m.W + 0.5) * C, (m.entRow + 0.5) * C + 18); c.rotate(-0.08);
  c.fillStyle = 'rgba(30,20,12,0.55)'; c.font = `10px 'Permanent Marker', cursive`; c.fillText('INICIO', 0, 0); c.restore();
  // sombras de contacto al pie de las paredes
  for (const R of G.rects) {
    if (!visible(R, v, 10)) continue;
    c.fillStyle = 'rgba(0,0,0,0.16)'; c.fillRect(R.x - 6, R.y - 6, R.w + 12, R.h + 12);
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(R.x - 3, R.y - 3, R.w + 6, R.h + 6);
  }
  drawFloorItems(c, v);   // trampas, pegamento y quesos (en la oscuridad no se ven: solo con la linterna)
}

function sideQuad(c, ax, ay, bx, by, cx2, cy2, dx, dy) {
  const g = c.createLinearGradient((ax + bx) / 2, (ay + by) / 2, (cx2 + dx) / 2, (cy2 + dy) / 2);
  g.addColorStop(0, '#3a2816'); g.addColorStop(1, '#7c5b37');
  c.fillStyle = g; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(cx2, cy2); c.lineTo(dx, dy); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(25,15,6,0.5)'; c.lineWidth = 0.6; c.stroke();
}

function drawWalls(c, v) {
  const s = 1 + K, vis = [];
  for (const R of G.rects) if (visible(R, v, C * 2)) vis.push(R);
  // caras laterales (las que miran a la cámara)
  for (const R of vis) {
    const tx = cam.x + (R.x - cam.x) * s, ty = cam.y + (R.y - cam.y) * s, tw = R.w * s, th = R.h * s;
    R._t = [tx, ty, tw, th];
    if (R.x > cam.x) sideQuad(c, R.x, R.y, R.x, R.y + R.h, tx, ty + th, tx, ty);
    if (R.x + R.w < cam.x) sideQuad(c, R.x + R.w, R.y, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx + tw, ty);
    if (R.y > cam.y) sideQuad(c, R.x, R.y, R.x + R.w, R.y, tx + tw, ty, tx, ty);
    if (R.y + R.h < cam.y) sideQuad(c, R.x, R.y + R.h, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx, ty + th);
  }
  // cantos superiores: cartón corrugado visto desde arriba
  for (const R of vis) {
    const [tx, ty, tw, th] = R._t, horiz = tw >= th;
    c.fillStyle = '#a9824f'; c.fillRect(tx, ty, tw, th);
    c.strokeStyle = 'rgba(80,52,24,0.9)'; c.lineWidth = 0.9; c.beginPath();
    if (horiz) {
      const y0 = ty + th * 0.22, y1 = ty + th * 0.78; let i = 0;
      for (let x = tx + 1; x <= tx + tw - 1; x += 2.8, i++) i ? c.lineTo(x, i % 2 ? y0 : y1) : c.moveTo(x, y1);
    } else {
      const x0 = tx + tw * 0.22, x1 = tx + tw * 0.78; let i = 0;
      for (let y = ty + 1; y <= ty + th - 1; y += 2.8, i++) i ? c.lineTo(i % 2 ? x0 : x1, y) : c.moveTo(x1, y);
    }
    c.stroke();
    c.strokeStyle = '#cfa877'; c.lineWidth = 1.5; c.beginPath();
    if (horiz) { c.moveTo(tx, ty + 1); c.lineTo(tx + tw, ty + 1); c.moveTo(tx, ty + th - 1); c.lineTo(tx + tw, ty + th - 1); }
    else { c.moveTo(tx + 1, ty); c.lineTo(tx + 1, ty + th); c.moveTo(tx + tw - 1, ty); c.lineTo(tx + tw - 1, ty + th); }
    c.stroke();
    c.strokeStyle = 'rgba(30,18,8,0.85)'; c.lineWidth = 0.8; c.strokeRect(tx, ty, tw, th);
    for (const off of R.tapes) {
      const o = off * s;
      c.fillStyle = 'rgba(205,200,186,0.75)';
      if (horiz) c.fillRect(tx + o - 4.5 * s, ty - 1.5, 9 * s, th + 3); else c.fillRect(tx - 1.5, ty + o - 4.5 * s, tw + 3, 9 * s);
    }
  }
  // rollos de cartón (túneles): van sobre las paredes que atraviesan
  for (const it of G.items) if (it.type === 'tunnel' && it.wx > v.x0 - C * 2 && it.wx < v.x1 + C * 2 && it.wy > v.y0 - C * 2 && it.wy < v.y1 + C * 2) drawTube(c, it);
}

// ---- items ----
function rrect(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }

// Trampera de madera vista desde arriba (placeholder hasta tener la imagen): +x apunta a la abertura del callejón
function drawTrap(c, it) {
  const L = TRAP_L, W = TRAP_W;
  c.save(); c.translate(it.x, it.y); c.rotate(it.a);
  c.fillStyle = 'rgba(0,0,0,0.32)'; rrect(c, -L / 2 + 1.5, -W / 2 + 2.5, L, W, 2); c.fill();   // sombra
  c.fillStyle = '#c99a5b'; rrect(c, -L / 2, -W / 2, L, W, 2); c.fill();                       // base de madera
  c.strokeStyle = 'rgba(120,80,35,0.45)'; c.lineWidth = 0.5;
  for (const k of [-5.5, -2, 1.5, 5]) { c.beginPath(); c.moveTo(-L / 2 + 1, k); c.bezierCurveTo(-6, k + 1, 6, k - 1, L / 2 - 1, k + 0.4); c.stroke(); }
  c.strokeStyle = 'rgba(80,50,20,0.75)'; c.lineWidth = 0.8; rrect(c, -L / 2, -W / 2, L, W, 2); c.stroke();
  // pedal de chapa con el cebo de queso, del lado de la abertura
  c.fillStyle = '#9aa0a6'; c.fillRect(6, -4.5, 9, 9);
  c.fillStyle = '#f2c94c'; c.beginPath(); c.moveTo(7.5, 3); c.lineTo(14, 3); c.lineTo(7.5, -3); c.closePath(); c.fill();
  // resortes y bisagra en el medio
  c.strokeStyle = '#c4c9ce'; c.lineWidth = 1;
  for (const s of [-1, 1]) { c.beginPath(); c.arc(-2, s * 5.5, 2.2, 0, Math.PI * 2); c.stroke(); }
  // arco de alambre: abierto descansa hacia atrás; al cerrarse gira sobre la bisagra y cae hacia adelante
  const endX = -2 - 14 * Math.cos(Math.PI * (it.closed ? it.t : 0));
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 2.2;
  c.beginPath(); c.moveTo(-2, -7); c.lineTo(endX, -7); c.lineTo(endX, 7); c.lineTo(-2, 7); c.stroke();
  c.strokeStyle = '#d9dee2'; c.lineWidth = 1.3;
  c.beginPath(); c.moveTo(-2, -7); c.lineTo(endX, -7); c.lineTo(endX, 7); c.lineTo(-2, 7); c.stroke();
  if (!it.closed) { c.strokeStyle = '#b5babf'; c.lineWidth = 0.7; c.beginPath(); c.moveTo(endX, 0); c.lineTo(7, 0); c.stroke(); }   // traba
  c.restore();
}

// Bandeja de plástico con pegamento amarillento y brillante
function drawSticky(c, it) {
  const { x, y, w, h } = it;
  c.fillStyle = 'rgba(0,0,0,0.25)'; rrect(c, x + 1.5, y + 2.5, w, h, 6); c.fill();
  c.fillStyle = '#e4dfd0'; rrect(c, x, y, w, h, 6); c.fill();                   // borde de plástico
  const g = c.createRadialGradient(x + w * 0.4, y + h * 0.35, 2, x + w / 2, y + h / 2, w * 0.6);
  g.addColorStop(0, '#e8cb63'); g.addColorStop(1, '#a8832c');
  c.fillStyle = g; rrect(c, x + 3.5, y + 3.5, w - 7, h - 7, 4); c.fill();       // pegote
  c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 1.2; c.lineCap = 'round';
  c.beginPath(); c.arc(x + w * 0.32, y + h * 0.3, w * 0.16, Math.PI * 1.1, Math.PI * 1.6); c.stroke();   // brillo
  c.lineWidth = 0.6; c.strokeStyle = 'rgba(255,250,220,0.55)';
  for (const [bx, by, br] of [[0.65, 0.6, 2], [0.4, 0.7, 1.4], [0.72, 0.32, 1.1], [0.25, 0.55, 0.9]]) { c.beginPath(); c.arc(x + w * bx, y + h * by, br, 0, Math.PI * 2); c.stroke(); }
  c.strokeStyle = 'rgba(90,80,60,0.6)'; c.lineWidth = 0.8; rrect(c, x, y, w, h, 6); c.stroke();
}

// Trocito de queso (cuña con agujeritos)
function drawCheese(c, it) {
  c.save(); c.translate(it.x, it.y); c.rotate(it.rot);
  c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(1, 2, 8, 5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#d9a62e'; c.beginPath(); c.moveTo(-7, 4); c.lineTo(8, 4); c.lineTo(8, 6); c.lineTo(-7, 6); c.closePath(); c.fill();
  c.fillStyle = '#f2c94c'; c.beginPath(); c.moveTo(-7, 4); c.lineTo(8, 4); c.lineTo(-7, -6); c.closePath(); c.fill();
  c.strokeStyle = '#8a5b10'; c.lineWidth = 0.6; c.stroke();
  c.fillStyle = '#c98f1d';
  for (const [hx, hy, hr] of [[-3.5, 1, 1.4], [-5, -3, 0.9], [1.5, 2.2, 0.8]]) { c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI * 2); c.fill(); }
  c.restore();
}

// Rollo de cartón (papel de cocina) que atraviesa una pared; se dibuja con las paredes porque es alto
function drawTube(c, it) {
  const s2 = 1 + K * 0.5, P = ([x, y]) => [cam.x + (x - cam.x) * s2, cam.y + (y - cam.y) * s2];
  const [ax, ay] = P(it.a), [bx, by] = P(it.b), r = TUBE_R * s2, len = Math.hypot(bx - ax, by - ay);
  c.save(); c.translate(ax, ay); c.rotate(Math.atan2(by - ay, bx - ax));
  const g = c.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#5a3e22'); g.addColorStop(0.25, '#b88a56'); g.addColorStop(0.5, '#ddb47e'); g.addColorStop(0.75, '#b88a56'); g.addColorStop(1, '#5a3e22');
  c.fillStyle = g; c.fillRect(0, -r, len, r * 2);
  c.save(); c.beginPath(); c.rect(0, -r, len, r * 2); c.clip();               // costura en espiral
  c.strokeStyle = 'rgba(90,60,30,0.55)'; c.lineWidth = 0.9;
  for (let x = -r * 1.2; x < len; x += 9) { c.beginPath(); c.moveTo(x, -r); c.lineTo(x + r * 1.1, r); c.stroke(); }
  c.restore();
  for (const ex of [0, len]) {                                                 // bocas abiertas
    c.fillStyle = '#e2c38f'; c.beginPath(); c.ellipse(ex, 0, 3.4, r, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#140d07'; c.beginPath(); c.ellipse(ex, 0, 2.3, r - 2.2, 0, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function drawFloorItems(c, v) {
  for (const it of G.items) {
    if (it.x < v.x0 - 60 || it.x > v.x1 + 60 || it.y < v.y0 - 60 || it.y > v.y1 + 60) continue;
    if (it.type === 'sticky') drawSticky(c, it);
    else if (it.type === 'trap') drawTrap(c, it);
    else if (it.type === 'cheese' && !it.got) drawCheese(c, it);
  }
}

// Sirena de los últimos 10 segundos: todo se tiñe de rojo y un haz rojo gira desde el techo
// (no lo cortan las paredes), dejando ver por un instante zonas lejos de la linterna
function drawSiren(l, T6) {
  const S = G.siren, w = lightCv.width, h = lightCv.height;
  l.setTransform(1, 0, 0, 1, 0, 0); l.globalAlpha = 1;
  l.globalCompositeOperation = 'multiply';
  l.fillStyle = `rgb(255, ${255 - 170 * S | 0}, ${255 - 185 * S | 0})`; l.fillRect(0, 0, w, h);
  l.globalCompositeOperation = 'lighter';
  l.fillStyle = `rgba(255, 30, 20, ${0.05 * S})`; l.fillRect(0, 0, w, h);      // un rojo apenas en todo
  l.setTransform(...T6);
  const cx = G.maze.W * C / 2, cy = G.maze.H * C / 2, R = Math.hypot(G.maze.W, G.maze.H) * C * 0.75, a = G.time * Math.PI;
  for (const [half, alpha] of [[0.42, 0.12], [0.3, 0.16], [0.18, 0.2]]) {      // tres capas: borde suave
    const g = l.createRadialGradient(cx, cy, 0, cx, cy, R);
    // transparente en el centro: el emisor está en el techo y no se ve, solo el haz que barre
    g.addColorStop(0, 'rgba(255, 50, 35, 0)'); g.addColorStop(0.18, `rgba(255, 50, 35, ${alpha * 1.6 * S})`);
    g.addColorStop(1, `rgba(255, 30, 20, ${alpha * 0.8 * S})`);
    l.fillStyle = g; l.beginPath(); l.moveTo(cx, cy); l.arc(cx, cy, R, a - half, a + half); l.closePath(); l.fill();
  }
  l.setTransform(1, 0, 0, 1, 0, 0); l.globalCompositeOperation = 'source-over';
}

function drawMouse(c, alpha) {
  const step = Math.sin(M.phase * 2.2);
  const bump = M.bumpT / BUMP_T;                       // 1 → 0 durante el golpe
  c.save(); c.globalAlpha = alpha;
  c.save(); c.translate(M.x, M.y); c.rotate(M.a);
  // sombra debajo: centrada y con borde esfumado (gradiente radial aplastado en elipse)
  c.scale(1, 0.6);
  const sg = c.createRadialGradient(-1, 0, 0, -1, 0, 25);
  sg.addColorStop(0, 'rgba(0,0,0,0.5)'); sg.addColorStop(0.55, 'rgba(0,0,0,0.32)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(-1, 0, 25, 0, Math.PI * 2); c.fill();
  c.restore();
  // cola: tramos que se van afinando (posiciones del mundo, calculadas en updateTail)
  if (M.tail) {
    c.strokeStyle = '#b98582'; c.lineCap = 'round';
    for (let i = 1; i <= TAIL_N; i++) {
      c.lineWidth = tailWidth(i / TAIL_N);
      c.beginPath(); c.moveTo(M.tail[i - 1][0], M.tail[i - 1][1]); c.lineTo(M.tail[i][0], M.tail[i][1]); c.stroke();
    }
  }
  c.translate(M.x, M.y); c.rotate(M.a);
  // al chocar, la cabeza se va un poco hacia atrás: todo lo que está delante de los hombros se comprime
  const recoil = 2.6 * bump * bump;
  const hx = x => x > 2 ? x - recoil * (x - 2) / 16 : x;
  // patitas: un poco por debajo del cuerpo; las de adelante delante de las orejas (a los lados de los ojos),
  // las de atrás junto a la cadera
  c.fillStyle = '#9a625e'; c.strokeStyle = '#9a625e'; c.lineCap = 'round'; c.lineWidth = 0.7;
  for (const [fx, fy, ph, rx, ry, rot] of [
    [12, -5.4, 1, 1.7, 2.0, -0.4], [12, 5.4, -1, 1.7, 2.0, 0.4],                 // manos
    [-14.5, -9.2, -1, 3.4, 1.9, -0.35], [-14.5, 9.2, 1, 3.4, 1.9, 0.35]]) {       // patas traseras
    const x = hx(fx + step * ph * (fx > 0 ? 1.4 : 2.2)), side = Math.sign(fy);
    const palm = x - (fx > 0 ? 1.6 : 0);   // la palma de las manos va un poco hacia el lomo; los deditos quedan donde estaban
    c.save(); c.translate(palm, fy); c.rotate(rot);
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    // deditos abiertos hacia adelante y hacia afuera (en diagonal)
    const l = Math.max(rx, ry) + 1.4;
    c.beginPath();
    for (const spread of [-0.45, -0.15, 0.15, 0.45]) {
      const a = side * 0.85 + spread;
      const fx0 = fx > 0 ? palm + 0.4 : x;   // en las manos los deditos salen más cerca de la palma
      c.moveTo(palm, fy); c.lineTo(fx0 + Math.cos(a) * l, fy + Math.sin(a) * l);
    }
    c.stroke();
  }
  // cuerpo en forma de pera redondeada: ancho atrás, hocico corto (cabeza y cuerpo en una sola silueta)
  // la cabeza gira sobre el cuello (x = NECK); entre el cuello y x = NECK + 4 el giro se reparte para que doble suave
  const NECK = 2;
  const P = (x, y) => {
    x = hx(x);
    const a = M.headA * clamp((x - NECK) / 4, 0, 1);
    if (!a) return [x, y];
    const dx = x - NECK;
    return [NECK + dx * Math.cos(a) - y * Math.sin(a), dx * Math.sin(a) + y * Math.cos(a)];
  };
  const bz = (...pts) => { const q = []; for (let i = 0; i < pts.length; i += 2) q.push(...P(pts[i], pts[i + 1])); body.bezierCurveTo(...q); };
  const body = new Path2D();
  body.moveTo(...P(18, 0));
  bz(16.5, -2.2, 13, -4.6, 9, -5.8);       // hocico → cachete
  bz(5, -7, 3, -8.8, -1, -10);             // hombros
  bz(-5, -11.4, -11, -11.6, -15, -10);     // parte más ancha
  bz(-19, -8.2, -20.5, -4.5, -20.5, 0);    // cola / cadera
  bz(-20.5, 4.5, -19, 8.2, -15, 10);
  bz(-11, 11.6, -5, 11.4, -1, 10);
  bz(3, 8.8, 5, 7, 9, 5.8);
  bz(13, 4.6, 16.5, 2.2, 18, 0);
  // volumen: centrado sobre el lomo (igual de ambos lados) y con más contraste hacia los bordes
  // degradé ovalado a lo largo del cuerpo: la cabeza queda del mismo tono y solo se oscurecen los bordes
  c.save(); c.clip(body); c.translate(-2, 0); c.scale(1.6, 1);
  const g = c.createRadialGradient(0, 0, 0.5, 0, 0, 15);
  g.addColorStop(0, '#fdfaf6'); g.addColorStop(0.45, '#e0d8ce'); g.addColorStop(0.8, '#b2a99f'); g.addColorStop(1, '#7d746b');
  c.fillStyle = g; c.fillRect(-20, -20, 40, 40);
  c.restore();
  // arnés (recortado a la silueta del cuerpo)
  c.save(); c.clip(body);
  c.strokeStyle = '#26262b'; c.lineWidth = 2; c.lineCap = 'butt'; c.beginPath();
  c.moveTo(1, -13); c.lineTo(1, 13); c.moveTo(-10, -13); c.lineTo(-10, 13); c.moveTo(-10, 0); c.lineTo(1, 0); c.stroke();
  c.restore();
  // linterna sobre el lomo: cuerpo gris azulado (cilindro, igual de ambos lados) con una barra de batería
  // que muestra el tiempo que queda y se vacía hacia la cola
  const rr = (x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
  const FL = 4;   // medio ancho del cuerpo
  const lg = c.createLinearGradient(0, -FL, 0, FL);
  lg.addColorStop(0, '#111215'); lg.addColorStop(0.24, '#4a5960'); lg.addColorStop(0.5, '#b2c1c8');
  lg.addColorStop(0.76, '#4a5960'); lg.addColorStop(1, '#111215');
  c.fillStyle = lg; rr(-13, -FL, 17, FL * 2, 1.6); c.fill();   // pasa la segunda tira del arnés
  c.fillStyle = '#26282c'; c.fillRect(-12.2, -FL + 0.5, 0.9, FL * 2 - 1);   // tapa trasera
  c.fillStyle = '#121316'; rr(-11.3, -2.1, 10.4, 4.2, 1); c.fill();        // marco de la barra
  const frac = G.state === 'title' ? 1 : clamp(G.timeLeft / Math.max(1, G.timeLimit), 0, 1);
  const blinkOut = G.state === 'play' && G.timeLeft <= 10 && Math.sin(G.time * 14) < -0.3;
  if (frac > 0 && !blinkOut) {
    c.fillStyle = frac > 0.25 ? '#e2ea3a' : frac > 0.1 ? '#f2b53a' : '#f0563a';
    rr(-10.8, -1.6, 9.4 * frac, 3.2, 0.6); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(-10.6, -1.35, Math.max(0, 9.4 * frac - 0.4), 0.55);   // brillo
  }
  for (const bx of [0.5, 2.6]) {   // botones
    c.fillStyle = '#17181b'; rr(bx - 0.8, -1.4, 1.6, 2.8, 0.45); c.fill();
    c.strokeStyle = 'rgba(190,205,210,0.55)'; c.lineWidth = 0.22; c.beginPath(); c.moveTo(bx, -0.6); c.lineTo(bx, 0.6); c.stroke();
  }
  c.fillStyle = '#3a3d42'; c.fillRect(3.4, -FL + 0.3, 0.6, FL * 2 - 0.6);   // anillo antes del cabezal
  const hg = c.createLinearGradient(0, -4.2, 0, 4.2);   // cabezal: mismo volumen de cilindro que el cuerpo
  hg.addColorStop(0, '#232529'); hg.addColorStop(0.5, '#a9adb4'); hg.addColorStop(1, '#232529');
  c.fillStyle = hg; c.fillRect(4, -4.2, 3.4, 8.4);
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(6.6, -4.2, 0.5, 8.4);   // borde del aro, un poco más claro
  c.fillStyle = G.light > 0.2 ? '#fff4d2' : '#6b6450'; c.fillRect(7.4, -3.6, 1.2, 7.2);
  // cara (nariz, orejas, ojos, bigotes): gira entera con la cabeza
  c.save(); c.translate(NECK, 0); c.rotate(M.headA); c.translate(-NECK, 0);
  // nariz chiquita, un poco metida dentro del hocico
  c.fillStyle = '#d98f95'; c.beginPath(); c.arc(hx(16.9), 0, 0.95, 0, Math.PI * 2); c.fill();
  const eyesClosed = M.blinkT > 0 || bump > 0.2;
  for (const sy of [-1, 1]) {
    // oreja ovalada: nace donde nacía la redonda y se estira hacia atrás; el interior rosa corrido hacia el cuerpo
    let ear = bump * Math.sin(G.time * 38 + sy) * 0.6;
    if (M.twitch.t > 0 && M.twitch.side === sy) ear += Math.sin((1 - M.twitch.t / TWITCH_T) * Math.PI * 2) * 0.75;
    c.save();
    // un poco metida hacia el cuerpo, e inclinada hacia afuera con pivote en su base trasera (del lado del cuerpo)
    c.translate(0, -sy * EAR_IN);
    c.translate(hx(2.5), sy * 6.5); c.rotate(sy * EAR_TILT); c.translate(-hx(2.5), -sy * 6.5);
    c.translate(hx(7.5), sy * 4.8); c.rotate(sy * ear); c.translate(-hx(7.5), -sy * 4.8);
    c.fillStyle = '#cfa59f'; c.beginPath(); c.ellipse(hx(7), sy * 7.8, 5.4, 4.0, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#b27f7c'; c.beginPath(); c.ellipse(hx(7.5), sy * 7.0, 3.4, 2.4, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    // ojo: cerca del hocico; rojo (albino) con brillito blanco, o cerrado (rayita de costado, curvada hacia el lomo)
    const ex = hx(11.7);
    if (eyesClosed) {
      c.strokeStyle = '#7a4644'; c.lineWidth = 0.6; c.lineCap = 'round'; c.beginPath();
      c.moveTo(ex, sy * 1.9); c.quadraticCurveTo(ex - 0.9, sy * 2.9, ex, sy * 3.9); c.stroke();
    } else {
      const eg = c.createRadialGradient(ex, sy * 2.9, 0.4, ex, sy * 2.9, 2.8);   // brillo rojo alrededor
      eg.addColorStop(0, 'rgba(255,40,40,0.55)'); eg.addColorStop(1, 'rgba(255,40,40,0)');
      c.fillStyle = eg; c.beginPath(); c.arc(ex, sy * 2.9, 2.8, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ff0a1e'; c.beginPath(); c.arc(ex, sy * 2.9, 1.1, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.arc(ex + 0.4, sy * 2.5, 0.38, 0, Math.PI * 2); c.fill();
    }
    // bigotes: salen junto a la nariz y se abren bien a los costados; tiemblan apenas y mucho al chocar
    const wh = Math.sin(G.time * 9 + sy) * 0.04 + Math.sin(G.time * 55 + sy * 2) * 0.35 * bump;
    const wx = hx(15.8);
    c.strokeStyle = 'rgba(235,230,220,0.6)'; c.lineWidth = 0.35; c.beginPath();
    for (const [k, len] of [[0.75, 10], [1.1, 12], [1.45, 12], [1.8, 10]]) {
      const th = sy * (k + wh); c.moveTo(wx, sy * 1.2); c.lineTo(wx + Math.cos(th) * len, sy * 1.2 + Math.sin(th) * len);
    }
    c.stroke();
  }
  c.restore();   // fin de la cara
  c.restore();
}

function render() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  if (!G.maze) return;
  // temblor suave de cámara (solo al dibujar, no mueve la cámara real)
  const shx = G.shake * G.shake * 3 * Math.sin(G.time * 63), shy = G.shake * G.shake * 3 * Math.cos(G.time * 51);
  cam.x += shx; cam.y += shy;
  const hw = w / (2 * scale), hh = h / (2 * scale);
  const v = { x0: cam.x - hw, y0: cam.y - hh, x1: cam.x + hw, y1: cam.y + hh };
  const T6 = [scale, 0, 0, scale, w / 2 - cam.x * scale, h / 2 - cam.y * scale];
  const lit = G.light > 0.01;

  if (lit) {
    // 1) escena completamente iluminada
    ctx.setTransform(...T6); drawFloor(ctx, v);
    wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, w, h); wctx.setTransform(...T6); drawWalls(wctx, v);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(wallCv, 0, 0);

    // 2) mapa de luz: haz recortado por las sombras de las paredes
    const ox = M.x + Math.cos(M.a) * 4, oy = M.y + Math.sin(M.a) * 4;
    castRays(ox, oy);
    actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, w, h); actx.setTransform(...T6);
    drawCone(actx, ox, oy);
    actx.globalCompositeOperation = 'destination-in'; actx.beginPath();
    for (let i = 0; i < RAYS; i++) { const x = ox + COS[i] * HITS[i], y = oy + SIN[i] * HITS[i]; i ? actx.lineTo(x, y) : actx.moveTo(x, y); }
    actx.closePath(); actx.fill(); actx.globalCompositeOperation = 'source-over';

    // las paredes se iluminan un poco más allá del impacto (su canto y su cara proyectada)
    bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, w, h); bctx.setTransform(...T6);
    drawCone(bctx, ox, oy);
    bctx.globalCompositeOperation = 'destination-in'; bctx.beginPath();
    const ext = T + 6, s = 1 + K;
    for (let i = 0; i < RAYS; i++) { const x = ox + COS[i] * (HITS[i] + ext), y = oy + SIN[i] * (HITS[i] + ext); i ? bctx.lineTo(x, y) : bctx.moveTo(x, y); }
    bctx.closePath();
    for (let i = 0; i < RAYS; i++) {
      const x = cam.x + (ox + COS[i] * (HITS[i] + ext) - cam.x) * s, y = cam.y + (oy + SIN[i] * (HITS[i] + ext) - cam.y) * s;
      i ? bctx.lineTo(x, y) : bctx.moveTo(x, y);
    }
    bctx.closePath(); bctx.fill('nonzero');
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    if (CAN_BLUR) {
      // borde suave también en la luz de las paredes (antes se veía un círculo de borde duro)
      const bw = blurCv.width, bh = blurCv.height;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0); blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.filter = `blur(${(WALL_SOFT * scale / 2).toFixed(1)}px)`;
      blurCtx.drawImage(bCv, 0, 0, bw, bh); blurCtx.filter = 'none';
      bctx.globalCompositeOperation = 'copy'; bctx.drawImage(blurCv, 0, 0, w, h);
      bctx.globalCompositeOperation = 'destination-in';
    }
    bctx.drawImage(wallCv, 0, 0);
    bctx.globalCompositeOperation = 'source-over';

    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
    lctx.fillStyle = '#000'; lctx.fillRect(0, 0, w, h);
    lctx.globalCompositeOperation = 'lighter'; lctx.globalAlpha = G.light;
    if (CAN_BLUR) {
      // sombras esfumadas: la luz del piso se desenfoca (a media resolución, para que sea barato)
      const bw = blurCv.width, bh = blurCv.height;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0); blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.filter = `blur(${(SHADOW_SOFT * scale / 2).toFixed(1)}px)`;
      blurCtx.drawImage(aCv, 0, 0, bw, bh); blurCtx.filter = 'none';
      lctx.drawImage(blurCv, 0, 0, w, h);
    } else lctx.drawImage(aCv, 0, 0);
    lctx.drawImage(bCv, 0, 0);
    lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
    if (G.siren > 0.01) drawSiren(lctx, T6);

    // 3) oscuridad total salvo lo que toca la luz
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(lightCv, 0, 0); ctx.globalCompositeOperation = 'source-over';
  }

  // zona de pantalla alrededor del ratón (para dibujarlo aparte y para las paredes de encima)
  const pad = 55 * scale, mx = w / 2 + (M.x - cam.x) * scale, my = h / 2 + (M.y - cam.y) * scale;
  const sx = Math.max(0, Math.floor(mx - pad)), sy = Math.max(0, Math.floor(my - pad));
  const sw = Math.min(w, Math.ceil(mx + pad)) - sx, sh = Math.min(h, Math.ceil(my + pad)) - sy;

  // 4) el ratón (siempre visible): se dibuja opaco en su propio canvas y se oscurece según la luz,
  //    así no se transparenta (ni el cuerpo ni la linterna dejan ver lo que hay debajo)
  if (sw > 0 && sh > 0) {
    mouseCtx.setTransform(1, 0, 0, 1, 0, 0); mouseCtx.globalCompositeOperation = 'source-over'; mouseCtx.clearRect(sx, sy, sw, sh);
    mouseCtx.setTransform(...T6); drawMouse(mouseCtx, 1);
    mouseCtx.setTransform(1, 0, 0, 1, 0, 0);
    const dark = 1 - (0.4 + 0.6 * G.light) * (1 - exitDarkness());   // al salir, también se pierde en la oscuridad
    if (dark > 0.01) { mouseCtx.globalCompositeOperation = 'source-atop'; mouseCtx.fillStyle = `rgba(0,0,0,${dark})`; mouseCtx.fillRect(sx, sy, sw, sh); }
    mouseCtx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(mouseCv, sx, sy, sw, sh, sx, sy, sw, sh);
  }
  ctx.setTransform(...T6);
  if (lit) {
    const lx = M.x + Math.cos(M.a) * 8.5, ly = M.y + Math.sin(M.a) * 8.5;
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 12);
    g.addColorStop(0, `rgba(255,240,200,${0.9 * G.light})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(lx - 12, ly - 12, 24, 24);
    ctx.globalCompositeOperation = 'source-over';
  }
  // migas de queso al agarrarlo
  for (const p of G.fx) {
    ctx.fillStyle = `rgba(245, 205, 80, ${1 - p.t / p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  // 5) las paredes son más altas que el ratón: se vuelven a dibujar encima, solo en la zona alrededor de él
  if (!lit) { wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, w, h); wctx.setTransform(...T6); drawWalls(wctx, v); }
  if (sw > 0 && sh > 0) {
    litCtx.setTransform(1, 0, 0, 1, 0, 0); litCtx.globalCompositeOperation = 'source-over'; litCtx.clearRect(sx, sy, sw, sh);
    litCtx.drawImage(wallCv, sx, sy, sw, sh, sx, sy, sw, sh);
    if (lit) { litCtx.globalCompositeOperation = 'multiply'; litCtx.drawImage(lightCv, sx, sy, sw, sh, sx, sy, sw, sh); }
    else { litCtx.globalCompositeOperation = 'source-in'; litCtx.fillStyle = '#000'; litCtx.fillRect(sx, sy, sw, sh); }
    litCtx.globalCompositeOperation = 'destination-in'; litCtx.drawImage(wallCv, sx, sy, sw, sh, sx, sy, sw, sh);
    litCtx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(litCv, sx, sy, sw, sh, sx, sy, sw, sh);
  }

  // 6) cortinilla: círculo negro centrado en el ratón que se cierra al salir y se abre al empezar
  if (G.iris < 1) {
    const e = G.iris * G.iris * (3 - 2 * G.iris);   // suavizado
    const maxR = Math.max(Math.hypot(mx, my), Math.hypot(w - mx, my), Math.hypot(mx, h - my), Math.hypot(w - mx, h - my));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.beginPath();
    ctx.rect(0, 0, w, h);
    if (e > 0.001) ctx.arc(mx, my, e * maxR, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
  }
  cam.x -= shx; cam.y -= shy;

  // HUD
  if (G.state !== 'title' && G.state !== 'select') {
    $level.textContent = 'NIVEL ' + G.level;
    $timer.textContent = fmt(G.timeLeft);
    $timer.classList.toggle('warn', G.timeLeft <= 10 && G.state === 'play');
    $cheese.classList.toggle('hidden', !G.cheeseTotal);
    $cheeseN.textContent = `${G.cheese}/${G.cheeseTotal}`;
  }
  const showHint = G.state === 'play' && G.level <= 2;
  $hint.style.display = showHint ? '' : 'none';
  $hintTouch.style.display = showHint && Stick.id === null ? '' : 'none';
}

// ===================== LOOP =====================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
}
resize();
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>

// ---- joystick flotante (celular) ----
// Aparece donde apoyás el dedo; el ratón gira hacia la dirección del stick y avanza según cuánto lo empujás.
const STICK_R = 52, STICK_DEAD = 0.18;   // radio en px CSS y zona muerta (0..1)
const Stick = { id: null, bx: 0, by: 0, x: 0, y: 0, mag: 0 };
const $zone = document.getElementById('stickZone'), $stick = document.getElementById('stick'), $knob = document.getElementById('knob');
function stickMove(cx, cy) {
  let dx = cx - Stick.bx, dy = cy - Stick.by;
  const d = Math.hypot(dx, dy);
  if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
  $knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, d / STICK_R);
  Stick.mag = m < STICK_DEAD ? 0 : (m - STICK_DEAD) / (1 - STICK_DEAD);
  Stick.x = d > 0 ? dx / Math.min(d, STICK_R) : 0; Stick.y = d > 0 ? dy / Math.min(d, STICK_R) : 0;
}
function stickEnd() {
  Stick.id = null; Stick.mag = 0; $stick.classList.remove('on'); $knob.style.transform = '';
}
$zone.addEventListener('pointerdown', e => {
  if (G.state !== 'play' || Stick.id !== null) return;
  e.preventDefault(); Snd.init();
  try { $zone.setPointerCapture(e.pointerId); } catch (_) {}
  Stick.id = e.pointerId; Stick.bx = e.clientX; Stick.by = e.clientY;
  $stick.style.left = e.clientX + 'px'; $stick.style.top = e.clientY + 'px'; $stick.classList.add('on');
  stickMove(e.clientX, e.clientY);
});
$zone.addEventListener('pointermove', e => { if (e.pointerId === Stick.id) { e.preventDefault(); stickMove(e.clientX, e.clientY); } });
for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) $zone.addEventListener(ev, e => { if (e.pointerId === Stick.id) stickEnd(); });
$zone.addEventListener('contextmenu', e => e.preventDefault());

// Primer toque en el celular: pantalla completa (donde el navegador lo permite)
function firstGesture() {
  if (!isTouch) return;
  const de = document.documentElement;
  if (de.requestFullscreen && !document.fullscreenElement) de.requestFullscreen().catch(() => {});
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true; Snd.init();
  if (e.repeat) return;
  if (k === ' ' || k === 'enter') primaryAction();
  else if (G.state === 'title' && (k === '1' || k === '2')) act(k === '1' ? 'story' : 'challenge');
  else if ((G.screen || G.state === 'select') && (k === 'escape' || k === 'backspace')) act('back');
  else if (G.state === 'paused' && k === 'q') act('menu');
  else if (k === 'p' || k === 'escape') togglePause();
  else if (k === 'm') { Music.toggle(); updateButtons(); }
  else if (k === 'f') { Snd.toggle(); updateButtons(); }
  else if (k === 'r' && G.state === 'play') { G.attempts++; resetRun(); startPlay(); }
  else if (k === 'n' && ['play', 'intro', 'paused'].includes(G.state)) {   // debug: saltar nivel
    if (G.mode === 'story') { if (G.story < LEVELS.length - 1) { loadStory(G.story + 1); showIntro(); } }
    else { loadLevel(G.level + 1); showIntro(); }
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
// la música arranca con el primer toque o tecla (los navegadores no dejan reproducir audio antes de un gesto)
for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, () => { if (!Music.started) Music.start(); }, { capture: true });
addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { if (!b.disabled) act(b.dataset.act, b); return; }
  if (e.target.closest('.btn')) return;
  if (isMenu() || G.screen) return;   // en los menús (y en Ratitas / Máquina) se elige con los botones
  primaryAction();
});
function autoPause() { for (const k in keys) keys[k] = false; stickEnd(); if (G.state === 'play') togglePause(); }
addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

// ===================== FÍSICA =====================
// Círculos de colisión de la rata: cuerpo, cabeza y cadera
const ratCircles = () => { const ca = Math.cos(M.a), sa = Math.sin(M.a); return [[0, RAD], [12, 7], [-11, 6]].map(([o, r]) => [M.x + ca * o, M.y + sa * o, r]); };
const circleRect = (cx, cy, r, R) => (cx - clamp(cx, R.x, R.x + R.w)) ** 2 + (cy - clamp(cy, R.y, R.y + R.h)) ** 2 < r * r;

// Puertas: si la rata se mete al hueco desde el lado del agujero, empuja la cortina y el hueco deja de chocar hasta
// que sale del todo. Desde el lado de la cortina el hueco es pared: la cortina es más grande y se apoya en el marco.
function doorCheck() {
  for (const d of G.items) if (d.type === 'door') {
    // embudo: yendo hacia el agujero un poco corrida, se acomoda sola hacia el centro (si no, se traba en el marco)
    const u = (M.x - d.wx) * d.dx + (M.y - d.wy) * d.dy, w = -(M.x - d.wx) * d.dy + (M.y - d.wy) * d.dx;
    const head = Math.cos(M.a) * d.dx + Math.sin(M.a) * d.dy;
    if (u < 0 && u > -T / 2 - 26 && Math.abs(w) < DOOR_HOLE / 2 + 16 && head > 0.6 && M.v > 20) {
      const sh = -Math.sign(w) * Math.min(Math.abs(w), 1.3);
      M.x += -d.dy * sh; M.y += d.dx * sh;
    }
    const over = ratCircles().some(([x, y, r]) => circleRect(x, y, r + 1, d.rect));
    if (!over) { d.passing = false; continue; }
    if (d.passing) continue;
    if ((M.x - d.wx) * d.dx + (M.y - d.wy) * d.dy < 0) { d.passing = true; Snd.flap(); }
    else { if (d.rattle < 0.3 && Math.abs(M.v) > 50) Snd.flapShut(0.8); d.rattle = 1; }   // empujada del otro lado: traquetea pero no abre
  }
}

function collide() {
  let pushed = 0;
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  doorCheck();
  // cuerpo, cabeza y cadera (la cadera evita que al girar pegado a una pared la cola se meta en el cartón)
  for (let it = 0; it < 3; it++) for (const [off, r] of [[0, RAD], [12, 7], [-11, 6]]) {
    let cx = M.x + ca * off, cy = M.y + sa * off;
    for (const R of G.solids) {   // paredes (con los huecos de las puertas) + huecos que están cerrados
      if (R.door && R.door.passing) continue;
      if (cx + r < R.x || cx - r > R.x + R.w || cy + r < R.y || cy - r > R.y + R.h) continue;
      const px = clamp(cx, R.x, R.x + R.w), py = clamp(cy, R.y, R.y + R.h);
      const dx = cx - px, dy = cy - py, d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      let nx, ny, pen;
      if (d2 > 1e-9) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = r - d; }
      else {
        const l = cx - R.x, rr = R.x + R.w - cx, t = cy - R.y, b = R.y + R.h - cy, mn = Math.min(l, rr, t, b);
        if (mn === l) { nx = -1; ny = 0; pen = l + r; } else if (mn === rr) { nx = 1; ny = 0; pen = rr + r; }
        else if (mn === t) { nx = 0; ny = -1; pen = t + r; } else { nx = 0; ny = 1; pen = b + r; }
      }
      M.x += nx * pen; M.y += ny * pen; cx += nx * pen; cy += ny * pen; pushed = Math.max(pushed, pen);
    }
  }
  return pushed;
}

// Pegamento: devuelve cuánto se multiplica la velocidad (frena encima y deja las patas pegajosas un rato)
function stickyFactor(dt) {
  // cuenta el cuerpo (no solo el centro): pegada a la pared también la pisa
  const on = G.items.some(it => it.type === 'sticky' &&
    Math.hypot(M.x - clamp(M.x, it.x, it.x + it.w), M.y - clamp(M.y, it.y, it.y + it.h)) < RAD * 0.7);
  if (on && !M.onTray) Snd.squish();
  if (!on && M.onTray) M.stretchT = STRETCH_T;   // se despega: estirón
  M.onTray = on;
  if (on) {
    // cuantas más patas apoyadas en el pegamento, más se clava: con las 4 adentro casi no avanza
    const trays = G.items.filter(it => it.type === 'sticky');
    const paws = (M.feet || []).filter(f => trays.some(it => f.p[0] > it.x && f.p[0] < it.x + it.w && f.p[1] > it.y && f.p[1] < it.y + it.h)).length;
    M.stickyT = STICKY_T;
    return STICKY_ON - STICKY_PAW * paws;
  }
  if (M.stickyT > 0) {
    M.stickyT = Math.max(0, M.stickyT - dt);
    return STICKY_SLOW + (1 - STICKY_SLOW) * (1 - M.stickyT / STICKY_T);   // recupera la velocidad de a poco
  }
  return 1;
}

// Trampas y quesos
function updateItems() {
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  for (const it of G.items) {
    if (it.type === 'trap' && !it.closed) {
      // cuerpo y cabeza de la rata contra el rectángulo de la trampa (en coordenadas de la trampa)
      const c = Math.cos(it.a), s = Math.sin(it.a);
      for (const [off, r] of [[0, RAD], [12, 7]]) {
        const px = M.x + ca * off - it.x, py = M.y + sa * off - it.y;
        const lx = px * c + py * s, ly = -px * s + py * c;
        const qx = clamp(lx, -TRAP_L / 2, TRAP_L / 2), qy = clamp(ly, -TRAP_W / 2, TRAP_W / 2);
        if ((lx - qx) ** 2 + (ly - qy) ** 2 < r * r) {
          it.closed = true; it.t = 0; Snd.trap(); Snd.squeal(); M.v = 0; M.turnV = 0;
          M.caught = true; M.caughtT = CAUGHT_T;   // atrapado: orejas y cola se agitan un segundo
          startDie('trap');
          return;
        }
      }
    } else if (it.type === 'coin' && !it.got) {
      if (Math.hypot(M.x + ca * 6 - it.x, M.y + sa * 6 - it.y) < 23) {
        it.got = true; G.runCoins++; Wallet.add(1); Snd.coin(); pop($coins);
        for (let k = 0; k < 7; k++) {
          const a = Math.random() * Math.PI * 2, v = 25 + Math.random() * 45;
          G.fx.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.3 + Math.random() * 0.2 });
        }
      }
    } else if (it.type === 'cheese' && !it.got) {
      if (Math.hypot(M.x + ca * 10 - it.x, M.y + sa * 10 - it.y) < 21) {
        it.got = true; G.cheese++; Snd.cheese(); pop($cheese);
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 50;
          G.fx.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.35 + Math.random() * 0.2 });
        }
      }
    }
  }
}

// Al cruzar el umbral de salida todo se va oscureciendo: 0 dentro del laberinto, 1 ya afuera
function exitDarkness() {
  if (!G.maze || Math.abs(M.y - (G.maze.exitRow + 0.5) * C) > C * 0.6) return 0;
  return clamp((C * 0.4 - M.x) / (C * 0.4 + 30), 0, 1);
}

function update(dt) {
  G.time += dt;
  const up = keys['arrowup'] || keys['w'], down = keys['arrowdown'] || keys['s'];
  const left = keys['arrowleft'] || keys['a'], right = keys['arrowright'] || keys['d'];

  if (G.state === 'play') {
    // Dirección deseada en pantalla: joystick (celular) o flechas/WASD (PC, ↑ = arriba, → = derecha…)
    let dx = 0, dy = 0, mag = 0;
    if (Stick.mag > 0) { dx = Stick.x; dy = Stick.y; mag = Stick.mag; }
    else {
      const kx = (right ? 1 : 0) - (left ? 1 : 0), ky = (down ? 1 : 0) - (up ? 1 : 0);
      if (kx || ky) { const l = Math.hypot(kx, ky); dx = kx / l; dy = ky / l; mag = 1; }
    }
    // el ratón gira hacia esa dirección y avanza más cuanto más alineado está
    let turn = 0, target = 0;
    if (mag > 0) {
      const goal = Math.atan2(dy, dx), diff = Math.atan2(Math.sin(goal - M.a), Math.cos(goal - M.a));
      turn = clamp(diff * 3, -1, 1);
      target = SPEED * mag * Math.max(0, Math.cos(diff));
    }
    target *= stickyFactor(dt);   // el pegamento frena
    const ox = M.x, oy = M.y;
    let want = 0;
    M.turnV += (turn * TURN - M.turnV) * Math.min(1, dt * 14);
    M.a += M.turnV * dt;
    M.v += (target - M.v) * Math.min(1, dt * 9);
    want = Math.abs(M.v) * dt;
    M.x += Math.cos(M.a) * M.v * dt; M.y += Math.sin(M.a) * M.v * dt;
    collide();
    updateDoors(dt);
    const moved = Math.hypot(M.x - ox, M.y - oy);
    M.bumpCd -= dt;
    if (want > 1.2 && moved < want * 0.35 && M.bumpCd <= 0 && Math.abs(M.v) > 80) {
      Snd.bump(); if (Math.random() < 0.7) Snd.squeak(); M.bumpCd = 0.45; M.v *= 0.3; M.bumpT = BUMP_T;
      if (G.time - M.lastBump < 1.2) { G.shake = Math.min(1, G.shake + 0.5); G.faltT = FALTER_T; }   // choques seguidos: tiembla la cámara y la linterna falla
      M.lastBump = G.time;
    }
    const sp = moved / Math.max(dt, 1e-4) + Math.abs(M.turnV) * 20;
    M.phase += dt * sp * 0.12;

    G.timeLeft -= dt;
    const s = Math.ceil(G.timeLeft);
    if (G.timeLeft <= 10 && s !== G.lastTick && s > 0) { G.lastTick = s; Snd.tick(s <= 5); }
    G.onT += dt;
    // encendido con parpadeo + leve oscilación del foco
    G.light = G.onT < 0.35 ? (Math.random() < 0.55 ? 1 : 0.15) : 0.96 + 0.04 * Math.sin(G.time * 13) * Math.sin(G.time * 7.3);
    // cada tanto la linterna baja un poquito y vuelve, suave (como una pila que flaquea un instante, sin parpadear)
    if ((G.dimIn -= dt) <= 0) { G.dimT = DIM_T; G.dimIn = 5 + Math.random() * 6; }
    if (G.dimT > 0) { G.dimT -= dt; G.light *= 1 - DIM_DEPTH * Math.sin(Math.PI * (1 - G.dimT / DIM_T)) ** 2; }
    // después de choques seguidos la linterna titubea: un par de bajones rápidos que se apagan solos
    if (G.faltT > 0) { G.faltT -= dt; const f = G.faltT / FALTER_T; G.light *= 1 - 0.45 * f * (0.5 + 0.5 * Math.sin(G.time * 55)); }
    G.light *= 1 - exitDarkness();
    updateItems();
    if (G.state !== 'play') { /* una trampa terminó la partida */ }
    else if (M.x < -6) win();
    else if (G.timeLeft <= 0) startDie('time');
  } else if (G.state === 'dying') {
    G.dieT += dt; M.v *= 0.9;
    G.light = G.dieT < 1.1 ? (Math.random() < 0.5 ? 0.12 : 0.85) * (1 - G.dieT / 1.25) : 0;
    if (G.dieT > 1.5) lost();
  } else if (G.state === 'won') {
    M.v = SPEED; M.a += (Math.PI - ((M.a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) * Math.min(1, dt * 4);
    M.x += Math.cos(M.a) * M.v * dt; M.y += Math.sin(M.a) * M.v * dt; M.phase += dt * SPEED * 0.12;
    G.light = 1 - exitDarkness();
  } else if (isMenu()) {
    menuFlicker(dt);
  } else if (G.state === 'intro' || G.state === 'lost') {
    G.light = 0;
  }
  const input = up || down || left || right || Stick.mag > 0;
  animMouse(dt, G.state === 'play' && (input || Math.abs(M.v) > 5));
  updateTail(dt);
  updateFeet(dt);
  // giro en el lugar (gira rápido sin avanzar): la cabeza gira más y el torso se compacta
  const spinT = clamp(Math.abs(M.turnV) / TURN, 0, 1) * (1 - clamp(Math.abs(M.v) / (SPEED * 0.5), 0, 1));
  M.spin += (spinT - M.spin) * Math.min(1, dt * 8);
  for (const p of G.prints) p.t += dt;
  G.prints = G.prints.filter(p => p.t < PRINT_LIFE);

  Music.tick(dt);
  // trampas cerrándose, migas de queso y sirena de los últimos 10 segundos
  for (const it of G.items) if (it.type === 'trap' && it.closed) it.t = Math.min(1, it.t + dt / 0.15);
  for (const p of G.fx) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.fx = G.fx.filter(p => p.t < p.life);
  const sirenOn = (G.state === 'play' || G.state === 'paused') && G.timeLeft <= 10;
  G.siren += clamp((sirenOn ? 1 : 0) - G.siren, -dt / 0.5, dt / 0.5);
  // "Uuuuh" de la sirena, una vez por vuelta: arranca un poco antes para que el pico coincida con el haz pasando
  // por encima de la rata (el haz gira a G.time·π, una vuelta cada 2 s)
  if (G.state === 'play' && G.siren > 0.3) {
    const ra = Math.atan2(M.y - G.maze.H * C / 2, M.x - G.maze.W * C / 2);
    const until = (((ra - G.time * Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / Math.PI;   // segundos hasta que pase
    if (until <= WAIL_UP && G.wailUntil > WAIL_UP) Snd.wail(G.siren);
    G.wailUntil = until;
  } else G.wailUntil = 99;
  // cortinilla circular y temblor de cámara
  G.iris += clamp(G.irisTarget - G.iris, -dt / IRIS_T, dt / IRIS_T);
  if (G.state === 'won' && !G.winCard && G.iris <= 0) showWinCard();
  G.shake = Math.max(0, G.shake - dt * 2.2);

  const t = camTarget(), f = Math.min(1, dt * 4);
  cam.x += (t.x - cam.x) * f; cam.y += (t.y - cam.y) * f;
  // red de seguridad: el ratón siempre queda dentro de una zona segura de la pantalla
  const z = safeZone(), w = cv.width, h = cv.height;
  cam.x = clamp(cam.x, M.x - (z.x1 - w / 2) / scale, M.x - (z.x0 - w / 2) / scale);
  cam.y = clamp(cam.y, M.y - (z.y1 - h / 2) / scale, M.y - (z.y0 - h / 2) / scale);
  if (isMenu()) {   // menús: cámara quieta en el centro del laberinto de fondo
    if (G.titleSize !== w + 'x' + h) titleBackground();
    cam.x = G.maze.W * C / 2; cam.y = G.maze.H * C / 2;
  }
}

// Zona de pantalla (en píxeles del canvas) donde tiene que quedar el ratón.
// En el celular: debajo del HUD y por encima del tercio de abajo (donde suele estar el dedo del joystick).
function safeZone() {
  const w = cv.width, h = cv.height, dpr = cv.width / (cv.clientWidth || cv.width);
  let y0 = h * 0.15, y1 = h * 0.85;
  if (isTouch) {
    if (!safeZone.at || G.time - safeZone.at > 0.5) {   // medir el HUD cuesta: se renueva cada medio segundo
      safeZone.at = G.time;
      let hud = document.getElementById('topbtns').getBoundingClientRect().bottom;
      if (!$hud.classList.contains('hidden')) hud = Math.max(hud, $timer.getBoundingClientRect().bottom);
      safeZone.hud = hud;
    }
    // arriba: bien por debajo del HUD (el ratón es grande); abajo: margen para el pulgar del joystick
    const top = (safeZone.hud + 80) * dpr, bottom = h * 0.66;
    if (bottom - top > h * 0.25) { y0 = top; y1 = bottom; }   // en pantallas muy bajitas se queda con la zona normal
  }
  return { x0: w * 0.15, x1: w * 0.85, y0, y1 };
}

// ===================== LUZ (rayos contra las paredes) =====================
const COS = new Float32Array(RAYS), SIN = new Float32Array(RAYS), HITS = new Float32Array(RAYS);
for (let i = 0; i < RAYS; i++) { const a = i / RAYS * Math.PI * 2; COS[i] = Math.cos(a); SIN[i] = Math.sin(a); }
function castRays(ox, oy) {
  const vs = [], hs = [];
  // con la cortina de una puerta levantada, la luz pasa por el agujero
  const rects = G.items.some(d => d.type === 'door' && d.ang > 0.3) ? G.holeRects : G.rects;
  for (const R of rects) {
    const px = clamp(ox, R.x, R.x + R.w), py = clamp(oy, R.y, R.y + R.h);
    if ((px - ox) ** 2 + (py - oy) ** 2 > LIGHT_R * LIGHT_R) continue;
    vs.push(R.x, R.y, R.y + R.h, R.x + R.w, R.y, R.y + R.h);
    hs.push(R.y, R.x, R.x + R.w, R.y + R.h, R.x, R.x + R.w);
  }
  for (let i = 0; i < RAYS; i++) {
    const dx = COS[i], dy = SIN[i]; let t = LIGHT_R;
    if (Math.abs(dx) > 1e-6) for (let j = 0; j < vs.length; j += 3) {
      const tt = (vs[j] - ox) / dx; if (tt <= 0 || tt >= t) continue;
      const y = oy + tt * dy; if (y >= vs[j + 1] && y <= vs[j + 2]) t = tt;
    }
    if (Math.abs(dy) > 1e-6) for (let j = 0; j < hs.length; j += 3) {
      const tt = (hs[j] - oy) / dy; if (tt <= 0 || tt >= t) continue;
      const x = ox + tt * dx; if (x >= hs[j + 1] && x <= hs[j + 2]) t = tt;
    }
    HITS[i] = t;
  }
}
// Fondo de la portada: laberinto a oscuras, sin la rata. Cada tanto un foco viejo parpadea en algún lugar de la
// pantalla y deja ver un poco (luz redonda, cortada por las paredes), y se vuelve a apagar.
const MenuFl = { t: 0, dur: 1, in: 1, x: 0, y: 0 };
const MENU_AMBIENT = 0.3;   // luz pareja de fondo en los menús (en el juego no hay: oscuridad total)
function menuFlicker(dt) {
  const F = MenuFl;
  if (F.t > 0) {
    F.t -= dt;
    const k = clamp(F.t / F.dur, 0, 1), step = Math.floor(G.time * 14);
    const on = Math.sin(step * 12.9898) * 43758.5453 % 1;   // prende y apaga al azar (cambia ~14 veces por segundo)
    G.light = (Math.abs(on) > 0.35 ? 1 : 0.12) * 0.55 * Math.min(1, k * 3, (1 - k) * 8);
  } else {
    G.light = 0;
    if ((F.in -= dt) <= 0) {
      const m = G.maze, hw = cv.width / scale / 2, hh = cv.height / scale / 2;
      const c = clamp(Math.floor((cam.x + (Math.random() - 0.5) * hw * 1.7) / C), 0, m.W - 1);
      const r = clamp(Math.floor((cam.y + (Math.random() - 0.5) * hh * 1.7) / C), 0, m.H - 1);
      F.x = (c + 0.5) * C; F.y = (r + 0.5) * C;
      F.dur = F.t = 0.6 + Math.random() * 0.8; F.in = 2 + Math.random() * 3.5;
    }
  }
}
function drawBulb(c, ox, oy) {
  const R = LIGHT_R * 0.7, g = c.createRadialGradient(ox, oy, 0, ox, oy, R);
  g.addColorStop(0, 'rgba(255,236,200,1)'); g.addColorStop(0.35, 'rgba(255,220,170,0.55)'); g.addColorStop(1, 'rgba(255,210,150,0)');
  c.save(); c.fillStyle = g; c.fillRect(ox - R, oy - R, R * 2, R * 2); c.restore();   // restore: si no, el degradé quedaba de fillStyle y el recorte de la luz del juego salía vacío
}

function drawCone(c, ox, oy) {
  c.save(); c.translate(ox, oy); c.rotate(M.a); c.drawImage(coneCv, -LIGHT_R, -LIGHT_R, LIGHT_R * 2, LIGHT_R * 2); c.restore();
}

// ===================== RENDER =====================
function visible(R, v, pad) { return R.x + R.w > v.x0 - pad && R.x < v.x1 + pad && R.y + R.h > v.y0 - pad && R.y < v.y1 + pad; }

// Cinta de peligro amarilla y negra pegada en el piso, en la boca del corral de inicio: se ve de una dónde se arranca
// (aunque no sepas leer). Plástico con un brillo a lo largo y arruguitas. También marca el lado de paso de las puertas.
function drawStartTape(c, x, y0, len, shade = 0) {
  const w = 9;
  c.save(); c.translate(x, y0 + len / 2); c.rotate(0.03);
  c.beginPath(); c.rect(-w / 2, -len / 2, w, len);
  c.save(); c.clip();
  c.fillStyle = '#ebb917'; c.fillRect(-w / 2, -len / 2, w, len);
  c.fillStyle = '#1c1b18';
  for (let s = -len / 2 - w; s < len / 2 + w; s += 8) {
    c.beginPath(); c.moveTo(-w / 2, s); c.lineTo(w / 2, s - w); c.lineTo(w / 2, s - w + 4); c.lineTo(-w / 2, s + 4); c.closePath(); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(-w / 2 + 1, -len / 2, w * 0.28, len);
  c.strokeStyle = 'rgba(255,255,255,0.14)'; c.lineWidth = 0.5;
  for (const k of [-0.32, -0.05, 0.27]) { c.beginPath(); c.moveTo(-w / 2, k * len); c.lineTo(w / 2, k * len + 2.5); c.stroke(); }
  if (shade) { c.fillStyle = `rgba(20,12,4,${shade})`; c.fillRect(-w / 2, -len / 2, w, len); }   // más oscura (cinta vieja, gastada)
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 0.5; c.stroke();
  c.restore();
}

function drawFloor(c, v) {
  const m = G.maze, Wp = m.W * C, Hp = m.H * C;
  c.fillStyle = '#2b2018'; c.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);       // mesa
  c.fillStyle = floorPat;
  c.fillRect(-T / 2, -T / 2, Wp + T, Hp + T);
  c.fillRect(Wp, m.entRow * C, C, C);
  // uniones de las planchas de cartón
  c.lineWidth = 1.1;
  for (const x of G.deco.sx) {
    if (x < v.x0 - 4 || x > v.x1 + 4) continue;
    c.strokeStyle = 'rgba(35,22,10,0.6)'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, Hp); c.stroke();
    c.strokeStyle = 'rgba(200,160,110,0.25)'; c.beginPath(); c.moveTo(x + 1.2, 0); c.lineTo(x + 1.2, Hp); c.stroke();
  }
  for (const y of G.deco.sy) {
    if (y < v.y0 - 4 || y > v.y1 + 4) continue;
    c.strokeStyle = 'rgba(35,22,10,0.6)'; c.beginPath(); c.moveTo(0, y); c.lineTo(Wp, y); c.stroke();
    c.strokeStyle = 'rgba(200,160,110,0.25)'; c.beginPath(); c.moveTo(0, y + 1.2); c.lineTo(Wp, y + 1.2); c.stroke();
  }
  for (const t of G.deco.tapes) {
    if (!visible(t, v, 10)) continue;
    c.fillStyle = 'rgba(200,196,182,0.5)'; c.fillRect(t.x, t.y, t.w, t.h);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(t.x, t.y, t.w, Math.min(t.h, t.w) * 0.25);
  }
  // marcas de lápiz y marcador
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const k of G.deco.marks) {
    if (k.x < v.x0 - 30 || k.x > v.x1 + 30 || k.y < v.y0 - 30 || k.y > v.y1 + 30) continue;
    c.save(); c.translate(k.x, k.y); c.rotate(k.rot); c.fillStyle = k.color;
    c.font = `${k.size}px 'Permanent Marker', cursive`; c.fillText(k.text, 0, 0); c.restore();
  }
  // salida e inicio pintados en el piso
  c.save(); c.translate(C * 0.5, (m.exitRow + 0.5) * C);
  c.fillStyle = 'rgba(150,20,16,0.85)'; c.font = `13px 'Permanent Marker', cursive`;
  c.fillText('SALIDA', 2, -10); c.font = `22px 'Permanent Marker', cursive`; c.fillText('←', 0, 10); c.restore();
  c.save(); c.translate((m.W + 0.5) * C, (m.entRow + 0.5) * C + 18); c.rotate(-0.08);
  c.fillStyle = 'rgba(30,20,12,0.55)'; c.font = `10px 'Permanent Marker', cursive`; c.fillText('INICIO', 0, 0); c.restore();
  drawStartTape(c, Wp, m.entRow * C + T / 2 - 2, C - T + 4);
  // sombras de contacto al pie de las paredes
  for (const R of G.rects) {
    if (!visible(R, v, 10)) continue;
    c.fillStyle = 'rgba(0,0,0,0.16)'; c.fillRect(R.x - 6, R.y - 6, R.w + 12, R.h + 12);
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(R.x - 3, R.y - 3, R.w + 6, R.h + 6);
  }
  drawFloorItems(c, v);   // trampas, pegamento y quesos (en la oscuridad no se ven: solo con la linterna)
}

function sideQuad(c, ax, ay, bx, by, cx2, cy2, dx, dy) {
  const g = c.createLinearGradient((ax + bx) / 2, (ay + by) / 2, (cx2 + dx) / 2, (cy2 + dy) / 2);
  g.addColorStop(0, '#3a2816'); g.addColorStop(1, '#7c5b37');
  c.fillStyle = g; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(cx2, cy2); c.lineTo(dx, dy); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(25,15,6,0.5)'; c.lineWidth = 0.6; c.stroke();
}

function drawWalls(c, v) {
  const s = 1 + K, vis = [];
  for (const R of G.rects) if (visible(R, v, C * 2)) vis.push(R);
  drawDoors(c, v, 'back');   // cortinas vistas desde el lado del agujero: quedan detrás de la pared
  // caras laterales (las que miran a la cámara)
  for (const R of vis) {
    const tx = cam.x + (R.x - cam.x) * s, ty = cam.y + (R.y - cam.y) * s, tw = R.w * s, th = R.h * s;
    R._t = [tx, ty, tw, th];
    if (R.x > cam.x) sideQuad(c, R.x, R.y, R.x, R.y + R.h, tx, ty + th, tx, ty);
    if (R.x + R.w < cam.x) sideQuad(c, R.x + R.w, R.y, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx + tw, ty);
    if (R.y > cam.y) sideQuad(c, R.x, R.y, R.x + R.w, R.y, tx + tw, ty, tx, ty);
    if (R.y + R.h < cam.y) sideQuad(c, R.x, R.y + R.h, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx, ty + th);
  }
  drawDoors(c, v, 'hole');   // agujeros en la cara de la pared que mira a la cámara
  // cantos superiores: cartón corrugado visto desde arriba
  for (const R of vis) {
    const [tx, ty, tw, th] = R._t, horiz = tw >= th;
    c.fillStyle = '#a9824f'; c.fillRect(tx, ty, tw, th);
    c.strokeStyle = 'rgba(80,52,24,0.9)'; c.lineWidth = 0.9; c.beginPath();
    if (horiz) {
      const y0 = ty + th * 0.22, y1 = ty + th * 0.78; let i = 0;
      for (let x = tx + 1; x <= tx + tw - 1; x += 2.8, i++) i ? c.lineTo(x, i % 2 ? y0 : y1) : c.moveTo(x, y1);
    } else {
      const x0 = tx + tw * 0.22, x1 = tx + tw * 0.78; let i = 0;
      for (let y = ty + 1; y <= ty + th - 1; y += 2.8, i++) i ? c.lineTo(i % 2 ? x0 : x1, y) : c.moveTo(x1, y);
    }
    c.stroke();
    c.strokeStyle = '#cfa877'; c.lineWidth = 1.5; c.beginPath();
    if (horiz) { c.moveTo(tx, ty + 1); c.lineTo(tx + tw, ty + 1); c.moveTo(tx, ty + th - 1); c.lineTo(tx + tw, ty + th - 1); }
    else { c.moveTo(tx + 1, ty); c.lineTo(tx + 1, ty + th); c.moveTo(tx + tw - 1, ty); c.lineTo(tx + tw - 1, ty + th); }
    c.stroke();
    c.strokeStyle = 'rgba(30,18,8,0.85)'; c.lineWidth = 0.8; c.strokeRect(tx, ty, tw, th);
    for (const off of R.tapes) {
      const o = off * s;
      c.fillStyle = 'rgba(205,200,186,0.75)';
      if (horiz) c.fillRect(tx + o - 4.5 * s, ty - 1.5, 9 * s, th + 3); else c.fillRect(tx - 1.5, ty + o - 4.5 * s, tw + 3, 9 * s);
    }
  }
  // cortinas de las puertas vistas desde su lado (van delante de la cara de la pared)
  drawDoors(c, v, 'front');
}

// ---- items ----
function rrect(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
// números al azar propios de cada item (salen de su posición): detalles distintos en cada uno, pero siempre iguales
function itemRng(it) { return mulberry32((Math.round(it.x * 7) * 73856093) ^ (Math.round(it.y * 7) * 19349663)); }

// Trampera de madera vista desde arriba (según la foto de referencia): +x apunta a la abertura del callejón,
// donde está el queso del cebo; el aro de alambre descansa hacia atrás y el resorte está un poco pasado el medio
function drawTrap(c, it) {
  const L = 34, W = 18, HX = 1.6;   // dibujo base de 34×18 (se escala al tamaño real TRAP_L); HX: bisagra (resorte)
  c.save(); c.translate(it.x, it.y); c.rotate(it.a);
  // sombra pegada y apenas esfumada (como la de la bandeja), corrida siempre hacia abajo-derecha del mundo
  const sox = Math.cos(it.a) + Math.sin(it.a), soy = Math.cos(it.a) - Math.sin(it.a);
  c.fillStyle = 'rgba(0,0,0,0.16)';
  for (const k of [0, 0.7, 1.4]) { rrect(c, -TRAP_L / 2 + sox - k, -TRAP_W / 2 + soy - k, TRAP_L + 2 * k, TRAP_W + 2 * k, 1.5 + k); c.fill(); }
  c.scale(TRAP_L / L, TRAP_W / W);
  // tabla de madera: planos de color sin contorno, vetas apenas más oscuras que la base
  const wg = c.createLinearGradient(0, -W / 2, 0, W / 2);
  wg.addColorStop(0, '#a87442'); wg.addColorStop(0.15, '#b98551'); wg.addColorStop(0.85, '#b47f4b'); wg.addColorStop(1, '#a06c3b');
  c.fillStyle = wg; rrect(c, -L / 2, -W / 2, L, W, 1.5); c.fill();
  c.lineWidth = 0.35;
  for (const [k, a] of [[-7.2, 0.22], [-5.4, 0.15], [-3.1, 0.2], [-0.8, 0.13], [1.6, 0.2], [3.9, 0.15], [6.2, 0.22]]) {
    c.strokeStyle = `rgba(140,90,45,${a})`; c.beginPath(); c.moveTo(-L / 2, k);
    c.bezierCurveTo(-8, k + 0.7, 2, k - 0.6, L / 2, k + 0.3); c.stroke();
  }
  // manchas de uso y un nudo de la madera (distintos en cada trampa, siempre iguales para la misma)
  const r = itemRng(it), spots = [];
  for (let i = 0; i < 6; i++) spots.push([-15 + r() * 30, -7 + r() * 14, 1.6 + r() * 3.2, 0.08 + r() * 0.12, r() < 0.3]);
  c.save(); rrect(c, -L / 2, -W / 2, L, W, 1.5); c.clip();
  for (const [sx, sy, sr, a, light] of spots) {
    const col = light ? '238,205,155' : '95,58,25', g = c.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  }
  const kx = -12 + r() * 10, ky = (r() < 0.5 ? -1 : 1) * (3 + r() * 3);
  c.fillStyle = 'rgba(115,72,35,0.28)'; c.beginPath(); c.ellipse(kx, ky, 0.8, 0.45, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(125,80,40,0.22)'; c.lineWidth = 0.3;
  for (const [ex, ey] of [[1.6, 0.9], [2.6, 1.4]]) { c.beginPath(); c.ellipse(kx, ky, ex, ey, 0, 0, Math.PI * 2); c.stroke(); }
  c.restore();
  // chapa del gatillo (con muescas) y el cubito de queso encima
  const mg = c.createLinearGradient(4.7, -4.4, 9.5, 4);                                       // chapa: brillo metálico
  mg.addColorStop(0, '#7d8287'); mg.addColorStop(0.45, '#c6cbd0'); mg.addColorStop(1, '#868b90');
  c.fillStyle = mg; c.fillRect(4.7, -4.4, 4.8, 8.4);
  c.fillStyle = '#767b80'; c.fillRect(4.7, -1.1, 1.1, 0.8); c.fillRect(4.7, 1.2, 1.1, 0.8);
  const cs = c.createLinearGradient(8.2, -2.6, 13.8, 3);                                       // costado del queso
  cs.addColorStop(0, '#d6961f'); cs.addColorStop(1, '#a86d12');
  c.fillStyle = cs; c.fillRect(8.2, -2.6, 5.6, 5.6);
  const ct = c.createLinearGradient(7.6, -3.3, 13.2, 2.3);                                     // cara de arriba
  ct.addColorStop(0, '#fbe07a'); ct.addColorStop(1, '#eab12f');
  c.fillStyle = ct; c.fillRect(7.6, -3.3, 5.6, 5.6);
  c.fillStyle = '#d9a12a';
  for (const [hx, hy, hr] of [[9.2, -1.6, 0.8], [11.6, 0.4, 1], [9, 1.3, 0.55], [12.1, -2.2, 0.45]]) { c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = '#f2c440';                                                                    // miguitas
  for (const [mx, my] of [[14.6, -4.6], [15.2, 2.8], [6.6, 6.2]]) c.fillRect(mx, my, 0.9, 0.9);
  // resorte en espiral sobre la bisagra
  c.fillStyle = '#6e4f33'; c.fillRect(HX - 1.3, -7.4, 2.6, 14.8);
  c.strokeStyle = '#94704c'; c.lineWidth = 0.45;
  for (let y = -7.1; y <= 7.1; y += 0.85) { c.beginPath(); c.moveTo(HX - 1.3, y); c.lineTo(HX + 1.3, y + 0.35); c.stroke(); }
  // aro de alambre: abierto descansa hacia atrás; al cerrarse gira sobre la bisagra y cae hacia adelante
  const endX = HX - 16 * Math.cos(Math.PI * (it.closed ? it.t : 0));
  const wire = (col, lw) => {
    c.strokeStyle = col; c.lineWidth = lw; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(HX, -7.6); c.lineTo(endX, -7.6); c.lineTo(endX, 7.6); c.lineTo(HX, 7.6); c.stroke();
  };
  wire('#7a7e83', 0.9); wire('rgba(230,234,238,0.45)', 0.3);
  if (!it.closed) {   // traba: del aro al gatillo, con el ojal del extremo
    c.strokeStyle = '#7a7e83'; c.lineWidth = 0.6; c.beginPath(); c.moveTo(endX + 1, 0); c.lineTo(5.2, 0); c.stroke();
    c.lineWidth = 0.5; c.beginPath(); c.arc(endX + 1.2, 0, 1.1, 0, Math.PI * 2); c.stroke();
  }
  c.restore();
}

// Trampa de pegamento (según la foto): bandeja de plástico negro con el pegamento gris azulado y brillante,
// tornillitos en las esquinas y un botón en el medio
function drawSticky(c, it) {
  const { x, y, w, h } = it;
  // sombra pegada y apenas esfumada: tres capas que se agrandan un poquito (igual de corrida en ambos lados)
  c.fillStyle = 'rgba(0,0,0,0.16)';
  for (const k of [0, 0.7, 1.4]) { rrect(c, x + 0.5 - k, y + 0.5 - k, w + 2 * k, h + 2 * k, 3 + k); c.fill(); }
  const fg = c.createLinearGradient(x, y, x + w, y + h);
  fg.addColorStop(0, '#3d4044'); fg.addColorStop(1, '#1d1f22');
  c.fillStyle = fg; rrect(c, x, y, w, h, 3); c.fill();                                        // marco de plástico
  const gx = x + 3, gy = y + 3, gw = w - 6, gh = h - 6;                                       // pegamento
  const g = c.createLinearGradient(gx, gy, gx + gw, gy + gh);
  g.addColorStop(0, '#536977'); g.addColorStop(0.45, '#3d4f5a'); g.addColorStop(1, '#28343c');
  c.fillStyle = g; rrect(c, gx, gy, gw, gh, 1.5); c.fill();
  c.save(); rrect(c, gx, gy, gw, gh, 1.5); c.clip();                                          // reflejos del pegamento
  const band = c.createLinearGradient(gx, gy, gx + gw * 0.7, gy + gh * 0.7);                  // franja diagonal, sin corte duro
  band.addColorStop(0, 'rgba(255,255,255,0)'); band.addColorStop(0.3, 'rgba(255,255,255,0)');
  band.addColorStop(0.48, 'rgba(255,255,255,0.08)'); band.addColorStop(0.7, 'rgba(255,255,255,0)'); band.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = band; c.fillRect(gx, gy, gw, gh);
  const hl = c.createRadialGradient(gx + gw - 3, gy + 3, 0, gx + gw - 3, gy + 3, Math.min(gw, gh) * 0.4);
  hl.addColorStop(0, 'rgba(255,255,255,0.35)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.fillRect(gx, gy, gw, gh);
  // brillos suaves y burbujas atrapadas en el pegamento (transparentes)
  const r = itemRng(it);
  for (let i = 0; i < 3; i++) {
    const px = gx + r() * gw, py = gy + r() * gh, pr = 3 + r() * 4, sg = c.createRadialGradient(px, py, 0, px, py, pr);
    sg.addColorStop(0, 'rgba(210,230,240,0.13)'); sg.addColorStop(1, 'rgba(210,230,240,0)');
    c.fillStyle = sg; c.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  }
  for (let i = 0; i < 9; i++) {
    const br = 0.5 + r() * 1.3, px = gx + br + 1 + r() * (gw - 2 * br - 2), py = gy + br + 1 + r() * (gh - 2 * br - 2);
    c.fillStyle = 'rgba(185,210,225,0.12)'; c.beginPath(); c.arc(px, py, br, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(225,238,246,0.3)'; c.lineWidth = 0.25;
    c.beginPath(); c.arc(px, py, br, Math.PI * 0.95, Math.PI * 1.7); c.stroke();             // borde iluminado arriba
    c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.arc(px - br * 0.35, py - br * 0.35, br * 0.22, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  for (const [sx, sy] of [[x + 1.6, y + 1.6], [x + w - 1.6, y + 1.6], [x + 1.6, y + h - 1.6], [x + w - 1.6, y + h - 1.6]]) {   // tornillitos
    c.fillStyle = '#15171a'; c.beginPath(); c.arc(sx, sy, 1.1, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.arc(sx - 0.3, sy - 0.3, 0.4, 0, Math.PI * 2); c.fill();
  }
  const bx = x + w / 2, by = y + h / 2;                                                       // botón del medio
  c.fillStyle = '#2c3135'; c.beginPath(); c.arc(bx, by, 2.1, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#3d4449'; c.beginPath(); c.arc(bx, by, 1.3, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.arc(bx - 0.6, by - 0.6, 0.45, 0, Math.PI * 2); c.fill();
}

// Cuña de queso con volumen: la cara de arriba se proyecta igual que los cantos de las paredes (más bajita),
// así se ven los costados que miran a la cámara. Forma: punta a la izquierda y la cáscara curva del otro lado.
const CHEESE_H = K * 0.7;   // altura aparente del queso (paralaje, como las paredes pero más bajito)
const CHEESE_SHAPE = [[-9.5, 3.8], [5, -7.2], [8, 5.8]];         // punta y las dos esquinas de la cáscara (recta)
const CHEESE_RIND = new Set([1]);                                 // tramo que es cáscara (más anaranjado)
const CHEESE_HOLES = [[-3.5, 1.6, 1.3], [1.8, -2.4, 1.6], [4.6, 2.6, 1.1], [-0.6, 3.6, 0.7], [5.2, -2.8, 0.7]];
function drawCheese(c, it) {
  const ca = Math.cos(it.rot), sa = Math.sin(it.rot), s = 1 + CHEESE_H;
  const W2 = ([x, y]) => [it.x + x * ca - y * sa, it.y + x * sa + y * ca];
  const up = ([x, y]) => [cam.x + (x - cam.x) * s, cam.y + (y - cam.y) * s];
  const base = CHEESE_SHAPE.map(W2), top = base.map(up), n = base.length;
  const cx = base.reduce((a, p) => a + p[0], 0) / n, cy = base.reduce((a, p) => a + p[1], 0) / n;
  // sombra con la forma de la cuña, pegada y apenas esfumada (tres capas que se agrandan un poquito)
  c.fillStyle = 'rgba(0,0,0,0.16)';
  for (const k of [0, 0.7, 1.4]) {
    const f = 1 + k / 7;
    c.beginPath(); base.forEach(([x, y], i) => { const px = cx + (x - cx) * f + 1, py = cy + (y - cy) * f + 1; i ? c.lineTo(px, py) : c.moveTo(px, py); });
    c.closePath(); c.fill();
  }
  // costados que miran a la cámara
  for (let i = 0; i < n; i++) {
    const a = base[i], b = base[(i + 1) % n], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    let nx = b[1] - a[1], ny = a[0] - b[0];
    if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }   // normal hacia afuera
    if (nx * (cam.x - mx) + ny * (cam.y - my) <= 0) continue;          // de espaldas a la cámara
    c.fillStyle = CHEESE_RIND.has(i) ? '#cf8a1f' : '#e0a432';
    c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.lineTo(...top[(i + 1) % n]); c.lineTo(...top[i]); c.closePath(); c.fill();
  }
  // cara de arriba con agujeros
  const g = c.createLinearGradient(...top[0], ...top[2]);
  g.addColorStop(0, '#f8d662'); g.addColorStop(1, '#efb53a');
  c.fillStyle = g; c.beginPath(); top.forEach((p, i) => i ? c.lineTo(...p) : c.moveTo(...p)); c.closePath(); c.fill();
  for (const [hx, hy, hr] of CHEESE_HOLES) {
    const [px, py] = up(W2([hx, hy]));
    c.fillStyle = '#c98a1d'; c.beginPath(); c.arc(px, py, hr * s, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e8ad35'; c.beginPath(); c.arc(px + 0.3 * hr, py + 0.3 * hr, hr * s * 0.65, 0, Math.PI * 2); c.fill();
  }
}

// Huellas pegajosas: palma y tres deditos del color del pegamento, que se van desvaneciendo
function drawPrints(c) {
  for (const p of G.prints) {
    const a = 0.35 * (1 - p.t / PRINT_LIFE);
    c.save(); c.translate(p.x, p.y); c.rotate(p.a);
    c.fillStyle = `rgba(55,78,92,${a})`;
    c.beginPath(); c.ellipse(0, 0, 1.7, 1.3, 0, 0, Math.PI * 2); c.fill();
    for (const s of [-0.5, 0, 0.5]) {
      const ta = p.side * 0.6 + s;
      c.beginPath(); c.arc(Math.cos(ta) * 2.6, Math.sin(ta) * 2.6, 0.55, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
}

// Moneda dorada (como las de referencia: borde claro, cara con un $ en relieve). Gira sobre sí misma: se angosta
// y deja ver el canto más oscuro de un lado.
const COIN_R = 6.5;
function drawCoin(c, it) {
  const s = Math.cos(G.time * 3 + it.ph), w = Math.max(0.16, Math.abs(s)), edge = (1 - w) * 1.8 * Math.sign(s || 1);
  c.save(); c.translate(it.x, it.y);
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(1.2, 2.2, COIN_R * Math.max(w, 0.45), COIN_R * 0.75, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#c98a0e'; c.beginPath(); c.ellipse(edge, 0, COIN_R * w, COIN_R, 0, 0, Math.PI * 2); c.fill();      // canto
  c.fillStyle = '#ffd84a'; c.beginPath(); c.ellipse(0, 0, COIN_R * w, COIN_R, 0, 0, Math.PI * 2); c.fill();         // borde
  c.fillStyle = '#f9b80f'; c.beginPath(); c.ellipse(0, 0, COIN_R * 0.74 * w, COIN_R * 0.74, 0, 0, Math.PI * 2); c.fill();   // cara
  c.scale(w, 1); c.fillStyle = '#ffe27a'; c.font = `bold 8px Arial, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('$', 0, 0.5);
  c.restore();
}

function drawFloorItems(c, v) {
  drawPrints(c);
  for (const it of G.items) {
    if (it.x < v.x0 - 60 || it.x > v.x1 + 60 || it.y < v.y0 - 60 || it.y > v.y1 + 60) continue;
    if (it.type === 'sticky') drawSticky(c, it);
    else if (it.type === 'trap') drawTrap(c, it);
    else if (it.type === 'cheese' && !it.got) drawCheese(c, it);
    else if (it.type === 'door') drawDoorShadow(c, it);
    else if (it.type === 'coin' && !it.got) drawCoin(c, it);
  }
}

// Sirena de los últimos 10 segundos: todo se tiñe de rojo y un haz rojo gira desde el techo
// (no lo cortan las paredes), dejando ver por un instante zonas lejos de la linterna
function drawSiren(l, T6) {
  const S = G.siren, w = lightCv.width, h = lightCv.height;
  l.setTransform(1, 0, 0, 1, 0, 0); l.globalAlpha = 1;
  l.globalCompositeOperation = 'multiply';
  l.fillStyle = `rgb(255, ${255 - 170 * S | 0}, ${255 - 185 * S | 0})`; l.fillRect(0, 0, w, h);
  l.globalCompositeOperation = 'lighter';
  l.fillStyle = `rgba(255, 30, 20, ${0.05 * S})`; l.fillRect(0, 0, w, h);      // un rojo apenas en todo
  l.setTransform(...T6);
  const cx = G.maze.W * C / 2, cy = G.maze.H * C / 2, R = Math.hypot(G.maze.W, G.maze.H) * C * 0.75, a = G.time * Math.PI;
  for (const [half, alpha] of [[0.42, 0.12], [0.3, 0.16], [0.18, 0.2]]) {      // tres capas: borde suave
    const g = l.createRadialGradient(cx, cy, 0, cx, cy, R);
    // transparente en el centro: el emisor está en el techo y no se ve, solo el haz que barre
    g.addColorStop(0, 'rgba(255, 50, 35, 0)'); g.addColorStop(0.18, `rgba(255, 50, 35, ${alpha * 1.6 * S})`);
    g.addColorStop(1, `rgba(255, 30, 20, ${alpha * 0.8 * S})`);
    l.fillStyle = g; l.beginPath(); l.moveTo(cx, cy); l.arc(cx, cy, R, a - half, a + half); l.closePath(); l.fill();
  }
  l.setTransform(1, 0, 0, 1, 0, 0); l.globalCompositeOperation = 'source-over';
}

function drawMouse(c, alpha) {
  const bump = M.bumpT / BUMP_T;                       // 1 → 0 durante el golpe
  const S = curSkin();                                 // colores de la ratita elegida
  c.save(); c.globalAlpha = alpha;
  c.save(); c.translate(M.x, M.y); c.rotate(M.a);
  // sombra debajo: centrada y con borde esfumado (gradiente radial aplastado en elipse)
  c.scale(1, 0.6);
  const sg = c.createRadialGradient(-1, 0, 0, -1, 0, 25);
  sg.addColorStop(0, 'rgba(0,0,0,0.5)'); sg.addColorStop(0.55, 'rgba(0,0,0,0.32)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sg; c.beginPath(); c.arc(-1, 0, 25, 0, Math.PI * 2); c.fill();
  c.restore();
  // cola: tramos que se van afinando (posiciones del mundo, calculadas en updateTail)
  if (M.tail) {
    c.strokeStyle = S.tail; c.lineCap = 'round';
    for (let i = 1; i <= TAIL_N; i++) {
      c.lineWidth = tailWidth(i / TAIL_N);
      c.beginPath(); c.moveTo(M.tail[i - 1][0], M.tail[i - 1][1]); c.lineTo(M.tail[i][0], M.tail[i][1]); c.stroke();
    }
  }
  c.translate(M.x, M.y); c.rotate(M.a);
  // al chocar, la cabeza se va un poco hacia atrás: todo lo que está delante de los hombros se comprime
  const recoil = 2.6 * bump * bump;
  const hx = x => x > 2 ? x - recoil * (x - 2) / 16 : x;
  // patitas: apoyadas en el piso (posición del mundo, calculada en updateFeet). Mientras una pata va por el aire
  // se achica (se levanta), se aclara y gira un poco hacia afuera.
  const ca = Math.cos(M.a), sa = Math.sin(M.a), backFeet = [], frontFeet = [];
  // aplastada por la trampa: patas bien abiertas (las de adelante hacia adelante y afuera, las de atrás estiradas
  // hacia atrás y afuera), torso chato y ancho, orejas caídas una para cada lado
  const sq = M.caught ? (M.squash || 0) : 0;
  c.lineCap = 'round'; c.lineWidth = 0.7;
  FEET.forEach(([fx, fy, front], i) => {
    const ft = M.feet && M.feet[i], side = Math.sign(fy);
    let x = fx, y = fy, lift = ft ? ft.lift : 0;
    if (ft) { const dx = ft.p[0] - M.x, dy = ft.p[1] - M.y; x = dx * ca + dy * sa; y = -dx * sa + dy * ca; }
    if (sq) {
      const [px, py] = front ? [12, side * 11] : [-19, side * 13.5];
      x += (px - x) * sq; y += (py - y) * sq; lift *= 1 - sq;
    }
    if (front) { x = hx(x); frontFeet.push([x, y, side, lift]); } else backFeet.push([x, y, side, lift]);
    const [rx, ry, rot] = front ? [1.7, 2.0, side * 0.4] : [3.4, 1.9, side * (0.35 - 0.9 * sq)];
    const sc = 1 - 0.28 * lift, out = side * 0.35 * lift;
    const col = `rgb(${S.foot[0] + 30 * lift | 0}, ${S.foot[1] + 26 * lift | 0}, ${S.foot[2] + 24 * lift | 0})`;
    c.fillStyle = col; c.strokeStyle = col;
    c.save(); c.translate(x, y); c.rotate(rot + out); c.scale(sc, sc);
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
    c.restore();
    // deditos abiertos hacia adelante y hacia afuera (en diagonal); en las manos salen un poco más adelante de la palma
    const l = (Math.max(rx, ry) + 1.4) * sc, x0 = x + (front ? 0.4 : 0) * sc;
    c.beginPath();
    for (const spread of [-0.45, -0.15, 0.15, 0.45]) {
      const a = side * (front ? 0.85 - 0.15 * sq : 0.85 + 1.5 * sq) + spread + out;   // aplastada: los de atrás apuntan para atrás
      c.moveTo(x, y); c.lineTo(x0 + Math.cos(a) * l, y + Math.sin(a) * l);
    }
    c.stroke();
  });
  // muslos traseros: óvalos de pelaje desde la cadera hasta cada pata (siguen a la pata cuando da el paso),
  // tapan el hueco entre la pata y el cuerpo; el cuerpo se dibuja encima y los deditos quedan a la vista
  // y brazos delanteros: más finitos, desde el hombro hasta cada mano (asoman apenas al costado de la cabeza)
  const limb = (ax, ay, x, y, thick, minLen, lift) => {
    const dx = x - ax, dy = y - ay, d = Math.hypot(dx, dy);
    const rx = Math.max(minLen, d * 0.42 + 0.8), ry = thick * (1 - 0.12 * lift);   // termina antes del centro de la pata
    c.save(); c.translate(ax + dx * 0.38, ay + dy * 0.38); c.rotate(Math.atan2(dy, dx));
    const tg = c.createLinearGradient(0, -ry, 0, ry);
    // un poco más oscuros que el cuerpo (claro y oscuro parejo): están más abajo, lejos de la luz
    tg.addColorStop(0, S.limb[0]); tg.addColorStop(0.5, S.limb[1]); tg.addColorStop(1, S.limb[0]);
    c.fillStyle = tg; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  };
  for (const [x, y, side, lift] of backFeet) limb(-12.5, side * 6.5, x, y, 3.6, 3.8, lift);
  for (const [x, y, side, lift] of frontFeet) limb(4.5, side * 4.2, x, y, 2.3, 3, lift);
  // torso: balanceo de lado a lado y un rebote mínimo al ritmo de los pasos;
  // al girar en el lugar se compacta (más corto y un poco más ancho)
  const moving = clamp(Math.abs(M.v) / SPEED, 0, 1);
  const sway = Math.sin(M.phase * 1.1) * 0.7 * moving, bob = 1 + 0.02 * Math.abs(Math.sin(M.phase * 2.2)) * moving;
  c.save(); c.translate(0, sway); c.rotate(sway * 0.03);
  const st = stretchAmount();   // estirón al despegarse del pegamento: más largo y más finito
  const tsx = (1 - 0.13 * M.spin) * bob * (1 + 0.2 * st) * (1 - 0.04 * sq), tsy = (1 + 0.09 * M.spin) * bob * (1 - 0.13 * st) * (1 + 0.13 * sq);
  c.translate(-2, 0); c.scale(tsx, tsy); c.translate(2, 0);
  // cuerpo en forma de pera redondeada: ancho atrás, hocico corto (cabeza y cuerpo en una sola silueta)
  // la cabeza gira sobre el cuello (x = NECK); entre el cuello y x = NECK + 4 el giro se reparte para que doble suave
  const NECK = 2;
  const P = (x, y) => {
    x = hx(x);
    const a = M.headA * clamp((x - NECK) / 4, 0, 1);
    if (!a) return [x, y];
    const dx = x - NECK;
    return [NECK + dx * Math.cos(a) - y * Math.sin(a), dx * Math.sin(a) + y * Math.cos(a)];
  };
  const bz = (...pts) => { const q = []; for (let i = 0; i < pts.length; i += 2) q.push(...P(pts[i], pts[i + 1])); body.bezierCurveTo(...q); };
  const body = new Path2D();
  body.moveTo(...P(18, 0));
  bz(16.5, -2.2, 13, -4.6, 9, -5.8);       // hocico → cachete
  bz(5, -7, 3, -8.8, -1, -10);             // hombros
  bz(-5, -11.4, -11, -11.6, -15, -10);     // parte más ancha
  bz(-19, -8.2, -20.5, -4.5, -20.5, 0);    // cola / cadera
  bz(-20.5, 4.5, -19, 8.2, -15, 10);
  bz(-11, 11.6, -5, 11.4, -1, 10);
  bz(3, 8.8, 5, 7, 9, 5.8);
  bz(13, 4.6, 16.5, 2.2, 18, 0);
  // volumen: centrado sobre el lomo (igual de ambos lados) y con más contraste hacia los bordes
  // degradé ovalado a lo largo del cuerpo: la cabeza queda del mismo tono y solo se oscurecen los bordes
  c.save(); c.clip(body); c.translate(-2, 0); c.scale(1.6, 1);
  const g = c.createRadialGradient(0, 0, 0.5, 0, 0, 15);
  g.addColorStop(0, S.body[0]); g.addColorStop(0.45, S.body[1]); g.addColorStop(0.8, S.body[2]); g.addColorStop(1, S.body[3]);
  c.fillStyle = g; c.fillRect(-20, -20, 40, 40);
  c.restore();
  if (S.spots) {   // manchas (Pandita): en el lomo y la cadera, recortadas a la silueta
    c.save(); c.clip(body); c.fillStyle = S.spots;
    for (const [x, y, rx, ry, r] of [[-13, -6.5, 5.5, 4.2, 0.3], [-5, 7, 4.6, 3.4, -0.4], [-18, 5, 3.4, 3, 0], [4, -6.5, 3, 2.4, 0.5]]) {
      c.beginPath(); c.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }
  // arnés (recortado a la silueta del cuerpo)
  c.save(); c.clip(body);
  c.strokeStyle = S.harness; c.lineWidth = 2; c.lineCap = 'butt'; c.beginPath();
  c.moveTo(1, -13); c.lineTo(1, 13); c.moveTo(-10, -13); c.lineTo(-10, 13); c.moveTo(-10, 0); c.lineTo(1, 0); c.stroke();
  c.restore();
  // orejas: giran con la cabeza y van debajo de la linterna
  c.save(); c.translate(NECK, 0); c.rotate(M.headA); c.translate(-NECK, 0);
  for (const sy of [-1, 1]) {
    // oreja ovalada: nace donde nacía la redonda y se estira hacia atrás; el interior rosa corrido hacia el cuerpo
    let ear = bump * Math.sin(G.time * 38 + sy) * 0.6;
    if (M.twitch.t > 0 && M.twitch.side === sy) ear += Math.sin((1 - M.twitch.t / TWITCH_T) * Math.PI * 2) * 0.75;
    if (M.caught) ear += Math.sin(G.time * 46 + sy * 1.3) * 0.55 * caughtAmp() + 0.75 * sq;   // atrapado: se agitan (1 s) y quedan caídas
    c.save();
    // un poco metida hacia el cuerpo, e inclinada hacia afuera con pivote en su base trasera (del lado del cuerpo)
    c.translate(0, -sy * EAR_IN);
    c.translate(hx(2.5), sy * 6.5); c.rotate(sy * EAR_TILT); c.translate(-hx(2.5), -sy * 6.5);
    c.translate(hx(7.5), sy * 4.8); c.rotate(sy * ear); c.translate(-hx(7.5), -sy * 4.8);
    c.fillStyle = S.ear; c.beginPath(); c.ellipse(hx(7), sy * 7.8, 5.4, 4.0, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = S.earIn; c.beginPath(); c.ellipse(hx(7.5), sy * 7.0, 3.4, 2.4, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }
  c.restore();
  // linterna sobre el lomo: cuerpo gris azulado (cilindro, igual de ambos lados) con una barra de batería
  // que muestra el tiempo que queda y se vacía hacia la cola. Es rígida: no se estira ni se aplasta con el torso
  // (se deshace la escala alrededor de su centro; acompaña al lomo en posición pero mantiene su forma)
  const FCX = -2.2;
  c.save(); c.translate(FCX, 0); c.scale(1 / tsx, 1 / tsy); c.translate(-FCX, 0);
  const rr = (x, y, w, h, r) => { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); };
  const FL = 4;   // medio ancho del cuerpo
  const lg = c.createLinearGradient(0, -FL, 0, FL);
  lg.addColorStop(0, S.light[0]); lg.addColorStop(0.24, S.light[1]); lg.addColorStop(0.5, S.light[2]);
  lg.addColorStop(0.76, S.light[1]); lg.addColorStop(1, S.light[0]);
  c.fillStyle = lg; rr(-13, -FL, 17, FL * 2, 1.6); c.fill();   // pasa la segunda tira del arnés
  c.fillStyle = '#26282c'; c.fillRect(-12.2, -FL + 0.5, 0.9, FL * 2 - 1);   // tapa trasera
  c.fillStyle = '#121316'; rr(-11.3, -2.1, 10.4, 4.2, 1); c.fill();        // marco de la barra
  const frac = isMenu() ? 1 : clamp(G.timeLeft / Math.max(1, G.timeLimit), 0, 1);
  const blinkOut = G.state === 'play' && G.timeLeft <= 10 && Math.sin(G.time * 14) < -0.3;
  if (frac > 0 && !blinkOut) {
    c.fillStyle = frac > 0.25 ? '#e2ea3a' : frac > 0.1 ? '#f2b53a' : '#f0563a';
    rr(-10.8, -1.6, 9.4 * frac, 3.2, 0.6); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(-10.6, -1.35, Math.max(0, 9.4 * frac - 0.4), 0.55);   // brillo
  }
  for (const bx of [0.5, 2.6]) {   // botones
    c.fillStyle = '#17181b'; rr(bx - 0.8, -1.4, 1.6, 2.8, 0.45); c.fill();
    c.strokeStyle = 'rgba(190,205,210,0.55)'; c.lineWidth = 0.22; c.beginPath(); c.moveTo(bx, -0.6); c.lineTo(bx, 0.6); c.stroke();
  }
  c.fillStyle = '#3a3d42'; c.fillRect(3.4, -FL + 0.3, 0.6, FL * 2 - 0.6);   // anillo antes del cabezal
  const hg = c.createLinearGradient(0, -4.2, 0, 4.2);   // cabezal: mismo volumen de cilindro que el cuerpo
  hg.addColorStop(0, '#232529'); hg.addColorStop(0.5, '#a9adb4'); hg.addColorStop(1, '#232529');
  c.fillStyle = hg; c.fillRect(4, -4.2, 3.4, 8.4);
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(6.6, -4.2, 0.5, 8.4);   // borde del aro, un poco más claro
  c.fillStyle = G.light > 0.2 ? '#fff4d2' : '#6b6450'; c.fillRect(7.4, -3.6, 1.2, 7.2);
  c.restore();   // fin de la linterna (rígida)
  // cara (nariz, orejas, ojos, bigotes): gira entera con la cabeza
  c.save(); c.translate(NECK, 0); c.rotate(M.headA); c.translate(-NECK, 0);
  // nariz chiquita, un poco metida dentro del hocico
  c.fillStyle = S.nose; c.beginPath(); c.arc(hx(16.9), 0, 0.95, 0, Math.PI * 2); c.fill();
  const eyesClosed = M.blinkT > 0 || bump > 0.2 || (M.caught && !(M.caughtT > 0));   // atrapada: cuando deja de sacudirse, queda con los ojos cerrados
  for (const sy of [-1, 1]) {
    // oreja ovalada: nace donde nacía la redonda y se estira hacia atrás; el interior rosa corrido hacia el cuerpo
    // (las orejas se dibujan antes, debajo de la linterna)
    // ojo: cerca del hocico; rojo (albino) con brillito blanco, o cerrado (rayita de costado, curvada hacia el lomo)
    const ex = hx(11.7);
    if (S.spots) { c.fillStyle = S.spots; c.beginPath(); c.ellipse(ex - 0.4, sy * 3, 2.6, 2, sy * 0.4, 0, Math.PI * 2); c.fill(); }   // antifaz de panda
    if (eyesClosed) {
      c.strokeStyle = S.eyeShut; c.lineWidth = 0.6; c.lineCap = 'round'; c.beginPath();
      c.moveTo(ex, sy * 1.9); c.quadraticCurveTo(ex - 0.9, sy * 2.9, ex, sy * 3.9); c.stroke();
    } else {
      const eg = c.createRadialGradient(ex, sy * 2.9, 0.4, ex, sy * 2.9, 2.8);   // brillo rojo alrededor
      eg.addColorStop(0, `rgba(${S.eyeRgb},0.55)`); eg.addColorStop(1, `rgba(${S.eyeRgb},0)`);
      c.fillStyle = eg; c.beginPath(); c.arc(ex, sy * 2.9, 2.8, 0, Math.PI * 2); c.fill();
      c.fillStyle = S.eyes; c.beginPath(); c.arc(ex, sy * 2.9, 1.1, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.arc(ex + 0.4, sy * 2.5, 0.38, 0, Math.PI * 2); c.fill();
    }
    // bigotes: salen junto a la nariz y se abren bien a los costados; tiemblan apenas y mucho al chocar
    const wt = M.caught ? 0 : G.time;   // atrapada: los bigotes quedan quietos
    const wh = Math.sin(wt * 9 + sy) * 0.04 + Math.sin(wt * 55 + sy * 2) * 0.35 * bump;
    const wx = hx(15.8);
    c.strokeStyle = 'rgba(235,230,220,0.6)'; c.lineWidth = 0.35; c.beginPath();
    for (const [k, len] of [[0.75, 10], [1.1, 12], [1.45, 12], [1.8, 10]]) {
      const th = sy * (k + wh); c.moveTo(wx, sy * 1.2); c.lineTo(wx + Math.cos(th) * len, sy * 1.2 + Math.sin(th) * len);
    }
    c.stroke();
  }
  c.restore();   // fin de la cara
  c.restore();   // fin del torso
  c.restore();
}

function render() {
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  if (!G.maze) return;
  // temblor suave de cámara (solo al dibujar, no mueve la cámara real)
  const shx = G.shake * G.shake * 3 * Math.sin(G.time * 63), shy = G.shake * G.shake * 3 * Math.cos(G.time * 51);
  cam.x += shx; cam.y += shy;
  const hw = w / (2 * scale), hh = h / (2 * scale);
  const v = { x0: cam.x - hw, y0: cam.y - hh, x1: cam.x + hw, y1: cam.y + hh };
  const T6 = [scale, 0, 0, scale, w / 2 - cam.x * scale, h / 2 - cam.y * scale];
  const menu = isMenu();   // en los menús no hay rata
  const lit = G.light > 0.01 || menu || debugLight;   // en los menús siempre hay una luz ambiente tenue (el fondo se ve un poco)

  if (lit) {
    // 1) escena completamente iluminada
    ctx.setTransform(...T6); drawFloor(ctx, v);
    wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, w, h); wctx.setTransform(...T6); drawWalls(wctx, v);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(wallCv, 0, 0);

    // 2) mapa de luz: haz recortado por las sombras de las paredes
    const ox = menu ? MenuFl.x : M.x + Math.cos(M.a) * 4, oy = menu ? MenuFl.y : M.y + Math.sin(M.a) * 4;
    const light = menu ? drawBulb : drawCone;
    castRays(ox, oy);
    actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, w, h); actx.setTransform(...T6);
    light(actx, ox, oy);
    actx.globalCompositeOperation = 'destination-in'; actx.fillStyle = '#000'; actx.beginPath();
    for (let i = 0; i < RAYS; i++) { const x = ox + COS[i] * HITS[i], y = oy + SIN[i] * HITS[i]; i ? actx.lineTo(x, y) : actx.moveTo(x, y); }
    actx.closePath(); actx.fill(); actx.globalCompositeOperation = 'source-over';

    // las paredes se iluminan un poco más allá del impacto (su canto y su cara proyectada)
    bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, w, h); bctx.setTransform(...T6);
    light(bctx, ox, oy);
    bctx.globalCompositeOperation = 'destination-in'; bctx.fillStyle = '#000'; bctx.beginPath();
    const ext = T + 6, s = 1 + K;
    for (let i = 0; i < RAYS; i++) { const x = ox + COS[i] * (HITS[i] + ext), y = oy + SIN[i] * (HITS[i] + ext); i ? bctx.lineTo(x, y) : bctx.moveTo(x, y); }
    bctx.closePath();
    for (let i = 0; i < RAYS; i++) {
      const x = cam.x + (ox + COS[i] * (HITS[i] + ext) - cam.x) * s, y = cam.y + (oy + SIN[i] * (HITS[i] + ext) - cam.y) * s;
      i ? bctx.lineTo(x, y) : bctx.moveTo(x, y);
    }
    bctx.closePath(); bctx.fill('nonzero');
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    if (CAN_BLUR) {
      // borde suave también en la luz de las paredes (antes se veía un círculo de borde duro)
      const bw = blurCv.width, bh = blurCv.height;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0); blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.filter = `blur(${(WALL_SOFT * scale / 2).toFixed(1)}px)`;
      blurCtx.drawImage(bCv, 0, 0, bw, bh); blurCtx.filter = 'none';
      bctx.globalCompositeOperation = 'copy'; bctx.drawImage(blurCv, 0, 0, w, h);
      bctx.globalCompositeOperation = 'destination-in';
    }
    bctx.drawImage(wallCv, 0, 0);
    bctx.globalCompositeOperation = 'source-over';

    lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
    lctx.fillStyle = '#000'; lctx.fillRect(0, 0, w, h);
    lctx.globalCompositeOperation = 'lighter'; lctx.globalAlpha = G.light;
    if (CAN_BLUR) {
      // sombras esfumadas: la luz del piso se desenfoca (a media resolución, para que sea barato)
      const bw = blurCv.width, bh = blurCv.height;
      blurCtx.setTransform(1, 0, 0, 1, 0, 0); blurCtx.clearRect(0, 0, bw, bh);
      blurCtx.filter = `blur(${(SHADOW_SOFT * scale / 2).toFixed(1)}px)`;
      blurCtx.drawImage(aCv, 0, 0, bw, bh); blurCtx.filter = 'none';
      lctx.drawImage(blurCv, 0, 0, w, h);
    } else lctx.drawImage(aCv, 0, 0);   // sin filter (iPhone): sombras de borde duro (el desenfoque alternativo vibraba)
    lctx.drawImage(bCv, 0, 0);
    lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over';
    const amb = menu ? MENU_AMBIENT : debugLight ? DEBUG_AMBIENT : 0;   // menús: fondo tenue · luz de prueba: todo el laberinto a la vista
    if (amb) { lctx.globalCompositeOperation = 'lighter'; lctx.fillStyle = 'rgba(255,240,215,' + amb + ')'; lctx.fillRect(0, 0, w, h); lctx.globalCompositeOperation = 'source-over'; }
    if (G.siren > 0.01) drawSiren(lctx, T6);

    // 3) oscuridad total salvo lo que toca la luz
    ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(lightCv, 0, 0); ctx.globalCompositeOperation = 'source-over';
  }

  // zona de pantalla alrededor del ratón (para dibujarlo aparte y para las paredes de encima)
  const pad = 55 * scale, mx = w / 2 + (M.x - cam.x) * scale, my = h / 2 + (M.y - cam.y) * scale;
  const sx = Math.max(0, Math.floor(mx - pad)), sy = Math.max(0, Math.floor(my - pad));
  const sw = Math.min(w, Math.ceil(mx + pad)) - sx, sh = Math.min(h, Math.ceil(my + pad)) - sy;

  // 4) el ratón (siempre visible): se dibuja opaco en su propio canvas y se oscurece según la luz,
  //    así no se transparenta (ni el cuerpo ni la linterna dejan ver lo que hay debajo)
  if (sw > 0 && sh > 0 && !menu) {
    mouseCtx.setTransform(1, 0, 0, 1, 0, 0); mouseCtx.globalCompositeOperation = 'source-over'; mouseCtx.clearRect(sx, sy, sw, sh);
    mouseCtx.setTransform(...T6); drawMouse(mouseCtx, 1);
    mouseCtx.setTransform(1, 0, 0, 1, 0, 0);
    const dark = 1 - (0.4 + 0.6 * G.light) * (1 - exitDarkness());   // al salir, también se pierde en la oscuridad
    if (dark > 0.01) { mouseCtx.globalCompositeOperation = 'source-atop'; mouseCtx.fillStyle = `rgba(0,0,0,${dark})`; mouseCtx.fillRect(sx, sy, sw, sh); }
    mouseCtx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(mouseCv, sx, sy, sw, sh, sx, sy, sw, sh);
  }
  ctx.setTransform(...T6);
  if (lit && !menu) {
    const lx = M.x + Math.cos(M.a) * 8.5, ly = M.y + Math.sin(M.a) * 8.5;
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, 12);
    g.addColorStop(0, `rgba(255,240,200,${0.9 * G.light})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(lx - 12, ly - 12, 24, 24);
    ctx.globalCompositeOperation = 'source-over';
  }
  // migas de queso al agarrarlo
  for (const p of G.fx) {
    ctx.fillStyle = `rgba(245, 205, 80, ${1 - p.t / p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2); ctx.fill();
  }

  // 5) las paredes son más altas que el ratón: se vuelven a dibujar encima, solo en la zona alrededor de él
  if (!lit) { wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.clearRect(0, 0, w, h); wctx.setTransform(...T6); drawWalls(wctx, v); }
  if (sw > 0 && sh > 0 && !menu) {
    litCtx.setTransform(1, 0, 0, 1, 0, 0); litCtx.globalCompositeOperation = 'source-over'; litCtx.clearRect(sx, sy, sw, sh);
    litCtx.drawImage(wallCv, sx, sy, sw, sh, sx, sy, sw, sh);
    if (lit) { litCtx.globalCompositeOperation = 'multiply'; litCtx.drawImage(lightCv, sx, sy, sw, sh, sx, sy, sw, sh); }
    else { litCtx.globalCompositeOperation = 'source-in'; litCtx.fillStyle = '#000'; litCtx.fillRect(sx, sy, sw, sh); }
    litCtx.globalCompositeOperation = 'destination-in'; litCtx.drawImage(wallCv, sx, sy, sw, sh, sx, sy, sw, sh);
    litCtx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(litCv, sx, sy, sw, sh, sx, sy, sw, sh);
  }

  // 6) cortinilla: círculo negro centrado en el ratón que se cierra al salir y se abre al empezar
  if (G.iris < 1) {
    const e = G.iris * G.iris * (3 - 2 * G.iris);   // suavizado
    const maxR = Math.max(Math.hypot(mx, my), Math.hypot(w - mx, my), Math.hypot(mx, h - my), Math.hypot(w - mx, h - my));
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.beginPath();
    ctx.rect(0, 0, w, h);
    if (e > 0.001) ctx.arc(mx, my, e * maxR, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
  }
  cam.x -= shx; cam.y -= shy;

  // HUD
  if (!isMenu()) {
    $level.textContent = 'NIVEL ' + G.level;
    $timer.textContent = fmt(G.timeLeft);
    $timer.classList.toggle('warn', G.timeLeft <= 10 && G.state === 'play');
    $cheese.classList.toggle('hidden', !G.cheeseTotal);
    $cheeseN.textContent = `${G.cheese}/${G.cheeseTotal}`;
  }
  const showHint = G.state === 'play' && G.level <= 2;
  $hint.style.display = showHint ? '' : 'none';
  $hintTouch.style.display = showHint && Stick.id === null ? '' : 'none';
}

// ===================== GALERÍA (index.html?galeria) =====================
// Muestra los items grandes y bien iluminados sobre el cartón, para revisar y corregir los diseños.
const GALLERY = /galeria/i.test(location.search + location.hash);
function renderGallery() {
  const w = cv.width, h = cv.height, cols = w > h ? 3 : 2, rows = Math.ceil(6 / cols), CELL = 64;
  const s = Math.min(w / cols, h / rows) / CELL;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  const ox = (w - cols * CELL * s) / 2, oy = (h - rows * CELL * s) / 2;
  ctx.setTransform(s, 0, 0, s, ox, oy);
  ctx.fillStyle = floorPat; ctx.fillRect(0, 0, cols * CELL, rows * CELL);
  const sc = cam.x, sy = cam.y;
  cam.x = cols * CELL / 2; cam.y = rows * CELL / 2;                 // el queso muestra distintos costados según dónde está
  const at = i => [(i % cols + 0.5) * CELL, (Math.floor(i / cols) + 0.45) * CELL];
  const list = [
    ['Trampera abierta', p => drawTrap(ctx, { x: p[0], y: p[1], a: 0, closed: false, t: 0 })],
    ['Trampera cerrada', p => drawTrap(ctx, { x: p[0], y: p[1], a: 0, closed: true, t: 1 })],
    ['Pegamento', p => drawSticky(ctx, { x: p[0] - TRAY_L / 2, y: p[1] - TRAY_W / 2, w: TRAY_L, h: TRAY_W })],
    ['Queso', p => drawCheese(ctx, { x: p[0], y: p[1], rot: -0.3 })],
    ['Queso (otro ángulo)', p => drawCheese(ctx, { x: p[0], y: p[1], rot: 2.2 })],
    ['Ratón (escala)', p => { const keep = { x: M.x, y: M.y, a: M.a, tail: M.tail, feet: M.feet }; Object.assign(M, { x: p[0] + 6, y: p[1], a: Math.PI, tail: null, feet: null }); updateTail(0); drawMouse(ctx, 1); Object.assign(M, keep); }],
  ];
  list.forEach(([name, draw], i) => {
    const p = at(i); draw(p);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(20,12,4,0.85)'; ctx.font = `${Math.max(12, 5 * s)}px 'Permanent Marker', cursive`; ctx.textAlign = 'center';
    ctx.fillText(name, ox + p[0] * s, oy + (p[1] + CELL * 0.42) * s);
    ctx.restore();
  });
  cam.x = sc; cam.y = sy;
}

// ===================== GALERÍA DE RATITAS (index.html?ratas) =====================
// Las 20 ratitas en sus jaulas, en estantes, todas desbloqueadas y animadas, para revisar los colores.
const RAT_GALLERY = /ratas/i.test(location.search + location.hash);
function renderRatGallery() {
  const w = cv.width, h = cv.height, cols = w > h ? 5 : 4, rows = Math.ceil(RATS.length / cols);
  const cw = w / cols, ch = h / rows;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  RATS.forEach((r, i) => {
    ctx.save(); ctx.translate((i % cols) * cw, Math.floor(i / cols) * ch);
    drawRatCage(ctx, cw, ch, i, true, false, G.time + i * 0.7);
    ctx.restore();
  });
}

// ===================== LOOP =====================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (GALLERY) { G.time += dt; renderGallery(); return; }
  if (RAT_GALLERY) { G.time += dt; renderRatGallery(); return; }
  update(dt); render();
}
resize();
showTitle();
if (GALLERY || RAT_GALLERY) { $coins.style.display = 'none'; clearTimeout(cardTimer); $card.classList.add('hidden'); $hint.style.display = $hintTouch.style.display = 'none'; }
requestAnimationFrame(frame);
</script>
</body>
</html>

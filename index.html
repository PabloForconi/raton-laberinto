<!doctype html>
<html lang="es" style="background:#000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- abierto desde el ícono de la pantalla de inicio: a pantalla completa, también debajo de la barra de estado (el usuario
     lo pidió para su iPhone); la hora y la batería quedan encima del juego -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<!-- al abrir el juego en el celular se veía un flash blanco antes de la primera imagen (el usuario lo vio): es el fondo
     del navegador mientras la página todavía no se pintó (baja la fuente de Google). Avisando que la página es oscura,
     ese fondo ya es negro; después el CSS vuelve a light (:root) para que los controles se vean como siempre -->
<meta name="color-scheme" content="dark">
<title>Maze Mouse</title>
<link rel="preload" as="image" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  :root { color-scheme: light; }
  /* lo que tapan la barra de estado (arriba) y la rayita de inicio (abajo) cuando el juego ocupa toda la pantalla: lo de
     arriba (monedas, engranaje, HUD, títulos) baja eso; abajo los botones quedan donde estaban (ya tenían su margen) */
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  /* En el iPhone, abierto desde el ícono con la barra translúcida (iOS 26.1+), la ventana mide la pantalla menos la barra
     de estado y abajo quedaba una franja negra; además el iPhone recorta ahí lo que es "fixed". Como en Growcore: en la
     app del ícono (html.gapfix, que pone fixGap una vez y no se saca) la página mide siempre el alto de la pantalla
     (--fullh) y las capas de pantalla completa van dentro de la página (absolute) con ese alto, sin depender del alto de
     la ventana (cambiarlo con la ventana hacía un ciclo: el juego saltaba de un tamaño a otro sin parar) */
  html.gapfix, html.gapfix body { overflow: visible; }
  html.gapfix { min-height: var(--fullh); }
  html.gapfix :is(canvas#game, #vignette, #screen, #opts, #splash, #fade, #stickZone) { position: absolute; top: 0; bottom: auto; height: var(--fullh); }
  html.gapfix :is(#credit, #hintTouch) { position: absolute; top: auto; }
  html.gapfix #credit { bottom: calc(max(10px, calc(var(--sab) - 24px)) + 100% - var(--fullh)); }
  html.gapfix #hintTouch { bottom: calc(max(14px, calc(var(--sab) - 20px)) + 100% - var(--fullh)); }
  html.gapfix #card { position: absolute; top: calc((var(--fullh) + var(--sat)) / 2); }
  /* Máquina a pantalla completa: la máquina y su fondo se agrandan alrededor del borde de la mesada y bajan juntos (con
     Activar) para que la imagen llegue hasta abajo (fitMachFS); #screen recorta lo que sobresale a los costados */
  html.gapfix #screen { overflow: clip; }
  html.gapfix #gachaCv { scale: var(--ms, 1); translate: 0 calc(var(--mdy, 0px) - var(--mup, 0px)); transform-origin: 50% 97.9%; }
  html.gapfix #gachaBtns { translate: 0 var(--mdy, 0px); }
  #hud { position: fixed; top: var(--sat); left: 0; right: 0; height: 0; }
  body { font-family: 'Kalam', cursive; font-weight: 700; color: #2a1a0c; user-select: none; }
  canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }
  .tape { position: absolute; background: #d9cfb2; padding: 4px 16px 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,.6); font-family: 'Kalam', cursive;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 2px, transparent 2px 5px); }
  /* nivel chiquito arriba del reloj, centrados */
  #level { top: 8px; left: 50%; font-size: 15px; padding: 2px 12px 0; transform: translateX(-50%) rotate(-2deg); white-space: nowrap; z-index: 1; }
  #timer { top: 36px; left: 50%; font-size: 34px; transform: translateX(-50%) rotate(1.5deg); min-width: 92px; text-align: center; }
  #timer.warn { color: #b3140f; animation: pulse .5s ease-in-out infinite alternate; }

  @keyframes pulse { to { transform: translateX(-50%) scale(1.08); } }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 16px; letter-spacing: .5px; color: #a08060; opacity: .75; pointer-events: none; }
  #hud.hidden, .hidden { display: none !important; }
  #card { position: fixed; left: 50%; top: calc(50% + var(--sat) / 2); transform: translate(-50%, -50%) rotate(-1deg);
    width: min(520px, calc(100vw - 32px)); box-sizing: border-box; padding: 26px 30px 22px; text-align: center;
    background: #a27b4f;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.25), transparent 60%);
    border: 2px solid #6b4c2c; box-shadow: 0 10px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(60,35,10,.5); }
  /* animación de carteles: entra chico y crece con rebote; sale achicándose */
  #card.in { animation: cardIn .22s cubic-bezier(.2, .9, .3, 1.25) both; }
  #card.out { animation: cardOut .1s ease-in both; }
  @keyframes cardIn { from { transform: translate(-50%, -50%) rotate(-5deg) scale(.55); opacity: 0; }
                      to { transform: translate(-50%, -50%) rotate(-1deg) scale(1); opacity: 1; } }
  @keyframes cardOut { to { transform: translate(-50%, -50%) rotate(3deg) scale(.6); opacity: 0; } }
  #level.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  #timer.pop:not(.warn) { animation: timerPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes levelPop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #level.pop { animation: lvlPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes lvlPop { from { transform: translateX(-50%) scale(.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  /* botón casita (volver al menú), arriba a la izquierda; en los resultados de Historia, ahí mismo va la flechita a los niveles */
  #btnBack { position: fixed; top: calc(12px + var(--sat)); left: 14px; z-index: 5; transform: rotate(-2deg); }
  #btnBack { z-index: 9; }   /* por encima de las pantallas negras (Ratitas) */
  @keyframes timerPop { from { transform: translateX(-50%) scale(.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .btn.tape { transition: transform .12s; }
  .btn.tape:active { transform: scale(.85) !important; }
  #card h1 { font-family: 'Kalam', cursive; font-weight: normal; font-size: 40px; margin: 0 0 8px; color: #1e1208; line-height: 1.05; }
  #card h1.red { color: #8e1410; }
  #card p { margin: 8px 0; font-size: 16px; line-height: 1.4; }
  #card .big { font-family: 'Kalam', cursive; font-size: 22px; }

  kbd { display: inline-block; background: #e8dcc0; border: 1px solid #5a3e22; border-bottom-width: 3px; border-radius: 4px;
    padding: 0 6px; font-family: inherit; font-size: 13px; margin: 0 1px; }
  #card { z-index: 6; }   /* por encima del joystick, así los botones de la pausa se pueden tocar */
  #card .logo { display: block; width: min(100%, 400px); margin: -6px auto 6px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  #card .menu { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .cbtn { font-family: 'Kalam', cursive; font-size: 22px; color: #1e1208; background: #e2d6b8; border: 0;
    padding: 8px 22px 6px; cursor: pointer; box-shadow: 0 3px 0 #6b4c2c, 0 4px 10px rgba(0,0,0,.35); transform: rotate(-1.5deg);
    -webkit-tap-highlight-color: transparent; }
  .cbtn:nth-child(even) { transform: rotate(1.5deg); }
  .cbtn.alt { background: #c8b893; font-size: 17px; }
  .cbtn:hover { filter: brightness(1.06); }
  .cbtn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 #6b4c2c; }
  #card .levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 14px 0 4px; max-height: 52vh; overflow-y: auto; padding: 4px 6px 8px;
    scrollbar-width: none; }   /* se sigue pudiendo deslizar, pero sin la barra */
  #card .levels::-webkit-scrollbar { display: none; }
  #card .lvl { background: #e2d6b8; border: 0; padding: 8px 4px 6px; cursor: pointer; box-shadow: 0 3px 0 #6b4c2c;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; color: #1e1208;
    -webkit-tap-highlight-color: transparent; }
  #card .lvl:nth-child(odd) { transform: rotate(-1deg); } #card .lvl:nth-child(even) { transform: rotate(1deg); }
  #card .lvl b { font-family: 'Kalam', cursive; font-size: 26px; line-height: 1; }
  #card .lvl small { font: 15px/1.05 'Kalam', cursive; }   /* (los nombres en Kalam y un poco más grandes, lo pidió el usuario) */
  #card .lvl small.lg { font-size: 13px; }   /* (una palabra larga, como Investigación: un poco más chica para que entre) */
  #card .lvl:disabled { opacity: .45; cursor: default; }
  #card .lvl:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #6b4c2c; }
  #card .st { color: #c98a12; font-size: 21px; line-height: 1.05; letter-spacing: 0; }   /* estrellitas de las fichas de niveles, grandes para leerlas de un vistazo */ #card .st i { color: rgba(60,40,20,.3); font-style: normal; }
  #card .stars { font-size: 46px; color: #e0a21a; text-shadow: 0 2px 0 #6b4c2c; letter-spacing: 6px; line-height: 1.1; }
  #card .stars span { color: rgba(60,40,20,.25); text-shadow: none; }
  #card .small { font-size: 13px; opacity: .8; }
  /* resultados de Historia: en el estilo del juego (cartón, cinta, marcador), no como un formulario */
  #card .lvlname { margin: -4px 0 4px; font-size: 14px; letter-spacing: .5px; opacity: .7; }
  @keyframes starDrop { from { transform: scale(2.3); opacity: 0; } 70% { transform: scale(.94); opacity: 1; } to { transform: scale(1); opacity: 1; } }   /* cae de frente, sin girar */
  /* cartel de fin de nivel, con la composición y los colores del boceto del usuario: cartón claro, el título en un cartel
     de papel que asoma arriba, las estrellas en un recuadro de cartón oscuro encintado, cajas de papel (quesos, tiempo,
     recompensa), el botón amarillo de la máquina y Repetir / Siguiente (verde) */
  #card:has(.win) { width: min(430px, calc(100vw - 24px)); margin-top: 14px; padding: 0 14px 16px; border: 3px solid #5b3a1b; border-radius: 16px;
    background-color: #c4915a; }
  #card .win { margin-top: -30px; color: #2b1a0b; }
  :is(#card, #opts) .wtitle { position: relative; z-index: 2; display: inline-block; margin: 0 auto; padding: 9px 28px 7px; background: #efdfbd;
    font-family: 'Kalam', cursive; line-height: 1; transform: rotate(-2deg);
    background-image: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.4), transparent 70%); box-shadow: 0 3px 0 #a07345, 0 6px 14px rgba(0,0,0,.35); }
  :is(#card, #opts) .wtitle b { display: block; font-weight: normal; font-size: 46px; letter-spacing: 1px; }
  :is(#card, #opts) .wtitle span { display: inline-block; margin-top: 3px; font-size: 25px; border-bottom: 3px solid #2b1a0b; }
  #card .wstars { position: relative; display: flex; justify-content: center; align-items: center; margin: -24px 4px 12px; padding: 34px 2px 12px;
    background: #9a6838 repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 3px, transparent 3px 7px);
    border: 6px solid #ead6ae; box-shadow: 0 3px 0 #8a6236, inset 0 0 18px rgba(40,20,5,.55); }
  :is(#card, #opts) .tp { position: absolute; width: 46px; height: 16px; background: rgba(240,236,225,.55); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  :is(#card, #opts) .tp:nth-of-type(1) { left: -18px; top: 2px; transform: rotate(-42deg); }
  :is(#card, #opts) .tp:nth-of-type(2) { right: -18px; top: 2px; transform: rotate(42deg); }
  :is(#card, #opts) .tp:nth-of-type(3) { left: -18px; bottom: 2px; transform: rotate(42deg); }
  :is(#card, #opts) .tp:nth-of-type(4) { right: -18px; bottom: 2px; transform: rotate(-42deg); }
  #card .wstar { position: relative; width: 34%; max-width: 118px; margin: 0 -4px; flex: none; }   /* las de los costados, del mismo tamaño que antes y un poco hacia afuera */
  #card .wstar svg { display: block; width: 100%; height: auto; }
  #card .wstar .wgold { position: absolute; inset: 0; filter: drop-shadow(0 3px 1.5px rgba(40,20,5,.4)); animation: starDrop .42s cubic-bezier(.2, .9, .3, 1.5) var(--d) both; }
  #card .wstar:nth-of-type(1) { top: 16px; rotate: -12deg; } #card .wstar:nth-of-type(3) { top: 16px; rotate: 12deg; }   /* las de los costados, inclinadas hacia afuera y un poco más abajo */
  #card .wstar:nth-of-type(2) { top: -6px; width: 39%; max-width: 138px; }   /* la del medio, más grande y más arriba */
  #card .wray { position: absolute; width: 34px; height: 34px; top: 18px; }
  #card .wray svg { display: block; width: 100%; height: 100%; }
  #card .wray.l { left: 6px; } #card .wray.r { right: 6px; transform: scaleX(-1); }
  #card .wrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 10px; }
  /* capas: la caja del tiempo (con el sello del récord) va arriba de la recompensa, y la recompensa (con su etiqueta) arriba
     de la de los quesos, así cada una pisa a la vecina por donde se monta */
  #card .wstat.q { z-index: 1; } #card .wreward { z-index: 2; } #card .wstat:not(.q) { z-index: 3; }
  /* sin quesos (Desafío y el nivel 1) la caja del tiempo va a todo el ancho, con el reloj y el tiempo al medio, y queda
     debajo de la recompensa (así la etiqueta "Recompensa" no queda tapada por el tiempo); el sello del récord va entonces
     en la caja de la recompensa, montado en su borde de arriba y corrido a la derecha (el usuario lo prefirió abajo del
     tiempo, como en las otras, y no adentro de la caja) */
  #card .wrow.solo .wstat { z-index: 1; }
  #card .wbox.wreward .stamp { width: 32%; top: auto; bottom: calc(100% - 1px); left: 77%; z-index: 3; }
  #card .wrow.solo { grid-template-columns: 1fr; }
  :is(#card, #opts) .wbox { position: relative; padding: 8px 10px; background: #efdcb6; border-radius: 3px;
    background-image: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.35), transparent 70%); box-shadow: 0 3px 0 #9b7244, 0 4px 8px rgba(0,0,0,.25); }
  :is(#card, #opts) .wbox h3 { margin: 0; font: 17px/1.2 'Kalam', cursive; letter-spacing: .5px; text-transform: uppercase; }
  :is(#card, #opts) .wbox .num { font: 44px/1 'Kalam', cursive; }
  /* quesos y tiempo: dos cajas iguales, el ícono grande a la izquierda y a su lado el título y el número */
  #card .wstat { display: flex; align-items: center; justify-content: center; gap: 8px; height: 84px; padding: 6px 8px; }
  #card .wstat > svg { flex: none; width: 58px; height: 58px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  #card .wstat.q > svg { transform: scale(1.25); margin: 0 6px 0 4px; }   /* el queso del HUD ocupa poco de su cuadro: así queda parejo con el reloj */
  #card .wstat > div { text-align: left; }
  #card .wstat h3 { font-size: 15px; }
  #card .wstat .num { display: block; font-size: 34px; white-space: nowrap; }
  /* el sello del récord va abajo de la caja del tiempo, así no tapa nada */
  :is(#card, #opts) .wbox .stamp { width: 68%; top: auto; bottom: -6px; left: 65%; z-index: 1; transform: translateX(-50%) rotate(4deg); animation-name: stampLow; }   /* (como la referencia del usuario: a la derecha, montado en el borde de abajo, y de un cuarto del ancho del cartel, también en PC, donde el cartel es más ancho) */
  @media (max-width: 560px) { :is(#card, #opts) .wstat .stamp { bottom: -3px; } #card .wbox.wreward .stamp { bottom: calc(100% + 4px); } }   /* en el celular, un poquito más arriba (lo pidió el usuario) */
  @keyframes stampLow { from { transform: translateX(-50%) rotate(20deg) scale(2); opacity: 0; } to { transform: translateX(-50%) rotate(4deg) scale(1); opacity: 1; } }
  /* cartel de inicio con el mismo formato: el título y una caja "Objetivo" con los quesos y el tiempo de las tres
     estrellas, separados por una rayita, y el botón verde para jugar */
  #card .wgoal { margin: 16px 2px 18px; padding: 10px 12px 14px; text-align: left; }
  #card .whead { display: inline-block; margin: 0 0 10px 4px; padding-bottom: 2px; font: 24px/1 'Kalam', cursive; text-transform: uppercase;
    border-bottom: 3px solid #2b1a0b; transform: rotate(-2deg); }
  #card .wgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 12px 4px; background: rgba(255,255,255,.35); border: 1px solid rgba(120,85,45,.25); border-radius: 4px; }
  #card .wgrid.solo { grid-template-columns: 1fr; }
  #card .wg { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #card .wg + .wg { border-left: 2px solid rgba(90,60,30,.3); }
  #card .wg > svg { flex: none; width: 56px; height: 56px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  #card .wg.q > svg { transform: scale(1.25); margin: 0 6px 0 4px; }
  #card .wg .num { display: block; font: 36px/1 'Kalam', cursive; white-space: nowrap; }
  #card .wg small { display: block; margin-top: 3px; font: 13px/1.1 'Kalam', cursive; text-transform: uppercase; }
  @media (max-width: 480px) { #card .wg { gap: 6px; } #card .wg > svg { width: 44px; height: 44px; } #card .wg .num { font-size: 30px; } #card .wg small { font-size: 11.5px; } }
  /* entrada animada de los carteles (animIn): cada parte entra a su turno (--ad); se usan translate / scale / rotate
     sueltos, así no pisan los transform (las inclinaciones) que ya tienen las piezas */
  .anim [data-a]:not([data-on]) { pointer-events: none; }   /* (animIn: hasta que empieza a aparecer) */
  .anim.skip [data-a] { pointer-events: auto; }
  .anim [data-a] { animation-duration: .38s; animation-timing-function: cubic-bezier(.2, .9, .3, 1.3); animation-fill-mode: both; animation-delay: var(--ad, 0s); }
  .anim [data-a="up"] { animation-name: aUp; }
  .anim [data-a="drop"] { animation-name: aDrop; }
  .anim [data-a="pop"] { animation-name: aPop; }
  @keyframes aUp { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0 0; } }
  @keyframes aDrop { from { opacity: 0; translate: 0 -34px; scale: 1.15; } to { opacity: 1; translate: 0 0; scale: 1; } }
  @keyframes aPop { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
  @keyframes aBreath { from { scale: 1; } to { scale: 1.045; } }
  .anim .lvl:disabled[data-a] { animation-name: aPopDim; }   /* los bloqueados terminan apagados */
  @keyframes aPopDim { from { opacity: 0; scale: .4; } to { opacity: .45; scale: 1; } }
  /* el botón principal (Siguiente, Jugar, Reintentar) queda latiendo suave después de aparecer */
  .anim .wbtn.go[data-a] { animation-name: aPop, aBreath; animation-duration: .38s, 1.1s; animation-delay: var(--ad), calc(var(--ad) + .6s);
    animation-iteration-count: 1, infinite; animation-direction: normal, alternate; animation-fill-mode: both, none; animation-timing-function: cubic-bezier(.2, .9, .3, 1.3), ease-in-out; }
  /* el botón de la máquina "respira" para invitar a tocarlo */
  #card .wmach { animation: aBreath 1.3s ease-in-out 2.4s infinite alternate; }
  /* chispitas cuando cae cada estrella */
  #card .wstar .spk { position: absolute; left: 50%; top: 52%; width: 8px; height: 8px; margin: -4px; background: #fff4a8; border-radius: 1px; opacity: 0; pointer-events: none;
    animation: aSpark .55s ease-out calc(var(--d) + .3s) both; }
  @keyframes aSpark { 0% { opacity: 0; transform: rotate(var(--ang)) translateX(12px) rotate(45deg) scale(1); } 12% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--ang)) translateX(54px) rotate(45deg) scale(.3); } }
  /* el sello del récord: golpe y un temblorcito del cartel */
  .win.shake { animation: aShake .32s ease-out; }
  @keyframes aShake { 0%, 100% { translate: 0 0; } 20% { translate: -5px 2px; } 40% { translate: 4px -2px; } 60% { translate: -3px 1px; } 80% { translate: 2px 0; } }
  /* perder: la trampa se sacude al cerrarse; la linterna parpadea y se apaga */
  .anim .wlose > svg { animation: aSnap .5s ease-out .55s both; }
  .anim .wlose.lamp > svg { animation: aFlicker .9s linear .5s both; }
  @keyframes aSnap { 0% { rotate: 0deg; scale: 1; } 15% { rotate: -9deg; scale: 1.12; } 35% { rotate: 7deg; } 55% { rotate: -4deg; } 75% { rotate: 2deg; } 100% { rotate: 0deg; scale: 1; } }
  @keyframes aFlicker { 0%, 12%, 30%, 50% { opacity: 1; } 6%, 22%, 40% { opacity: .35; } 100% { opacity: .75; } }
  /* tocar el cartel mientras se arma: todo aparece de una */
  .anim.skip [data-a], .anim.skip .wgold, .anim.skip .stamp { animation-delay: 0s !important; animation-duration: .01s !important; }
  .anim.skip .wbtn.go[data-a] { animation-delay: 0s, .4s !important; animation-duration: .01s, 1.1s !important; }
  .anim.skip .spk { display: none; }
  /* portada "de cine" (al entrar al juego): primero el laberinto, que se prende, y el logo solo, que aparece con un fundido
     y entra en foco; después el cartón de fondo crece detrás y los controles y los botones salen a tiempo con la música.
     El cartón es un ::before con el mismo aspecto del cartel (el #card queda transparente), así puede aparecer después
     que el logo; CINE_* son los tiempos */
  #card.cine, #card.cine.in { animation: none; background: transparent; border-color: transparent; box-shadow: none; }
  #card.cine::before { content: ""; position: absolute; inset: -3px; z-index: -1; border: 3px solid #5b3a1b; border-radius: 16px;
    background-color: #c4915a; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.25), transparent 60%);
    box-shadow: 0 10px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(60,35,10,.5); animation: cineBoard .5s cubic-bezier(.2, .9, .3, 1.15) var(--cb, 1.2s) both; }
  #card.cine .logo { animation: cineLogo var(--cld, 1s) cubic-bezier(.25, .6, .3, 1) var(--cl, .35s) both; }

  #card.cine:has(.skip)::before, #card.cine:has(.skip) .logo { animation-delay: 0s !important; animation-duration: .01s !important; }
  /* mientras dura, sin las monedas, el engranaje ni el crédito (el plano limpio); aparecen al final con un fundido */

  @keyframes cineUi { from { opacity: 0; } to { opacity: 1; } }

  /* la moneda más grande y sin transparencia, con el borde tan oscuro y grueso como la del HUD (lo pidió el usuario) */

  @media (min-width: 561px) { #card .wsel .lvl { aspect-ratio: 1; justify-content: center; } #card .wsel .lvl small { font-size: 16px; } #card .wsel .lvl small.lg { font-size: 14px; } }
  /* carteles de perder (trampa o tiempo): el subtítulo en rojo y una caja con el dibujito y qué pasó */

  #card .wtitle:has(.wrib) { top: -6px; padding-top: 4px; transform: rotate(-1deg); }

  #card .wtag { position: absolute; left: 10px; top: -10px; padding: 3px 12px 1px; background: #f6cf4a;   /* amarilla (como las monedas y el botón de la máquina), así no se pierde contra la caja */ font: 17px/1.2 'Kalam', cursive;

     cumpliste, roja si no */
  #card .wtag.wobj { left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 13px; padding: 2px 8px 0; top: -9px; background: #fff6df; border: 1.5px solid rgba(110,75,35,.28);
    border-radius: 4px; color: #c2362b; }

  #card .wtag.wobj { display: inline-flex; align-items: center; gap: 5px; padding-right: 3px; }   /* (no cumplido: rojo y un círculo rojo con una cruz) */
  #card .wtag.wobj.ok { color: #0b7a0b; }
  /* (más alto que la etiqueta y centrado en su fondo, así sobresale lo mismo arriba y abajo: la etiqueta tiene 2 px de

  #card .wtag.wobj .wchk { flex: none; width: 27px; height: 27px; margin: -8px -8px -8px 0; position: relative; top: -1px; }
  #card .wcoins { position: relative; top: -5px; width: 82px; height: 58px; }   /* (un poco más arriba, lo pidió el usuario) */
  #card .wcoins .ci { position: absolute; width: 50px; height: 50px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
  #card .wcoins .ci:first-child { left: 0; top: 8px; } #card .wcoins .ci:last-child { left: 30px; top: 0; }
  #card .wreward .num { font-size: 56px; }
  #card .wreward .wray { position: static; width: 26px; height: 26px; }
  #card .wmach { position: relative; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%;   /* (border-box: el cartel sin monedas es un div, no un botón) */ min-height: 72px; margin: 0 0 14px; padding: 8px 10px 8px 112px;
    background: linear-gradient(#ffdc45, #f4b00e); border: 3px solid #b77d06; border-radius: 14px; box-shadow: 0 4px 0 #8f5f05, 0 6px 12px rgba(0,0,0,.3);
    font: 22px/1.05 'Kalam', cursive; color: #2b1a0b; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  /* la ratita asomando de la cápsula (img/btn-maquina.png, la btn_img_maquina del usuario achicada a 200 px de ancho): más
     alta que el botón, asoma por arriba y un poco por la izquierda, como en la referencia del usuario */
  #card .wmach img { position: absolute; left: 4px; bottom: 3px; width: 104px; height: auto; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
  #card #machSlot { position: relative; z-index: 4; }   /* (así la tapa de la cápsula pasa por delante de la caja de la recompensa) */
  /* en pantallas angostas todo un poco más chico, así entran la ratita, el texto y el precio (la flechita de la derecha
     se sacó: el usuario prefirió el lugar) */
  @media (max-width: 420px) {

  :is(#card, #opts) .wbtns { display: grid; grid-template-columns: 1fr 1.25fr; gap: 12px; }

  /* el sello del récord: la imagen del usuario (img/record-nuevo.png o record-new.png según el idioma); antes era texto en

  #card .stamp { position: absolute; left: 50%; top: -27px; width: 92px; height: auto; pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
    transform: translateX(-50%) rotate(-3deg); animation: stamp .2s cubic-bezier(.3, .9, .45, 1.08) .9s both; }   /* rápido y casi sin rebote (lo pidió el usuario) */

  @media (max-width: 480px) { #card .note b { font-size: 18px; } }
  /* cartel de inicio de nivel: etiqueta, nombre grande, la frase, tres tarjetitas (límite, ★★, ★★★) y lo que hay adentro */

  #card .menu.res { margin-top: 24px; }

  /* columna de la izquierda: la casita (o la flechita), debajo las monedas y debajo el queso, más grandes */
  /* queso y batería: el mismo ancho fijo (entra "10/10"; en em, así se achica con la letra en el celular), con el
     contenido centrado; así no cambia de tamaño al juntar quesos y la batería queda del mismo ancho (lo pidió el usuario) */
  #cheese, #lamp { box-sizing: border-box; width: 4.4em; justify-content: center; }
  #cheese { top: 64px; left: 14px; font-size: 24px; display: flex; align-items: center; gap: 7px; transform: rotate(1deg); padding: 3px 12px 1px; }
  #cheese svg { width: 27px; height: 27px; }

  #lamp { top: 114px; left: 14px; display: flex; align-items: center; padding: 3px 12px 1px; font-size: 24px; transform: rotate(-1deg); }
  #lamp::before { content: '\200b'; }   /* una línea de texto invisible: así mide lo mismo de alto que el queso */
  #lamp.up { top: 64px; }   /* sin queso, va en su lugar (entre monedas, queso y batería queda el mismo espacio: 8 px) */
  #lamp.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  /* pila del HUD, después de un diseño del usuario: un marco gris oscuro con el polo a la derecha y 4 celdas planas; las
     prendidas van todas del mismo color según cuántas quedan (LAMP_COLORS: 4 verde, 3 amarilla, 2 naranja, 1 roja) y las vacías, gris */
  #lamp .bat { position: relative; display: flex; gap: 3px; margin-right: 5px; padding: 4px; border-radius: 6px; background: #4b4b4b; }
  #lamp .bat::after { content: ''; position: absolute; right: -5px; top: 50%; width: 5px; height: 44%; transform: translateY(-50%); background: #4b4b4b; border-radius: 0 2px 2px 0; }
  #lamp .bat i { width: .45em; height: .7em; border-radius: 2px; background: #333333; }   /* (un poco más grande, para probar) */
  #lamp .bat i.blink { opacity: .25; }
  /* monedas: siempre a la vista arriba a la izquierda (en el juego, al lado de la casita) */
  #coins { position: fixed; top: calc(14px + var(--sat)); left: 14px; z-index: 8; font-size: 24px; display: flex; align-items: center; gap: 7px;   /* arriba a la izquierda */
    transform: rotate(-1.5deg); padding: 3px 12px 1px; pointer-events: none; }

  #coins .ci { width: 25px; height: 25px; }
  /* Contornos parejos (lo pidió el usuario): el contorno de cada ícono (class="ol") mide lo mismo en pantalla, sea cual sea
     el tamaño del ícono (vector-effect: non-scaling-stroke, así no se agranda con el dibujo): STROKE_SMALL en los íconos
     chicos (la interfaz de arriba y las monedas de los botones y precios) y STROKE_BIG en los grandes de los carteles
     (queso, reloj, monedas de la recompensa, trampa y linterna). Con el zoom de los carteles en pantallas chicas se achica
     junto con todo */
  svg .ol, svg .ol > * { vector-effect: non-scaling-stroke; stroke-width: 1.5px; }
  #card .wstat > svg .ol, #card .wstat > svg .ol > *, #card .wg > svg .ol, #card .wg > svg .ol > *, #card .wcoins .ci .ol, #card .wlose > svg .ol { stroke-width: 2.5px; }
  #coins.below { top: 64px; }   /* en las pantallas con flechita de volver, debajo de ella */
  #coins.pop { animation: coinPop .25s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes coinPop { from { transform: scale(1.3); } to { transform: scale(1); } }

  #screen { position: fixed; inset: 0; z-index: 7; background: #000; pointer-events: none;

    transition: clip-path .45s ease-in-out, -webkit-clip-path .45s ease-in-out; }
  #screen.open { pointer-events: auto; clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); -webkit-clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); }

  #screen.open .inner.show { opacity: 1; }
  #screen .stitle { font-family: 'Kalam', cursive; font-weight: normal; font-size: 46px; margin: 0; color: #f1e4c4; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  #screen .ssub { margin: 0; font-size: 15px; color: #bfae8c; }
  /* Bioterio y Máquina: el título sube a la altura de la flechita y el engranaje; los estantes arrancan debajo de las monedas */
  #screen .stitle.up { margin-top: -52px; }
  #screen .sbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; flex: 0 0 auto; }
  /* ratitas: estantes de metal de punta a punta de la pantalla, sobre el negro; las jaulas centradas en cada estante */
  /* Bioterio: el fondo, las jaulas y el título se deslizan juntos detrás de los botones, que quedan fijos (sin barra) */
  #screen .inner > .rack { position: absolute !important; inset: 0; z-index: 0 !important; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain; }   /* (contain: al llegar al final no arrastra la página) */
  .rackin { position: relative; overflow: hidden; }
  /* franjas oscuras: la de arriba queda pegada arriba mientras se desliza (por encima de las jaulas, debajo del título) */
  .bandtop { position: sticky; top: 0; z-index: 1; pointer-events: none; background: linear-gradient(rgba(0,0,0,.9), rgba(0,0,0,0)); }
  .rackin .biohead { z-index: 2; }
  #screen .inner > .bandbot { position: absolute !important; left: 0; right: 0; bottom: 0; z-index: 1 !important; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,0)); }
  /* fondo de la Máquina, en su capa: se apaga (y vuelve) fundiéndose */
  #screen .inner > .scrbg { position: absolute !important; inset: -12px; z-index: 0 !important; pointer-events: none; transition: opacity .25s ease; }
  #screen .inner > .scrbg.dark { transition: opacity .6s ease; }   /* se apaga despacio cuando salta la cápsula; vuelve rápido con "Otra vez" */
  #screen .inner > .scrbg.dark { opacity: 0; }
  #screen .inner > .labbg { position: absolute !important; inset: -12px; z-index: 0 !important; pointer-events: none; opacity: 0; will-change: opacity; }   /* el laboratorio de la ratita del premio (en su propia capa: aparecer cambiándole la opacidad cuadro a cuadro no lo vuelve a pintar) */
  #screen .inner > .scrbg { will-change: opacity; }   /* el fondo se corta donde termina el deslizamiento */
  .biohead { position: absolute; top: 12px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #screen .bionav { margin-top: auto; }
  /* la casita (a la portada) va abajo, cuadrada, a la izquierda del botón Máquina / Bioterio: así las monedas quedan
     siempre arriba a la izquierda, en el mismo lugar que en el juego */
  #screen .sbtns .cbtn.home { display: inline-grid; place-items: center; padding: 0 12px; }
  #screen .sbtns .cbtn.home svg { width: 26px; height: 26px; }
  .rack::-webkit-scrollbar { display: none; }
  .bgrack { position: absolute; background: url(img/fondo-bioterio.jpg?v=2) 0 0 / 100% 100% no-repeat; }
  .bgrack .rat { position: absolute; }
  .rat { position: relative; z-index: 1; background: none; border: 0; padding: 0; cursor: pointer; display: block;
    width: min(calc(100vw / var(--cols)), 280px); -webkit-tap-highlight-color: transparent; }
  .rat canvas { display: block; width: 100%; }   /* (la proporción la da el lienzo: CAGE_W × CAGE_H) */
  .rat:disabled { cursor: default; }
  .rat:not(:disabled):active canvas { transform: scale(.96); }
  /* máquina */
  /* la máquina grande y un poco más abajo; el espacio que sobra se reparte arriba de ella y antes del botón Bioterio */
  #gachaCv { display: block; width: min(calc(100vh - 230px), 100vw); aspect-ratio: 1; flex: 0 0 auto; margin-top: auto; }
  #gachaNav { margin-top: auto; }
  #gachaBtns { min-height: 48px; margin-top: 8px;   /* aunque esté vacío (mientras anda) ocupa lo mismo: la máquina no se corre (el margen reemplaza el hueco del texto de "te faltan monedas", que ya no está: sin monedas el botón Activar se ve apagado, y el usuario prefirió eso) */
    /* subido (sin mover nada más) hasta justo debajo del borde de la mesada, como marcó el usuario; la mesada termina
       6,3 unidades antes del pie del canvas de la máquina, que mide min(100vh - 230px, 100vw) = 300 unidades */
    top: calc(-9px - 0.021 * min(100vh - 230px, 100vw)); }
  /* luz de la baliza: un canvas a pantalla completa detrás del título, el texto y los botones */
  #gachaFx, #gachaFx2 { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #gachaFx2 { z-index: 2; }   /* la capa de adelante: ahí va la ratita del premio, así no la corta el borde del canvas */
  #screen .inner > :not(#gachaFx):not(#gachaFx2) { position: relative; z-index: 1; }
  #screen .inner > .stitle, #gachaBtns, #gachaNav { z-index: 3; }   /* los textos y botones quedan arriba de la luz */
  .gname { font-family: 'Kalam', cursive; font-size: 30px; color: #f6e7bf; }
  .cbtn:disabled { opacity: .5; cursor: default; }
  /* portada */
  #card .lead { margin: 4px 0 12px; }
  #card .lead p { margin: 2px 0; font-size: 16px; line-height: 1.35; text-wrap: balance; }
  #card .ctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px auto 2px; padding: 10px 0;
    border-top: 1px dashed rgba(60,35,10,.35); border-bottom: 1px dashed rgba(60,35,10,.35); max-width: 400px; }
  #card .ctl span:last-child { text-align: left; font-size: 14px; line-height: 1.35; }
  #card .keys { display: grid; grid-template-columns: repeat(4, auto); gap: 4px; }
  #card .keys kbd { margin: 0; min-width: 12px; text-align: center; }
  #card .finger { font-size: 30px; line-height: 1; }
  #card .modes { margin-top: 12px; }
  #card .modes p { margin: 2px 0; font-size: 13.5px; line-height: 1.35; opacity: .85; text-wrap: balance; }
  #card .modes b { font-family: 'Kalam', cursive; font-weight: normal; }
  #card table { margin: 10px auto 0; border-collapse: collapse; font-size: 14px; text-align: left; }
  #card td { padding: 2px 8px; }

  /* arriba a la derecha: la ruedita (jugando pausa; en los menús abre las opciones) */
  #btnBack, #coins, #btnGear, #gachaNav { transition: opacity .3s ease; }
  .faded { opacity: 0 !important; pointer-events: none !important; }   /* se desvanece (la máquina andando) */
  #topbtns { position: fixed; top: calc(12px + var(--sat)); right: 14px; display: flex; gap: 8px; z-index: 8; }
  #btnGear svg { width: 27px; height: 27px; }
  /* ventana de pausa / opciones: Música y Sonido con interruptores, y abajo la casita y Reanudar (o Cerrar) */
  #opts { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding-top: var(--sat); box-sizing: border-box; background: rgba(0,0,0,.72); }   /* oscurece bien lo de atrás */
  #opts.hidden { display: none; }
  /* pausa / opciones: con el formato de los carteles nuevos (cartón claro, título de papel que asoma arriba, caja de papel
     encintada con Música y Sonido, y botones grandes: la casita y Reanudar en verde, o Cerrar) */
  #opts .box { width: min(400px, calc(100vw - 24px)); box-sizing: border-box; margin-top: 14px; padding: 0 14px 16px; text-align: center; transform: rotate(-1deg);
    background: #c4915a; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.25), transparent 60%);
    border: 3px solid #5b3a1b; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(60,35,10,.35); color: #2b1a0b;
    animation: optsIn .22s cubic-bezier(.2, .9, .3, 1.25) both; }
  @keyframes optsIn { from { transform: rotate(-5deg) scale(.6); opacity: 0; } to { transform: rotate(-1deg) scale(1); opacity: 1; } }
  /* al cerrarse (sacar la pausa, cerrar opciones) se achica y se va, como entró pero al revés; el fondo oscuro se aclara */
  /* fundido a negro entre pantallas (fadeTo): por encima de todo menos la librería */
  /* crédito al pie de la portada (lo pidió el usuario): chiquito pero legible, en un gris claro */
  /* pantalla previa "TOCÁ PARA ENTRAR": solo el fondo del juego y el texto, que aparece suave y queda latiendo */
  #splash { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding-top: var(--sat); box-sizing: border-box; pointer-events: none; }
  #splash span { font: 700 22px/1 'Kalam', cursive; letter-spacing: .12em; color: #f3e4c4;   /* (sin sombra y un poco más chico, a pedido del usuario) */
    animation: splashIn .9s ease-out both, splashBeat 1.6s ease-in-out .9s infinite; }
  #splash.out span { animation: splashOut .25s ease-in both; }
  @keyframes splashIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes splashBeat { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes splashOut { from { opacity: 1; } to { opacity: 0; } }
  #credit { position: fixed; left: 0; right: 0; bottom: max(10px, calc(var(--sab) - 24px)); z-index: 5; text-align: center; pointer-events: none;
    font: 700 13px/1 'Kalam', cursive; color: #b8b8b8; letter-spacing: .02em; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #fade { position: fixed; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; transition: opacity .16s ease; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #opts:not(.hidden) { animation: optsBgIn .18s ease-out both; }
  #opts.closing { animation: optsBgOut .16s ease-in both; pointer-events: none; }
  #opts.closing .box { animation: optsOut .16s ease-in both; }
  @keyframes optsOut { from { transform: rotate(-1deg) scale(1); opacity: 1; } to { transform: rotate(4deg) scale(.6); opacity: 0; } }
  @keyframes optsBgIn { from { background: rgba(0,0,0,0); } }
  @keyframes optsBgOut { to { background: rgba(0,0,0,0); } }
  #opts .box > .wtitle { margin-top: -30px; padding: 12px 34px 10px; }
  #opts .orows { margin: 18px 2px 18px; padding: 6px 18px 10px 16px; text-align: left; }
  #opts .opt { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; font: 23px/1.1 'Kalam', cursive; }
  #opts .opt + .opt { border-top: 2px dashed rgba(90,60,30,.3); }
  #opts .opt span { display: flex; align-items: center; gap: 12px; }
  #opts .opt svg { width: 28px; height: 28px; }
  #opts .tog { position: relative; width: 56px; height: 30px; border: 0; border-radius: 15px; background: #7d6a52; cursor: pointer;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; transition: background .15s; }
  #opts .tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #e2d6b8;
    box-shadow: 0 2px 2px rgba(0,0,0,.35); transition: left .15s; }
  #opts .tog.on { background: #6f9e3c; } #opts .tog.on::after { left: 29px; }
  /* el idioma: dos banderitas; la elegida entera y con un borde, la otra apagada */
  #opts .flags { gap: 8px; }
  #opts .flag { width: 42px; height: 30px; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: pointer; background: none;
    box-shadow: 0 2px 2px rgba(0,0,0,.3); opacity: .45; filter: saturate(.5); -webkit-tap-highlight-color: transparent;
    transition: opacity .15s, filter .15s, transform .15s; }
  #opts .flag svg { display: block; width: 100%; height: 100%; }
  #opts .flag.on { opacity: 1; filter: none; outline: 3px solid #6f9e3c; outline-offset: 1px; transform: scale(1.06); }
  :is(#card, #opts) .wbtns.home { grid-template-columns: 66px 1fr; }   /* el botón cuadrado (casita o niveles) y el principal a lo ancho */
  :is(#card, #opts) .wbtns.three { grid-template-columns: 62px 1fr 1.25fr; gap: 10px; }
  #opts .wbtns.pause { grid-template-columns: 66px 66px 1fr; gap: 10px; }   /* pausa: casita, reiniciar y Reanudar */
  :is(#card, #opts) .wbtn.sq { padding: 0; } :is(#card, #opts) .wbtn.sq svg { width: 30px; height: 30px; }
  .btn.tape { position: static; width: 44px; height: 44px; padding: 0; border: 0; display: grid; place-items: center;
    color: #2a1a0c; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn.tape:nth-child(odd) { transform: rotate(-2deg); } .btn.tape:nth-child(even) { transform: rotate(2deg); }
  .btn svg { width: 24px; height: 24px; }
  .btn:active { filter: brightness(.85); }

  /* controles táctiles */
  body:not(.touch) #hintTouch { display: none; }
  body.touch #hint { display: none !important; }
  #hintTouch { position: fixed; bottom: max(14px, calc(var(--sab) - 20px)); left: 0; right: 0; text-align: center;
    font-size: 13px; color: #a08060; opacity: .75; pointer-events: none; padding: 0 120px; }
  /* joystick flotante: aparece donde apoyás el dedo */
  #stickZone { position: fixed; inset: 0; z-index: 3; display: none; touch-action: none; }
  body.touch.playing #stickZone { display: block; }
  #stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    background: rgba(217,207,178,.10); border: 2px solid rgba(217,207,178,.38); display: none; z-index: 4; }
  #stick.on { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(217,207,178,.45); border: 2px solid rgba(240,228,205,.6); }
  body.touch { touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none; }
  /* en el celular (o con pantalla táctil) no se muestran las barras de scroll: se sigue pudiendo deslizar */
  @media (max-width: 560px), (pointer: coarse) {
    .rack, #card .levels, #card { scrollbar-width: none; }
    .rack::-webkit-scrollbar, #card .levels::-webkit-scrollbar, #card::-webkit-scrollbar { display: none; }
  }
  @media (max-width: 560px) {
    #level { font-size: 13px; }
    #timer { top: 32px; font-size: 26px; }
    #cheese, #lamp { font-size: 21px; }
    #lamp { top: 108px; }
    #card .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
    #card .lvl b { font-size: 21px; }
    #card .lvl small { font-size: 13px; } #card .lvl small.lg { font-size: 11px; }
    #card .st { font-size: 18px; }
    #screen .stitle { font-size: 36px; }
    .cbtn { font-size: 19px; padding: 7px 16px 5px; }
    #card { padding: 22px 16px 18px; }
    #card .lead p { font-size: 12.5px; }
    #card .ctl { gap: 10px; }
    #card .ctl span:last-child { font-size: 12.5px; }
    #card .ctl br { display: none; }
    #card .modes p { font-size: 11.5px; }
  }
  /* ---- HUD y botones sueltos con el formato de los carteles nuevos ----
     fichas de papel derechas (sin cinta ni inclinación), con esquinas redondeadas, borde marrón y sombra de botón */
  .tape { background: #efdcb6; background-image: radial-gradient(ellipse at 40% 20%, rgba(255,255,255,.4), transparent 70%);
    border: 0; border-radius: 11px; box-shadow: 0 3px 0 #75522c, 0 5px 10px rgba(0,0,0,.45); color: #2b1a0b; }   /* sin borde, como los botones flotantes */
  #coins, #cheese, #lamp, .btn.tape:nth-child(odd), .btn.tape:nth-child(even) { transform: none; }
  #level, #timer { transform: translateX(-50%); }
  /* monedas, queso y batería, con el mismo aire entre las fichas (8 px) */
  #cheese, #lamp.up { top: 69px; } #lamp { top: 123px; }
  @media (max-width: 560px) { #lamp { top: 118px; } }
  /* el nivel, una etiqueta oscura montada sobre el borde de arriba del reloj */
  #level { z-index: 2; top: 6px; padding: 1px 10px 0; background: #2b1a0b; color: #f3e4c4; border-radius: 7px; box-shadow: 0 2px 4px rgba(0,0,0,.5); letter-spacing: .5px; }
  #timer { top: 24px; padding: 6px 12px 1px; min-width: 0; width: 2.7em; box-sizing: content-box; font-size: 26px; }   /* más chico, con minutos de dos cifras (00:25); ancho fijo: entran los 4 números más anchos de Kalam (el 8, 0,59 em) y los dos puntos (0,25 em), así la caja no cambia de tamaño mientras corre */
  @media (max-width: 560px) { #timer { top: 22px; font-size: 22px; } }
  /* Bioterio y Máquina: los botones de abajo y Activar, como los botones de los carteles */
  #screen .sbtns .cbtn { transform: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 4px 24px 0;
    font-size: 23px; border-radius: 14px; background: #ecd7ae; color: #2b1a0b; border: 0; box-shadow: 0 4px 0 #75522c, 0 6px 12px rgba(0,0,0,.35); }   /* flotantes: sin borde, como el engranaje */
  #screen .sbtns .cbtn.home { padding: 0 14px; }
  #screen #gachaBtns .cbtn { background: linear-gradient(#ffdc45, #f4b00e); box-shadow: 0 4px 0 #8f5f05, 0 6px 12px rgba(0,0,0,.35); }
  /* "¡Usarla!" (verde, con la patita), a la derecha de Bioterio después del premio; con él, los botones de esa fila van un
     poco más angostos para que entren los tres en el celular más angosto (360 px) */
  #screen #gachaNav .cbtn.go { background: linear-gradient(#5fce50, #2f9b33); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.3); box-shadow: 0 4px 0 #185a1c, 0 6px 12px rgba(0,0,0,.35); gap: 6px; }
  #screen #gachaNav .cbtn.go svg { width: 22px; height: 22px; }
  #screen #gachaNav .cbtn.go:active { box-shadow: 0 1px 0 #185a1c; }
  #screen #gachaNav:has(.go) .cbtn:not(.home) { padding: 4px 15px 0; }
  #screen #gachaNav { flex-wrap: nowrap; }   /* (nunca en dos filas: fitNav la achica si no entra) */
  #screen .sbtns .cbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #75522c; }
  #screen #gachaBtns .cbtn:active { box-shadow: 0 1px 0 #8f5f05; }
</style>

<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud" class="hidden">

  <div id="level" class="tape">NIVEL 1</div>

  <div id="cheese" class="tape hidden"><svg viewBox="0 0 24 24"><defs><linearGradient id="chG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8d662"/><stop offset="1" stop-color="#efb53a"/></linearGradient></defs><path d="M2 15.1 L21.25 17.3 L21.25 20.8 L2 18.6 Z" fill="#e0a432" stroke="#8a5b10" class="ol" stroke-width="1.1" stroke-linejoin="round"/><path d="M17.95 3 L21.25 17.3 L21.25 20.8 L17.95 6.5 Z" fill="#cf8a1f" stroke="#8a5b10" class="ol" stroke-width="1.1" stroke-linejoin="round"/><path d="M2 15.1 L17.95 3 L21.25 17.3 Z" fill="url(#chG)" stroke="#8a5b10" class="ol" stroke-width="1.1" stroke-linejoin="round"/><circle cx="8.6" cy="12.7" r="1.45" fill="#c98a1d"/><circle cx="14.4" cy="8.3" r="1.75" fill="#c98a1d"/><circle cx="17.5" cy="13.8" r="1.2" fill="#c98a1d"/><circle cx="11.8" cy="14.9" r=".8" fill="#c98a1d"/><circle cx="18.2" cy="7.9" r=".8" fill="#c98a1d"/></svg><span id="cheeseN">0/5</span></div>

<script>
// Reinicio del progreso: la primera vez que se abre esta versión se borran el progreso de Historia, las monedas y las
// ratitas (el usuario lo pidió al terminar de probar, junto con volver a cobrar la máquina y desbloquear los niveles de a
// uno); las preferencias (idioma, música y sonido) quedan. Para reiniciar a todos otra vez, cambiar SAVE_VER
// (pasó a '3' el 26/10/2026, cuando el usuario volvió a reiniciar todo después de otra tanda de pruebas)
const SAVE_VER = '3';
try {
  if (localStorage.getItem('raton.ver') !== SAVE_VER) {
    ['raton.story', 'raton.coins', 'raton.skins', 'raton.debugLight'].forEach(k => localStorage.removeItem(k));
    localStorage.setItem('raton.ver', SAVE_VER);
  }
} catch (_) {}
// Idioma (el usuario pidió poder pasar a inglés desde las opciones, con una banderita de Argentina y una de Estados
// Unidos): 'es' o 'en', guardado en el navegador; la primera vez sale del idioma del navegador. say(es, en) devuelve el
// texto en el idioma elegido (las pantallas de prueba, la galería y la librería de colores quedan en castellano)

// Tamaños de laberinto por nivel (columnas x filas)
const SIZES = [[7,4],[9,5],[11,6],[13,8],[16,9],[19,11],[22,13],[26,15],[30,17],[34,19]];
function sizeFor(n) {
  if (n <= SIZES.length) return SIZES[n - 1];
  const e = n - SIZES.length;
  return [Math.min(60, 34 + 3 * e), Math.min(34, 19 + 2 * e)];
}
// Cuántas celdas de ancho entran en pantalla: al principio el laberinto entra casi entero,
// después la cámara se acerca y el laberinto crece, así deja de verse completo.
function viewCells(n) { return Math.max(6, 9 - 0.4 * (n - 1)); }
// Tiempo según el largo del camino más corto
function timeFor(n, pathCells) {
  const factor = Math.max(2.2, 4.2 - 0.25 * (n - 1));
  return Math.ceil((8 + pathCells * C / SPEED * factor) / 5) * 5;
}

const RAT_RARITY = [null, 'comun', 'comun', 'comun', 'comun', 'infrecuente', 'comun', 'comun', 'comun', 'infrecuente', 'infrecuente',
  'infrecuente', 'infrecuente', 'rara', 'infrecuente', 'comun', 'rara', 'comun', 'rara', 'legendaria', 'legendaria'];
function rollRat() {
  let r = Math.random(), tier = 'comun';
  for (const k in RARITY) { if ((r -= RARITY[k].w) < 0) { tier = k; break; } }
  const pool = RAT_RARITY.map((t, i) => t === tier ? i : -1).filter(i => i >= 0);
  return pool[Math.floor(Math.random() * pool.length)];
}

    m.fl.frequency.setTargetAtTime(250 + 900 * amp, t, 0.08); m.g.gain.setTargetAtTime(0.02 + 0.045 * amp, t, 0.08);
    w.src.forEach((o, i) => o.frequency.setTargetAtTime(f * 7 * [1, 2.01][i], t, 0.08)); w.fl.frequency.setTargetAtTime(f * 7, t, 0.08);
    w.g.gain.setTargetAtTime(0.004 + 0.018 * amp * amp, t, 0.1);
    gr.fl.frequency.setTargetAtTime(1200 + 2400 * amp, t, 0.1); gr.g.gain.setTargetAtTime(0.008 + 0.03 * amp, t, 0.1);
  },
  // el motor se frena: baja de tono y se apaga, con un "clonc" al detenerse
  motorStop() {
    const c = this.ctx; if (!c) return; const t = c.currentTime;
    for (const k of ['motor', 'whine', 'gear']) {
      const v = this.mv[k]; if (!v) continue;
      v.src.forEach(o => { if (o.frequency) o.frequency.setTargetAtTime(o.frequency.value * 0.45, t, 0.25); });
      v.stop(0.7); delete this.mv[k];
    }
    this.tone(120, 55, 0.14, 'square', 0.05, 0.45); this.noise(0.06, 500, 1, 0.14, 'lowpass', 0.45);

  // una cápsula de plástico choca con otra o con el vidrio de la pecera
  capTick(v = 1) {
    const f = 1700 + Math.random() * 2200;

  // la cápsula premiada cae adentro: golpes de plástico que rebotan cada vez más rápido y más suaves, y rueda
  clack() {

      const v = 1 - k / 7;
      this.noise(0.02, 2200 + k * 150, 3, 0.26 * v, 'bandpass', d); this.tone(520 - k * 15, 300, 0.05, 'triangle', 0.08 * v, d);

  doorOpen(d = 2, hit = 1.95) {
    const c = this.ctx; if (!c) return; const t = c.currentTime;
    // (sin el "pssst" de aire comprimido: el usuario lo sacó, no le gustaba) la luz de adentro se prende con un zumbido
    this.relay(); this.tone(60, 120, 0.5, 'sawtooth', 0.03); this.ring(3300, 0.15, 0.02, 0.6, 0.06);
    for (let k = 0, x = 0.15; x < d - 0.05; k++, x += 0.1 + 0.03 * Math.sin(k * 1.7)) {
      this.noise(0.018, 2600 + (k % 3) * 400, 4, 0.09, 'bandpass', x); this.tone(380, 260, 0.03, 'triangle', 0.025, x);
    }
    const r = this.voice('noise', 0, 'lowpass', 260, 1); r.g.gain.setValueAtTime(0.0001, t); r.g.gain.exponentialRampToValueAtTime(0.06, t + 0.2);
    r.g.gain.setValueAtTime(0.06, t + d - 0.25); r.g.gain.linearRampToValueAtTime(0, t + d); r.src[0].stop(t + d + 0.05);
    const s = this.voice([['sawtooth', 1], ['sine', 2]], 520, 'bandpass', 900, 3);
    s.src.forEach(o => { o.frequency.setValueAtTime(o.frequency.value, t + 0.1); o.frequency.linearRampToValueAtTime(o.frequency.value * 0.75, t + hit); });
    s.g.gain.setValueAtTime(0.0001, t + 0.1); s.g.gain.exponentialRampToValueAtTime(0.012, t + 0.3); s.g.gain.setValueAtTime(0.012, t + hit - 0.05); s.g.gain.linearRampToValueAtTime(0, t + hit);
    s.src.forEach(o => o.stop(t + hit + 0.1));
    this.tone(200, 90, 0.1, 'sine', 0.12, hit); this.noise(0.05, 1800, 2, 0.08, 'bandpass', hit); this.noise(0.03, 1800, 2, 0.03, 'bandpass', hit + 0.2);
  },
  // la cápsula salta al frente (el zumbido de la máquina se va con ella) y empieza la tensión: un silbido que sube, un
  // tono grave que se tensa hasta que se abre (revealHit lo corta de golpe). (Tenía además un redoble que se aceleraba, pero
  // arrancaba con la cápsula todavía volando y sonaba como el sacudón antes de verlo: el usuario lo oía adelantado. El
  // redoble lo hace el traqueteo de la cápsula, pegado a su movimiento)
  launch(d) {
    const c = this.ctx; if (!c) return; const t = c.currentTime;
    if (this.mv.hum) { this.mv.hum.stop(0.5); delete this.mv.hum; }
    this.sweep(300, 2600, 0.45, 0.12, 1.2); this.tone(220, 520, 0.4, 'sine', 0.04);
    const n = this.mv.rise = this.voice('noise', 0, 'bandpass', 500, 4);
    n.fl.frequency.setValueAtTime(500, t); n.fl.frequency.exponentialRampToValueAtTime(5000, t + d);
    n.g.gain.setValueAtTime(0.0001, t); n.g.gain.exponentialRampToValueAtTime(0.12, t + d);
    const o = this.mv.tense = this.voice([['sawtooth', 1], ['sawtooth', 1.06, 0]], 73, 'lowpass', 400, 2);   // re y mi bemol: roce tenso
    o.src.forEach(x => x.frequency.exponentialRampToValueAtTime(x.frequency.value * 2, t + d)); o.fl.frequency.exponentialRampToValueAtTime(1600, t + d);
    o.g.gain.setValueAtTime(0.0001, t); o.g.gain.exponentialRampToValueAtTime(0.07, t + d);
  },
  // la cápsula llega al frente y hace un rebotecito en el aire: un "boing" de resorte cortito
  boing() { this.tone(260, 520, 0.12, 'triangle', 0.06); this.tone(520, 300, 0.18, 'sine', 0.04, 0.1); },
  // la baliza: un "uii-uuu" de alarma suave en cada vuelta mientras anda el motor (tensión)
  beacon(v = 1) {
    const c = this.ctx; if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(640, t); o.frequency.linearRampToValueAtTime(920, t + 0.35); o.frequency.linearRampToValueAtTime(640, t + 0.8);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03 * v, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    o.connect(g).connect(this.master); const w = c.createGain(); w.gain.value = 0.8; g.connect(w).connect(this.room()); o.start(t); o.stop(t + 0.9);
  },
  // la cúpula se suma al temblor: un "clanc" metálico del cierre
  domeClank() { this.ring(1250, 0.3, 0.03, 0.5); this.ring(1870, 0.2, 0.02, 0.5); this.noise(0.03, 2600, 3, 0.08, 'bandpass'); this.tone(180, 90, 0.08, 'sine', 0.08); },
  // los tubitos crujen en su enganche cuando se bambolean
  creak() {
    const c = this.ctx; if (!c) return; const t = c.currentTime, f = 700 + Math.random() * 500, o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), fl = c.createBiquadFilter(), g = c.createGain();

  // la ratita salta de la cápsula: un "fiuu" que sube y un chillido contento
  ratJump() { this.sweep(500, 1800, 0.3, 0.07, 1.5); this.tone(700, 1400, 0.18, 'sine', 0.03); setTimeout(() => this.squeak(), 120); },
  // aterriza en la mesada: un golpecito blando y el rebote
  ratLand() { this.tone(150, 70, 0.12, 'sine', 0.16); this.noise(0.06, 500, 0.8, 0.12, 'lowpass'); this.tone(110, 60, 0.08, 'sine', 0.06, 0.16); },
  // los textos del premio aparecen con un "pop" de burbuja
  textPop(k = 0) { const f = k ? 660 : 880; this.tone(f * 0.6, f * 1.4, 0.07, 'sine', 0.06); this.noise(0.02, 3000, 2, 0.04, 'bandpass'); },
  // un brillito (de los que suben alrededor de la ratita)
  twinkle() { const f = 2400 + Math.random() * 2400; this.ring(f, 0.35, 0.012 + Math.random() * 0.01, 1.5); },
  // traqueteo de la cápsula en el aire: la cáscara de plástico y algo que suena adentro
  rattle(a = 1) {   // a: qué tan fuerte es el sacudón (0..1), así suena tan grande como se ve
    const f = 1300 + Math.random() * 900, v = 0.3 + 0.7 * a;
    this.noise(0.03, f, 3, 0.16 * v, 'bandpass'); this.tone(f * 0.35, f * 0.3, 0.04, 'triangle', 0.04 * v);

  // se abre: se corta la tensión, chasquido del plástico, un golpe de aire grave y un destello con campanitas en la sala

    this.noise(0.03, 5000, 0.8, 0.35, 'highpass'); this.noise(0.12, 1300, 0.8, 0.3, 'bandpass'); this.tone(160, 50, 0.3, 'sine', 0.3);

  tick(hi) { this.tone(hi ? 1600 : 1050, hi ? 1600 : 1050, 0.035, 'square', 0.07); },
  click() { this.noise(0.025, 3200, 2, 0.4); this.noise(0.02, 1800, 2, 0.3, 'bandpass', 0.05); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.22, 'triangle', 0.2, i * 0.11)); setTimeout(() => this.squeak(), 520); },
  lose() { this.tone(420, 60, 1.0, 'sawtooth', 0.09); this.tone(210, 40, 1.2, 'square', 0.05, 0.05); },
  // ruido con barrido de frecuencia (para los "fiuu" de los carteles)
  sweep(f0, f1, dur, vol, q = 1.2, delay = 0) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;

  cardIn() { this.sweep(500, 2400, 0.14, 0.16); this.tone(170, 80, 0.09, 'sine', 0.22, 0.12); this.noise(0.05, 700, 0.8, 0.18, 'lowpass', 0.12); },
  // cartel que sale: "fiuu" que baja, más corto
  cardOut() { this.sweep(2200, 450, 0.12, 0.13); },

  // botones aparecen con notitas que suben
  logoLand() { this.tone(150, 55, 0.18, 'sine', 0.28); this.noise(0.09, 520, 0.8, 0.3, 'lowpass'); this.noise(0.04, 1600, 1, 0.08, 'bandpass', 0.02); },
  slide() { this.sweep(700, 1700, 0.16, 0.08, 1.4); },
  popIn(k = 0) { const f = [523, 659, 784, 1047][k] || 1047; this.tone(f, f * 1.25, 0.07, 'triangle', 0.09); this.tone(f * 2, f * 2, 0.06, 'sine', 0.03, 0.02); },
  // trampa que se cierra: golpe metálico seco
  trap() { this.noise(0.06, 2600, 1, 0.6); this.tone(320, 70, 0.14, 'square', 0.22); this.noise(0.12, 400, 0.7, 0.4, 'lowpass', 0.02); },
  // pisar pegamento: "splosh" pegajoso
  squish() { this.sweep(900, 220, 0.25, 0.3, 2.5); this.tone(110, 70, 0.15, 'sine', 0.12); },
  // agarrar un queso: dos notitas para arriba
  // estrella que cae en el cartel de resultados: una campanita con eco de sala (el usuario pidió más "cámara"; antes era un
  // bip seco y la primera, la más grave, casi no se oía): un golpecito al apoyarse, la nota con un parcial brillante y un
  // destello agudo, todo mandado también a la sala (room). La primera suena un poco más fuerte para compensar que es más grave
  star(k = 0) {
    const f = [698.5, 880, 1175][k] || 1175, v = ([1.5, 1.15, 1][k] || 1) * 0.6;   // fa, la, re: re menor, como la música de resultados (antes fa#, para el remate en re mayor)
    this.tone(f, f * 1.5, 0.12, 'triangle', 0.14 * v);
    this.ring(f, 0.9, 0.12 * v, 1.6);
    this.ring(f * 2.76, 0.35, 0.035 * v, 1.6);
    this.ring(f * 2, 0.6, 0.05 * v, 1.8, 0.06);
    this.noise(0.05, 5200, 1.2, 0.05 * v, 'bandpass');
    this.tone(220, 110, 0.07, 'sine', 0.12 * v);   // se apoya
  },
  // nota de campana: un seno que se apaga solo, con parte del sonido a la sala de eco
  ring(f, dur, vol, wet = 0.5, delay = 0) {
    const c = this.ctx; if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.03);
    const w = c.createGain(); w.gain.value = wet; g.connect(w).connect(this.room());
  },
  // sala de eco de los efectos (se arma la primera vez que se usa): una cola de ruido que se apaga en 1,8 s
  room() {
    if (this.rev) return this.rev;
    const c = this.ctx, len = Math.round(c.sampleRate * 1.8), ir = c.createBuffer(2, len, c.sampleRate);
    for (let k = 0; k < 2; k++) { const d = ir.getChannelData(k); let lp = 0; for (let j = 0; j < len; j++) { const x = j / len; lp += (Math.random() * 2 - 1 - lp) * (0.6 - 0.4 * x); d[j] = lp * (1 - x) ** 3; } }
    this.rev = c.createConvolver(); this.rev.buffer = ir; const g = c.createGain(); g.gain.value = 0.8; this.rev.connect(g).connect(this.master);
    return this.rev;
  },
  // queso: un "ñam ñam" de videojuego clásico, dos chirridos de onda cuadrada que suben rápido (el usuario lo pidió así
  // después de probar un "ñam" de dientes, una mordida de manzana y un chomp de dibujito copiado de una referencia)
  cheese() {
    const c = this.ctx; if (!c) return; const t0 = c.currentTime + 0.005;
    for (const [at, f0, f1, d] of [[0, 330, 880, 0.06], [0.08, 440, 1320, 0.075]]) {
      const t = t0 + at, o = c.createOscillator(), g = c.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d * 0.8);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.004); g.gain.setValueAtTime(0.05, t + d * 0.6); g.gain.linearRampToValueAtTime(0, t + d);
      o.connect(g).connect(this.master); o.start(t); o.stop(t + d + 0.02);
    }
  },
  gate() { this.noise(0.05, 1100, 1.4, 0.3); this.tone(170, 85, 0.12, 'square', 0.07); this.noise(0.04, 700, 1, 0.22, 'bandpass', 0.12); },
  gateLand() { this.tone(110, 55, 0.14, 'sine', 0.22); this.noise(0.07, 450, 0.8, 0.18, 'lowpass'); this.noise(0.03, 380, 0.8, 0.06, 'lowpass', 0.16); },   // la compuerta toca abajo y rebota blandito
  tap() { this.noise(0.03, 1400, 1.2, 0.22); this.tone(520, 380, 0.05, 'triangle', 0.05); },
  // entrar desde "TOCÁ PARA ENTRAR": un acorde suave con un soplo de aire. El aire era ruido que arrancaba de golpe a todo
  // volumen y sonaba como un click (el usuario lo oyó): ahora sube de a poco (sweep), y todo arranca 40 ms después, porque
  // el audio se acaba de prender con ese mismo toque y en el iPhone el primer instante puede cortarse
  enter() {
    const c = this.ctx; if (!c) return;
    [392, 523, 784].forEach((f, i) => {   // cada nota entra en 50 ms (no de golpe) y se apaga sola
      const t = c.currentTime + 0.04 + i * 0.07, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.07, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g).connect(this.master); o.start(t); o.stop(t + 0.6);
    });
    this.sweep(1300, 2300, 0.45, 0.035, 0.6, 0.04);
  },
  battery() { this.tone(330, 660, 0.12, 'square', 0.06); this.tone(660, 1320, 0.16, 'square', 0.05, 0.1); this.tone(1320, 1320, 0.1, 'triangle', 0.12, 0.24); },
  flap() { this.noise(0.2, 900, 0.7, 0.22); this.sweep(350, 1100, 0.22, 0.1, 2); },   // cortina de cartón que se levanta
  flapShut(v = 1) { this.noise(0.05, 650, 0.9, 0.3 * v, 'lowpass'); this.tone(190, 95, 0.07, 'sine', 0.16 * v); },   // la cortina golpea el marco
};

// Música de fondo (archivo mp3): suena solo dentro del laberinto, con su propio botón de silencio
// ===================== MÚSICA (sintetizada, como la de Growcore) =====================
// Cuatro piezas hechas con osciladores y ruido, sin archivos. Reemplazan la canción en mp3 (audio/laberinto-de-circuitos.mp3,
// que ya no se carga), de la que toman el tempo, unos 100 bpm, y la tonalidad, re menor:
// después el usuario las pidió más frenéticas, al estilo de Danny Elfman mezclado con electrónico:
//   el tema (TH_CH, TH_MEL), un vals raro en 3/4, con una instrumentación por pantalla: MUS_TITLE portada y niveles,
//             MUS_RES cartel de inicio y resultados, MUS_BIO Bioterio, MUS_MACH Máquina, MUS_LAB Ratalab (el premio)
//   MUS_PLAY  laberintos con luz (los impares): el mismo tema en 4/4, electrónico con cuerdas, celesta y coros, frenético
//   MUS_PLAY_B laberintos con luz (los pares): la música con luz de antes
//   MUS_DARK  laberintos a oscuras (y Desafío): electrónica oscura y frenética, con bajo distorsionado y coro en racimo;
//             con la última pila (WARN_T) se acelera y suma un trémolo y una alarma que sube
//   MUS_STING un remate corto al perder (startDie)
// Cada pista es un loop de semicorcheas: un temporizador programa las notas un poquito antes de que suenen (el patrón de
// siempre en Web Audio), así no se atrasan aunque un cuadro se trabe. Va por su propio volumen (Music.bus, con una sala
// de eco), aparte de los efectos: el switch de Música la apaga sin tocar los efectos.
const hz = m => 440 * 2 ** ((m - 69) / 12);
// instrumentos: cada uno arma sus nodos para sonar en el instante t (segundos del reloj de audio) y se conecta a la
// pista que está sonando (Music.out, seco, y Music.wet, a la sala)
const MN = {
  env(g, t, gain, attack, dur, decay) {   // sube en attack y se apaga sola, más rápido o más lento según decay
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.setTargetAtTime(0, t + attack, decay != null ? decay : Math.max(0.02, (dur - attack) / 3));
  },
  send(node, wet) {
    node.connect(Music.out);
    if (wet) { const w = Snd.ctx.createGain(); w.gain.value = wet; node.connect(w).connect(Music.wet); }
  },
  tone(t, f, dur, { to, type = 'triangle', gain = 0.05, attack = 0.008, decay, filter, wet = 0, vib = 0 } = {}) {
    const c = Snd.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);

// ===================== LABERINTO =====================
function genMaze(W, H, rng, loopFrac) {
  const hW = [], vW = [];
  for (let r = 0; r <= H; r++) hW.push(new Array(W).fill(true));   // hW[r][c]: pared superior de la fila r
  for (let c = 0; c <= W; c++) vW.push(new Array(H).fill(true));   // vW[c][r]: pared izquierda de la columna c
  const vis = new Uint8Array(W * H);
  const sr = Math.floor(rng() * H); vis[sr * W + W - 1] = 1;
  const stack = [[W - 1, sr]];
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const nb = [];
    if (c > 0 && !vis[r * W + c - 1]) nb.push([c - 1, r, 0]);
    if (c < W - 1 && !vis[r * W + c + 1]) nb.push([c + 1, r, 1]);
    if (r > 0 && !vis[(r - 1) * W + c]) nb.push([c, r - 1, 2]);
    if (r < H - 1 && !vis[(r + 1) * W + c]) nb.push([c, r + 1, 3]);
    if (!nb.length) { stack.pop(); continue; }
    const [nc, nr, d] = nb[Math.floor(rng() * nb.length)];
    if (d === 0) vW[c][r] = false; else if (d === 1) vW[c + 1][r] = false; else if (d === 2) hW[r][c] = false; else hW[r + 1][c] = false;
    vis[nr * W + nc] = 1; stack.push([nc, nr]);
  }
  // algunos ciclos para confundir (se abren paredes al azar)
  const loops = Math.floor(W * H * loopFrac);
  for (let i = 0; i < loops; i++) {
    if (rng() < 0.5) { const c = 1 + Math.floor(rng() * (W - 1)), r = Math.floor(rng() * H); vW[c][r] = false; }
    else { const r = 1 + Math.floor(rng() * (H - 1)), c = Math.floor(rng() * W); hW[r][c] = false; }
  }
  const entRow = Math.floor(rng() * H), exitRow = Math.floor(rng() * H);
  vW[W][entRow] = false; vW[0][exitRow] = false;
  return { W, H, hW, vW, entRow, exitRow };
}

// Distancia (en celdas) desde una celda a todas las demás, recorriendo el laberinto
function bfs(m, c0, r0) {
  const { W, H } = m, dist = new Int32Array(W * H).fill(-1);
  const q = [[c0, r0]]; dist[r0 * W + c0] = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const [c, r] = q[qi], d = dist[r * W + c];
    const go = (nc, nr) => { if (dist[nr * W + nc] < 0) { dist[nr * W + nc] = d + 1; q.push([nc, nr]); } };
    if (c > 0 && !m.vW[c][r]) go(c - 1, r);
    if (c < W - 1 && !m.vW[c + 1][r]) go(c + 1, r);
    if (r > 0 && !m.hW[r][c]) go(c, r - 1);
    if (r < H - 1 && !m.hW[r + 1][c]) go(c, r + 1);
  }
  return dist;
}
// El camino más corto con los atajos de las puertas (de A a B, de un solo sentido), y qué tan lejos queda cada punto de
// él: len (como pathLen), onPath(x, y) (la celda está en un camino más corto sin puertas) y detour(x, y) (celdas de ida y
// vuelta para ir hasta ahí desde el camino)
function routeInfo(m, items) {
  const { W, H } = m, ix = (x, y) => Math.floor(y / C) * W + Math.floor(x / C);
  const dE = bfs(m, W - 1, m.entRow), dX = bfs(m, 0, m.exitRow), best = dE[m.exitRow * W];
  const doors = items.filter(it => it.type === 'door').map(d => [ix(d.wx - d.dx * C / 2, d.wy - d.dy * C / 2), ix(d.wx + d.dx * C / 2, d.wy + d.dy * C / 2)]);
  let len = best;
  if (doors.length) {   // BFS con las puertas como pasos de un solo sentido
    const dist = new Int32Array(W * H).fill(-1), q = [m.entRow * W + W - 1]; dist[q[0]] = 0;
    for (let qi = 0; qi < q.length; qi++) {
      const k = q[qi], c = k % W, r = (k - c) / W, d = dist[k];
      const go = nk => { if (dist[nk] < 0) { dist[nk] = d + 1; q.push(nk); } };
      if (c > 0 && !m.vW[c][r]) go(k - 1);
      if (c < W - 1 && !m.vW[c + 1][r]) go(k + 1);
      if (r > 0 && !m.hW[r][c]) go(k - W);
      if (r < H - 1 && !m.hW[r + 1][c]) go(k + W);
      for (const [a, b] of doors) if (a === k) go(b);
    }
    len = dist[m.exitRow * W];
  }

    len: len < 0 ? W * H : len + 3, plain: best + 3,
    onPath: (x, y) => { const k = ix(x, y); return dE[k] + dX[k] === best; },
    detour: (x, y) => { const k = ix(x, y); return dE[k] < 0 ? 0 : dE[k] + dX[k] - best; },

}
// Largo del camino más corto, contando el corral de inicio y el umbral de salida
function pathLen(m) {
  const d = bfs(m, m.W - 1, m.entRow)[m.exitRow * m.W];
  return d < 0 ? m.W * m.H : d + 3;
}

// Paredes como rectángulos (tramos colineales fusionados)
function buildRects(m, rng) {
  const rects = [];
  for (let r = 0; r <= m.H; r++) {
    let c = 0;
    while (c < m.W) {
      if (!m.hW[r][c]) { c++; continue; }
      const c0 = c; while (c < m.W && m.hW[r][c]) c++;
      rects.push({ x: c0 * C - T / 2, y: r * C - T / 2, w: (c - c0) * C + T, h: T });
    }
  }
  for (let c = 0; c <= m.W; c++) {
    let r = 0;
    while (r < m.H) {
      if (!m.vW[c][r]) { r++; continue; }
      const r0 = r; while (r < m.H && m.vW[c][r]) r++;
      rects.push({ x: c * C - T / 2, y: r0 * C - T / 2, w: T, h: (r - r0) * C + T });
    }
  }
  // corral de inicio, fuera de la entrada
  const W = m.W, er = m.entRow;
  rects.push({ x: W * C - T / 2, y: er * C - T / 2, w: C + T, h: T });
  rects.push({ x: W * C - T / 2, y: (er + 1) * C - T / 2, w: C + T, h: T });
  rects.push({ x: (W + 1) * C - T / 2, y: er * C - T / 2, w: T, h: C + T });
  // cinta de embalar en algunas uniones
  for (const R of rects) {
    R.tapes = [];
    const len = Math.max(R.w, R.h);
    for (let k = 0; T / 2 + k * C <= len; k++) if (rng() < 0.3) R.tapes.push(T / 2 + k * C + (rng() - 0.5) * 6);
  }
  return rects;
}

const MARKS = ['?', 'X', 'A-3', 'B-7', 'N°4', '!!', '///', '12', 'LAB', 'x2', '→', '↑', '←', 'O', '#', 'no', '7', 'C-1', '?!', '≈', 'R2', '✓'];
function buildDeco(m, rng) {
  const Wp = m.W * C, Hp = m.H * C, sx = [], sy = [], tapes = [], marks = [];
  for (let x = 110 + rng() * 120; x < Wp - 40; x += 150 + rng() * 170) sx.push(x);
  for (let y = 110 + rng() * 120; y < Hp - 40; y += 150 + rng() * 170) sy.push(y);
  for (const x of sx) for (let y = 20; y < Hp - 20; y += 90) if (rng() < 0.3) { const l = 24 + rng() * 26; tapes.push({ x: x - l / 2, y, w: l, h: 11 }); }
  for (const y of sy) for (let x = 20; x < Wp - 20; x += 90) if (rng() < 0.3) { const l = 24 + rng() * 26; tapes.push({ x, y: y - l / 2, w: 11, h: l }); }
  const n = Math.floor(m.W * m.H / 6);
  for (let i = 0; i < n; i++) {
    const c = Math.floor(rng() * m.W), r = Math.floor(rng() * m.H);
    if ((c === 0 && r === m.exitRow) || (c === m.W - 1 && r === m.entRow)) continue;
    marks.push({ x: (c + 0.25 + rng() * 0.5) * C, y: (r + 0.3 + rng() * 0.4) * C, rot: (rng() - 0.5) * 0.9,
      size: 9 + rng() * 6, text: MARKS[Math.floor(rng() * MARKS.length)],
      color: rng() < 0.2 ? 'rgba(140,22,18,0.75)' : 'rgba(35,24,14,0.55)' });
  }
  return { sx, sy, tapes, marks };
}

// ===================== ITEMS (mecánicas de Historia) =====================
const TRAP_L = 52, TRAP_W = 27;        // trampa (más grande que la rata; casi todo el largo del callejón)
const TRAY_W = 48, TRAY_L = Math.round(TRAY_W * 62 / 32);   // bandeja de pegamento: casi todo el ancho del pasillo, largo proporcional
const STICKY_SLOW = 0.35, STICKY_T = 1.5;     // al salir: recupera desde STICKY_SLOW en STICKY_T segundos
const STICKY_ON = 0.38, STICKY_PAW = 0.06;    // encima: 0.38 de velocidad, menos 0.06 por cada pata apoyada (4 patas: 0.14)

// Coloca los items de un nivel según sus reglas. Todo sale del rng del nivel, así que siempre queda igual.
function placeItems(L, m, rng) {
  const { W, H } = m, idx = (c, r) => r * W + c;
  const dE = bfs(m, W - 1, m.entRow), dX = bfs(m, 0, m.exitRow), best = dE[idx(0, m.exitRow)];
  const onPath = i => dE[i] + dX[i] === best;
  const ent = [W - 1, m.entRow], ext = [0, m.exitRow];
  const near = (c, r, [c2, r2], d) => Math.abs(c - c2) + Math.abs(r - r2) <= d;
  const special = (c, r, d = 0) => near(c, r, ent, d) || near(c, r, ext, d);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const cells = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) cells.push([c, r]);
  const center = (c, r) => [(c + 0.5) * C, (r + 0.5) * C];
  // elige hasta n celdas separadas entre sí al menos minSep (distancia en grilla)
  const pick = (cands, n, minSep, chosen = []) => {
    const out = [];
    for (const cell of cands) {
      if (out.length >= n) break;
      if ([...chosen, ...out].some(o => Math.abs(o[0] - cell[0]) + Math.abs(o[1] - cell[1]) < minSep)) continue;
      out.push(cell);
    }
    return out;
  };

  // Trampas: solo al fondo de callejones sin salida, fuera del camino y lejos de la entrada y la salida
  if (L.traps) {
    const walls = (c, r) => [m.hW[r][c], m.hW[r + 1][c], m.vW[c][r], m.vW[c + 1][r]];
    const cand = shuffle(cells.filter(([c, r]) => walls(c, r).filter(Boolean).length === 3 && !onPath(idx(c, r)) && !special(c, r, 1)));
    for (const [c, r] of pick(cand, L.traps, 2)) {
      const [top, bottom, left, right] = walls(c, r);
      const a = !top ? -Math.PI / 2 : !bottom ? Math.PI / 2 : !left ? Math.PI : 0;   // hacia la abertura del callejón
      const [x, y] = center(c, r);
      const back = C / 2 - T / 2 - TRAP_L / 2;   // fondo de la trampa contra la pared del callejón
      items.push({ type: 'trap', x: x - Math.cos(a) * back, y: y - Math.sin(a) * back, a, closed: false, t: 0 });
      used.push([c, r]);
    }
  }
  // Pegamento: solo en tramos rectos de pasillo (dos celdas seguidas con paredes a ambos lados, nunca en cruces ni
  // esquinas), centrada en el pasillo y ocupando casi todo su ancho; puede ir en el camino, más probable cerca de la salida
  if (L.sticky) {
    const maxX = Math.max(...dX), segs = [];

      if (c + 1 < W && !m.vW[c + 1][r] && m.hW[r][c] && m.hW[r + 1][c] && m.hW[r][c + 1] && m.hW[r + 1][c + 1]) segs.push({ a: [c, r], b: [c + 1, r], vert: false });
      // vertical: (c,r) y (c,r+1) unidas, con paredes a izquierda y derecha en las dos
      if (r + 1 < H && !m.hW[r + 1][c] && m.vW[c][r] && m.vW[c + 1][r] && m.vW[c][r + 1] && m.vW[c + 1][r + 1]) segs.push({ a: [c, r], b: [c, r + 1], vert: true });
    }
    const ok = segs.filter(s => !special(...s.a) && !special(...s.b) && dX[idx(...s.a)] >= 0);
    ok.forEach(s => { const i = idx(...s.a); s.key = rng() * (1 + 3 * (1 - dX[i] / maxX)) * (onPath(i) ? 1.5 : 1); });
    ok.sort((p, q) => q.key - p.key);

      const w = s.vert ? TRAY_W : TRAY_L, h = s.vert ? TRAY_L : TRAY_W;

    // parecido en todos los niveles (antes había quesos a 80 celdas y otros al lado del camino)
    const maxDet = Math.max(6, Math.min(36, Math.round(best * 0.25))), det = i => dE[i] + dX[i] - best;

    const off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r)))), on = shuffle(free.filter(([c, r]) => onPath(idx(c, r))));

    for (const [c, r] of chosen) {
      const [x, y] = center(c, r);

  if (L.doors) {

      if (special(c, r, 1)) continue;
      const d = bfs(m, c, r);
      if (c + 1 < W && m.vW[c + 1][r] && !special(c + 1, r, 1) && d[idx(c + 1, r)] >= 8) pairs.push({ a: [c, r], b: [c + 1, r], gain: d[idx(c + 1, r)] });

    }

      if (chosen.length >= L.doors) break;

      const near = (list, dmin) => list.some(u => Math.abs(u[0] - p.a[0]) + Math.abs(u[1] - p.a[1]) < dmin || Math.abs(u[0] - p.b[0]) + Math.abs(u[1] - p.b[1]) < dmin);
      if (near(used, 1) || near([].concat(...chosen.map(q => [q.a, q.b])), 3)) continue;
      chosen.push(p);
    }
    for (const p of chosen) {

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Mouse</title>
<link rel="preload" as="image" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Special Elite', 'Courier New', monospace; color: #2a1a0c; user-select: none; }
  canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }
  .tape { position: absolute; background: #d9cfb2; padding: 4px 16px 2px;
    box-shadow: 0 2px 6px rgba(0,0,0,.6); font-family: 'Kalam', cursive;
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 2px, transparent 2px 5px); }
  /* nivel chiquito arriba del reloj, centrados */
  #level { top: 8px; left: 50%; font-size: 15px; padding: 2px 12px 0; transform: translateX(-50%) rotate(-2deg); white-space: nowrap; z-index: 1; }
  #timer { top: 36px; left: 50%; font-size: 34px; transform: translateX(-50%) rotate(1.5deg); min-width: 92px; text-align: center; }
  #timer.warn { color: #b3140f; animation: pulse .5s ease-in-out infinite alternate; }

  @keyframes pulse { to { transform: translateX(-50%) scale(1.08); } }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 13px; color: #a08060; opacity: .75; pointer-events: none; }
  #hud.hidden, .hidden { display: none !important; }
  #card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1deg);
    width: min(520px, calc(100vw - 32px)); box-sizing: border-box; padding: 26px 30px 22px; text-align: center;
    background: #a27b4f;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.25), transparent 60%);
    border: 2px solid #6b4c2c; box-shadow: 0 10px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(60,35,10,.5); }
  /* animación de carteles: entra chico y crece con rebote; sale achicándose */
  #card.in { animation: cardIn .22s cubic-bezier(.2, .9, .3, 1.25) both; }
  #card.out { animation: cardOut .1s ease-in both; }
  @keyframes cardIn { from { transform: translate(-50%, -50%) rotate(-5deg) scale(.55); opacity: 0; }
                      to { transform: translate(-50%, -50%) rotate(-1deg) scale(1); opacity: 1; } }
  @keyframes cardOut { to { transform: translate(-50%, -50%) rotate(3deg) scale(.6); opacity: 0; } }
  #level.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  #timer.pop:not(.warn) { animation: timerPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes levelPop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #level.pop { animation: lvlPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  @keyframes lvlPop { from { transform: translateX(-50%) scale(.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  /* botón casita (volver al menú), arriba a la izquierda; en los resultados de Historia, ahí mismo va la flechita a los niveles */
  #btnBack { position: fixed; top: 12px; left: 14px; z-index: 5; transform: rotate(-2deg); }
  #btnBack { z-index: 9; }   /* por encima de las pantallas negras (Ratitas) */
  @keyframes timerPop { from { transform: translateX(-50%) scale(.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .btn.tape { transition: transform .12s; }
  .btn.tape:active { transform: scale(.85) !important; }
  #card h1 { font-family: 'Kalam', cursive; font-weight: normal; font-size: 40px; margin: 0 0 8px; color: #1e1208; line-height: 1.05; }
  #card h1.red { color: #8e1410; }
  #card p { margin: 8px 0; font-size: 16px; line-height: 1.4; }
  #card .big { font-family: 'Kalam', cursive; font-size: 22px; }

  kbd { display: inline-block; background: #e8dcc0; border: 1px solid #5a3e22; border-bottom-width: 3px; border-radius: 4px;
    padding: 0 6px; font-family: inherit; font-size: 13px; margin: 0 1px; }
  #card { z-index: 6; }   /* por encima del joystick, así los botones de la pausa se pueden tocar */
  #card .logo { display: block; width: min(100%, 400px); margin: -6px auto 6px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.45)); }
  #card .menu { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .cbtn { font-family: 'Kalam', cursive; font-size: 22px; color: #1e1208; background: #e2d6b8; border: 0;
    padding: 8px 22px 6px; cursor: pointer; box-shadow: 0 3px 0 #6b4c2c, 0 4px 10px rgba(0,0,0,.35); transform: rotate(-1.5deg);
    -webkit-tap-highlight-color: transparent; }
  .cbtn:nth-child(even) { transform: rotate(1.5deg); }
  .cbtn.alt { background: #c8b893; font-size: 17px; }
  .cbtn:hover { filter: brightness(1.06); }
  .cbtn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 #6b4c2c; }
  #card .levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 14px 0 4px; max-height: 52vh; overflow-y: auto; padding: 4px 6px 8px;
    scrollbar-width: none; }   /* se sigue pudiendo deslizar, pero sin la barra */
  #card .levels::-webkit-scrollbar { display: none; }
  #card .lvl { background: #e2d6b8; border: 0; padding: 8px 4px 6px; cursor: pointer; box-shadow: 0 3px 0 #6b4c2c;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; color: #1e1208;
    -webkit-tap-highlight-color: transparent; }
  #card .lvl:nth-child(odd) { transform: rotate(-1deg); } #card .lvl:nth-child(even) { transform: rotate(1deg); }
  #card .lvl b { font-family: 'Kalam', cursive; font-size: 26px; line-height: 1; }
  #card .lvl small { font-size: 11px; }
  #card .lvl:disabled { opacity: .45; cursor: default; }
  #card .lvl:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #6b4c2c; }
  #card .st { color: #c98a12; font-size: 21px; line-height: 1.05; letter-spacing: 0; }   /* estrellitas de las fichas de niveles, grandes para leerlas de un vistazo */ #card .st i { color: rgba(60,40,20,.3); font-style: normal; }
  #card .stars { font-size: 46px; color: #e0a21a; text-shadow: 0 2px 0 #6b4c2c; letter-spacing: 6px; line-height: 1.1; }
  #card .stars span { color: rgba(60,40,20,.25); text-shadow: none; }
  #card .small { font-size: 13px; opacity: .8; }
  /* resultados de Historia: en el estilo del juego (cartón, cinta, marcador), no como un formulario */
  #card .lvlname { margin: -4px 0 4px; font-size: 14px; letter-spacing: .5px; opacity: .7; }
  @keyframes starDrop { from { transform: scale(2.3); opacity: 0; } 70% { transform: scale(.94); opacity: 1; } to { transform: scale(1); opacity: 1; } }   /* cae de frente, sin girar */
  /* cartel de fin de nivel, con la composición y los colores del boceto del usuario: cartón claro, el título en un cartel
     de papel que asoma arriba, las estrellas en un recuadro de cartón oscuro encintado, cajas de papel (quesos, tiempo,
     recompensa), el botón amarillo de la máquina y Repetir / Siguiente (verde) */
  #card:has(.win) { width: min(430px, calc(100vw - 24px)); margin-top: 14px; padding: 0 14px 16px; border: 3px solid #5b3a1b; border-radius: 16px;
    background-color: #c4915a; }
  #card .win { margin-top: -30px; color: #2b1a0b; }
  :is(#card, #opts) .wtitle { position: relative; z-index: 2; display: inline-block; margin: 0 auto; padding: 9px 28px 7px; background: #efdfbd;
    font-family: 'Kalam', cursive; line-height: 1; transform: rotate(-2deg);
    background-image: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.4), transparent 70%); box-shadow: 0 3px 0 #a07345, 0 6px 14px rgba(0,0,0,.35); }
  :is(#card, #opts) .wtitle b { display: block; font-weight: normal; font-size: 46px; letter-spacing: 1px; }
  :is(#card, #opts) .wtitle span { display: inline-block; margin-top: 3px; font-size: 25px; border-bottom: 3px solid #2b1a0b; }
  #card .wstars { position: relative; display: flex; justify-content: center; align-items: center; margin: -24px 4px 12px; padding: 34px 8px 12px;
    background: #9a6838 repeating-linear-gradient(0deg, rgba(0,0,0,.07) 0 3px, transparent 3px 7px);
    border: 6px solid #ead6ae; box-shadow: 0 3px 0 #8a6236, inset 0 0 18px rgba(40,20,5,.55); }
  :is(#card, #opts) .tp { position: absolute; width: 46px; height: 16px; background: rgba(240,236,225,.55); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  :is(#card, #opts) .tp:nth-of-type(1) { left: -18px; top: 2px; transform: rotate(-42deg); }
  :is(#card, #opts) .tp:nth-of-type(2) { right: -18px; top: 2px; transform: rotate(42deg); }
  :is(#card, #opts) .tp:nth-of-type(3) { left: -18px; bottom: 2px; transform: rotate(42deg); }
  :is(#card, #opts) .tp:nth-of-type(4) { right: -18px; bottom: 2px; transform: rotate(-42deg); }
  #card .wstar { position: relative; width: 31%; max-width: 104px; margin: 0 2px; flex: none; }   /* las de los costados, del mismo tamaño que antes y un poco hacia afuera */
  #card .wstar svg { display: block; width: 100%; height: auto; }
  #card .wstar .wsh { transform: translateY(7%) scale(1.16); }   /* un poco más grande y más abajo: asoma por debajo de la dorada */
  #card .wstar.off .wsh { transform: translateY(1%) scale(1.16); }   /* vacía (sin dorada encima): un poco más arriba, a la altura de las doradas */
  #card .wstar .wgold { position: absolute; inset: 0; filter: drop-shadow(0 4px 2px rgba(60,30,5,.45)); animation: starDrop .42s cubic-bezier(.2, .9, .3, 1.5) var(--d) both; }
  #card .wstar:nth-of-type(2) { top: -14px; width: 36%; max-width: 122px; }   /* la del medio, más grande y más arriba */
  #card .wray { position: absolute; width: 34px; height: 34px; top: 18px; }
  #card .wray svg { display: block; width: 100%; height: 100%; }
  #card .wray.l { left: 6px; } #card .wray.r { right: 6px; transform: scaleX(-1); }
  #card .wrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 10px; }
  /* capas: la caja del tiempo (con el sello del récord) va arriba de la recompensa, y la recompensa (con su etiqueta) arriba
     de la de los quesos, así cada una pisa a la vecina por donde se monta */
  #card .wstat.q { z-index: 1; } #card .wreward { z-index: 2; } #card .wstat:not(.q) { z-index: 3; }
  /* sin quesos (Desafío y el nivel 1) la caja del tiempo va a todo el ancho: queda debajo de la recompensa (así se ve la
     etiqueta) y el sello del récord se pega en su esquina de arriba a la derecha, donde no lo tapa nada */
  #card .wrow.solo .wstat { z-index: 1; }
  #card .wrow.solo .wbox .stamp { top: -14px; bottom: auto; left: auto; right: 12px; transform: rotate(5deg); animation-name: stampCorner; }
  @keyframes stampCorner { from { transform: rotate(20deg) scale(2); opacity: 0; } to { transform: rotate(5deg) scale(1); opacity: 1; } }
  #card .wrow.solo { grid-template-columns: 1fr; }
  :is(#card, #opts) .wbox { position: relative; padding: 8px 10px; background: #efdcb6; border-radius: 3px;
    background-image: radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.35), transparent 70%); box-shadow: 0 3px 0 #9b7244, 0 4px 8px rgba(0,0,0,.25); }
  :is(#card, #opts) .wbox h3 { margin: 0; font: 17px/1.2 'Kalam', cursive; letter-spacing: .5px; text-transform: uppercase; }
  :is(#card, #opts) .wbox .num { font: 44px/1 'Kalam', cursive; }
  /* quesos y tiempo: dos cajas iguales, el ícono grande a la izquierda y a su lado el título y el número */
  #card .wstat { display: flex; align-items: center; justify-content: center; gap: 8px; height: 84px; padding: 6px 8px; }
  #card .wstat > svg { flex: none; width: 58px; height: 58px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  #card .wstat.q > svg { transform: scale(1.25); margin: 0 6px 0 4px; }   /* el queso del HUD ocupa poco de su cuadro: así queda parejo con el reloj */
  #card .wstat > div { text-align: left; }
  #card .wstat h3 { font-size: 15px; }
  #card .wstat .num { display: block; font-size: 34px; white-space: nowrap; }
  /* el sello del récord va abajo de la caja del tiempo, así no tapa nada */
  :is(#card, #opts) .wbox .stamp { top: auto; bottom: -11px; z-index: 1; font-size: 18px; padding: 3px 14px 2px; background: #fff; transform: translateX(-50%) rotate(-4deg); animation-name: stampLow; }
  @keyframes stampLow { from { transform: translateX(-50%) rotate(-20deg) scale(2); opacity: 0; } to { transform: translateX(-50%) rotate(-4deg) scale(1); opacity: 1; } }
  /* cartel de inicio con el mismo formato: el título y una caja "Objetivo" con los quesos y el tiempo de las tres
     estrellas, separados por una rayita, y el botón verde para jugar */
  #card .wgoal { margin: 16px 2px 18px; padding: 10px 12px 14px; text-align: left; }
  #card .whead { display: inline-block; margin: 0 0 10px 4px; padding-bottom: 2px; font: 24px/1 'Kalam', cursive; text-transform: uppercase;
    border-bottom: 3px solid #2b1a0b; transform: rotate(-2deg); }
  #card .wgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 12px 4px; background: rgba(255,255,255,.35); border: 1px solid rgba(120,85,45,.25); border-radius: 4px; }
  #card .wgrid.solo { grid-template-columns: 1fr; }
  #card .wg { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #card .wg + .wg { border-left: 2px solid rgba(90,60,30,.3); }
  #card .wg > svg { flex: none; width: 56px; height: 56px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  #card .wg.q > svg { transform: scale(1.25); margin: 0 6px 0 4px; }
  #card .wg .num { display: block; font: 36px/1 'Kalam', cursive; white-space: nowrap; }
  #card .wg small { display: block; margin-top: 3px; font: 13px/1.1 'Kalam', cursive; text-transform: uppercase; }
  @media (max-width: 480px) { #card .wg { gap: 6px; } #card .wg > svg { width: 44px; height: 44px; } #card .wg .num { font-size: 30px; } #card .wg small { font-size: 11.5px; } }
  /* entrada animada de los carteles (animIn): cada parte entra a su turno (--ad); se usan translate / scale / rotate
     sueltos, así no pisan los transform (las inclinaciones) que ya tienen las piezas */
  .anim [data-a] { animation-duration: .38s; animation-timing-function: cubic-bezier(.2, .9, .3, 1.3); animation-fill-mode: both; animation-delay: var(--ad, 0s); }
  .anim [data-a="up"] { animation-name: aUp; }
  .anim [data-a="drop"] { animation-name: aDrop; }
  .anim [data-a="pop"] { animation-name: aPop; }
  @keyframes aUp { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0 0; } }
  @keyframes aDrop { from { opacity: 0; translate: 0 -34px; scale: 1.15; } to { opacity: 1; translate: 0 0; scale: 1; } }
  @keyframes aPop { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }
  @keyframes aBreath { from { scale: 1; } to { scale: 1.045; } }
  .anim .lvl:disabled[data-a] { animation-name: aPopDim; }   /* los bloqueados terminan apagados */
  @keyframes aPopDim { from { opacity: 0; scale: .4; } to { opacity: .45; scale: 1; } }
  /* el botón principal (Siguiente, Jugar, Reintentar) queda latiendo suave después de aparecer */
  .anim .wbtn.go[data-a] { animation-name: aPop, aBreath; animation-duration: .38s, 1.1s; animation-delay: var(--ad), calc(var(--ad) + .6s);
    animation-iteration-count: 1, infinite; animation-direction: normal, alternate; animation-fill-mode: both, none; animation-timing-function: cubic-bezier(.2, .9, .3, 1.3), ease-in-out; }
  /* el botón de la máquina "respira" para invitar a tocarlo */
  #card .wmach { animation: aBreath 1.3s ease-in-out 2.4s infinite alternate; }
  /* chispitas cuando cae cada estrella */
  #card .wstar .spk { position: absolute; left: 50%; top: 52%; width: 8px; height: 8px; margin: -4px; background: #fff4a8; border-radius: 1px; opacity: 0; pointer-events: none;
    animation: aSpark .55s ease-out calc(var(--d) + .3s) both; }
  @keyframes aSpark { 0% { opacity: 0; transform: rotate(var(--ang)) translateX(12px) rotate(45deg) scale(1); } 12% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--ang)) translateX(54px) rotate(45deg) scale(.3); } }
  /* el sello del récord: golpe y un temblorcito del cartel */
  .win.shake { animation: aShake .32s ease-out; }
  @keyframes aShake { 0%, 100% { translate: 0 0; } 20% { translate: -5px 2px; } 40% { translate: 4px -2px; } 60% { translate: -3px 1px; } 80% { translate: 2px 0; } }
  /* perder: la trampa se sacude al cerrarse; la linterna parpadea y se apaga */
  .anim .wlose > svg { animation: aSnap .5s ease-out .55s both; }
  .anim .wlose.lamp > svg { animation: aFlicker .9s linear .5s both; }
  @keyframes aSnap { 0% { rotate: 0deg; scale: 1; } 15% { rotate: -9deg; scale: 1.12; } 35% { rotate: 7deg; } 55% { rotate: -4deg; } 75% { rotate: 2deg; } 100% { rotate: 0deg; scale: 1; } }
  @keyframes aFlicker { 0%, 12%, 30%, 50% { opacity: 1; } 6%, 22%, 40% { opacity: .35; } 100% { opacity: .75; } }
  /* tocar el cartel mientras se arma: todo aparece de una */
  .anim.skip [data-a], .anim.skip .wgold, .anim.skip .stamp { animation-delay: 0s !important; animation-duration: .01s !important; }
  .anim.skip .wbtn.go[data-a] { animation-delay: 0s, .4s !important; animation-duration: .01s, 1.1s !important; }
  .anim.skip .spk { display: none; }
  /* portada con el formato nuevo: sin cartel de título (el logo es el título) */
  #card .wmenu { margin-top: 0; padding-top: 22px; }   /* aire de cartón arriba del logo, que no quede pegado al borde */
  #card .wmenu .logo { margin: 0 auto 26px; }   /* arriba, con el doble de aire hasta los controles que de los controles a Historia */
  #card .wctl { margin: 4px 2px 16px; padding: 4px 12px; }
  #card .wctl .ctl { margin: 0 auto; border: 0; }
  #card .wmenu .wbtns { grid-template-columns: 1fr 1fr; margin-top: 12px; }
  #card .wmenu .wbtns + .wbtns .wbtn { height: 54px; font-size: 21px; }
  #card .wbtn.yl { background: linear-gradient(#ffdc45, #f4b00e); color: #2b1a0b; border: 3px solid #b77d06; box-shadow: 0 4px 0 #8f5f05; }
  #card .wprice { display: inline-flex; align-items: center; gap: 4px; font-size: .8em; opacity: .85; }
  #card .wprice .ci { width: 1.05em; height: 1.05em; }
  /* selector de niveles: fichas de papel en una caja de papel encintada; las de los niveles a oscuras, oscuras */
  #card .wlevels { margin: 16px 2px 4px; padding: 10px 6px; background-color: #cfa96f; }   /* un marrón un poco más oscuro que el papel: las fichas se despegan del fondo */
  #card .wlevels .levels { margin: 0; }
  #card .lvl { background: #f6e9cc; border-radius: 6px; box-shadow: 0 3px 0 #9b7244; }
  #card .lvl.dark { background: #3a3542; color: #f1e3c2; box-shadow: 0 3px 0 #1d1a22; }
  #card .lvl.dark .st i { color: rgba(241,227,194,.25); }
  #card .lvl.dark small { opacity: .8; }
  /* carteles de perder (trampa o tiempo): el subtítulo en rojo y una caja con el dibujito y qué pasó */
  :is(#card, #opts) .wtitle.lose span { color: #b3140f; border-color: #b3140f; }
  #card .wlose { display: flex; align-items: center; gap: 14px; margin: 16px 2px 18px; padding: 16px 16px 14px; text-align: left; }
  #card .wlose > svg { flex: none; width: 76px; height: 76px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  #card .wlose b { display: block; font: 23px/1.1 'Kalam', cursive; font-weight: normal; }
  #card .wlose span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.3; }
  #card .wplay { width: 100%; height: 72px; gap: 14px; font-size: 32px; }
  #card .wbtns.intro { grid-template-columns: 72px 1fr; } #card .wbtns.intro .wbtn { height: 72px; }   /* inicio: el botón cuadrado de Niveles al lado de Jugar, del mismo alto */
  #card .wplay svg { width: 38px; height: 38px; }
  #card .wreward { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 0 14px; padding: 18px 10px 6px; }
  #card .wtag { position: absolute; left: 10px; top: -10px; padding: 3px 12px 1px; background: #f6cf4a;   /* amarilla (como las monedas y el botón de la máquina), así no se pierde contra la caja */ font: 17px/1.2 'Kalam', cursive;
    text-transform: uppercase; transform: rotate(-4deg); box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  #card .wcoins { position: relative; width: 82px; height: 58px; }
  #card .wcoins .ci { position: absolute; width: 50px; height: 50px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
  #card .wcoins .ci:first-child { left: 0; top: 8px; } #card .wcoins .ci:last-child { left: 30px; top: 0; }
  #card .wreward .num { font-size: 56px; }
  #card .wreward .wray { position: static; width: 26px; height: 26px; }
  #card .wmach { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 72px; margin: 0 0 14px; padding: 8px 12px 8px 90px;

  /* columna de la izquierda: la casita (o la flechita), debajo las monedas y debajo el queso, más grandes */
  #cheese { top: 64px; left: 14px; font-size: 24px; display: flex; align-items: center; gap: 7px; transform: rotate(1deg); padding: 3px 12px 1px; }
  #cheese svg { width: 27px; height: 27px; }
  #cheese.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  /* batería de la linterna (niveles a oscuras): 4 bloques de 15 s, debajo del queso */
  #lamp { top: 114px; left: 14px; display: flex; align-items: center; padding: 3px 12px 1px 10px; font-size: 24px; transform: rotate(-1deg); }
  #lamp::before { content: '\200b'; }   /* una línea de texto invisible: así mide lo mismo de alto que el queso */
  #lamp.up { top: 64px; }   /* sin queso, va en su lugar (entre monedas, queso y batería queda el mismo espacio: 8 px) */
  #lamp.pop { animation: levelPop .3s cubic-bezier(.2, .9, .3, 1.4) both; }
  #lamp .bat { position: relative; display: flex; gap: 2px; margin-right: 5px; padding: 2px; border: 2.5px solid #2b2d31; border-radius: 5px; background: #3a3d42; }
  #lamp .bat::after { content: ''; position: absolute; right: -6.5px; top: 50%; width: 3.5px; height: 40%; transform: translateY(-50%); background: #2b2d31; border-radius: 0 3px 3px 0; }
  #lamp .bat i { width: .46em; height: .5em; border-radius: 2px; background: #25272b; }
  #lamp .bat i.on { background: linear-gradient(#e9f56a, #b8d42a); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
  #lamp .bat i.low { background: linear-gradient(#ffb15a, #f07a18); }
  #lamp .bat i.crit { background: linear-gradient(#ff7a6a, #d8281a); }
  #lamp .bat i.blink { opacity: .25; }
  /* monedas: siempre a la vista arriba a la izquierda (en el juego, al lado de la casita) */
  #coins { position: fixed; top: 14px; left: 14px; z-index: 8; font-size: 24px; display: flex; align-items: center; gap: 7px;   /* arriba a la izquierda */
    transform: rotate(-1.5deg); padding: 3px 12px 1px; pointer-events: none; }

  #coins .ci { width: 25px; height: 25px; }
  #coins.below { top: 64px; }   /* en las pantallas con flechita de volver, debajo de ella */

  @keyframes coinPop { from { transform: scale(1.3); } to { transform: scale(1); } }
  .ci { width: 1em; height: 1em; vertical-align: -0.14em; }
  #card .menu.sub { margin-top: 10px; }
  /* pantallas a pantalla completa (Ratitas, Máquina): fondo negro que entra y sale con un círculo desde el botón */
  #screen { position: fixed; inset: 0; z-index: 7; background: #000; pointer-events: none;
    clip-path: circle(0px at var(--x, 50%) var(--y, 50%)); -webkit-clip-path: circle(0px at var(--x, 50%) var(--y, 50%));
    transition: clip-path .45s ease-in-out, -webkit-clip-path .45s ease-in-out; }
  #screen.open { pointer-events: auto; clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); -webkit-clip-path: circle(150vmax at var(--x, 50%) var(--y, 50%)); }
  #screen .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
    padding: 64px 12px calc(14px + env(safe-area-inset-bottom)); gap: 8px; opacity: 0; transition: opacity .25s; text-align: center; color: #e9dcc0; }
  #screen.open .inner.show { opacity: 1; }
  #screen .stitle { font-family: 'Kalam', cursive; font-weight: normal; font-size: 46px; margin: 0; color: #f1e4c4; line-height: 1; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  #screen .ssub { margin: 0; font-size: 15px; color: #bfae8c; }
  /* Bioterio y Máquina: el título sube a la altura de la flechita y el engranaje; los estantes arrancan debajo de las monedas */
  #screen .stitle.up { margin-top: -52px; }
  #screen .sbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; flex: 0 0 auto; }
  /* ratitas: estantes de metal de punta a punta de la pantalla, sobre el negro; las jaulas centradas en cada estante */
  /* Bioterio: el fondo, las jaulas y el título se deslizan juntos detrás de los botones, que quedan fijos (sin barra) */
  #screen .inner > .rack { position: absolute !important; inset: 0; z-index: 0 !important; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .rackin { position: relative; overflow: hidden; }
  /* franjas oscuras: la de arriba queda pegada arriba mientras se desliza (por encima de las jaulas, debajo del título) */
  .bandtop { position: sticky; top: 0; z-index: 1; pointer-events: none; background: linear-gradient(rgba(0,0,0,.9), rgba(0,0,0,0)); }
  .rackin .biohead { z-index: 2; }
  #screen .inner > .bandbot { position: absolute !important; left: 0; right: 0; bottom: 0; z-index: 1 !important; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,0)); }
  /* fondo de la Máquina, en su capa: se apaga (y vuelve) fundiéndose */
  #screen .inner > .scrbg { position: absolute !important; inset: -12px; z-index: 0 !important; pointer-events: none; transition: opacity .25s ease; }
  #screen .inner > .scrbg.dark { transition: opacity .6s ease; }   /* se apaga despacio cuando salta la cápsula; vuelve rápido con "Otra vez" */
  #screen .inner > .scrbg.dark { opacity: 0; }
  #screen .inner > .labbg { position: absolute !important; inset: -12px; z-index: 0 !important; pointer-events: none; opacity: 0; will-change: opacity; }   /* el laboratorio de la ratita del premio (en su propia capa: aparecer cambiándole la opacidad cuadro a cuadro no lo vuelve a pintar) */
  #screen .inner > .scrbg { will-change: opacity; }   /* el fondo se corta donde termina el deslizamiento */
  .biohead { position: absolute; top: 12px; left: 0; right: 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #screen .bionav { margin-top: auto; }
  /* la casita (a la portada) va abajo, cuadrada, a la izquierda del botón Máquina / Bioterio: así las monedas quedan
     siempre arriba a la izquierda, en el mismo lugar que en el juego */
  #screen .sbtns .cbtn.home { display: inline-grid; place-items: center; padding: 0 12px; }
  #screen .sbtns .cbtn.home svg { width: 26px; height: 26px; }
  .rack::-webkit-scrollbar { display: none; }
  .bgrack { position: absolute; background: url(img/fondo-bioterio.jpg) 0 0 / 100% 100% no-repeat; }
  .bgrack .rat { position: absolute; }
  .rat { position: relative; z-index: 1; background: none; border: 0; padding: 0; cursor: pointer; display: block;
    width: min(calc(100vw / var(--cols)), 280px); -webkit-tap-highlight-color: transparent; }
  .rat canvas { display: block; width: 100%; }   /* (la proporción la da el lienzo: CAGE_W × CAGE_H) */
  .rat:disabled { cursor: default; }
  .rat:not(:disabled):active canvas { transform: scale(.96); }
  /* máquina */
  /* la máquina grande y un poco más abajo; el espacio que sobra se reparte arriba de ella y antes del botón Bioterio */
  #gachaCv { display: block; width: min(calc(100vh - 230px), 100vw); aspect-ratio: 1; flex: 0 0 auto; margin-top: auto; }
  #gachaNav { margin-top: auto; }
  #gachaBtns { min-height: 48px;   /* aunque esté vacío (mientras anda) ocupa lo mismo: la máquina no se corre */
    /* subido (sin mover nada más) hasta justo debajo del borde de la mesada, como marcó el usuario; la mesada termina
       6,3 unidades antes del pie del canvas de la máquina, que mide min(100vh - 230px, 100vw) = 300 unidades */
    top: calc(-9px - 0.021 * min(100vh - 230px, 100vw)); }
  #gachaRes:empty { min-height: 0; }   /* sin texto (en reposo) el botón Activar queda justo debajo de la máquina */
  /* luz de la baliza: un canvas a pantalla completa detrás del título, el texto y los botones */
  #gachaFx, #gachaFx2 { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #gachaFx2 { z-index: 2; }   /* la capa de adelante: ahí va la ratita del premio, así no la corta el borde del canvas */
  #screen .inner > :not(#gachaFx):not(#gachaFx2) { position: relative; z-index: 1; }
  #screen .inner > .stitle, #gachaRes, #gachaBtns, #gachaNav { z-index: 3; }   /* los textos y botones quedan arriba de la luz */
  #gachaRes { min-height: 2.8em; margin: 0; font-size: 16px; text-shadow: 0 0 6px #000, 0 2px 4px #000, 0 0 14px rgba(0,0,0,0.8); }
  .gname { font-family: 'Kalam', cursive; font-size: 30px; color: #f6e7bf; }
  .cbtn:disabled { opacity: .5; cursor: default; }
  /* portada */
  #card .lead { margin: 4px 0 12px; }
  #card .lead p { margin: 2px 0; font-size: 16px; line-height: 1.35; text-wrap: balance; }
  #card .ctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px auto 2px; padding: 10px 0;
    border-top: 1px dashed rgba(60,35,10,.35); border-bottom: 1px dashed rgba(60,35,10,.35); max-width: 400px; }
  #card .ctl span:last-child { text-align: left; font-size: 14px; line-height: 1.35; }

  /* arriba a la derecha: la ruedita (jugando pausa; en los menús abre las opciones) */
  #btnBack, #coins, #btnGear, #gachaNav { transition: opacity .3s ease; }
  .faded { opacity: 0 !important; pointer-events: none !important; }   /* se desvanece (la máquina andando) */
  #topbtns { position: fixed; top: 12px; right: 14px; display: flex; gap: 8px; z-index: 8; }
  #btnGear svg { width: 27px; height: 27px; }
  /* ventana de pausa / opciones: Música y Sonido con interruptores, y abajo la casita y Reanudar (o Cerrar) */
  #opts { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(0,0,0,.72); }   /* oscurece bien lo de atrás */
  #opts.hidden { display: none; }
  /* pausa / opciones: con el formato de los carteles nuevos (cartón claro, título de papel que asoma arriba, caja de papel
     encintada con Música y Sonido, y botones grandes: la casita y Reanudar en verde, o Cerrar) */
  #opts .box { width: min(400px, calc(100vw - 24px)); box-sizing: border-box; margin-top: 14px; padding: 0 14px 16px; text-align: center; transform: rotate(-1deg);
    background: #c4915a; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 3px, transparent 3px 7px),
      radial-gradient(ellipse at 30% 20%, rgba(255,230,190,.25), transparent 60%);
    border: 3px solid #5b3a1b; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.8), inset 0 0 30px rgba(60,35,10,.35); color: #2b1a0b;
    animation: optsIn .22s cubic-bezier(.2, .9, .3, 1.25) both; }
  @keyframes optsIn { from { transform: rotate(-5deg) scale(.6); opacity: 0; } to { transform: rotate(-1deg) scale(1); opacity: 1; } }
  /* al cerrarse (sacar la pausa, cerrar opciones) se achica y se va, como entró pero al revés; el fondo oscuro se aclara */
  /* fundido a negro entre pantallas (fadeTo): por encima de todo menos la librería */
  #fade { position: fixed; inset: 0; z-index: 50; background: #000; opacity: 0; pointer-events: none; transition: opacity .16s ease; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #opts:not(.hidden) { animation: optsBgIn .18s ease-out both; }
  #opts.closing { animation: optsBgOut .16s ease-in both; pointer-events: none; }
  #opts.closing .box { animation: optsOut .16s ease-in both; }
  @keyframes optsOut { from { transform: rotate(-1deg) scale(1); opacity: 1; } to { transform: rotate(4deg) scale(.6); opacity: 0; } }
  @keyframes optsBgIn { from { background: rgba(0,0,0,0); } }
  @keyframes optsBgOut { to { background: rgba(0,0,0,0); } }
  #opts .box > .wtitle { margin-top: -30px; padding: 12px 34px 10px; }
  #opts .orows { margin: 18px 2px 18px; padding: 6px 16px; text-align: left; }
  #opts .opt { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; font: 23px/1.1 'Kalam', cursive; }
  #opts .opt + .opt { border-top: 2px dashed rgba(90,60,30,.3); }
  #opts .opt span { display: flex; align-items: center; gap: 12px; }
  #opts .opt svg { width: 28px; height: 28px; }
  #opts .tog { position: relative; width: 56px; height: 30px; border: 0; border-radius: 15px; background: #7d6a52; cursor: pointer;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; transition: background .15s; }
  #opts .tog::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #e2d6b8;
    box-shadow: 0 2px 2px rgba(0,0,0,.35); transition: left .15s; }
  #opts .tog.on { background: #6f9e3c; } #opts .tog.on::after { left: 29px; }
  :is(#card, #opts) .wbtns.home { grid-template-columns: 66px 1fr; }   /* el botón cuadrado (casita o niveles) y el principal a lo ancho */
  :is(#card, #opts) .wbtns.three { grid-template-columns: 62px 1fr 1.25fr; gap: 10px; }
  #opts .wbtns.pause { grid-template-columns: 66px 66px 1fr; gap: 10px; }   /* pausa: casita, reiniciar y Reanudar */

  .btn.tape { position: static; width: 44px; height: 44px; padding: 0; border: 0; display: grid; place-items: center;

  /* controles táctiles */
  body:not(.touch) #hintTouch { display: none; }
  body.touch #hint { display: none !important; }
  #hintTouch { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: 13px; color: #a08060; opacity: .75; pointer-events: none; padding: 0 120px; }
  /* joystick flotante: aparece donde apoyás el dedo */

  body.touch.playing #stickZone { display: block; }
  #stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; pointer-events: none;
    background: rgba(217,207,178,.10); border: 2px solid rgba(217,207,178,.38); display: none; z-index: 4; }
  #stick.on { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;

// ===================== CONSTANTES (tuneables) =====================

const LIGHT_R = 5.2 * C;   // alcance de la linterna
// alrededor de la linterna, una luz tenue y redonda (cortada por las paredes) deja ver un poco lo que hay cerca, también
// atrás y a los costados; el haz de la linterna no cambia
const AURA_R = LIGHT_R * 0.42, AURA_A = 0.25;
// qué tan cerca hay que pasar para agarrar una moneda o un queso (antes 23 y 21: costaba un poco agarrarlos)
const PICK_COIN = 30, PICK_CHEESE = 28;

// Tamaños de laberinto por nivel (columnas x filas)
const SIZES = [[7,4],[9,5],[11,6],[13,8],[16,9],[19,11],[22,13],[26,15],[30,17],[34,19]];
function sizeFor(n) {
  if (n <= SIZES.length) return SIZES[n - 1];
  const e = n - SIZES.length;
  return [Math.min(60, 34 + 3 * e), Math.min(34, 19 + 2 * e)];
}
// Cuántas celdas de ancho entran en pantalla: al principio el laberinto entra casi entero,
// después la cámara se acerca y el laberinto crece, así deja de verse completo.
function viewCells(n) { return Math.max(6, 9 - 0.4 * (n - 1)); }
// Tiempo según el largo del camino más corto
function timeFor(n, pathCells) {
  const factor = Math.max(2.2, 4.2 - 0.25 * (n - 1));
  return Math.ceil((8 + pathCells * C / SPEED * factor) / 5) * 5;
}

// ===================== MODO HISTORIA =====================

  save() { try { localStorage.setItem('raton.story', JSON.stringify(this.data)); } catch (_) {} },
  // guarda el resultado y devuelve lo que había antes (para el récord y las estrellas nuevas)
  finish(i, stars, time) {
    const d = this.data; d.best = d.best || [];
    const prev = { stars: d.stars[i] || 0, best: d.best[i] };
    d.stars[i] = Math.max(prev.stars, stars);

// ===================== LABERINTO =====================
function genMaze(W, H, rng, loopFrac) {
  const hW = [], vW = [];
  for (let r = 0; r <= H; r++) hW.push(new Array(W).fill(true));   // hW[r][c]: pared superior de la fila r
  for (let c = 0; c <= W; c++) vW.push(new Array(H).fill(true));   // vW[c][r]: pared izquierda de la columna c
  const vis = new Uint8Array(W * H);
  const sr = Math.floor(rng() * H); vis[sr * W + W - 1] = 1;
  const stack = [[W - 1, sr]];
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const nb = [];
    if (c > 0 && !vis[r * W + c - 1]) nb.push([c - 1, r, 0]);
    if (c < W - 1 && !vis[r * W + c + 1]) nb.push([c + 1, r, 1]);
    if (r > 0 && !vis[(r - 1) * W + c]) nb.push([c, r - 1, 2]);
    if (r < H - 1 && !vis[(r + 1) * W + c]) nb.push([c, r + 1, 3]);
    if (!nb.length) { stack.pop(); continue; }
    const [nc, nr, d] = nb[Math.floor(rng() * nb.length)];
    if (d === 0) vW[c][r] = false; else if (d === 1) vW[c + 1][r] = false; else if (d === 2) hW[r][c] = false; else hW[r + 1][c] = false;
    vis[nr * W + nc] = 1; stack.push([nc, nr]);
  }
  // algunos ciclos para confundir (se abren paredes al azar)
  const loops = Math.floor(W * H * loopFrac);
  for (let i = 0; i < loops; i++) {
    if (rng() < 0.5) { const c = 1 + Math.floor(rng() * (W - 1)), r = Math.floor(rng() * H); vW[c][r] = false; }
    else { const r = 1 + Math.floor(rng() * (H - 1)), c = Math.floor(rng() * W); hW[r][c] = false; }
  }
  const entRow = Math.floor(rng() * H), exitRow = Math.floor(rng() * H);
  vW[W][entRow] = false; vW[0][exitRow] = false;
  return { W, H, hW, vW, entRow, exitRow };
}

// Distancia (en celdas) desde una celda a todas las demás, recorriendo el laberinto
function bfs(m, c0, r0) {
  const { W, H } = m, dist = new Int32Array(W * H).fill(-1);
  const q = [[c0, r0]]; dist[r0 * W + c0] = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const [c, r] = q[qi], d = dist[r * W + c];
    const go = (nc, nr) => { if (dist[nr * W + nc] < 0) { dist[nr * W + nc] = d + 1; q.push([nc, nr]); } };
    if (c > 0 && !m.vW[c][r]) go(c - 1, r);
    if (c < W - 1 && !m.vW[c + 1][r]) go(c + 1, r);
    if (r > 0 && !m.hW[r][c]) go(c, r - 1);
    if (r < H - 1 && !m.hW[r + 1][c]) go(c, r + 1);
  }
  return dist;
}
// Largo del camino más corto, contando el corral de inicio y el umbral de salida
function pathLen(m) {
  const d = bfs(m, m.W - 1, m.entRow)[m.exitRow * m.W];
  return d < 0 ? m.W * m.H : d + 3;
}

// Paredes como rectángulos (tramos colineales fusionados)
function buildRects(m, rng) {
  const rects = [];
  for (let r = 0; r <= m.H; r++) {
    let c = 0;
    while (c < m.W) {
      if (!m.hW[r][c]) { c++; continue; }
      const c0 = c; while (c < m.W && m.hW[r][c]) c++;
      rects.push({ x: c0 * C - T / 2, y: r * C - T / 2, w: (c - c0) * C + T, h: T });
    }
  }
  for (let c = 0; c <= m.W; c++) {
    let r = 0;
    while (r < m.H) {
      if (!m.vW[c][r]) { r++; continue; }
      const r0 = r; while (r < m.H && m.vW[c][r]) r++;
      rects.push({ x: c * C - T / 2, y: r0 * C - T / 2, w: T, h: (r - r0) * C + T });
    }
  }
  // corral de inicio, fuera de la entrada
  const W = m.W, er = m.entRow;
  rects.push({ x: W * C - T / 2, y: er * C - T / 2, w: C + T, h: T });
  rects.push({ x: W * C - T / 2, y: (er + 1) * C - T / 2, w: C + T, h: T });
  rects.push({ x: (W + 1) * C - T / 2, y: er * C - T / 2, w: T, h: C + T });
  // cinta de embalar en algunas uniones
  for (const R of rects) {
    R.tapes = [];
    const len = Math.max(R.w, R.h);
    for (let k = 0; T / 2 + k * C <= len; k++) if (rng() < 0.3) R.tapes.push(T / 2 + k * C + (rng() - 0.5) * 6);
  }
  return rects;
}

const MARKS = ['?', 'X', 'A-3', 'B-7', 'N°4', '!!', '///', '12', 'LAB', 'x2', '→', '↑', '←', 'O', '#', 'no', '7', 'C-1', '?!', '≈', 'R2', '✓'];
function buildDeco(m, rng) {
  const Wp = m.W * C, Hp = m.H * C, sx = [], sy = [], tapes = [], marks = [];
  for (let x = 110 + rng() * 120; x < Wp - 40; x += 150 + rng() * 170) sx.push(x);
  for (let y = 110 + rng() * 120; y < Hp - 40; y += 150 + rng() * 170) sy.push(y);
  for (const x of sx) for (let y = 20; y < Hp - 20; y += 90) if (rng() < 0.3) { const l = 24 + rng() * 26; tapes.push({ x: x - l / 2, y, w: l, h: 11 }); }
  for (const y of sy) for (let x = 20; x < Wp - 20; x += 90) if (rng() < 0.3) { const l = 24 + rng() * 26; tapes.push({ x, y: y - l / 2, w: 11, h: l }); }
  const n = Math.floor(m.W * m.H / 6);
  for (let i = 0; i < n; i++) {
    const c = Math.floor(rng() * m.W), r = Math.floor(rng() * m.H);
    if ((c === 0 && r === m.exitRow) || (c === m.W - 1 && r === m.entRow)) continue;
    marks.push({ x: (c + 0.25 + rng() * 0.5) * C, y: (r + 0.3 + rng() * 0.4) * C, rot: (rng() - 0.5) * 0.9,
      size: 9 + rng() * 6, text: MARKS[Math.floor(rng() * MARKS.length)],
      color: rng() < 0.2 ? 'rgba(140,22,18,0.75)' : 'rgba(35,24,14,0.55)' });
  }
  return { sx, sy, tapes, marks };
}

// ===================== ITEMS (mecánicas de Historia) =====================
const TRAP_L = 52, TRAP_W = 27;        // trampa (más grande que la rata; casi todo el largo del callejón)
const TRAY_W = 48, TRAY_L = Math.round(TRAY_W * 62 / 32);   // bandeja de pegamento: casi todo el ancho del pasillo, largo proporcional
const STICKY_SLOW = 0.35, STICKY_T = 1.5;     // al salir: recupera desde STICKY_SLOW en STICKY_T segundos
const STICKY_ON = 0.38, STICKY_PAW = 0.06;    // encima: 0.38 de velocidad, menos 0.06 por cada pata apoyada (4 patas: 0.14)

// Coloca los items de un nivel según sus reglas. Todo sale del rng del nivel, así que siempre queda igual.
function placeItems(L, m, rng) {
  const { W, H } = m, idx = (c, r) => r * W + c;

  const near = (c, r, [c2, r2], d) => Math.abs(c - c2) + Math.abs(r - r2) <= d;
  const special = (c, r, d = 0) => near(c, r, ent, d) || near(c, r, ext, d);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const cells = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) cells.push([c, r]);
  const center = (c, r) => [(c + 0.5) * C, (r + 0.5) * C];
  // elige hasta n celdas separadas entre sí al menos minSep (distancia en grilla)
  const pick = (cands, n, minSep, chosen = []) => {
    const out = [];
    for (const cell of cands) {
      if (out.length >= n) break;
      if ([...chosen, ...out].some(o => Math.abs(o[0] - cell[0]) + Math.abs(o[1] - cell[1]) < minSep)) continue;
      out.push(cell);
    }

  };

  // Trampas: solo al fondo de callejones sin salida, fuera del camino y lejos de la entrada y la salida
  if (L.traps) {

    const cand = shuffle(cells.filter(([c, r]) => walls(c, r).filter(Boolean).length === 3 && !onPath(idx(c, r)) && !special(c, r, 1)));
    for (const [c, r] of pick(cand, L.traps, 2)) {

      const a = !top ? -Math.PI / 2 : !bottom ? Math.PI / 2 : !left ? Math.PI : 0;   // hacia la abertura del callejón
      const [x, y] = center(c, r);
      const back = C / 2 - T / 2 - TRAP_L / 2;   // fondo de la trampa contra la pared del callejón
      items.push({ type: 'trap', x: x - Math.cos(a) * back, y: y - Math.sin(a) * back, a, closed: false, t: 0 });
      used.push([c, r]);
    }
  }
  // Pegamento: solo en tramos rectos de pasillo (dos celdas seguidas con paredes a ambos lados, nunca en cruces ni
  // esquinas), centrada en el pasillo y ocupando casi todo su ancho; puede ir en el camino, más probable cerca de la salida

    }
    const ok = segs.filter(s => !special(...s.a) && !special(...s.b) && dX[idx(...s.a)] >= 0);
    ok.forEach(s => { const i = idx(...s.a); s.key = rng() * (1 + 3 * (1 - dX[i] / maxX)) * (onPath(i) ? 1.5 : 1); });
    ok.sort((p, q) => q.key - p.key);
    const chosen = [];
    for (const s of ok) {
      if (chosen.length >= L.sticky) break;
      const busy = used.concat(...chosen.map(q => [q.a, q.b]));
      if (busy.some(u => Math.abs(u[0] - s.a[0]) + Math.abs(u[1] - s.a[1]) < 2 || Math.abs(u[0] - s.b[0]) + Math.abs(u[1] - s.b[1]) < 2)) continue;
      chosen.push(s);
    }
    for (const s of chosen) {
      const x = (s.a[0] + s.b[0] + 1) / 2 * C, y = (s.a[1] + s.b[1] + 1) / 2 * C;   // centro del tramo de dos celdas
      const w = s.vert ? TRAY_W : TRAY_L, h = s.vert ? TRAY_L : TRAY_W;
      items.push({ type: 'sticky', x: x - w / 2, y: y - h / 2, w, h });
      used.push(s.a, s.b);
    }
  }
  // Quesos: preferentemente fuera del camino más corto (para que haya que desviarse), separados entre sí
  if (L.cheese) {
    const free = cells.filter(([c, r]) => !special(c, r) && dE[idx(c, r)] >= 0 && !used.some(u => u[0] === c && u[1] === r));
    const off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r)))), on = shuffle(free.filter(([c, r]) => onPath(idx(c, r))));
    let chosen = pick(off, L.cheese, 4, used);
    if (chosen.length < L.cheese) chosen = chosen.concat(pick(off.concat(on), L.cheese - chosen.length, 2, used.concat(chosen)));
    for (const [c, r] of chosen) {
      const [x, y] = center(c, r);
      items.push({ type: 'cheese', x: x + (rng() - 0.5) * 16, y: y + (rng() - 0.5) * 16, rot: rng() * Math.PI * 2, got: false });
      used.push([c, r]);
    }
  }
  // Puertas de un solo sentido: en una pared entre dos celdas vecinas que por el laberinto están lejos.
  // Se pasa de A (lado del agujero) a B (lado de la cortina): A es la celda más lejana a la salida, así es un atajo de ida.
  if (L.doors) {
    const pairs = [];
    for (const [c, r] of cells) {
      if (special(c, r, 1)) continue;
      const d = bfs(m, c, r);
      if (c + 1 < W && m.vW[c + 1][r] && !special(c + 1, r, 1) && d[idx(c + 1, r)] >= 8) pairs.push({ a: [c, r], b: [c + 1, r], gain: d[idx(c + 1, r)] });

    }
    shuffle(pairs).sort((p, q) => q.gain - p.gain);

    for (const p of pairs) {

      const near = (list, dmin) => list.some(u => Math.abs(u[0] - p.a[0]) + Math.abs(u[1] - p.a[1]) < dmin || Math.abs(u[0] - p.b[0]) + Math.abs(u[1] - p.b[1]) < dmin);

      const [from, to] = dX[idx(...p.a)] >= dX[idx(...p.b)] ? [p.a, p.b] : [p.b, p.a];
      const [ax, ay] = center(...from), [bx, by] = center(...to);
      items.push({ type: 'door', dx: Math.sign(bx - ax), dy: Math.sign(by - ay), wx: (ax + bx) / 2, wy: (ay + by) / 2,
        passing: false, ang: DOOR_REST, av: 0, rattle: 0 });
      used.push(p.a, p.b);
    }
  }
  // Molinetes: en cruces (celdas con 3 o 4 salidas, así siempre hay por dónde escapar del aspa), en lo posible en el
  // camino más corto (hay que pasarlos sí o sí), lejos de la entrada, la salida y de los otros objetos. Van al final, así
  // no cambian dónde caen los demás. Las aspas no llegan a las paredes del cruce.
  if (L.spinners) {
    const opens = (c, r) => [!m.hW[r][c], !m.hW[r + 1][c], !m.vW[c][r], !m.vW[c + 1][r]].filter(Boolean).length;
    const free = cells.filter(([c, r]) => opens(c, r) >= 3 && !special(c, r, 2) && dE[idx(c, r)] >= 0);
    const on = shuffle(free.filter(([c, r]) => onPath(idx(c, r)))), off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r))));
    pick(on.concat(off), L.spinners, 2, used).forEach(([c, r], k) => {
      const [x, y] = center(c, r);
      items.push({ type: 'spinner', x, y, a0: rng() * Math.PI / 2, dir: k % 2 ? -1 : 1 });
      used.push([c, r]);
    });
  }
  // Compuertas: en pasillos rectos (paredes a los dos costados, entrada y salida enfrentadas), en lo posible en el
  // camino más corto, lejos de la entrada, la salida y de los otros objetos. Cada una con su desfase en el ciclo.
  if (L.gates) {
    const straight = (c, r) => {
      const up = m.hW[r][c], dn = m.hW[r + 1][c], lf = m.vW[c][r], rt = m.vW[c + 1][r];
      return up && dn && !lf && !rt ? 'h' : lf && rt && !up && !dn ? 'v' : null;
    };
    const free = cells.filter(([c, r]) => straight(c, r) && !special(c, r, 2) && dE[idx(c, r)] >= 0);
    const on = shuffle(free.filter(([c, r]) => onPath(idx(c, r)))), off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r))));
    pick(on.concat(off), L.gates, 2, used).forEach(([c, r]) => {
      const [x, y] = center(c, r);
      const vert = straight(c, r) === 'v', [p, q] = vert ? [[c, r - 1], [c, r + 1]] : [[c - 1, r], [c + 1, r]];
      const far = (a, b) => (dX[idx(...a)] ?? -1) - (dX[idx(...b)] ?? -1);   // de qué lado se viene (más lejos de la salida)
      items.push({ type: 'gate', x, y, vert, ph: rng() * GATE_CYCLE, side: far(q, p) >= 0 ? 1 : -1 });
      used.push([c, r]);
    });
  }
  return items;
}

// Monedas que hacen elegir, no juntar por juntar, y pocas (una ratita sale COIN_PRICE): en el camino más corto van
// unas pocas sueltas (la ruta directa es la más rápida pero rinde poco) y fuera del camino un tesorito de 3 a 5, más
// grande cuanto más largo es el desvío (cuesta tiempo, y la tercera estrella pide un tiempo justo). En Historia son
// unas 6 a 9 por nivel (dos o tres sueltas y un tesoro; dos tesoros en los laberintos grandes). En Desafío el nivel N
// tiene N monedas en total (budget): sirve para juntar, pero rinde ir más lejos. Usan su propio rng, así no cambian
// dónde caen los otros items. No van en la entrada, la salida ni encima de otro item.
const COIN_DETOUR_S = 2.5;   // en los tesoros: una moneda por cada tantos segundos de desvío (de 3 a 5)
// Pilas de los niveles a oscuras: n repartidas parejo a lo largo del camino más corto (si el lugar está ocupado, la
// celda libre más cercana del camino), así siguiéndolo siempre alcanza la linterna
function placeBatteries(m, items, n) {
  const { W, H } = m, out = [];
  const dE = bfs(m, W - 1, m.entRow), dX = bfs(m, 0, m.exitRow), D = dE[m.exitRow * W];
  const path = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (dE[r * W + c] >= 0 && dE[r * W + c] + dX[r * W + c] === D) path.push([c, r, dE[r * W + c]]);
  path.sort((p, q) => p[2] - q[2]);

  for (let k = 1; k <= n; k++) {
    const want = Math.round(k * (path.length - 1) / (n + 1));
    for (let j = 0; j < path.length; j++) {
      const idx = want + (j % 2 ? -1 : 1) * Math.ceil(j / 2);
      if (idx < 1 || idx > path.length - 2) continue;
      const x = (path[idx][0] + 0.5) * C, y = (path[idx][1] + 0.5) * C;
      if (!busy(x, y)) { out.push({ type: 'battery', x, y, got: false, ph: k * 1.7 }); break; }
    }
  }
  return out;
}
function placeCoins(m, items, seed, budget = null) {
  const rng = mulberry32(seed), { W, H } = m, out = [];
  const dE = bfs(m, W - 1, m.entRow), dX = bfs(m, 0, m.exitRow), D = dE[m.exitRow * W];
  const busy = (x, y) => items.some(it => Math.hypot((it.x ?? it.wx) - x, (it.y ?? it.wy) - y) < C * 0.75) ||
    out.some(o => Math.hypot(o.x - x, o.y - y) < C * 0.75);
  const isEnd = (c, r) => (c === W - 1 && r === m.entRow) || (c === 0 && r === m.exitRow);
  const coin = (x, y) => out.push({ type: 'coin', x, y, got: false, ph: rng() * 6 });
  // cuántas sueltas y qué tesoros: en Historia fijo según el tamaño; en Desafío se reparten las N del nivel
  let singles, treasures;
  if (budget == null) {
    singles = 2 + (rng() < 0.5 ? 1 : 0);
    treasures = Array(W * H >= 220 ? 2 : 1).fill(null);   // null: el tamaño sale del desvío
  } else {
    singles = Math.min(budget, budget <= 3 ? budget : 2);
    treasures = [];
    for (let left = budget - singles; left > 0; left -= 5) treasures.push(Math.min(5, left));
  }
  // 1) en el camino más corto: sueltas, repartidas parejo a lo largo
  const path = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (dE[r * W + c] >= 0 && dE[r * W + c] + dX[r * W + c] === D) path.push([c, r, dE[r * W + c]]);
  path.sort((p, q) => p[2] - q[2]);
  let placed = 0;
  for (let k = 0; k < singles * 3 && placed < singles; k++) {   // si un lugar está ocupado, prueba un poco más allá
    const f = (placed + 0.5 + (rng() - 0.5) * 0.4) / singles, idx = clamp(Math.round(2 + f * (path.length - 4)) + (k % 3), 1, path.length - 2);
    const [c, r] = path[idx], x = (c + 0.5) * C, y = (r + 0.5) * C;
    if (!isEnd(c, r) && !busy(x, y)) { coin(x, y); placed++; }
  }
  // 2) tesoros fuera del camino: los callejones pesan más; cada uno vale más cuanto más largo es el desvío
  const off = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c, det = dE[i] + dX[i] - D;   // celdas de más que hay que caminar para pasar por acá
    if (dE[i] < 0 || det < 3 || isEnd(c, r)) continue;
    const walls = [m.vW[c][r], m.vW[c + 1][r], m.hW[r][c], m.hW[r + 1][c]].filter(Boolean).length;
    off.push({ c, r, det, w: (walls === 3 ? 2.5 : 1) * Math.min(det, 12) });
  }
  const stash = [];
  while (stash.length < treasures.length && off.length) {
    let tot = off.reduce((acc, o) => acc + o.w, 0), pick = rng() * tot, j = 0;
    while (j < off.length - 1 && (pick -= off[j].w) > 0) j++;
    const st = off.splice(j, 1)[0], x = (st.c + 0.5) * C, y = (st.r + 0.5) * C;
    if (stash.some(o => Math.abs(o.c - st.c) + Math.abs(o.r - st.r) < 3) || busy(x, y)) continue;
    const n = treasures[stash.length] ?? clamp(Math.round(st.det * C / SPEED / COIN_DETOUR_S), 3, 5);
    stash.push(st);
    const L = !m.vW[st.c][st.r], R = !m.vW[st.c + 1][st.r], U = !m.hW[st.r][st.c], Dn = !m.hW[st.r + 1][st.c];
    const horiz = L && R && !U && !Dn, vert = U && Dn && !L && !R;
    if (horiz || vert) {   // en hilera a lo largo del pasillo (de a dos filas si son más de 4)
      const rows = n > 4 ? 2 : 1, per = Math.ceil(n / rows);
      for (let k = 0; k < n; k++) {
        const row = Math.floor(k / per), cnt = row ? n - per : per, o = (k % per - (cnt - 1) / 2) * 15, side = rows > 1 ? (row ? 9 : -9) : 0;
        coin(x + (horiz ? o : side), y + (vert ? o : side));
      }
    } else if (n === 1) coin(x, y);
    else { const rad = n > 4 ? 19 : 13; for (let k = 0; k < n; k++) { const ang = k / n * Math.PI * 2 - Math.PI / 2; coin(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad); } }   // en ronda
  }
  return out;
}

// Puertas: la pared se corta en el hueco (para chocar) y el hueco se vuelve un sólido de un solo sentido.
// Las paredes que se dibujan y cortan la luz (G.rects) quedan enteras: el canto sigue arriba del hueco.
const DOOR_HOLE = 30, DOOR_FLAP = 42;   // ancho del agujero y de la cortina (más grande que el agujero)
function doorSolids(items, rects) {
  let out = rects.slice();
  for (const d of items) if (d.type === 'door') {
    const vert = d.dx !== 0;   // pared vertical si el paso es horizontal
    out = out.flatMap(R => {
      const inside = vert ? R.w === T && Math.abs(R.x + T / 2 - d.wx) < 0.5 && d.wy > R.y && d.wy < R.y + R.h
                          : R.h === T && Math.abs(R.y + T / 2 - d.wy) < 0.5 && d.wx > R.x && d.wx < R.x + R.w;
      if (!inside) return [R];
      return vert
        ? [{ x: R.x, y: R.y, w: R.w, h: d.wy - DOOR_HOLE / 2 - R.y }, { x: R.x, y: d.wy + DOOR_HOLE / 2, w: R.w, h: R.y + R.h - d.wy - DOOR_HOLE / 2 }]
        : [{ x: R.x, y: R.y, w: d.wx - DOOR_HOLE / 2 - R.x, h: R.h }, { x: d.wx + DOOR_HOLE / 2, y: R.y, w: R.x + R.w - d.wx - DOOR_HOLE / 2, h: R.h }];
    });
    d.rect = vert ? { x: d.wx - T / 2, y: d.wy - DOOR_HOLE / 2, w: T, h: DOOR_HOLE, door: d }
                  : { x: d.wx - DOOR_HOLE / 2, y: d.wy - T / 2, w: DOOR_HOLE, h: T, door: d };
    out.push(d.rect);
  }
  return out;
}

// Cortina: cuelga de una bisagra (cinta) arriba del agujero, del lado B. Pasando, sube según cuánto asoma la rata
// del otro lado; al soltarla cae, golpea el marco y rebota un poquito. En reposo queda apenas despegada (se ve el borde).
const DOOR_REST = 0.18;                 // ángulo de reposo (rad)
const WALL_HW = 40;                     // alto de la pared en unidades de mundo (para el largo de la cortina)
const HOLE_H = 0.5, FLAP_H = 0.64;      // alto del agujero y de la bisagra (fracción del alto de la pared)
function updateDoors(dt) {
  const L = FLAP_H * WALL_HW;
  for (const d of G.items) if (d.type === 'door') {
    let tgt = DOOR_REST;
    if (d.passing) {
      // cuánto asoma la rata del lado de la cortina (punta del círculo más adelantado, desde la cara de la pared)
      const depth = Math.max(...ratCircles().map(([x, y, r]) => (x - d.wx) * d.dx + (y - d.wy) * d.dy + r)) - T / 2;
      tgt = clamp(Math.asin(clamp(depth / L, 0, 1)) + 0.25, 0.3, 1.25);
    }
    d.av += ((tgt - d.ang) * 160 - d.av * 11) * dt;
    d.ang += d.av * dt;
    if (d.ang < 0) {                     // golpea el marco
      if (d.av < -2.5) Snd.flapShut(Math.min(1, -d.av / 10));
      d.ang = 0; d.av = -d.av * 0.3;
    }
    d.rattle = Math.max(0, d.rattle - dt * 3);
  }
}

// Dibujo de las puertas, en tres pasadas de drawWalls:
// 'back'  (antes de las paredes): la cortina cuando la cámara está del lado del agujero (la pared la tapa en parte)
// 'hole'  (sobre las caras laterales): el agujero oscuro en la cara que mira a la cámara, del lado A
// 'front' (después de los cantos): la cortina cuando la cámara está del lado de la cortina, y las cintas de la bisagra
function drawDoors(c, v, pass) {
  for (const d of G.items) {
    if (d.type !== 'door' || d.wx < v.x0 - C * 2 || d.wx > v.x1 + C * 2 || d.wy < v.y0 - C * 2 || d.wy > v.y1 + C * 2) continue;
    // en la máscara de lo que tapa a la rata: si está del lado de la cortina sin levantarla (empujando la puerta que no
    // abre), la cortina cuelga contra la pared detrás de ella y la rata va por encima
    if (c === topCtx && !d.passing && (M.x - d.wx) * d.dx + (M.y - d.wy) * d.dy > 0 && d.ang < DOOR_REST + 0.15) continue;
    const nx = d.dx, ny = d.dy, tx = -ny, ty = nx;
    // punto en coordenadas de la puerta: u a lo largo del paso (A→B), w de costado, f altura (0 piso, 1 canto)
    const P = (u, w, f) => {
      const x = d.wx + nx * u + tx * w, y = d.wy + ny * u + ty * w, k = 1 + K * f;
      return [cam.x + (x - cam.x) * k, cam.y + (y - cam.y) * k];
    };
    const quad = pts => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
    const camU = (cam.x - d.wx) * nx + (cam.y - d.wy) * ny;
    if (pass === 'hole') {
      if (camU < -T / 2) {   // la cara del lado A mira a la cámara: se ve el agujero (y adentro, la cortina en sombra)
        const h = DOOR_HOLE / 2, u = -T / 2;
        quad([P(u, -h, 0), P(u, h, 0), P(u, h, HOLE_H), P(u, -h, HOLE_H)]);
        c.fillStyle = '#120c07'; c.fill();
        c.strokeStyle = 'rgba(200,160,110,0.35)'; c.lineWidth = 0.6; c.stroke();   // borde cortado del cartón
      }
      continue;
    }
    if ((pass === 'back') === (camU > T / 2)) {
      if (pass === 'front') drawHinge(c, d, P, quad);
      continue;
    }
    // la cortina: de la bisagra (u = T/2, altura FLAP_H) hasta su borde libre
    const ang = d.ang + d.rattle * 0.05 * Math.abs(Math.sin(G.time * 60));
    const L = FLAP_H * WALL_HW, fw = DOOR_FLAP / 2;
    const u1 = T / 2 + L * Math.sin(ang), f1 = FLAP_H * (1 - Math.cos(ang));
    const hinge = [P(T / 2, -fw, FLAP_H), P(T / 2, fw, FLAP_H)], edge = [P(u1, fw, f1), P(u1, -fw, f1)];
    const [gx0, gy0] = P(T / 2, 0, FLAP_H), [gx1, gy1] = P(u1, 0, f1);
    const g = c.createLinearGradient(gx0, gy0, gx1, gy1);
    g.addColorStop(0, '#6f6658'); g.addColorStop(1, '#a89d88');
    quad([...hinge, ...edge]); c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(40,30,20,0.7)'; c.lineWidth = 0.7; c.stroke();
    // borde inferior más claro (canto del cartón fino)
    c.strokeStyle = '#c9bea8'; c.lineWidth = 1; c.beginPath(); c.moveTo(...edge[0]); c.lineTo(...edge[1]); c.stroke();
    if (pass === 'front') drawHinge(c, d, P, quad);
  }
}
// Sombra en el piso del lado del agujero: el hueco es oscuro y se nota aunque la cámara esté justo arriba
function drawDoorShadow(c, d) {
  const h = DOOR_HOLE / 2, x0 = d.wx - d.dx * T / 2, y0 = d.wy - d.dy * T / 2, x1 = x0 - d.dx * 8, y1 = y0 - d.dy * 8;
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, 'rgba(8,5,2,0.8)'); g.addColorStop(1, 'rgba(8,5,2,0)');
  c.fillStyle = g; c.beginPath();
  c.moveTo(x0 + d.dy * h, y0 - d.dx * h); c.lineTo(x0 - d.dy * h, y0 + d.dx * h);
  c.lineTo(x1 - d.dy * (h + 3), y1 + d.dx * (h + 3)); c.lineTo(x1 + d.dy * (h + 3), y1 - d.dx * (h + 3)); c.closePath(); c.fill();
  // tirita de cinta de peligro en el piso, a lo largo de la pared, del lado por donde se pasa (un poco más oscura que la del inicio)
  c.save(); c.translate(d.wx, d.wy); c.transform(d.dx, d.dy, -d.dy, d.dx, 0, 0);   // x local = hacia B, y local = a lo largo de la pared
  drawStartTape(c, -T / 2 - 10, -(DOOR_HOLE + 10) / 2, DOOR_HOLE + 10, 0.3);
  c.restore();
}
// Cintas que sostienen la cortina: cruzan el canto de la pared y bajan por la cara del lado B
function drawHinge(c, d, P, quad) {
  for (const w of [-DOOR_FLAP / 2 + 5, DOOR_FLAP / 2 - 5]) {
    quad([P(-T / 2 + 1, w - 3, 1), P(-T / 2 + 1, w + 3, 1), P(T / 2, w + 3, 1), P(T / 2, w + 3, FLAP_H - 0.06),
          P(T / 2, w - 3, FLAP_H - 0.06), P(T / 2, w - 3, 1)]);
    c.fillStyle = 'rgba(214,206,186,0.85)'; c.fill();
  }
}

// Sprite del haz de la linterna (apunta hacia +x)
const CS = 320, [coneCv, coneCtx] = mk(CS, CS);
(function () {
  const img = coneCtx.createImageData(CS, CS), d = img.data;
  for (let j = 0; j < CS; j++) for (let i = 0; i < CS; i++) {
    const x = (i + 0.5 - CS / 2) / (CS / 2) * LIGHT_R, y = (j + 0.5 - CS / 2) / (CS / 2) * LIGHT_R;
    const dist = Math.hypot(x, y), a = Math.abs(Math.atan2(y, x));
    const rad = Math.pow(Math.max(0, 1 - dist / LIGHT_R), 0.9);
    const ang = smooth(CONE + CONE_SOFT, CONE - CONE_SOFT, a);
    const hot = 1 + 0.5 * Math.exp(-(a * a) / (0.2 * 0.2));
    const sp = Math.max(0, 1 - dist / (1.6 * C));
    const I = Math.min(1, ang * rad * hot * 1.4 + 0.38 * sp * sp);
    const k = (j * CS + i) * 4;
    d[k] = 255; d[k + 1] = 200 + 45 * I; d[k + 2] = 135 + 85 * I; d[k + 3] = I * 255;
  }
  coneCtx.putImageData(img, 0, 0);
})();

function resize() {
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  // tamaño real visible del canvas (en el celular 100vh incluye la barra del navegador y descentraba la cámara)
  const w = Math.max(1, Math.floor((cv.clientWidth || innerWidth) * dpr)), h = Math.max(1, Math.floor((cv.clientHeight || innerHeight) * dpr));
  for (const c of [cv, wallCv, lightCv, aCv, bCv, litCv, mouseCv, topCv]) { c.width = w; c.height = h; }
  blurCv.width = Math.max(1, w >> 1); blurCv.height = Math.max(1, h >> 1);  computeScale();
}
function computeScale() {
  const vc = viewCells(G.viewLevel || G.level) * C;

// ===================== ESTADO =====================
const G = { state: 'title', mode: 'challenge', level: 1, viewLevel: 1, story: 0, maze: null, rects: [], solids: [], deco: null,

  attempts: 0, light: 0, dieT: 0, onT: 0, baseSeed: 1, lastTick: 99, time: 0,
  iris: 1, irisTarget: 1, winCard: false,   // cortinilla circular (1 = abierta, 0 = cerrada)
  shake: 0 };                               // temblor de cámara (0..1)

const DIM_T = 0.8, DIM_DEPTH = 0.1;         // bajón ocasional de la linterna: duración y cuánto baja (10%)
G.dimIn = 6; G.dimT = 0; G.faltT = 0;

const FALTER_T = 0.35;                      // titubeo de la linterna después de choques seguidos
const M = { x: 0, y: 0, a: Math.PI, v: 0, turnV: 0, phase: 0, stepT: 0, bumpCd: 0, lastBump: -9,

  headA: 0, look: { t: 0, ang: 0, next: 0 }, lookIn: 2,                                   // giro de la cabeza
  spin: 0, feet: null };                                                                  // giro en el lugar y patas
const BUMP_T = 0.6, TWITCH_T = 0.32, BLINK_T = 0.14;
const STRETCH_T = 0.45;   // al despegarse del pegamento: el cuerpo se estira y afina un instante (inercia)
const CAUGHT_T = 1;       // atrapado: cuánto dura el sacudón de orejas y cola (después queda quieta)
// intensidad del sacudón: completa y se apaga suave en el último tercio
const caughtAmp = () => clamp((M.caughtT || 0) / (CAUGHT_T * 0.35), 0, 1);
// cuánto se estira (+) o se achata (-) en este momento: primero se estira, después un rebote mínimo y vuelve
const stretchAmount = () => { if (!(M.stretchT > 0)) return 0; const f = 1 - M.stretchT / STRETCH_T; return Math.sin(f * Math.PI * 1.5) * (1 - f); };

const FEET = [[6, -5.4, true, 0], [6, 5.4, true, 1], [-14.5, -9.2, false, 1], [-14.5, 9.2, false, 0]];
const STRIDE = 28;        // largo de un ciclo de paso (unidades de mundo recorridas por las patas): más largo = pasos más lentos
const FOOT_SLIP = 0.45;   // apoyada, la pata acompaña al cuerpo este tanto (leve arrastre): pasos largos sin despegarse del cuerpo
const SWING = 0.45;       // fracción del ciclo que la pata va por el aire
const FRONT_REACH = 1;    // recorrido de las manos respecto del de las patas traseras (con menos, se corren hacia atrás al apoyar)
// Marcha atada a la distancia: un ciclo (M.gait) avanza según cuánto se desplazan los lugares de reposo de las patas
// (caminando o girando en el lugar). Cada par diagonal va a medio ciclo del otro, así que siempre están en sincronía:
// lento = pasos lentos, rápido = pasos rápidos. Apoyada, la pata queda quieta en el piso; en el aire va de un poco
// atrás a un poco adelante de su lugar. En el pegamento los pasos son más cortos y "tironeados", y al salir deja huellas.
function updateFeet(dt) {
  if (M.caught && M.feet) return;   // atrapada: las patas quedan abiertas (pose en drawMouse)
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  const homes = FEET.map(([fx, fy]) => [M.x + fx * ca - fy * sa, M.y + fx * sa + fy * ca]);
  if (!M.feet || !M.prevHomes || homes.some((h, i) => Math.hypot(h[0] - M.prevHomes[i][0], h[1] - M.prevHomes[i][1]) > 25)) {
    M.feet = homes.map(h => ({ p: h, dir: [ca, sa], air: false, lift: 0 }));   // primera vez o teletransporte
    M.prevHomes = homes; M.gait = 0;

  const dist = disp.reduce((a, d) => a + Math.hypot(d[0], d[1]), 0) / disp.length;
  M.gait += dist / stride;
  // si casi no se mueve y quedó una pata en el aire, termina el paso sola (no queda congelada levantada)
  if (dist < 0.02 && M.feet.some(f => f.air)) M.gait += dt * 3;

    const A = stride * (1 - SWING) * (1 - FOOT_SLIP) / 2 * (front ? FRONT_REACH : 1);   // cuánto se adelanta / atrasa
    const pf = ((M.gait + pair * 0.5) % 1 + 1) % 1;

      ft.p = [ft.p[0] + disp[i][0] * FOOT_SLIP, ft.p[1] + disp[i][1] * FOOT_SLIP];

}
const PRINT_LIFE = 4;   // segundos que duran las huellas pegajosas

function updateTail(dt) {

    const t = i / TAIL_N, x = -TAIL_ROOT - TAIL_L * t;
    const y = M.caught
      ? Math.sin(G.time * 40 - t * 1.5) * 5 * t * caughtAmp()   // atrapado: cola recta que se sacude (1 s) y queda quieta
      : Math.sin(M.phase * 1.3 - t * 3.2) * 4.5 * t + Math.sin(G.time * 1.7 - t * 2.5) * 1.2 * t - M.turnV * 2.5 * t * t
        + Math.sin(G.time * 42 - t * 4) * 4 * t * (M.bumpT / BUMP_T);   // sacudón rápido de la cola al chocar
    return [M.x + x * ca - y * sa, M.y + x * sa + y * ca];
  };
  // primera vez o teletransporte: la cola nace recogida en la base del cuerpo y crece hacia atrás en los primeros
  // cuadros, chocando con las paredes (si se armaba recta de una, en el corral de inicio atravesaba la pared de atrás)
  if (!M.tail || Math.hypot(M.tail[0][0] - (M.x - ca * TAIL_ROOT), M.tail[0][1] - (M.y - sa * TAIL_ROOT)) > 30) {
    M.tail = []; for (let i = 0; i <= TAIL_N; i++) M.tail.push([M.x - ca * 4, M.y - sa * 4]);
  }
  const P = M.tail;
  // la cola no choca con el hueco de las puertas (pasa por abajo de la cortina detrás del cuerpo)
  const near = G.solids.filter(R => !R.door && R.x < M.x + 60 && R.x + R.w > M.x - 60 && R.y < M.y + 60 && R.y + R.h > M.y - 60);
  // el eje gris de los molinetes cercanos: la cola pasa por debajo de las aspas pero choca con él como con una pared
  const hubs = G.items.filter(it => it.type === 'spinner' && Math.abs(it.x - M.x) < 60 && Math.abs(it.y - M.y) < 60);
  // nacimiento de la cola: sobre el eje del cuerpo, pero si ahí hay una pared, se corre hacia el ratón hasta quedar
  // afuera, del lado del ratón (si no, el empuje de las paredes podía mandar la cola al otro lado)
  let root = TAIL_ROOT;
  for (const R of near) {
    const x0 = R.x - 1.5, x1 = R.x + R.w + 1.5, y0 = R.y - 1.5, y1 = R.y + R.h + 1.5;
    let t0 = 0, t1 = TAIL_ROOT;
    for (const [o, d, lo, hi] of [[M.x, -ca, x0, x1], [M.y, -sa, y0, y1]]) {
      if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) { t0 = 1; t1 = 0; } continue; }
      let a = (lo - o) / d, b = (hi - o) / d; if (a > b) [a, b] = [b, a];
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    if (t0 <= t1) root = Math.min(root, Math.max(0, t0 - 0.5));
  }
  P[0] = [M.x - ca * root, M.y - sa * root];
  const MAX_STEP = 4;   // un punto de la cola no se mueve más que esto por cuadro (menos que el grosor del cartón)
  for (let i = 1; i <= TAIL_N; i++) {
    // más floja hacia la punta: al girar o rotar en el lugar la cola queda barriendo atrás (inercia) y se endereza sola
    // (atrapado: firme hasta la punta, así el sacudón se ve entero)
    const t = i / TAIL_N, [rx, ry] = rest(i), k = Math.min(1, dt * (M.caught ? 40 : 20 - 17 * t));
    let mx = (rx - P[i][0]) * k, my = (ry - P[i][1]) * k, ml = Math.hypot(mx, my);
    if (ml > MAX_STEP) { mx *= MAX_STEP / ml; my *= MAX_STEP / ml; }   // aunque se trabe un cuadro, no salta paredes
    let x = P[i][0] + mx, y = P[i][1] + my;
    // largo fijo del tramo + fuera de las paredes; se repite para que, si choca, se deslice a lo largo del muro
    const r = tailWidth(t) / 2 + 0.6;
    for (let pass = 0; pass < 3; pass++) {
      let dx = x - P[i - 1][0], dy = y - P[i - 1][1], d = Math.hypot(dx, dy);
      if (d < 1e-6) { dx = -ca; dy = -sa; d = 1; }
      x = P[i - 1][0] + dx / d * TAIL_SEG; y = P[i - 1][1] + dy / d * TAIL_SEG;
      let hit = false;
      for (const R of near) {
        const qx = clamp(x, R.x, R.x + R.w), qy = clamp(y, R.y, R.y + R.h);
        const ex = x - qx, ey = y - qy, e2 = ex * ex + ey * ey;
        if (e2 >= r * r) continue;
        hit = true;
        if (e2 > 1e-9) { const e = Math.sqrt(e2); x += ex / e * (r - e); y += ey / e * (r - e); }
        else {   // el punto quedó adentro: sale por el borde más cercano
          const l = x - R.x, rr = R.x + R.w - x, tp = y - R.y, b = R.y + R.h - y, m = Math.min(l, rr, tp, b);
          if (m === l) x = R.x - r; else if (m === rr) x = R.x + R.w + r; else if (m === tp) y = R.y - r; else y = R.y + R.h + r;
        }
      }
      for (const h of hubs) {
        let ex = x - h.x, ey = y - h.y, e = Math.hypot(ex, ey);
        const need = SPIN_HUB + r;
        if (e >= need) continue;
        hit = true;
        if (e < 1e-6) { ex = P[i - 1][0] - h.x; ey = P[i - 1][1] - h.y; e = Math.hypot(ex, ey) || 1; }   // justo en el centro: sale hacia el tramo anterior
        x = h.x + ex / e * need; y = h.y + ey / e * need;
      }
      if (!hit) break;
    }
    P[i] = [x, y];
  }
}

// Gestos del ratón: golpe contra la pared, parpadeo y orejita cuando está quieto
function animMouse(dt, active) {
  M.bumpT = Math.max(0, M.bumpT - dt);
  M.stretchT = Math.max(0, (M.stretchT || 0) - dt);
  M.caughtT = Math.max(0, (M.caughtT || 0) - dt);
  // atrapada: se aplasta de golpe (pose fija) y no hace más gestos (ni parpadeo, ni orejas, ni cabeza)
  if (M.caught) { M.squash = Math.min(1, (M.squash || 0) + dt / 0.08); M.blinkT = 0; M.twitch.t = 0; return; }
  M.blinkT = Math.max(0, M.blinkT - dt);
  if ((M.blinkIn -= dt) <= 0) { M.blinkT = BLINK_T; M.blinkIn = 1.5 + Math.random() * 4; }
  M.twitch.t = Math.max(0, M.twitch.t - dt);
  M.idleT = active ? 0 : M.idleT + dt;
  if (M.idleT > 1 && (M.twitchIn -= dt) <= 0) {
    M.twitch = { side: Math.random() < 0.5 ? -1 : 1, t: TWITCH_T };
    M.twitchIn = 1.2 + Math.random() * 3;
  }
  // cabeza: se adelanta hacia donde gira; quieto, cada tanto mira a un costado (o a uno y al otro) y vuelve
  let head = 0;
  if (active) M.look.t = 0;
  if (Math.abs(M.turnV) > 0.25) head = clamp(M.turnV / TURN, -1, 1) * (0.45 + 0.35 * M.spin);   // girando en el lugar, más
  else if (M.look.t > 0) {
    head = M.look.ang;
    if ((M.look.t -= dt) <= 0 && M.look.next) M.look = { t: 0.45 + Math.random() * 0.5, ang: M.look.next, next: 0 };
  } else if (M.idleT > 1.2 && (M.lookIn -= dt) <= 0) {
    const s = Math.random() < 0.5 ? -1 : 1, amount = () => 0.3 + Math.random() * 0.25;
    M.look = { t: 0.5 + Math.random() * 0.7, ang: s * amount(), next: Math.random() < 0.4 ? -s * amount() : 0 };
    M.lookIn = 1.8 + Math.random() * 3;
  }
  M.headA += (head - M.headA) * Math.min(1, dt * 9);
}
const cam = { x: 0, y: 0 };
const keys = {};

// Arma el laberinto (paredes, decoración) a partir de una semilla; devuelve el rng para seguir colocando cosas
function buildMaze(W, H, seed, loopFrac) {
  const rng = mulberry32(seed);
  G.maze = genMaze(W, H, rng, loopFrac);
  G.rects = buildRects(G.maze, rng);
  G.deco = buildDeco(G.maze, rng);
  return rng;
}
// Desafío: niveles infinitos al azar (la semilla de la partida cambia cada vez)
// Tiempos de las estrellas (los dos modos): desde el camino ideal (el más corto, a velocidad máxima) con un margen, más
// el extra por quesos y pegamento. ★★ por debajo de star2 y ★★★ por debajo de star3 (y con todos los quesos)
function starTimes(extra) {
  const ideal = pathLen(G.maze) * C / SPEED, niceT = x => x < 20 ? Math.ceil(x) : Math.ceil(x / 5) * 5;
  G.star2 = Math.min(niceT(ideal * 1.8 + extra * 1.3 + 3), G.timeLimit - 5);   // (+3 y +2 fijos: las vueltas cuestan, sobre todo en laberintos chicos)
  G.star3 = Math.min(niceT(ideal * 1.3 + extra + 2), G.star2 - 5);
}
function loadLevel(n) {
  G.mode = 'challenge'; G.level = n; G.viewLevel = n;
  const [W, H] = sizeFor(n);
  buildMaze(W, H, G.baseSeed + n * 7919, Math.min(0.05, 0.008 * (n - 1)));
  G.items = placeCoins(G.maze, [], G.baseSeed + n * 7919 + 777, n); G.runCoins = 0; G.coinsTotal = G.items.length;
  G.solids = G.holeRects = G.rects; G.cheeseTotal = 0;
  G.dark = G.lamp = true;   // Desafío: a oscuras con el tiempo de siempre (todavía sin pilas en el laberinto; se revisa después)
  G.timeLimit = timeFor(n, pathLen(G.maze));
  G.lampBlock = G.timeLimit / 4;   // la pila del HUD: sus 4 bloques reparten el tiempo del nivel
  starTimes(0);
  G.attempts = 1; G.chBest = null; G.chStars = 0;   // récord y estrellas de este laberinto (son al azar: valen mientras lo repetís)
  computeScale();
  resetRun();
}
// Historia: niveles fijos de la tabla LEVELS
function loadStory(i) {
  const L = LEVELS[i];
  G.mode = 'story'; G.story = i; G.level = i + 1; G.viewLevel = STORY_VIEW;
  const rng = buildMaze(L.size[0], L.size[1], L.seed, L.loops || 0);
  G.items = placeItems(L, G.maze, rng);
  G.items = G.items.concat(placeCoins(G.maze, G.items, L.seed + 777)); G.runCoins = 0;
  G.coinsTotal = G.items.filter(it => it.type === 'coin').length;
  G.solids = doorSolids(G.items, G.rects);
  G.holeRects = G.solids.filter(R => !R.door);   // paredes con los agujeros de las puertas (la luz pasa con la cortina levantada)
  const nCheese = G.items.filter(it => it.type === 'cheese').length;
  G.cheeseTotal = Math.min(nCheese, L.cheeseGoal || nCheese);   // cuántos hay que juntar (puede haber más dando vueltas)
  // tiempo: el del nivel 5 de Desafío más un extra por desvíos (quesos) y por lentitud (pegamento)
  const extra = G.cheeseTotal * 6 + (L.sticky || 0) * 5 + (L.spinners || 0) * 3 + (L.gates || 0) * 2;   // (esperar el hueco de un molinete, ~3 s)   // cruzar una bandeja con las 4 patas adentro lleva ~4 s
  G.timeLimit = L.time || Math.ceil((timeFor(STORY_VIEW, pathLen(G.maze)) + extra) / 5) * 5;
  starTimes(extra);
  // a oscuras: la linterna arranca con LAMP_MAX segundos y hay pilas en el camino para que alcance el tiempo de antes
  G.dark = G.lamp = DARK_LEVELS.includes(i + 1); G.lampBlock = LAMP_BLOCK;
  if (G.dark) {
    const bats = placeBatteries(G.maze, G.items, Math.max(1, Math.ceil(G.timeLimit / BAT_EVERY) - 1));
    G.items = G.items.filter(it => it.type !== 'coin').concat(bats, G.items.filter(it => it.type === 'coin'));
    G.timeLimit = LAMP_MAX;
  }
  G.attempts = 1; G.chBest = null; G.chStars = 0;
  computeScale();
  resetRun();
}
function resetRun() {
  const m = G.maze;
  M.x = (m.W + 0.5) * C; M.y = (m.entRow + 0.5) * C; M.a = Math.PI; M.v = 0; M.turnV = 0; M.tail = null;
  M.stickyT = 0; M.onTray = false; M.feet = null; M.spin = 0; M.caught = false; M.squash = 0; G.prints = [];
  // las monedas que ya agarraste quedan agarradas (son tuyas aunque pierdas; no vuelven a aparecer al reintentar)
  for (const it of G.items) { it.closed = false; it.t = 0; it.got = it.type === 'coin' && it.got; it.passing = false; it.ang = DOOR_REST; it.av = 0; it.rattle = 0; }   // trampas abiertas, quesos sin juntar, puertas cerradas
  G.cheese = 0; G.fx = []; G.dieReason = 'time'; G.siren = 0;
  G.timeLeft = G.timeLimit; G.elapsed = 0; G.lastTick = 99; G.light = 0;
  const t = camTarget(); cam.x = t.x; cam.y = t.y;
}
function camTarget() {
  const m = G.maze, hw = cv.width / (2 * scale), hh = cv.height / (2 * scale);
  const minX = -1.2 * C, maxX = (m.W + 1.4) * C, minY = -0.5 * C, maxY = (m.H + 0.5) * C;
  const tx = M.x + Math.cos(M.a) * C * 0.8, ty = M.y + Math.sin(M.a) * C * 0.8;
  // la cámara sigue al ratón; si el laberinto es más grande que la pantalla, no se pasa de los bordes
  return {
    x: (maxX - minX < 2 * hw) ? tx : clamp(tx, minX + hw, maxX - hw),
    y: (maxY - minY < 2 * hh) ? ty : clamp(ty, minY + hh, maxY - hh),
  };
}

// Durante un fundido a negro el viejo desaparece de una (no se ve) y el nuevo entra cuando la pantalla se aclara
const CARD_OUT_MS = 100, CARD_GAP_MS = 40;

function card(html, anim = null) {
  clearTimeout(cardTimer); cardAnimStop();
  const leaving = $card.classList.contains('out'), shown = !$card.classList.contains('hidden') && !leaving;
  if (fading) {
    $card.classList.remove('in', 'out'); $card.classList.add('hidden');
    cardTimer = setTimeout(() => showCard(html, anim), 80);
  } else if (shown) {
    Snd.cardOut();
    $card.classList.remove('in'); $card.classList.add('out');
    cardTimer = setTimeout(() => { $card.classList.remove('out'); $card.classList.add('hidden'); cardTimer = setTimeout(() => showCard(html, anim), CARD_GAP_MS); }, CARD_OUT_MS);
  } else if (leaving) {   // todavía se está yendo el anterior: espera a que termine
    cardTimer = setTimeout(() => { $card.classList.remove('out'); $card.classList.add('hidden'); showCard(html, anim); }, CARD_OUT_MS + CARD_GAP_MS);
  } else showCard(html, anim);
}

  g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = Math.max(1, u * 0.006); g.stroke(box);

// Bioterio: de a ratos alguna de las ratitas que tenés se mueve un poco (respira, mueve los bigotes, una oreja, la
// cola, parpadea) y vuelve a quedarse quieta. Nunca más de CAGE_ANIM_MAX a la vez (así no se pone lento) y solo
// redibuja esas jaulas. Cada movimiento arranca y termina suave (amp de 0 a 1 y a 0), así no salta del dibujo quieto
const CAGE_ANIM_MAX = 2, CAGE_ANIM_T = 2.8;

// WAG_DELAY: arranca un instante después del toque, así no queda tapada por el dedo (el "click" de la jaula sigue al toque)

function cageAnimLoop() {
  const id = ++cageLoopId;   // si se vuelve a abrir el Bioterio, el loop viejo se corta
  const anims = new Map();
  let last = performance.now(), next = 0.4;
  const step = now => {
    if (G.screen !== 'ratitas' || id !== cageLoopId) return;
    requestAnimationFrame(step);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if ((next -= dt) <= 0 && anims.size < CAGE_ANIM_MAX) {   // le toca a otra, al azar entre las que tenés
      const free = [...$scr.querySelectorAll('canvas[data-rat]')].filter(cv => +cv.dataset.rat >= 0 && Skins.has(+cv.dataset.rat) && !anims.has(cv));
      if (free.length) anims.set(free[Math.floor(Math.random() * free.length)], { p: 0, t0: 3.2 + Math.random() * 2.4 });
      next = 0.5 + Math.random() * 1.1;

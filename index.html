      const [from, to] = dX[idx(...p.a)] >= dX[idx(...p.b)] ? [p.a, p.b] : [p.b, p.a];
      const [ax, ay] = center(...from), [bx, by] = center(...to);
      items.push({ type: 'door', dx: Math.sign(bx - ax), dy: Math.sign(by - ay), wx: (ax + bx) / 2, wy: (ay + by) / 2,
        passing: false, ang: DOOR_REST, av: 0, rattle: 0 });
      used.push(p.a, p.b);
    }
  }
  // Molinetes: en cruces (celdas con 3 o 4 salidas, así siempre hay por dónde escapar del aspa), en lo posible en el
  // camino más corto (hay que pasarlos sí o sí), lejos de la entrada, la salida y de los otros objetos. Van al final, así
  // no cambian dónde caen los demás. Las aspas no llegan a las paredes del cruce.
  if (L.spinners) {
    const opens = (c, r) => [!m.hW[r][c], !m.hW[r + 1][c], !m.vW[c][r], !m.vW[c + 1][r]].filter(Boolean).length;
    const free = cells.filter(([c, r]) => opens(c, r) >= 3 && !special(c, r, 2) && dE[idx(c, r)] >= 0);
    const on = shuffle(free.filter(([c, r]) => onPath(idx(c, r)))), off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r))));
    pick(on.concat(off), L.spinners, 2, used).forEach(([c, r], k) => {
      const [x, y] = center(c, r);
      items.push({ type: 'spinner', x, y, a0: rng() * Math.PI / 2, dir: k % 2 ? -1 : 1 });
      used.push([c, r]);
    });
  }
  // Compuertas: en pasillos rectos (paredes a los dos costados, entrada y salida enfrentadas), en lo posible en el
  // camino más corto, lejos de la entrada, la salida y de los otros objetos. Cada una con su desfase en el ciclo.
  if (L.gates) {
    const straight = (c, r) => {
      const up = m.hW[r][c], dn = m.hW[r + 1][c], lf = m.vW[c][r], rt = m.vW[c + 1][r];
      return up && dn && !lf && !rt ? 'h' : lf && rt && !up && !dn ? 'v' : null;
    };
    const free = cells.filter(([c, r]) => straight(c, r) && !special(c, r, 2) && dE[idx(c, r)] >= 0);
    const on = shuffle(free.filter(([c, r]) => onPath(idx(c, r)))), off = shuffle(free.filter(([c, r]) => !onPath(idx(c, r))));
    pick(on.concat(off), L.gates, 2, used).forEach(([c, r]) => {
      const [x, y] = center(c, r);
      const vert = straight(c, r) === 'v', [p, q] = vert ? [[c, r - 1], [c, r + 1]] : [[c - 1, r], [c + 1, r]];
      const far = (a, b) => (dX[idx(...a)] ?? -1) - (dX[idx(...b)] ?? -1);   // de qué lado se viene (más lejos de la salida)
      items.push({ type: 'gate', x, y, vert, ph: rng() * GATE_CYCLE, side: far(q, p) >= 0 ? 1 : -1 });
      used.push([c, r]);
    });
  }
  return items;
}

// Monedas que hacen elegir, no juntar por juntar, y pocas (una ratita sale COIN_PRICE): en el camino más corto van
// unas pocas sueltas (la ruta directa es la más rápida pero rinde poco) y fuera del camino un tesorito de 3 a 5, más
// grande cuanto más largo es el desvío (cuesta tiempo, y la tercera estrella pide un tiempo justo). En Historia son
// unas 6 a 9 por nivel (dos o tres sueltas y un tesoro; dos tesoros en los laberintos grandes). En Desafío el nivel N
// tiene N monedas en total (budget): sirve para juntar, pero rinde ir más lejos. Usan su propio rng, así no cambian
// dónde caen los otros items. No van en la entrada, la salida ni encima de otro item.
const COIN_DETOUR_S = 2.5;   // en los tesoros: una moneda por cada tantos segundos de desvío (de 3 a 5)
// Pilas de los niveles a oscuras: repartidas parejo a lo largo del camino más corto, una cada BAT_CELLS celdas como
// mucho (si el lugar está ocupado, la celda libre más cercana del camino); y también a lo largo del camino con los
// atajos de las puertas, donde entre dos pilas queden más de BAT_CELLS celdas (si no, tomando el atajo se salteaban
// las pilas del camino largo y podían quedar casi 60 s sin ninguna)
function placeBatteries(m, items) {
  const { W, H } = m, out = [], ix = (x, y) => Math.floor(y / C) * W + Math.floor(x / C);
  const doors = items.filter(it => it.type === 'door').map(d => [ix(d.wx - d.dx * C / 2, d.wy - d.dy * C / 2), ix(d.wx + d.dx * C / 2, d.wy + d.dy * C / 2)]);
  const dist = (start, useDoors, rev) => {   // BFS por el laberinto; con las puertas como pasos de un solo sentido (al revés desde la salida)
    const d = new Int32Array(W * H).fill(-1), q = [start]; d[start] = 0;
    for (let qi = 0; qi < q.length; qi++) {
      const k = q[qi], c = k % W, r = (k - c) / W, v = d[k];
      const go = nk => { if (d[nk] < 0) { d[nk] = v + 1; q.push(nk); } };
      if (c > 0 && !m.vW[c][r]) go(k - 1);
      if (c < W - 1 && !m.vW[c + 1][r]) go(k + 1);
      if (r > 0 && !m.hW[r][c]) go(k - W);
      if (r < H - 1 && !m.hW[r + 1][c]) go(k + W);
      if (useDoors) for (const [a, b] of doors) { if (!rev && a === k) go(b); if (rev && b === k) go(a); }
    }
    return d;
  };
  const s0 = m.entRow * W + W - 1, e0 = m.exitRow * W;
  const route = useDoors => {   // las celdas de un camino más corto, en orden desde la entrada
    const dS = dist(s0, useDoors, false), dT = dist(e0, useDoors, true), tot = dS[e0], cells = [];
    for (let k = 0; k < W * H; k++) if (dS[k] >= 0 && dS[k] + dT[k] === tot) cells.push(k);
    return cells.sort((a, b) => dS[a] - dS[b]);
  };
  const busy = (x, y) => items.concat(out).some(it => Math.hypot((it.x ?? it.wx) - x, (it.y ?? it.wy) - y) < C * 0.75);
  for (const path of doors.length ? [route(false), route(true)] : [route(false)]) {
    // dónde ya hay pilas en este camino (las del camino largo que también están en el de los atajos)
    const marks = [0, ...out.map(b => path.indexOf(ix(b.x, b.y))).filter(p => p >= 0).sort((a, b) => a - b), path.length - 1];
    for (let g = 1; g < marks.length; g++) {
      const a = marks[g - 1], b = marks[g], n = Math.ceil((b - a) / BAT_CELLS) - 1;
      for (let k = 1; k <= n; k++) {
        const want = a + Math.round(k * (b - a) / (n + 1));
        for (let j = 0; j < path.length; j++) {
          const p = want + (j % 2 ? -1 : 1) * Math.ceil(j / 2);
          if (p < 1 || p > path.length - 2) continue;
          const x = (path[p] % W + 0.5) * C, y = (Math.floor(path[p] / W) + 0.5) * C;
          if (!busy(x, y)) { out.push({ type: 'battery', x, y, got: false, ph: out.length * 1.7 }); break; }
        }
      }
    }
  }
  if (!out.length) {   // camino corto: igual una pila a mitad de camino (para que se conozcan)
    const path = route(false);
    for (let j = 0; j < path.length; j++) {
      const p = (path.length >> 1) + (j % 2 ? -1 : 1) * Math.ceil(j / 2); if (p < 1 || p > path.length - 2) continue;
      const x = (path[p] % W + 0.5) * C, y = (Math.floor(path[p] / W) + 0.5) * C;
      if (!busy(x, y)) { out.push({ type: 'battery', x, y, got: false, ph: 0 }); break; }
    }
  }
  return out;
}
function placeCoins(m, items, seed, budget = null) {
  const rng = mulberry32(seed), { W, H } = m, out = [];
  const dE = bfs(m, W - 1, m.entRow), dX = bfs(m, 0, m.exitRow), D = dE[m.exitRow * W];
  const busy = (x, y) => items.some(it => Math.hypot((it.x ?? it.wx) - x, (it.y ?? it.wy) - y) < C * 0.75) ||
    out.some(o => Math.hypot(o.x - x, o.y - y) < C * 0.75);
  const isEnd = (c, r) => (c === W - 1 && r === m.entRow) || (c === 0 && r === m.exitRow);
  const coin = (x, y) => out.push({ type: 'coin', x, y, got: false, ph: rng() * 6 });
  // cuántas sueltas y qué tesoros: en Historia fijo según el tamaño; en Desafío se reparten las N del nivel
  let singles, treasures;
  if (budget == null) {
    singles = 2 + (rng() < 0.5 ? 1 : 0);
    treasures = Array(W * H >= 220 ? 2 : 1).fill(null);   // null: el tamaño sale del desvío
  } else {
    singles = Math.min(budget, budget <= 3 ? budget : 2);
    treasures = [];
    for (let left = budget - singles; left > 0; left -= 5) treasures.push(Math.min(5, left));
  }
  // 1) en el camino más corto: sueltas, repartidas parejo a lo largo
  const path = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (dE[r * W + c] >= 0 && dE[r * W + c] + dX[r * W + c] === D) path.push([c, r, dE[r * W + c]]);
  path.sort((p, q) => p[2] - q[2]);
  let placed = 0;
  for (let k = 0; k < singles * 3 && placed < singles; k++) {   // si un lugar está ocupado, prueba un poco más allá
    const f = (placed + 0.5 + (rng() - 0.5) * 0.4) / singles, idx = clamp(Math.round(2 + f * (path.length - 4)) + (k % 3), 1, path.length - 2);
    const [c, r] = path[idx], x = (c + 0.5) * C, y = (r + 0.5) * C;
    if (!isEnd(c, r) && !busy(x, y)) { coin(x, y); placed++; }
  }
  // 2) tesoros fuera del camino: los callejones pesan más; cada uno vale más cuanto más largo es el desvío
  const off = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const i = r * W + c, det = dE[i] + dX[i] - D;   // celdas de más que hay que caminar para pasar por acá
    if (dE[i] < 0 || det < 3 || isEnd(c, r)) continue;
    const walls = [m.vW[c][r], m.vW[c + 1][r], m.hW[r][c], m.hW[r + 1][c]].filter(Boolean).length;
    off.push({ c, r, det, w: (walls === 3 ? 2.5 : 1) * Math.min(det, 12) });
  }
  const stash = [];
  while (stash.length < treasures.length && off.length) {
    let tot = off.reduce((acc, o) => acc + o.w, 0), pick = rng() * tot, j = 0;
    while (j < off.length - 1 && (pick -= off[j].w) > 0) j++;
    const st = off.splice(j, 1)[0], x = (st.c + 0.5) * C, y = (st.r + 0.5) * C;
    if (stash.some(o => Math.abs(o.c - st.c) + Math.abs(o.r - st.r) < 3) || busy(x, y)) continue;
    const n = treasures[stash.length] ?? clamp(Math.round(st.det * C / SPEED / COIN_DETOUR_S), 3, 5);
    stash.push(st);
    const L = !m.vW[st.c][st.r], R = !m.vW[st.c + 1][st.r], U = !m.hW[st.r][st.c], Dn = !m.hW[st.r + 1][st.c];
    const horiz = L && R && !U && !Dn, vert = U && Dn && !L && !R;
    if (horiz || vert) {   // en hilera a lo largo del pasillo (de a dos filas si son más de 4)
      const rows = n > 4 ? 2 : 1, per = Math.ceil(n / rows);
      for (let k = 0; k < n; k++) {
        const row = Math.floor(k / per), cnt = row ? n - per : per, o = (k % per - (cnt - 1) / 2) * 15, side = rows > 1 ? (row ? 9 : -9) : 0;
        coin(x + (horiz ? o : side), y + (vert ? o : side));
      }
    } else if (n === 1) coin(x, y);
    else { const rad = n > 4 ? 19 : 13; for (let k = 0; k < n; k++) { const ang = k / n * Math.PI * 2 - Math.PI / 2; coin(x + Math.cos(ang) * rad, y + Math.sin(ang) * rad); } }   // en ronda
  }
  return out;
}

// Puertas: la pared se corta en el hueco (para chocar) y el hueco se vuelve un sólido de un solo sentido.
// Las paredes que se dibujan y cortan la luz (G.rects) quedan enteras: el canto sigue arriba del hueco.
const DOOR_HOLE = 30, DOOR_FLAP = 42;   // ancho del agujero y de la cortina (más grande que el agujero)
function doorSolids(items, rects) {
  let out = rects.slice();
  for (const d of items) if (d.type === 'door') {
    const vert = d.dx !== 0;   // pared vertical si el paso es horizontal
    out = out.flatMap(R => {
      const inside = vert ? R.w === T && Math.abs(R.x + T / 2 - d.wx) < 0.5 && d.wy > R.y && d.wy < R.y + R.h
                          : R.h === T && Math.abs(R.y + T / 2 - d.wy) < 0.5 && d.wx > R.x && d.wx < R.x + R.w;
      if (!inside) return [R];
      return vert
        ? [{ x: R.x, y: R.y, w: R.w, h: d.wy - DOOR_HOLE / 2 - R.y }, { x: R.x, y: d.wy + DOOR_HOLE / 2, w: R.w, h: R.y + R.h - d.wy - DOOR_HOLE / 2 }]
        : [{ x: R.x, y: R.y, w: d.wx - DOOR_HOLE / 2 - R.x, h: R.h }, { x: d.wx + DOOR_HOLE / 2, y: R.y, w: R.x + R.w - d.wx - DOOR_HOLE / 2, h: R.h }];
    });
    d.rect = vert ? { x: d.wx - T / 2, y: d.wy - DOOR_HOLE / 2, w: T, h: DOOR_HOLE, door: d }
                  : { x: d.wx - DOOR_HOLE / 2, y: d.wy - T / 2, w: DOOR_HOLE, h: T, door: d };
    out.push(d.rect);
  }
  return out;
}

// Cortina: cuelga de una bisagra (cinta) arriba del agujero, del lado B. Pasando, sube según cuánto asoma la rata
// del otro lado; al soltarla cae, golpea el marco y rebota un poquito. En reposo queda apenas despegada (se ve el borde).
const DOOR_REST = 0.18;                 // ángulo de reposo (rad)
const WALL_HW = 40;                     // alto de la pared en unidades de mundo (para el largo de la cortina)
const HOLE_H = 0.5, FLAP_H = 0.64;      // alto del agujero y de la bisagra (fracción del alto de la pared)
function updateDoors(dt) {
  const L = FLAP_H * WALL_HW;
  for (const d of G.items) if (d.type === 'door') {
    let tgt = DOOR_REST;
    if (d.passing) {
      // cuánto asoma la rata del lado de la cortina (punta del círculo más adelantado, desde la cara de la pared)
      const depth = Math.max(...ratCircles().map(([x, y, r]) => (x - d.wx) * d.dx + (y - d.wy) * d.dy + r)) - T / 2;
      tgt = clamp(Math.asin(clamp(depth / L, 0, 1)) + 0.25, 0.3, 1.25);
    }
    d.av += ((tgt - d.ang) * 160 - d.av * 11) * dt;
    d.ang += d.av * dt;
    if (d.ang < 0) {                     // golpea el marco
      if (d.av < -2.5) Snd.flapShut(Math.min(1, -d.av / 10));
      d.ang = 0; d.av = -d.av * 0.3;
    }
    d.rattle = Math.max(0, d.rattle - dt * 3);
  }
}

// Dibujo de las puertas, en tres pasadas de drawWalls:
// 'back'  (antes de las paredes): la cortina cuando la cámara está del lado del agujero (la pared la tapa en parte)
// 'hole'  (sobre las caras laterales): el agujero oscuro en la cara que mira a la cámara, del lado A
// 'front' (después de los cantos): la cortina cuando la cámara está del lado de la cortina, y las cintas de la bisagra
function drawDoors(c, v, pass) {
  for (const d of G.items) {
    if (d.type !== 'door' || d.wx < v.x0 - C * 2 || d.wx > v.x1 + C * 2 || d.wy < v.y0 - C * 2 || d.wy > v.y1 + C * 2) continue;
    // en la máscara de lo que tapa a la rata: si está del lado de la cortina sin levantarla (empujando la puerta que no
    // abre), la cortina cuelga contra la pared detrás de ella y la rata va por encima
    if (c === topCtx && !d.passing && (M.x - d.wx) * d.dx + (M.y - d.wy) * d.dy > 0 && d.ang < DOOR_REST + 0.15) continue;
    const nx = d.dx, ny = d.dy, tx = -ny, ty = nx;
    // punto en coordenadas de la puerta: u a lo largo del paso (A→B), w de costado, f altura (0 piso, 1 canto)
    const P = (u, w, f) => {
      const x = d.wx + nx * u + tx * w, y = d.wy + ny * u + ty * w, k = 1 + K * f;
      return [cam.x + (x - cam.x) * k, cam.y + (y - cam.y) * k];
    };
    const quad = pts => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
    const camU = (cam.x - d.wx) * nx + (cam.y - d.wy) * ny;
    if (pass === 'hole') {
      if (camU < -T / 2) {   // la cara del lado A mira a la cámara: se ve el agujero (y adentro, la cortina en sombra)
        const h = DOOR_HOLE / 2, u = -T / 2;
        quad([P(u, -h, 0), P(u, h, 0), P(u, h, HOLE_H), P(u, -h, HOLE_H)]);
        c.fillStyle = '#120c07'; c.fill();
        c.strokeStyle = 'rgba(200,160,110,0.35)'; c.lineWidth = 0.6; c.stroke();   // borde cortado del cartón
      }
      continue;
    }
    if ((pass === 'back') === (camU > T / 2)) {
      if (pass === 'front') drawHinge(c, d, P, quad);
      continue;
    }
    // la cortina: de la bisagra (u = T/2, altura FLAP_H) hasta su borde libre
    const ang = d.ang + d.rattle * 0.05 * Math.abs(Math.sin(G.time * 60));
    const L = FLAP_H * WALL_HW, fw = DOOR_FLAP / 2;
    const u1 = T / 2 + L * Math.sin(ang), f1 = FLAP_H * (1 - Math.cos(ang));
    const hinge = [P(T / 2, -fw, FLAP_H), P(T / 2, fw, FLAP_H)], edge = [P(u1, fw, f1), P(u1, -fw, f1)];
    const [gx0, gy0] = P(T / 2, 0, FLAP_H), [gx1, gy1] = P(u1, 0, f1);
    const g = c.createLinearGradient(gx0, gy0, gx1, gy1);
    g.addColorStop(0, '#6f6658'); g.addColorStop(1, '#a89d88');
    quad([...hinge, ...edge]); c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(40,30,20,0.7)'; c.lineWidth = 0.7; c.stroke();
    // borde inferior más claro (canto del cartón fino)
    c.strokeStyle = '#c9bea8'; c.lineWidth = 1; c.beginPath(); c.moveTo(...edge[0]); c.lineTo(...edge[1]); c.stroke();
    if (pass === 'front') drawHinge(c, d, P, quad);

}
// Sombra en el piso del lado del agujero: el hueco es oscuro y se nota aunque la cámara esté justo arriba
function drawDoorShadow(c, d) {
  const h = DOOR_HOLE / 2, x0 = d.wx - d.dx * T / 2, y0 = d.wy - d.dy * T / 2, x1 = x0 - d.dx * 8, y1 = y0 - d.dy * 8;
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, 'rgba(8,5,2,0.8)'); g.addColorStop(1, 'rgba(8,5,2,0)');
  c.fillStyle = g; c.beginPath();
  c.moveTo(x0 + d.dy * h, y0 - d.dx * h); c.lineTo(x0 - d.dy * h, y0 + d.dx * h);
  c.lineTo(x1 - d.dy * (h + 3), y1 + d.dx * (h + 3)); c.lineTo(x1 + d.dy * (h + 3), y1 - d.dx * (h + 3)); c.closePath(); c.fill();
  // tirita de cinta de peligro en el piso, a lo largo de la pared, del lado por donde se pasa (un poco más oscura que la del inicio)
  c.save(); c.translate(d.wx, d.wy); c.transform(d.dx, d.dy, -d.dy, d.dx, 0, 0);   // x local = hacia B, y local = a lo largo de la pared
  drawStartTape(c, -T / 2 - 10, -(DOOR_HOLE + 10) / 2, DOOR_HOLE + 10, 0.3);

}
// Cintas que sostienen la cortina: cruzan el canto de la pared y bajan por la cara del lado B
function drawHinge(c, d, P, quad) {
  for (const w of [-DOOR_FLAP / 2 + 5, DOOR_FLAP / 2 - 5]) {
    quad([P(-T / 2 + 1, w - 3, 1), P(-T / 2 + 1, w + 3, 1), P(T / 2, w + 3, 1), P(T / 2, w + 3, FLAP_H - 0.06),
          P(T / 2, w - 3, FLAP_H - 0.06), P(T / 2, w - 3, 1)]);
    c.fillStyle = 'rgba(214,206,186,0.85)'; c.fill();
  }
}

// ===================== CANVAS / TEXTURAS =====================
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const [wallCv, wctx] = mk(), [lightCv, lctx] = mk(), [aCv, actx] = mk(), [bCv, bctx] = mk();
const [blurCv, blurCtx] = mk(), [litCv, litCtx] = mk(), [mouseCv, mouseCtx] = mk();   // sombras suaves / paredes por encima del ratón / ratón opaco
const [topCv, topCtx] = mk();   // máscara de lo que tapa al ratón: solo los cantos de arriba de las paredes (y las cortinas de adelante)
// ¿El navegador desenfoca de verdad con ctx.filter? (Safari / iPhone no: a veces tiene la propiedad pero la ignora)
let CAN_BLUR = (() => {

})();
const SHADOW_SOFT = 5;   // esfumado del borde de las sombras (unidades de mundo)
const WALL_SOFT = 8;     // esfumado del borde de la luz sobre las paredes
const WALL_LIGHT = 0.6;   // cuánto de la linterna llega a las paredes (sus cantos se veían más brillantes que el piso)
let scale = 1;
let lightBox = [0, 0, 0, 0];   // recuadro de pantalla donde se dibujó la luz en el último cuadro (para limpiar solo eso)
let menuSig = '';              // firma del último fondo de menú dibujado (ver renderScene)

function makeFloorTile() {
  const S = 512, [c, x] = mk(S, S);
  x.fillStyle = '#8c6943'; x.fillRect(0, 0, S, S);
  for (let i = 0; i < 70; i++) {
    const px = Math.random() * S, py = Math.random() * S, r = 20 + Math.random() * 90;
    const col = Math.random() < 0.5 ? '60,38,18' : '190,150,100';
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      const g = x.createRadialGradient(px + ox, py + oy, 0, px + ox, py + oy, r);
      g.addColorStop(0, `rgba(${col},0.08)`); g.addColorStop(1, `rgba(${col},0)`);
      x.fillStyle = g; x.fillRect(px + ox - r, py + oy - r, r * 2, r * 2);
    }

  G.lampBlock = G.timeLimit / 4;   // la pila del HUD: sus 4 bloques reparten el tiempo del nivel
  starTimes(0);
  G.attempts = 1; G.chBest = null; G.chStars = 0;   // récord y estrellas de este laberinto (son al azar: valen mientras lo repetís)
  computeScale();
  resetRun();
}
// Historia: niveles fijos de la tabla LEVELS
function loadStory(i) {
  const L = LEVELS[i];
  G.mode = 'story'; G.story = i; G.level = i + 1; G.viewLevel = STORY_VIEW;
  const rng = buildMaze(L.size[0], L.size[1], L.seed, L.loops || 0);
  G.items = placeItems(L, G.maze, rng);
  G.items = G.items.concat(placeCoins(G.maze, G.items, L.seed + 777)); G.runCoins = 0;
  G.coinsTotal = G.items.filter(it => it.type === 'coin').length;
  G.solids = doorSolids(G.items, G.rects);
  G.holeRects = G.solids.filter(R => !R.door);   // paredes con los agujeros de las puertas (la luz pasa con la cortina levantada)
  const nCheese = G.items.filter(it => it.type === 'cheese').length;
  G.cheeseTotal = Math.min(nCheese, L.cheeseGoal || nCheese);   // cuántos hay que juntar (puede haber más dando vueltas)
  // tiempo: el del nivel 5 de Desafío sobre el camino ideal (con los atajos de las puertas), más lo que cuesta lo que está
  // EN el camino (cruzar una bandeja de pegamento ~5 s, esperar el hueco de un molinete ~3 s, una compuerta ~2 s) y el
  // desvío real hasta los quesos que hay que juntar (los más cercanos); lo que queda fuera del camino no suma
  const R = routeInfo(G.maze, G.items), onP = it => R.onPath(it.x + (it.w || 0) / 2, it.y + (it.h || 0) / 2);
  const nOn = t => G.items.filter(it => it.type === t && onP(it)).length;
  const det = G.items.filter(it => it.type === 'cheese').map(it => R.detour(it.x, it.y)).sort((a, b) => a - b).slice(0, G.cheeseTotal).reduce((a, b) => a + b, 0);
  const extra = Math.round(det * C / SPEED * 1.3 + G.cheeseTotal + nOn('sticky') * 5 + nOn('spinner') * 3 + nOn('gate') * 2);
  G.timeLimit = L.time || Math.ceil((timeFor(STORY_VIEW, R.len) + extra) / 5) * 5;
  starTimes(extra, R.len);
  // a oscuras: la linterna arranca con LAMP_MAX segundos y hay pilas en el camino para que alcance el tiempo de antes
  G.dark = G.lamp = DARK_LEVELS.includes(i + 1); G.lampBlock = LAMP_BLOCK;
  if (G.dark) {
    const bats = placeBatteries(G.maze, G.items);
    G.items = G.items.filter(it => it.type !== 'coin').concat(bats, G.items.filter(it => it.type === 'coin'));
    G.timeLimit = LAMP_MAX;
  }
  G.attempts = 1; G.chBest = null; G.chStars = 0;
  computeScale();
  resetRun();
}
function resetRun() {
  const m = G.maze;
  M.x = (m.W + 0.5) * C; M.y = (m.entRow + 0.5) * C; M.a = Math.PI; M.v = 0; M.turnV = 0; M.tail = null;
  M.stickyT = 0; M.onTray = false; M.feet = null; M.spin = 0; M.caught = false; M.squash = 0; G.prints = [];
  // las monedas que ya agarraste quedan agarradas (son tuyas aunque pierdas; no vuelven a aparecer al reintentar)
  for (const it of G.items) { it.closed = false; it.t = 0; it.got = it.type === 'coin' && it.got; it.passing = false; it.ang = DOOR_REST; it.av = 0; it.rattle = 0; }   // trampas abiertas, quesos sin juntar, puertas cerradas
  G.cheese = 0; G.fx = []; G.dieReason = 'time'; G.siren = 0;
  G.timeLeft = G.timeLimit; G.elapsed = 0; G.lastTick = 99; G.light = 0;
  const t = camTarget(); cam.x = t.x; cam.y = t.y;
}
function camTarget() {
  const m = G.maze, hw = cv.width / (2 * scale), hh = cv.height / (2 * scale);
  const minX = -1.2 * C, maxX = (m.W + 1.4) * C, minY = -0.5 * C, maxY = (m.H + 0.5) * C;
  const tx = M.x + Math.cos(M.a) * C * 0.8, ty = M.y + Math.sin(M.a) * C * 0.8;
  // la cámara sigue al ratón; si el laberinto es más grande que la pantalla, no se pasa de los bordes
  return {
    x: (maxX - minX < 2 * hw) ? tx : clamp(tx, minX + hw, maxX - hw),
    y: (maxY - minY < 2 * hh) ? ty : clamp(ty, minY + hh, maxY - hh),
  };
}

// ---- Ratitas: un mueble de estantes con las 20 jaulas; las que tenés se eligen tocándolas ----
// Fondo del Bioterio (img/fondo-bioterio.jpg, 2638 × 3100: la versión de noviembre del usuario, el mismo dibujo que el
// "Estantes_02" de 1920 × 2257 con más resolución, ×1,3747 medido en las luces de los estantes; todos los números de
// abajo son los de antes por ese factor, así todo queda donde estaba): una alcoba con 6 estantes
// iluminados y la base, con lugar de más a los costados y arriba (es el "Estantes_01" agrandado 1,25 veces y centrado,
// así que los estantes quedan donde estaban). Va detrás de toda la pantalla, también debajo del título, y se desliza
// entero junto con las jaulas y el título; los botones (casita, monedas, engranaje y "Máquina") quedan fijos encima.
// Cada jaula se apoya en un estante, de a 3 (7 filas para las 21 ratitas), centrada en la luz amarilla de su columna.
// Las jaulas tienen un tamaño fijo en píxeles del fondo (entran entre un estante y el de arriba) y el fondo se escala
// parejo, sin deformarse, para que las 3 de una fila llenen casi todo el ancho de la pantalla (en la PC, con un tope)
const BIO_BG = { src: 'img/fondo-bioterio.jpg?v=2', w: 2638, h: 3100, s: 1.3747,   // s: px de esta imagen por px de la de antes
  shelves: [870.2, 1143.8, 1414.6, 1692.3, 1968.6, 2239.4, 2528.1],   // borde de arriba de cada estante y de la base (y en el fondo)
  cols: [927.2, 1319.7, 1712.2],                       // centro de las luces amarillas de cada columna (x)
  cageW: 391.8,     // ancho de cada jaula (px del fondo): más anchas que antes, casi tocándose pero sin tocarse
  fitW: 1111.6,     // ancho de una fila con el que se escala el fondo (el de antes, así el fondo y los estantes no cambian)
  titleY: 453.7,   // el título va sobre la caja de la lámpara del techo (como la referencia del usuario): así arranca la galería
  end: 2771.4 };   // hasta dónde se desliza: un poco debajo de la base, donde empieza el piso (como marcó el usuario)
function layoutRack() {
  const rack = $scr.querySelector('.rack'), bg = rack && rack.querySelector('.bgrack'), head = rack && rack.querySelector('.biohead');
  if (!bg) return;
  // en la PC no tan grande (el tope de antes: la imagen vieja a su tamaño real), pero siempre un poco más ancho que la
  // pantalla, así los costados del fondo nunca se ven (el usuario pidió que los fondos sobren en la PC y en el iPhone)
  const B = BIO_BG, k = Math.min(rack.clientWidth * 0.96 / B.fitW, Math.max(1 / B.s, (rack.clientWidth + 16) / B.w));
  const h2 = head.querySelector('.stitle'), ty = head.offsetTop + h2.offsetTop + h2.offsetHeight / 2;   // centro del título
  const cw = B.cageW * k, ch = cw * CAGE_H / CAGE_W;
  // la primera fila de jaulas nunca empieza arriba del contador de monedas: en el iPhone a pantalla completa las monedas
  // bajan con la zona del reloj y quedaban encima de las jaulas; ahí la fila (y el fondo con ella) baja lo justo para
  // quedar con la tapa de la caja apenas detrás del borde de abajo de las monedas, sin taparle el cartelito del nombre
  // (primero bajaba toda la zona del reloj y después quedaba 8 px debajo: el usuario la pidió dos veces más arriba)
  const coinsB = $coins.getBoundingClientRect().bottom - rack.getBoundingClientRect().top + rack.scrollTop;
  const top = Math.max(ty - B.titleY * k, coinsB - 8 - ((B.shelves[0] - 2.5) * k - 0.86 * ch));
  const [bt, bb] = bandHeights();   // las franjas oscuras
  rack.querySelector('.bandtop').style.height = bt + 'px'; rack.querySelector('.bandtop').style.marginBottom = -bt + 'px';
  $scr.querySelector('.bandbot').style.height = bb + 'px';
  bg.style.width = B.w * k + 'px'; bg.style.height = B.h * k + 'px';
  bg.style.left = (rack.clientWidth - B.w * k) / 2 + 'px'; bg.style.top = top + 'px';
  rack.querySelector('.rackin').style.height = Math.max(rack.clientHeight, top + B.end * k) + 'px';   // si no entra, se desliza
  bg.querySelectorAll('.rat').forEach(el => {
    const row = +el.dataset.row, col = +el.dataset.col;
    el.style.width = cw + 'px';
    el.style.left = (B.cols[col] * k - cw / 2) + 'px';
    el.style.top = ((B.shelves[row] - 2.5 * B.s) * k - 0.86 * ch) + 'px';   // el fondo de la caja (86% del dibujo) apoyado justo arriba de la línea amarilla del estante
  });
}

// Retrato de una ratita de perfil (mirando a la izquierda), agachada, sin arnés ni linterna: para la galería, la grilla

// La ratita en el instante t del salto (en segundos), con (cx, cy, size) como la sentada (drawRatFrontPose)
function drawRatJump(c, cx, cy, size, i, t) {
  const fr = jumpFr(t), k0 = Math.floor(fr), k1 = Math.min(JUMP.n - 1, k0 + 1), w = fr - k0;
  const F = SALTO_FR[k0].map((v, j) => j === 24 ? (w < 0.5 ? v : SALTO_FR[k1][j]) : lerp(v, SALTO_FR[k1][j], w));
  // la bolita sale toda blanca de la cápsula y para el cuadro 8 ya tiene sus colores (lo pidió el usuario)
  const wht = 1 - (u => u * u * (3 - 2 * u))(clamp((fr - 4) / 3, 0, 1));   // (blanca hasta el cuadro 5)
  const white = o => wht <= 0 ? o : Object.fromEntries(Object.entries(o).map(([q, v]) => [q, typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? mixC(v, '#ffffff', wht) : v]));
  const S = white(skinOf(i)), P = white(portraitOf(i)), ink = P.line;
  const [eDx, eY, eRx, eRy, nY, nRx, nRy, aDx, aY, aRx, aRy, iDx, iDy, iR, hDx, hY, hMaj, hMin, hAng, fDx, fY, fMaj, fMin, fAng, , bcY, kY, kRx, kRy, bSx, bSy, bBy] = F;
  const T = q => [590 + (q[0] - 590) * bSx, bBy - (1092 - q[1]) * bSy];   // la panza de la sentada, estirada y corrida
  const k = size / 935;
  c.save(); c.translate(cx, cy); c.scale(k, k); c.translate(-590, -FRONT_CY[0]);
  c.lineCap = 'round'; c.lineJoin = 'round';
  // cola: la de la sentada (con su vaivén), pegada al mismo punto de la panza; crece desde la base mientras se despliega.
  // Cuando deja de ser bolita sale de atrás del cuerpo y bastante más arriba; en el cuadro 14 sale del costado, a la
  // altura de las manitos, y para el 16 baja hasta abajo de la anca (donde lo marcó el usuario); hasta el 18 el rulo es
  // más bajo y para el 22 ya tiene su altura
  {
    const sm = u => u * u * (3 - 2 * u), e1 = sm(clamp((fr - 5) / 8, 0, 1)), e2 = sm(clamp((fr - 13) / 2, 0, 1));
    const up = 190 * (1 - e2), [bx, by] = T([850 - lerp(lerp(200, 65, e1), 0, e2), 1040 - up]);
    frontTail(c, P, t, 0, 0, bx - 850, by - 1040, clamp((fr - 5) / 9, 0, 1), lerp(0.68, 1, sm(clamp((fr - 17) / 4, 0, 1))));
  }
  // orejas (detrás del cuerpo): las mismas, con su interior y el arco
  for (const sd of [-1, 1]) {
    c.save(); c.translate(590 + sd * aDx, aY);
    c.fillStyle = P.ear; c.beginPath(); c.ellipse(0, 0, aRx, aRy, 0, 0, Math.PI * 2); c.fill();
    const sy = aRy / aRx, ir = iR, kk = ir / 124;
    c.fillStyle = P.earIn; c.beginPath(); c.ellipse(sd * iDx, iDy, ir, ir * sy, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = P.earLine; c.lineWidth = 6 * Math.min(1, kk + 0.2); c.beginPath(); c.ellipse(sd * iDx, iDy, Math.max(1, ir - 4), Math.max(1, ir - 4) * sy, 0, Math.PI * 1.03, Math.PI * 1.97); c.stroke();   // (en el borde del interior)
    c.restore();
  }

  const feet = () => {
    for (const sd of [-1, 1]) {
      const fx = 590 + sd * fDx, ang = sd < 0 ? fAng : -fAng;
      c.save(); c.beginPath(); c.rect(fx - 400, fY - 400, 800, 1092 - (fY - 400)); c.clip();   // el piso corta la pata apoyada
      c.translate(fx, fY); c.rotate(ang);
      c.fillStyle = P.paws; c.beginPath(); c.ellipse(0, 0, fMaj, fMin, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = P.earLine; c.lineWidth = 5;
      for (const dx of [-9, 9]) {   // las dos rayitas, del lado de afuera (las mismas de la sentada, en proporción)
        const ax = (sd * 60 + dx - sd * 5) * fMaj / 110, bx = (sd * 60 + dx + sd * 5) * fMaj / 110;
        c.beginPath(); c.moveTo(ax, -38 * fMin / 88); c.lineTo(bx, -6 * fMin / 88); c.stroke();
      }
      c.restore();
    }
  };
  // unión de cada pata con el cuerpo, del color del pelaje y por debajo de los dos: en la secuencia del usuario las patas
  // tapan esa parte del cuerpo y al medir el contorno quedan muescas que, mientras las patas se acomodan, dejaban ver
  // huecos entre la panza y las patas; esto los llena (donde no hay hueco queda tapado por el cuerpo y la pata). (Medir el
  // contorno con las patas incluidas dejaba en cambio un borde de pelaje debajo de ellas)
  if (fr >= 6) {
    c.strokeStyle = P.fur; c.lineCap = 'round';
    for (const sd of [-1, 1]) {

  // y la cabeza (con la suya)

// Círculos de colisión de la rata: cuerpo, cabeza y cadera
const ratCircles = () => { const ca = Math.cos(M.a), sa = Math.sin(M.a); return [[0, RAD], [12, 7], [-11, 6]].map(([o, r]) => [M.x + ca * o, M.y + sa * o, r]); };
const circleRect = (cx, cy, r, R) => (cx - clamp(cx, R.x, R.x + R.w)) ** 2 + (cy - clamp(cy, R.y, R.y + R.h)) ** 2 < r * r;

// Puertas: si la rata se mete al hueco desde el lado del agujero, empuja la cortina y el hueco deja de chocar hasta
// que sale del todo. Desde el lado de la cortina el hueco es pared: la cortina es más grande y se apoya en el marco.
function doorCheck() {
  for (const d of G.items) if (d.type === 'door') {
    // embudo: yendo hacia el agujero un poco corrida, se acomoda sola hacia el centro (si no, se traba en el marco)
    const u = (M.x - d.wx) * d.dx + (M.y - d.wy) * d.dy, w = -(M.x - d.wx) * d.dy + (M.y - d.wy) * d.dx;
    const head = Math.cos(M.a) * d.dx + Math.sin(M.a) * d.dy;
    if (u < 0 && u > -T / 2 - 26 && Math.abs(w) < DOOR_HOLE / 2 + 16 && head > 0.6 && M.v > 20) {
      const sh = -Math.sign(w) * Math.min(Math.abs(w), 1.3);
      M.x += -d.dy * sh; M.y += d.dx * sh;
    }
    const over = ratCircles().some(([x, y, r]) => circleRect(x, y, r + 1, d.rect));
    if (!over) { d.passing = false; continue; }
    if (d.passing) continue;
    if ((M.x - d.wx) * d.dx + (M.y - d.wy) * d.dy < 0) { d.passing = true; Snd.flap(); }
    else { if (d.rattle < 0.3 && Math.abs(M.v) > 50) Snd.flapShut(0.8); d.rattle = 1; }   // empujada del otro lado: traquetea pero no abre
  }
}

function collide() {
  let pushed = 0;
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  doorCheck();
  // cuerpo, cabeza y cadera (la cadera evita que al girar pegado a una pared la cola se meta en el cartón)
  let spinLeft = SPIN_PUSH_MAX * 1.4;   // lo que pueden empujar los molinetes en un cuadro, entre todos los círculos (nunca un salto)
  for (let it = 0; it < 3; it++) for (const [off, r] of [[0, RAD], [12, 7], [-11, 6]]) {
    let cx = M.x + ca * off, cy = M.y + sa * off;
    if (it === 0 && spinLeft > 0) {   // las aspas del molinete la empujan (las paredes se resuelven después y ganan)
      let [sx, sy] = spinPush(cx, cy, r, off > 0 ? 1 : off < 0 ? 2 : 0);
      const [gx, gy] = gatePush(cx, cy, r); sx += gx; sy += gy;   // y las compuertas que bajan
      const L = Math.hypot(sx, sy);
      if (L > spinLeft) { sx *= spinLeft / L; sy *= spinLeft / L; }
      spinLeft -= Math.min(L, spinLeft);
      if (L) { M.x += sx; M.y += sy; cx += sx; cy += sy; pushed = Math.max(pushed, Math.hypot(sx, sy)); }
    }
    for (const R of G.solids) {   // paredes (con los huecos de las puertas) + huecos que están cerrados
      if (R.door && R.door.passing) continue;
      if (cx + r < R.x || cx - r > R.x + R.w || cy + r < R.y || cy - r > R.y + R.h) continue;
      const px = clamp(cx, R.x, R.x + R.w), py = clamp(cy, R.y, R.y + R.h);
      const dx = cx - px, dy = cy - py, d2 = dx * dx + dy * dy;
      if (d2 >= r * r) continue;
      let nx, ny, pen;
      if (d2 > 1e-9) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = r - d; }
      else {
        const l = cx - R.x, rr = R.x + R.w - cx, t = cy - R.y, b = R.y + R.h - cy, mn = Math.min(l, rr, t, b);
        if (mn === l) { nx = -1; ny = 0; pen = l + r; } else if (mn === rr) { nx = 1; ny = 0; pen = rr + r; }
        else if (mn === t) { nx = 0; ny = -1; pen = t + r; } else { nx = 0; ny = 1; pen = b + r; }
      }
      M.x += nx * pen; M.y += ny * pen; cx += nx * pen; cy += ny * pen; pushed = Math.max(pushed, pen);
    }
  }
  // un golpe de aspa: el golpecito y las orejas que se sacuden (no más de uno cada medio segundo)
  if (G.items.some(it => (it.type === 'spinner' || it.type === 'gate') && it.hit)) {
    G.items.forEach(it => { if (it.type === 'spinner' || it.type === 'gate') it.hit = false; });
    if ((M.spinCd || 0) < G.time) { M.spinCd = G.time + 0.5; M.bumpT = BUMP_T; Snd.bump(); if (Math.random() < 0.5) Snd.squeak(); }
  }
  return pushed;
}

// Pegamento: devuelve cuánto se multiplica la velocidad (frena encima y deja las patas pegajosas un rato)
function stickyFactor(dt) {
  // cuenta el cuerpo (no solo el centro): pegada a la pared también la pisa
  const on = G.items.some(it => it.type === 'sticky' &&
    Math.hypot(M.x - clamp(M.x, it.x, it.x + it.w), M.y - clamp(M.y, it.y, it.y + it.h)) < RAD * 0.7);
  if (on && !M.onTray) Snd.squish();
  if (!on && M.onTray) M.stretchT = STRETCH_T;   // se despega: estirón
  M.onTray = on;
  if (on) {
    // cuantas más patas apoyadas en el pegamento, más se clava: con las 4 adentro casi no avanza
    const trays = G.items.filter(it => it.type === 'sticky');
    const paws = (M.feet || []).filter(f => trays.some(it => f.p[0] > it.x && f.p[0] < it.x + it.w && f.p[1] > it.y && f.p[1] < it.y + it.h)).length;
    M.stickyT = STICKY_T;
    return STICKY_ON - STICKY_PAW * paws;
  }
  if (M.stickyT > 0) {
    M.stickyT = Math.max(0, M.stickyT - dt);
    return STICKY_SLOW + (1 - STICKY_SLOW) * (1 - M.stickyT / STICKY_T);   // recupera la velocidad de a poco
  }
  return 1;
}

// Trampas y quesos
function updateItems() {
  const ca = Math.cos(M.a), sa = Math.sin(M.a);
  for (const it of G.items) {
    if (it.type === 'trap' && !it.closed) {
      // cuerpo y cabeza de la rata contra el rectángulo de la trampa (en coordenadas de la trampa)
      const c = Math.cos(it.a), s = Math.sin(it.a);
      for (const [off, r] of [[0, RAD], [12, 7]]) {
        const px = M.x + ca * off - it.x, py = M.y + sa * off - it.y;
        const lx = px * c + py * s, ly = -px * s + py * c;
        const qx = clamp(lx, -TRAP_L / 2, TRAP_L / 2), qy = clamp(ly, -TRAP_W / 2, TRAP_W / 2);
        if ((lx - qx) ** 2 + (ly - qy) ** 2 < r * r) {
          it.closed = true; it.t = 0; Snd.trap(); Snd.squeal(); M.v = 0; M.turnV = 0;
          M.caught = true; M.caughtT = CAUGHT_T;   // atrapado: orejas y cola se agitan un segundo
          startDie('trap');
          return;
        }
      }
    } else if (it.type === 'coin' && !it.got) {
      if (Math.hypot(M.x + ca * 6 - it.x, M.y + sa * 6 - it.y) < PICK_COIN) {
        it.got = true; G.runCoins++; Wallet.add(1); Snd.coinPick(); pop($coins);   // (la moneda de los botones de la máquina, que sube si juntás varias seguidas)
        for (let k = 0; k < 8; k++) {
          const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 50;
          G.fx.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.3 + Math.random() * 0.25,
            sq: true, s: 1.6 + Math.random() * 1.6, rot: Math.PI / 4, vr: (Math.random() - 0.5) * 6 });
        }
      }
    } else if (it.type === 'battery' && !it.got) {
      if (Math.hypot(M.x + ca * 8 - it.x, M.y + sa * 8 - it.y) < PICK_CHEESE) {
        it.got = true; G.timeLeft = G.timeLimit; G.lastTick = 99; Snd.battery(); pop($lamp);
        G.faltT = 0; G.onT = 0.2;   // la linterna da un chispazo al recargar
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 50;
          G.fx.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.35 + Math.random() * 0.2, rgb: hexRgb(BAT_GREEN).join(','), r: 2 });   // del verde de la pila
        }
      }
    } else if (it.type === 'cheese' && !it.got) {
      if (Math.hypot(M.x + ca * 10 - it.x, M.y + sa * 10 - it.y) < PICK_CHEESE) {
        it.got = true; G.cheese++; Snd.cheese(); pop($cheese);
        for (let k = 0; k < 10; k++) {
          const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 50;
          G.fx.push({ x: it.x, y: it.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.35 + Math.random() * 0.2 });
        }
      }
    }
  }
}

// Al cruzar el umbral de salida todo se va oscureciendo: 0 dentro del laberinto, 1 ya afuera. Empieza recién en la línea
// de la salida (x = 0): antes arrancaba 25 unidades adentro y al acercarse a la meta la luz ya bajaba (el usuario lo vio)
function exitDarkness() {
  if (!G.maze || Math.abs(M.y - (G.maze.exitRow + 0.5) * C) > C * 0.6) return 0;
  return clamp(-M.x / 30, 0, 1);
}

function update(dt) {
  G.time += dt;
  const up = keys['arrowup'] || keys['w'], down = keys['arrowdown'] || keys['s'];
  const left = keys['arrowleft'] || keys['a'], right = keys['arrowright'] || keys['d'];

  if (G.state === 'play') {
    // Dirección deseada en pantalla: joystick (celular) o flechas/WASD (PC, ↑ = arriba, → = derecha…)
    let dx = 0, dy = 0, mag = 0;
    if (Stick.mag > 0) { dx = Stick.x; dy = Stick.y; mag = Stick.mag; }
    else {
      const kx = (right ? 1 : 0) - (left ? 1 : 0), ky = (down ? 1 : 0) - (up ? 1 : 0);
      if (kx || ky) { const l = Math.hypot(kx, ky); dx = kx / l; dy = ky / l; mag = 1; }
    }
    // el ratón gira hacia esa dirección y avanza más cuanto más alineado está
    let turn = 0, target = 0;
    if (mag > 0) {
      const goal = Math.atan2(dy, dx), diff = Math.atan2(Math.sin(goal - M.a), Math.cos(goal - M.a));
      turn = clamp(diff * 3, -1, 1);
      target = SPEED * mag * Math.max(0, Math.cos(diff));
    }
    target *= stickyFactor(dt);   // el pegamento frena
    const ox = M.x, oy = M.y;
    let want = 0;
    M.turnV += (turn * TURN - M.turnV) * Math.min(1, dt * 14);
    M.a += M.turnV * dt;
    M.v += (target - M.v) * Math.min(1, dt * 9);
    want = Math.abs(M.v) * dt;
    M.x += Math.cos(M.a) * M.v * dt; M.y += Math.sin(M.a) * M.v * dt;
    collide();
    updateDoors(dt);
    const moved = Math.hypot(M.x - ox, M.y - oy);
    M.bumpCd -= dt;
    if (want > 1.2 && moved < want * 0.35 && M.bumpCd <= 0 && Math.abs(M.v) > 80) {
      Snd.bump(); if (Math.random() < 0.7) Snd.squeak(); M.bumpCd = 0.45; M.v *= 0.3; M.bumpT = BUMP_T;
      if (G.time - M.lastBump < 1.2) { G.shake = Math.min(1, G.shake + 0.5); G.faltT = FALTER_T; }   // choques seguidos: tiembla la cámara y la linterna falla
      M.lastBump = G.time;
    }
    const sp = moved / Math.max(dt, 1e-4) + Math.abs(M.turnV) * 20;
    M.phase += dt * sp * 0.12;

    G.elapsed += dt;
    if (G.dark) G.timeLeft -= dt;   // con la luz prendida no se gasta: no hay derrota por tiempo
    const s = Math.ceil(G.timeLeft);
    if (G.dark && G.timeLeft <= WARN_T && s !== G.lastTick && s > 0) { G.lastTick = s; Snd.tick(s <= 5); }
    G.onT += dt;
    // encendido con parpadeo + leve oscilación del foco
    G.light = G.onT < 0.35 ? (Math.random() < 0.55 ? 1 : 0.15) : 0.96 + 0.04 * Math.sin(G.time * 13) * Math.sin(G.time * 7.3);
    // cada tanto la linterna baja un poquito y vuelve, suave (como una pila que flaquea un instante, sin parpadear)
    if ((G.dimIn -= dt) <= 0) { G.dimT = DIM_T; G.dimIn = 5 + Math.random() * 6; }
    if (G.dimT > 0) { G.dimT -= dt; G.light *= 1 - DIM_DEPTH * Math.sin(Math.PI * (1 - G.dimT / DIM_T)) ** 2; }
    // después de choques seguidos la linterna titubea: un par de bajones rápidos que se apagan solos
    if (G.faltT > 0) { G.faltT -= dt; const f = G.faltT / FALTER_T; G.light *= 1 - 0.45 * f * (0.5 + 0.5 * Math.sin(G.time * 55)); }
    if (!G.dark) G.light = 1;   // luz prendida: sin linterna que parpadee
    G.light *= 1 - exitDarkness();
    updateItems();
    for (const it of G.items) if (it.type === 'gate') {   // "clac" cuando una compuerta cercana empieza a bajar
      const w = gateState(it).warn, near = Math.hypot(M.x - it.x, M.y - it.y) < C * 5; if (w && !it.warned && near) Snd.gate(); it.warned = w;
      const gt = ((G.time + it.ph) % GATE_CYCLE + GATE_CYCLE) % GATE_CYCLE, down = GATE_OPEN + GATE_MOVE;   // "tac" al tocar abajo
      if (it.prevT != null && it.prevT < down && gt >= down && near) Snd.gateLand(); it.prevT = gt;
    }
    if (G.state !== 'play') { /* una trampa terminó la partida */ }
    else if (M.x < -6) win();
    else if (G.dark && G.timeLeft <= 0) startDie('time');
  } else if (G.state === 'dying') {
    G.dieT += dt; M.v *= 0.9;
    G.light = G.dieT < 1.1 ? (Math.random() < 0.5 ? 0.12 : 0.85) * (1 - G.dieT / 1.25) : 0;
    if (G.dieT > 1.5) lost();
  } else if (G.state === 'won') {
    M.v = SPEED; M.a += (Math.PI - ((M.a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) * Math.min(1, dt * 4);
    M.x += Math.cos(M.a) * M.v * dt; M.y += Math.sin(M.a) * M.v * dt; M.phase += dt * SPEED * 0.12;
    G.light = 1 - exitDarkness();
  } else if (isMenu()) {
    menuFlicker(dt);
  } else if (G.state === 'intro' || G.state === 'lost') {
    G.light = 0;
  }
  const input = up || down || left || right || Stick.mag > 0;
  animMouse(dt, G.state === 'play' && (input || Math.abs(M.v) > 5));
  updateTail(dt);
  updateFeet(dt);
  // giro en el lugar (gira rápido sin avanzar): la cabeza gira más y el torso se compacta
  const spinT = clamp(Math.abs(M.turnV) / TURN, 0, 1) * (1 - clamp(Math.abs(M.v) / (SPEED * 0.5), 0, 1));
  M.spin += (spinT - M.spin) * Math.min(1, dt * 8);
  for (const p of G.prints) p.t += dt;
  G.prints = G.prints.filter(p => p.t < PRINT_LIFE);

  Music.tick(dt);
  // trampas cerrándose, migas de queso y sirena de los últimos WARN_T segundos
  for (const it of G.items) if (it.type === 'trap' && it.closed) it.t = Math.min(1, it.t + dt / 0.15);
  for (const p of G.fx) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.fx = G.fx.filter(p => p.t < p.life);
  const sirenOn = (G.state === 'play' || G.state === 'paused') && G.dark && G.timeLeft <= WARN_T;
  G.siren += clamp((sirenOn ? 1 : 0) - G.siren, -dt / 0.5, dt / 0.5);
  // "Uuuuh" de la sirena, una vez por vuelta: arranca un poco antes para que el pico coincida con el haz pasando
  // por encima de la rata (el haz gira a G.time·π, una vuelta cada 2 s)
  if (G.state === 'play' && G.siren > 0.3) {
    const ra = Math.atan2(M.y - G.maze.H * C / 2, M.x - G.maze.W * C / 2);
    const until = (((ra - G.time * Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / Math.PI;   // segundos hasta que pase
    if (until <= WAIL_UP && G.wailUntil > WAIL_UP) Snd.wail(G.siren);
    G.wailUntil = until;
  } else G.wailUntil = 99;
  // cortinilla circular y temblor de cámara
  G.iris += clamp(G.irisTarget - G.iris, -dt / IRIS_T, dt / IRIS_T);
  if (G.state === 'won' && !G.winCard && G.iris <= 0) showWinCard();
  G.shake = Math.max(0, G.shake - dt * 2.2);

  const t = camTarget(), f = Math.min(1, dt * 4);
  cam.x += (t.x - cam.x) * f; cam.y += (t.y - cam.y) * f;
  // red de seguridad: el ratón siempre queda dentro de una zona segura de la pantalla
  const z = safeZone(), w = cv.width, h = cv.height;
  cam.x = clamp(cam.x, M.x - (z.x1 - w / 2) / scale, M.x - (z.x0 - w / 2) / scale);
  cam.y = clamp(cam.y, M.y - (z.y1 - h / 2) / scale, M.y - (z.y0 - h / 2) / scale);
  if (isMenu()) {   // menús: cámara quieta en el centro del laberinto de fondo
    if (G.titleSize !== w + 'x' + h) titleBackground();
    cam.x = G.maze.W * C / 2; cam.y = G.maze.H * C / 2;
  }
}

// Zona de pantalla (en píxeles del canvas) donde tiene que quedar el ratón.
// En el celular: debajo del HUD y por encima del tercio de abajo (donde suele estar el dedo del joystick).
function safeZone() {
  const w = cv.width, h = cv.height, dpr = cv.width / (safeZone.cssW || cv.width);   // (el ancho CSS se guarda en resize: leerlo en cada cuadro obligaba a recalcular el diseño)
  let y0 = h * 0.15, y1 = h * 0.85;
  if (isTouch) {
    if (!safeZone.at || G.time - safeZone.at > 0.5) {   // medir el HUD cuesta: se renueva cada medio segundo
      safeZone.at = G.time;
      let hud = document.getElementById('topbtns').getBoundingClientRect().bottom;
      if (!$hud.classList.contains('hidden')) hud = Math.max(hud, $timer.getBoundingClientRect().bottom);
      safeZone.hud = hud;
    }
    // arriba: bien por debajo del HUD (el ratón es grande); abajo: margen para el pulgar del joystick
    const top = (safeZone.hud + 80) * dpr, bottom = h * 0.66;
    if (bottom - top > h * 0.25) { y0 = top; y1 = bottom; }   // en pantallas muy bajitas se queda con la zona normal
  }
  return { x0: w * 0.15, x1: w * 0.85, y0, y1 };
}

// ===================== LUZ (rayos contra las paredes) =====================
const COS = new Float32Array(RAYS), SIN = new Float32Array(RAYS), HITS = new Float32Array(RAYS);
for (let i = 0; i < RAYS; i++) { const a = i / RAYS * Math.PI * 2; COS[i] = Math.cos(a); SIN[i] = Math.sin(a); }
function castRays(ox, oy) {
  const vs = [], hs = [];
  // con la cortina de una puerta levantada, la luz pasa por el agujero
  const rects = G.items.some(d => d.type === 'door' && d.ang > 0.3) ? G.holeRects : G.rects;
  for (const R of rects) {
    const px = clamp(ox, R.x, R.x + R.w), py = clamp(oy, R.y, R.y + R.h);
    if ((px - ox) ** 2 + (py - oy) ** 2 > LIGHT_R * LIGHT_R) continue;
    vs.push(R.x, R.y, R.y + R.h, R.x + R.w, R.y, R.y + R.h);
    hs.push(R.y, R.x, R.x + R.w, R.y + R.h, R.x, R.x + R.w);
  }
  for (let i = 0; i < RAYS; i++) {
    const dx = COS[i], dy = SIN[i]; let t = LIGHT_R;
    if (Math.abs(dx) > 1e-6) for (let j = 0; j < vs.length; j += 3) {
      const tt = (vs[j] - ox) / dx; if (tt <= 0 || tt >= t) continue;
      const y = oy + tt * dy; if (y >= vs[j + 1] && y <= vs[j + 2]) t = tt;
    }
    if (Math.abs(dy) > 1e-6) for (let j = 0; j < hs.length; j += 3) {
      const tt = (hs[j] - oy) / dy; if (tt <= 0 || tt >= t) continue;
      const x = ox + tt * dx; if (x >= hs[j + 1] && x <= hs[j + 2]) t = tt;
    }
    HITS[i] = t;
  }
}
// Fondo de la portada: laberinto a oscuras, sin la rata. Cada tanto un foco viejo parpadea en algún lugar de la
// pantalla y deja ver un poco (luz redonda, cortada por las paredes), y se vuelve a apagar.
const MenuFl = { t: 0, dur: 1, in: 1, x: 0, y: 0 };
// Entrada de cine de la portada (el usuario la pidió más de cine): las luces del laberinto arrancan apagadas y se prenden
// como un tubo fluorescente (dos parpadeos y se quedan) un ratito después de arrancar en negro, el logo aparece solo con un fundido y entra en foco, y a tiempo
// con el vals (150 bpm: un compás es 1,2 s) el cartón crece en el segundo compás, y los controles y los botones salen en
// sus tiempos. CINE.t0: cuándo empezó (null, ya terminó)
const CINE = { t0: null };
const CINE_AT = { lights: 0.36, logo: 1.2, board: 2.4, ctl: 2.6, btns: 2.8 };   // negro, se prende el laberinto, el logo al empezar el segundo compás y el resto al empezar el tercero (lo pidió el usuario: primero negro, después el laberinto, después el logo y lo demás todo animado)
const CINE_FLICK = [[0, 0], [0.36, 0], [0.37, 0.85], [0.43, 0.85], [0.44, 0.08], [0.53, 0.08], [0.54, 0.95], [0.58, 0.95], [0.59, 0.3], [0.68, 0.3], [0.92, 1]];   // [segundos, luz]
// esconde las monedas, el engranaje y el crédito durante la entrada y los trae de vuelta con un fundido al terminar (o al tocar)
let cineUiT = 0;
function cineUi(on) {
  clearTimeout(cineUiT); document.body.classList.remove('cineout');
  if (on) { document.body.classList.add('cine'); cineUiT = setTimeout(() => cineUi(false), (CINE_AT.btns + 0.5) * 1000); return; }
  if (!document.body.classList.contains('cine')) return;
  document.body.classList.remove('cine'); document.body.classList.add('cineout'); cineUiT = setTimeout(() => document.body.classList.remove('cineout'), 600);
}
function menuLightK() {
  if (CINE.t0 == null) return 1;
  const e = (performance.now() - CINE.t0) / 1000, F = CINE_FLICK;
  if (e >= F[F.length - 1][0]) { CINE.t0 = null; return 1; }
  for (let i = 1; i < F.length; i++) if (e < F[i][0]) { const [a, va] = F[i - 1], [b, vb] = F[i]; return va + (vb - va) * (e - a) / (b - a); }
  return 1;
}
const MENU_AMBIENT = 0.3;   // luz pareja de fondo en los menús (en el juego no hay: oscuridad total)
function menuFlicker(dt) {
  const F = MenuFl;
  if (F.t > 0) {
    F.t -= dt;
    const k = clamp(F.t / F.dur, 0, 1), step = Math.floor(G.time * 14);
    const on = Math.sin(step * 12.9898) * 43758.5453 % 1;   // prende y apaga al azar (cambia ~14 veces por segundo)
    G.light = (Math.abs(on) > 0.35 ? 1 : 0.12) * 0.55 * Math.min(1, k * 3, (1 - k) * 8);
  } else {
    G.light = 0;
    if ((F.in -= dt) <= 0) {
      const m = G.maze, hw = cv.width / scale / 2, hh = cv.height / scale / 2;
      const c = clamp(Math.floor((cam.x + (Math.random() - 0.5) * hw * 1.7) / C), 0, m.W - 1);
      const r = clamp(Math.floor((cam.y + (Math.random() - 0.5) * hh * 1.7) / C), 0, m.H - 1);
      F.x = (c + 0.5) * C; F.y = (r + 0.5) * C;
      F.dur = F.t = 0.6 + Math.random() * 0.8; F.in = 2 + Math.random() * 3.5;
    }
  }
}
function drawBulb(c, ox, oy) {
  const R = LIGHT_R * 0.7, g = c.createRadialGradient(ox, oy, 0, ox, oy, R);
  g.addColorStop(0, 'rgba(255,236,200,1)'); g.addColorStop(0.35, 'rgba(255,220,170,0.55)'); g.addColorStop(1, 'rgba(255,210,150,0)');
  c.save(); c.fillStyle = g; c.fillRect(ox - R, oy - R, R * 2, R * 2); c.restore();   // restore: si no, el degradé quedaba de fillStyle y el recorte de la luz del juego salía vacío
}

function drawCone(c, ox, oy) {
  c.save(); c.translate(ox, oy); c.rotate(M.a); c.drawImage(coneCv, -LIGHT_R, -LIGHT_R, LIGHT_R * 2, LIGHT_R * 2);
  c.restore();
  // la luz tenue de alrededor (se suma al haz; después las dos se recortan juntas con las sombras de las paredes)
  const g = c.createRadialGradient(ox, oy, 0, ox, oy, AURA_R);
  g.addColorStop(0, `rgba(255,232,195,${AURA_A})`); g.addColorStop(0.45, `rgba(255,225,185,${AURA_A * 0.5})`); g.addColorStop(1, 'rgba(255,220,180,0)');
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(ox - AURA_R, oy - AURA_R, AURA_R * 2, AURA_R * 2); c.restore();
}

// ===================== RENDER =====================
function visible(R, v, pad) { return R.x + R.w > v.x0 - pad && R.x < v.x1 + pad && R.y + R.h > v.y0 - pad && R.y < v.y1 + pad; }

// Cinta de peligro amarilla y negra pegada en el piso, en la boca del corral de inicio: se ve de una dónde se arranca
// (aunque no sepas leer). Plástico con un brillo a lo largo y arruguitas. También marca el lado de paso de las puertas.
// Con checker es la cinta a cuadros blancos y negros de la salida, como una bandera de llegada.
function drawStartTape(c, x, y0, len, shade = 0, checker = false) {
  const w = checker ? 10 : 9;
  c.save(); c.translate(x, y0 + len / 2); c.rotate(checker ? -0.03 : 0.03);
  c.beginPath(); c.rect(-w / 2, -len / 2, w, len);
  c.save(); c.clip();
  c.fillStyle = checker ? '#ece8df' : '#ebb917'; c.fillRect(-w / 2, -len / 2, w, len);
  c.fillStyle = '#1c1b18';
  if (checker) {   // dos columnas de cuadritos alternados
    const q = w / 2;
    for (let n = 0, s = -len / 2; s < len / 2; s += q, n++) c.fillRect(n % 2 ? 0 : -q, s, q, q);
  } else for (let s = -len / 2 - w; s < len / 2 + w; s += 8) {
    c.beginPath(); c.moveTo(-w / 2, s); c.lineTo(w / 2, s - w); c.lineTo(w / 2, s - w + 4); c.lineTo(-w / 2, s + 4); c.closePath(); c.fill();
  }
  c.fillStyle = 'rgba(255,255,255,0.16)'; c.fillRect(-w / 2 + 1, -len / 2, w * 0.28, len);
  c.strokeStyle = 'rgba(255,255,255,0.14)'; c.lineWidth = 0.5;
  for (const k of [-0.32, -0.05, 0.27]) { c.beginPath(); c.moveTo(-w / 2, k * len); c.lineTo(w / 2, k * len + 2.5); c.stroke(); }
  if (shade) { c.fillStyle = `rgba(20,12,4,${shade})`; c.fillRect(-w / 2, -len / 2, w, len); }   // más oscura (cinta vieja, gastada)
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 0.5; c.stroke();
  c.restore();
}

function drawFloor(c, v) {
  const m = G.maze, Wp = m.W * C, Hp = m.H * C;
  c.fillStyle = '#2b2018'; c.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);       // mesa
  c.fillStyle = floorPat;
  c.fillRect(-T / 2, -T / 2, Wp + T, Hp + T);
  c.fillRect(Wp, m.entRow * C, C, C);
  // uniones de las planchas de cartón
  c.lineWidth = 1.1;
  for (const x of G.deco.sx) {
    if (x < v.x0 - 4 || x > v.x1 + 4) continue;
    c.strokeStyle = 'rgba(35,22,10,0.6)'; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, Hp); c.stroke();
    c.strokeStyle = 'rgba(200,160,110,0.25)'; c.beginPath(); c.moveTo(x + 1.2, 0); c.lineTo(x + 1.2, Hp); c.stroke();
  }
  for (const y of G.deco.sy) {
    if (y < v.y0 - 4 || y > v.y1 + 4) continue;
    c.strokeStyle = 'rgba(35,22,10,0.6)'; c.beginPath(); c.moveTo(0, y); c.lineTo(Wp, y); c.stroke();
    c.strokeStyle = 'rgba(200,160,110,0.25)'; c.beginPath(); c.moveTo(0, y + 1.2); c.lineTo(Wp, y + 1.2); c.stroke();
  }
  for (const t of G.deco.tapes) {
    if (!visible(t, v, 10)) continue;
    c.fillStyle = 'rgba(200,196,182,0.5)'; c.fillRect(t.x, t.y, t.w, t.h);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(t.x, t.y, t.w, Math.min(t.h, t.w) * 0.25);
  }
  // marcas de lápiz y marcador
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const k of G.deco.marks) {
    if (k.x < v.x0 - 30 || k.x > v.x1 + 30 || k.y < v.y0 - 30 || k.y > v.y1 + 30) continue;
    c.save(); c.translate(k.x, k.y); c.rotate(k.rot); c.fillStyle = k.color;
    c.font = `${k.size}px 'Permanent Marker', cursive`; c.fillText(k.text, 0, 0); c.restore();
  }
  // salida e inicio pintados en el piso
  c.save(); c.translate(C * 0.5, (m.exitRow + 0.5) * C);
  c.fillStyle = 'rgba(150,20,16,0.85)'; c.font = `13px 'Kalam', cursive`;
  c.fillText(say('SALIDA', 'EXIT'), 2, -10); c.font = `22px 'Kalam', cursive`; c.fillText('←', 0, 10); c.restore();
  c.save(); c.translate((m.W + 0.5) * C, (m.entRow + 0.5) * C + 18); c.rotate(-0.08);
  c.fillStyle = 'rgba(30,20,12,0.55)'; c.font = `10px 'Kalam', cursive`; c.fillText(say('INICIO', 'START'), 0, 0); c.restore();
  drawStartTape(c, Wp, m.entRow * C + T / 2 - 2, C - T + 4);
  drawStartTape(c, 0, m.exitRow * C + T / 2 - 2, C - T + 4, 0, true);   // la llegada, a cuadros
  // sombras de contacto al pie de las paredes
  for (const R of G.rects) {
    if (!visible(R, v, 10)) continue;
    c.fillStyle = 'rgba(0,0,0,0.16)'; c.fillRect(R.x - 6, R.y - 6, R.w + 12, R.h + 12);
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(R.x - 3, R.y - 3, R.w + 6, R.h + 6);
  }
  drawFloorItems(c, v);   // trampas, pegamento y quesos (en la oscuridad no se ven: solo con la linterna)
}

// cara de una pared que mira a la cámara: base (a, b) en el piso y canto (c, d) arriba. El degradé (oscura abajo, clara
// arriba) va derecho de la base al canto, perpendicular a la base: antes iba entre el medio de la base y el del canto, y
// con la cámara corrida a un costado ese camino quedaba casi a lo largo de la pared, así media cara salía oscura y media
// clara, y esa mancha oscura se deslizaba por la pared al moverse (lo vio el usuario en los niveles con luz)
function sideQuad(c, ax, ay, bx, by, cx2, cy2, dx, dy) {
  const mx = (ax + bx) / 2, my = (ay + by) / 2, ex = bx - ax, ey = by - ay, el = Math.hypot(ex, ey) || 1, nx = -ey / el, ny = ex / el;
  const h = ((cx2 + dx) / 2 - mx) * nx + ((cy2 + dy) / 2 - my) * ny;   // lo que sube el canto, medido derecho desde la base
  const g = c.createLinearGradient(mx, my, mx + nx * h, my + ny * h);
  g.addColorStop(0, '#3a2816'); g.addColorStop(1, '#7c5b37');
  c.fillStyle = g; c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.lineTo(cx2, cy2); c.lineTo(dx, dy); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(25,15,6,0.5)'; c.lineWidth = 0.6; c.stroke();
}

function drawWalls(c, v) {
  const s = 1 + K, vis = [];
  for (const R of G.rects) if (visible(R, v, C * 2)) vis.push(R);
  drawDoors(c, v, 'back');   // cortinas vistas desde el lado del agujero: quedan detrás de la pared
  // caras laterales (las que miran a la cámara)
  for (const R of vis) {
    const tx = cam.x + (R.x - cam.x) * s, ty = cam.y + (R.y - cam.y) * s, tw = R.w * s, th = R.h * s;
    R._t = [tx, ty, tw, th];
    if (R.x > cam.x) sideQuad(c, R.x, R.y, R.x, R.y + R.h, tx, ty + th, tx, ty);
    if (R.x + R.w < cam.x) sideQuad(c, R.x + R.w, R.y, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx + tw, ty);
    if (R.y > cam.y) sideQuad(c, R.x, R.y, R.x + R.w, R.y, tx + tw, ty, tx, ty);
    if (R.y + R.h < cam.y) sideQuad(c, R.x, R.y + R.h, R.x + R.w, R.y + R.h, tx + tw, ty + th, tx, ty + th);
  }
  drawDoors(c, v, 'hole');   // agujeros en la cara de la pared que mira a la cámara
  // cantos superiores: cartón corrugado visto desde arriba
  for (const R of vis) {
    const [tx, ty, tw, th] = R._t, horiz = tw >= th;
    c.fillStyle = '#a9824f'; c.fillRect(tx, ty, tw, th);
    c.strokeStyle = 'rgba(80,52,24,0.9)'; c.lineWidth = 0.9; c.beginPath();
    if (horiz) {
      const y0 = ty + th * 0.22, y1 = ty + th * 0.78; let i = 0;
      for (let x = tx + 1; x <= tx + tw - 1; x += 2.8, i++) i ? c.lineTo(x, i % 2 ? y0 : y1) : c.moveTo(x, y1);
    } else {
      const x0 = tx + tw * 0.22, x1 = tx + tw * 0.78; let i = 0;
      for (let y = ty + 1; y <= ty + th - 1; y += 2.8, i++) i ? c.lineTo(i % 2 ? x0 : x1, y) : c.moveTo(x1, y);
    }
    c.stroke();
    c.strokeStyle = '#cfa877'; c.lineWidth = 1.5; c.beginPath();
    if (horiz) { c.moveTo(tx, ty + 1); c.lineTo(tx + tw, ty + 1); c.moveTo(tx, ty + th - 1); c.lineTo(tx + tw, ty + th - 1); }
    else { c.moveTo(tx + 1, ty); c.lineTo(tx + 1, ty + th); c.moveTo(tx + tw - 1, ty); c.lineTo(tx + tw - 1, ty + th); }
    c.stroke();
    c.strokeStyle = 'rgba(30,18,8,0.85)'; c.lineWidth = 0.8; c.strokeRect(tx, ty, tw, th);
    for (const off of R.tapes) {
      const o = off * s;
      c.fillStyle = 'rgba(205,200,186,0.75)';
      if (horiz) c.fillRect(tx + o - 4.5 * s, ty - 1.5, 9 * s, th + 3); else c.fillRect(tx - 1.5, ty + o - 4.5 * s, tw + 3, 9 * s);
    }
  }
  // cortinas de las puertas vistas desde su lado (van delante de la cara de la pared)
  drawDoors(c, v, 'front');
  drawGates(c, v);   // las compuertas, colgadas de su eje en el pasillo: encima de la pared de atrás y debajo de la de adelante
}

// ---- items ----
function rrect(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
// números al azar propios de cada item (salen de su posición): detalles distintos en cada uno, pero siempre iguales
function itemRng(it) { return mulberry32((Math.round(it.x * 7) * 73856093) ^ (Math.round(it.y * 7) * 19349663)); }

// Trampera de madera vista desde arriba (según la foto de referencia): +x apunta a la abertura del callejón,
// donde está el queso del cebo; el aro de alambre descansa hacia atrás y el resorte está un poco pasado el medio
function drawTrap(c, it) {
  const L = 34, W = 18, HX = 1.6;   // dibujo base de 34×18 (se escala al tamaño real TRAP_L); HX: bisagra (resorte)
  c.save(); c.translate(it.x, it.y); c.rotate(it.a);
  // sombra pegada y apenas esfumada (como la de la bandeja), corrida siempre hacia abajo-derecha del mundo
  const sox = Math.cos(it.a) + Math.sin(it.a), soy = Math.cos(it.a) - Math.sin(it.a);
  c.fillStyle = 'rgba(0,0,0,0.16)';
  for (const k of [0, 0.7, 1.4]) { rrect(c, -TRAP_L / 2 + sox - k, -TRAP_W / 2 + soy - k, TRAP_L + 2 * k, TRAP_W + 2 * k, 1.5 + k); c.fill(); }
  c.scale(TRAP_L / L, TRAP_W / W);
  // tabla de madera: planos de color sin contorno, vetas apenas más oscuras que la base
  const wg = c.createLinearGradient(0, -W / 2, 0, W / 2);
  wg.addColorStop(0, '#a87442'); wg.addColorStop(0.15, '#b98551'); wg.addColorStop(0.85, '#b47f4b'); wg.addColorStop(1, '#a06c3b');
  c.fillStyle = wg; rrect(c, -L / 2, -W / 2, L, W, 1.5); c.fill();
  c.lineWidth = 0.35;
  for (const [k, a] of [[-7.2, 0.22], [-5.4, 0.15], [-3.1, 0.2], [-0.8, 0.13], [1.6, 0.2], [3.9, 0.15], [6.2, 0.22]]) {
    c.strokeStyle = `rgba(140,90,45,${a})`; c.beginPath(); c.moveTo(-L / 2, k);
    c.bezierCurveTo(-8, k + 0.7, 2, k - 0.6, L / 2, k + 0.3); c.stroke();
  }
  // manchas de uso y un nudo de la madera (distintos en cada trampa, siempre iguales para la misma)
  const r = itemRng(it), spots = [];
  for (let i = 0; i < 6; i++) spots.push([-15 + r() * 30, -7 + r() * 14, 1.6 + r() * 3.2, 0.08 + r() * 0.12, r() < 0.3]);
  c.save(); rrect(c, -L / 2, -W / 2, L, W, 1.5); c.clip();
  for (const [sx, sy, sr, a, light] of spots) {
    const col = light ? '238,205,155' : '95,58,25', g = c.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  }
  const kx = -12 + r() * 10, ky = (r() < 0.5 ? -1 : 1) * (3 + r() * 3);
  c.fillStyle = 'rgba(115,72,35,0.28)'; c.beginPath(); c.ellipse(kx, ky, 0.8, 0.45, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(125,80,40,0.22)'; c.lineWidth = 0.3;
  for (const [ex, ey] of [[1.6, 0.9], [2.6, 1.4]]) { c.beginPath(); c.ellipse(kx, ky, ex, ey, 0, 0, Math.PI * 2); c.stroke(); }
  c.restore();
  // chapa del gatillo (con muescas) y el cubito de queso encima
  const mg = c.createLinearGradient(4.7, -4.4, 9.5, 4);                                       // chapa: brillo metálico
  mg.addColorStop(0, '#7d8287'); mg.addColorStop(0.45, '#c6cbd0'); mg.addColorStop(1, '#868b90');
  c.fillStyle = mg; c.fillRect(4.7, -4.4, 4.8, 8.4);
  c.fillStyle = '#767b80'; c.fillRect(4.7, -1.1, 1.1, 0.8); c.fillRect(4.7, 1.2, 1.1, 0.8);
  const cs = c.createLinearGradient(8.2, -2.6, 13.8, 3);                                       // costado del queso
  cs.addColorStop(0, '#d6961f'); cs.addColorStop(1, '#a86d12');
  c.fillStyle = cs; c.fillRect(8.2, -2.6, 5.6, 5.6);
  const ct = c.createLinearGradient(7.6, -3.3, 13.2, 2.3);                                     // cara de arriba
  ct.addColorStop(0, '#fbe07a'); ct.addColorStop(1, '#eab12f');
  c.fillStyle = ct; c.fillRect(7.6, -3.3, 5.6, 5.6);
  c.fillStyle = '#d9a12a';
  for (const [hx, hy, hr] of [[9.2, -1.6, 0.8], [11.6, 0.4, 1], [9, 1.3, 0.55], [12.1, -2.2, 0.45]]) { c.beginPath(); c.arc(hx, hy, hr, 0, Math.PI * 2); c.fill(); }
  c.fillStyle = '#f2c440';                                                                    // miguitas
  for (const [mx, my] of [[14.6, -4.6], [15.2, 2.8], [6.6, 6.2]]) c.fillRect(mx, my, 0.9, 0.9);
  // resorte en espiral sobre la bisagra
  c.fillStyle = '#6e4f33'; c.fillRect(HX - 1.3, -7.4, 2.6, 14.8);
  c.strokeStyle = '#94704c'; c.lineWidth = 0.45;
  for (let y = -7.1; y <= 7.1; y += 0.85) { c.beginPath(); c.moveTo(HX - 1.3, y); c.lineTo(HX + 1.3, y + 0.35); c.stroke(); }
  // aro de alambre: abierto descansa hacia atrás; al cerrarse gira sobre la bisagra y cae hacia adelante
  const endX = HX - 16 * Math.cos(Math.PI * (it.closed ? it.t : 0));
  const wire = (col, lw) => {
    c.strokeStyle = col; c.lineWidth = lw; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(HX, -7.6); c.lineTo(endX, -7.6); c.lineTo(endX, 7.6); c.lineTo(HX, 7.6); c.stroke();
  };
  wire('#7a7e83', 0.9); wire('rgba(230,234,238,0.45)', 0.3);
  if (!it.closed) {   // traba: del aro al gatillo, con el ojal del extremo
    c.strokeStyle = '#7a7e83'; c.lineWidth = 0.6; c.beginPath(); c.moveTo(endX + 1, 0); c.lineTo(5.2, 0); c.stroke();
    c.lineWidth = 0.5; c.beginPath(); c.arc(endX + 1.2, 0, 1.1, 0, Math.PI * 2); c.stroke();
  }
  c.restore();
}

// Trampa de pegamento (según la foto): bandeja de plástico negro con el pegamento gris azulado y brillante,
// tornillitos en las esquinas y un botón en el medio
function drawSticky(c, it) {
  const { x, y, w, h } = it;
  // sombra pegada y apenas esfumada: tres capas que se agrandan un poquito (igual de corrida en ambos lados)
  c.fillStyle = 'rgba(0,0,0,0.16)';
  for (const k of [0, 0.7, 1.4]) { rrect(c, x + 0.5 - k, y + 0.5 - k, w + 2 * k, h + 2 * k, 3 + k); c.fill(); }
  const fg = c.createLinearGradient(x, y, x + w, y + h);
  fg.addColorStop(0, '#3d4044'); fg.addColorStop(1, '#1d1f22');
  c.fillStyle = fg; rrect(c, x, y, w, h, 3); c.fill();                                        // marco de plástico
  const gx = x + 3, gy = y + 3, gw = w - 6, gh = h - 6;                                       // pegamento
  const g = c.createLinearGradient(gx, gy, gx + gw, gy + gh);
  g.addColorStop(0, '#536977'); g.addColorStop(0.45, '#3d4f5a'); g.addColorStop(1, '#28343c');
  c.fillStyle = g; rrect(c, gx, gy, gw, gh, 1.5); c.fill();
  c.save(); rrect(c, gx, gy, gw, gh, 1.5); c.clip();                                          // reflejos del pegamento
  const band = c.createLinearGradient(gx, gy, gx + gw * 0.7, gy + gh * 0.7);                  // franja diagonal, sin corte duro
  band.addColorStop(0, 'rgba(255,255,255,0)'); band.addColorStop(0.3, 'rgba(255,255,255,0)');
  band.addColorStop(0.48, 'rgba(255,255,255,0.08)'); band.addColorStop(0.7, 'rgba(255,255,255,0)'); band.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = band; c.fillRect(gx, gy, gw, gh);
  const hl = c.createRadialGradient(gx + gw - 3, gy + 3, 0, gx + gw - 3, gy + 3, Math.min(gw, gh) * 0.4);
  hl.addColorStop(0, 'rgba(255,255,255,0.35)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = hl; c.fillRect(gx, gy, gw, gh);
  // brillos suaves y burbujas atrapadas en el pegamento (transparentes)
  const r = itemRng(it);
  for (let i = 0; i < 3; i++) {
    const px = gx + r() * gw, py = gy + r() * gh, pr = 3 + r() * 4, sg = c.createRadialGradient(px, py, 0, px, py, pr);
    sg.addColorStop(0, 'rgba(210,230,240,0.13)'); sg.addColorStop(1, 'rgba(210,230,240,0)');
    c.fillStyle = sg; c.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  }
  for (let i = 0; i < 9; i++) {
    const br = 0.5 + r() * 1.3, px = gx + br + 1 + r() * (gw - 2 * br - 2), py = gy + br + 1 + r() * (gh - 2 * br - 2);
    c.fillStyle = 'rgba(185,210,225,0.12)'; c.beginPath(); c.arc(px, py, br, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(225,238,246,0.3)'; c.lineWidth = 0.25;
    c.beginPath(); c.arc(px, py, br, Math.PI * 0.95, Math.PI * 1.7); c.stroke();             // borde iluminado arriba
    c.fillStyle = 'rgba(255,255,255,0.6)'; c.beginPath(); c.arc(px - br * 0.35, py - br * 0.35, br * 0.22, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  for (const [sx, sy] of [[x + 1.6, y + 1.6], [x + w - 1.6, y + 1.6], [x + 1.6, y + h - 1.6], [x + w - 1.6, y + h - 1.6]]) {   // tornillitos
    c.fillStyle = '#15171a'; c.beginPath(); c.arc(sx, sy, 1.1, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.arc(sx - 0.3, sy - 0.3, 0.4, 0, Math.PI * 2); c.fill();
  }
  const bx = x + w / 2, by = y + h / 2;                                                       // botón del medio
  c.fillStyle = '#2c3135'; c.beginPath(); c.arc(bx, by, 2.1, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#3d4449'; c.beginPath(); c.arc(bx, by, 1.3, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.arc(bx - 0.6, by - 0.6, 0.45, 0, Math.PI * 2); c.fill();
